<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#148453">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日常问题">
<meta name="format-detection" content="telephone=no">
<title>日常问题 · 春秋全能助手</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --primary:#148453;--primary-dark:#0C5F3A;--primary-light:#3E9E79;
  --primary-soft:#E8F3EE;--primary-mist:#F4F9F6;
  --gold:#F5B800;--gold-soft:#FEF6DC;
  --danger:#C62828;--danger-soft:#FDE7E7;
  --grad-primary:linear-gradient(135deg,#148453 0%,#1FA56A 100%);
  --bg:#F5F8F6;--bg-card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#9DB0A6;
  --border:#E5EDE9;--shadow:0 4px 14px rgba(20,132,83,.10);--shadow-lg:0 12px 32px rgba(20,132,83,.14);
}
html[data-theme="dark"]{
  --bg:#0F1A14;--bg-card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;
  --primary-soft:#1A3D2A;--primary-mist:#142E22;--danger-soft:#2A1616;--gold-soft:#2A2410;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
button{font-family:var(--font-sans);cursor:pointer;}
input{font-family:var(--font-sans);}

/* ===== 顶部 ===== */
.livery-stripe{height:3px;background:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 18px;transition:background .3s;backdrop-filter:blur(20px);}
.t-title{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800;color:var(--primary);white-space:nowrap;}
.t-title .ic{width:30px;height:30px;border-radius:9px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.t-count{font-size:.72rem;font-weight:600;color:var(--text2);background:var(--primary-soft);padding:3px 10px;border-radius:12px;white-space:nowrap;}
.t-sub{margin-left:auto;font-size:.74rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 容器 ===== */
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px;}

/* ===== 搜索区 ===== */
.search-box{display:flex;gap:8px;box-shadow:var(--shadow-lg);border-radius:16px;padding:8px;background:var(--bg-card);border:1px solid var(--border);transition:border-color .2s,box-shadow .2s;}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,132,83,.15);}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:.98rem;color:var(--text);padding:8px 10px;min-width:0;}
.search-box input::placeholder{color:var(--text3);}
.search-btn{border:none;background:var(--grad-primary);color:#fff;font-size:.9rem;font-weight:700;border-radius:11px;padding:8px 20px;transition:transform .15s,box-shadow .2s;box-shadow:var(--shadow);}
.search-btn:active{transform:scale(.96);}
.hot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.hot .lbl{font-size:.72rem;color:var(--text3);font-weight:600;}
.tag{font-size:.76rem;font-weight:600;color:var(--text2);background:var(--bg-card);border:1px solid var(--border);padding:4px 12px;border-radius:14px;transition:all .15s;}
.tag:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-mist);}
.tag.on{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ===== 分类 ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.cat{font-size:.82rem;font-weight:700;color:var(--text2);background:var(--bg-card);border:1px solid var(--border);padding:6px 14px;border-radius:10px;transition:all .15s;}
.cat:hover,.cat.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.cat small{font-weight:600;opacity:.75;margin-left:3px;}

/* ===== 结果信息 ===== */
.res-info{margin:16px 0 10px;font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:8px;min-height:20px;}
.res-info .hl{color:var(--primary);font-weight:800;}
.res-info .clear{font-size:.74rem;color:var(--primary);background:var(--primary-soft);border:none;padding:3px 10px;border-radius:10px;font-weight:600;}

/* ===== 问答列表 ===== */
.group-title{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:800;color:var(--primary);margin:18px 2px 8px;}
.group-title::after{content:'';flex:1;height:1px;background:var(--border);}
.qa{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:box-shadow .2s,border-color .2s;}
.qa:hover{box-shadow:var(--shadow);}
.qa.open{border-color:var(--primary);box-shadow:var(--shadow-lg);}
.qa-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;}
.qa-q{flex:1;font-size:.92rem;font-weight:700;line-height:1.5;min-width:0;}
.qa-meta{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.badge{font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:9px;color:#fff;white-space:nowrap;}
.badge.sales{background:#148453;}.badge.deliver{background:#1E88E5;}.badge.inflight{background:#6D4EC2;}.badge.sick{background:#E8590C;}.badge.invoice{background:#B8860B;}
.qa-src{font-size:.66rem;color:var(--text3);background:var(--primary-mist);padding:2px 7px;border-radius:8px;white-space:nowrap;}
.chev{width:22px;height:22px;flex-shrink:0;color:var(--text2);transition:transform .25s;display:flex;align-items:center;justify-content:center;}
.qa.open .chev{transform:rotate(180deg);color:var(--primary);}
.qa-body{display:none;padding:2px 16px 16px;border-top:1px dashed var(--border);}
.qa.open .qa-body{display:block;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ans{font-size:.87rem;line-height:1.85;color:var(--text);}
.ans p{margin:8px 0;}
.ans ul{margin:8px 0 8px 20px;list-style:none;}
.ans ul li{position:relative;padding-left:16px;margin:5px 0;}
.ans ul li::before{content:'';position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:2px;background:var(--primary-light);}
.ans strong{color:var(--primary-dark);}
html[data-theme="dark"] .ans strong{color:#7FD4B0;}
.ans .box{border-radius:11px;padding:10px 13px;margin:10px 0;font-size:.84rem;line-height:1.8;}
.ans .tip{background:var(--primary-soft);color:var(--primary-dark);}
html[data-theme="dark"] .ans .tip{color:#8FD9B6;}
.ans .warn{background:var(--danger-soft);color:var(--danger);}
.ans .gold{background:var(--gold-soft);color:#8a6d00;}
.ans table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.78rem;}
.ans table th{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;}
.ans table th,.ans table td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
.ans table tr:nth-child(even) td{background:var(--primary-mist);}
.ans mark{background:#FFE374;color:#5c4600;border-radius:3px;padding:0 2px;}
html[data-theme="dark"] .ans mark{background:#8a7300;color:#ffe374;}
.imgs{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px;}
.fig{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg-card);cursor:zoom-in;transition:box-shadow .2s;}
.fig img{width:100%;display:block;max-height:340px;object-fit:contain;}
.fig figcaption{font-size:.72rem;color:var(--text2);background:var(--primary-mist);padding:6px 10px;line-height:1.6;}
.fig:active{transform:scale(.995);}
.fig .zoom-hint{float:right;font-size:.62rem;color:var(--text3);margin-left:6px;}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:46px 20px;color:var(--text3);}
.empty .e-ic{font-size:2.4rem;margin-bottom:10px;}
.empty .e-t{font-weight:700;color:var(--text2);font-size:.95rem;margin-bottom:6px;}
.empty .e-s{font-size:.8rem;line-height:1.9;}

/* ===== 底部 ===== */
.foot{margin-top:26px;padding:16px 0 10px;border-top:1px solid var(--border);text-align:center;font-size:.7rem;color:var(--text3);line-height:2;}

/* ===== 灯箱 ===== */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(8,20,14,.88);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;backdrop-filter:blur(4px);}
.lightbox.show{display:flex;animation:lbIn .2s;}
@keyframes lbIn{from{opacity:0;}to{opacity:1;}}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox .lb-cap{margin-top:14px;color:#E8F3EE;font-size:.85rem;max-width:640px;text-align:center;line-height:1.7;}
.lightbox .lb-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;font-size:1.15rem;display:flex;align-items:center;justify-content:center;}
.lightbox .lb-close:active{transform:scale(.92);}
.hidden{display:none !important;}
@media(max-width:560px){
  .topbar{padding:10px 14px;}
  .t-sub{display:none;}
  .search-btn{padding:8px 14px;}
  .fig img{max-height:260px;}
}
</style>
<style id="mobile-ux-patch">
/* ===== 移动端统一设计规范补丁（2026-09-12）：主色 #00A650 / 圆角 12px / 统一阴影 / 点击态 ===== */
:root{
  --primary:#00A650;--primary-dark:#00793C;--primary-light:#2FB877;
  --primary-soft:#E5F6EE;--primary-mist:#F2FAF6;
  --grad-primary:linear-gradient(135deg,#00A650 0%,#22BE79 100%);
  --radius:12px;
  --shadow:0 4px 14px rgba(0,120,64,.10);--shadow-lg:0 12px 32px rgba(0,120,64,.14);
}
/* 关键修复：小屏上问答卡片头部允许换行——问题占整行，徽标/来源/箭头排到第二行，
   彻底解决问题文字被来源标签挤压成一字一行的问题（图5） */
@media(max-width:640px){
  .qa-head{flex-wrap:wrap;row-gap:8px;}
  .qa-q{flex:1 1 100%;font-size:.94rem;}
  .qa-meta{flex-wrap:wrap;order:2;min-width:0;}
  .qa-src{white-space:normal;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;}
  .chev{margin-left:auto;}
}
.qa{border-radius:var(--radius);}
.search-box{border-radius:14px;}
/* 分类/热门标签：小屏横向滑动备选——保持换行但控制标签尺寸 */
@media(max-width:380px){
  .wrap{padding:12px 10px 48px;}
  .cat{padding:5px 11px;font-size:.78rem;}
  .tag{padding:3px 10px;font-size:.72rem;}
}
/* 点击态反馈 */
button{transition:transform .12s ease,background-color .18s ease,border-color .18s ease,color .18s ease;}
button:active{transform:scale(.96);}
.qa-head:active{background:#F4FAF6;}
@media (hover:none){
  .tag:hover,.cat:hover{background:var(--bg-card);color:var(--text2);}
  .cat.on{background:var(--primary);color:#fff;}
}
</style>
<style id="uxPolish">/*__UX_POLISH:v1__*/
/* ---- UX Polish v1 · 统一交互规范（规范源：index.html 壳层）---- */
:root{
  --ux-primary:#148453;--ux-primary-dark:#0C5F3A;--ux-primary-light:#1FA56A;
  --ux-gold:#F5B800;--ux-danger:#C62828;--ux-warn:#E64A19;
  --ux-ink:#0F2A1F;--ux-ink2:#5A6F65;--ux-border:#E5EDE9;
  --ux-radius-sm:8px;--ux-radius:12px;--ux-radius-lg:16px;
  /* 嵌入态底部补偿：index 壳层内嵌时由宿主注入实际 TabBar 高度；
     独立打开时回退 0px，模块自身安全区逻辑照旧（2026-09-16 遮挡修复） */
  --embed-bottom:0px;
  --embed-top:0px;
}
::selection{background:rgba(20,132,83,.24);}
*{scrollbar-width:thin;scrollbar-color:rgba(20,132,83,.35) transparent;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(20,132,83,.30);border-radius:99px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
button,a,[role="button"],input,select,textarea,label{-webkit-tap-highlight-color:transparent;}
button:not(:disabled){transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease;}
button:active:not(:disabled){transform:translateY(1px);}
:focus{outline:none;}
:focus-visible{outline:2.5px solid #148453;outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
/* ---- 深色模式：滚动条随主题（浅色令牌在 :root，各模块 dark 规则见下）---- */
html[data-theme="dark"] *{scrollbar-color:rgba(255,255,255,.22) transparent;}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.20);border:2px solid transparent;background-clip:content-box;}
html[data-theme="dark"] ::selection{background:rgba(31,165,106,.34);}

/* ---- UX Polish v1 · 深色模式兜底层（2026-09-16）----
   用户反馈：深色模式只有边框在变、美妆与医疗未覆盖、深色下部分文字看不清。
   本层为「无令牌体系」的模块补最小暗色变量，并统一修高对比度问题。 */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A14;--bg-card:#162420;--bg-elev:#1B2E26;
  --text:#E8F3EE;--text2:#9CB3A7;--text3:#6E8479;
  --border:#24402F;--border-strong:#2E5240;
  --primary-soft:#1A3D2A;--primary-mist:#132C21;
  --shadow:0 4px 14px rgba(0,0,0,.42);--shadow-lg:0 14px 36px rgba(0,0,0,.55);
}
html[data-theme="dark"] body{background:var(--bg);color:var(--text);}
/* 输入类：深色下浏览器默认白底白字，必须显式覆盖 */
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea{
  background:var(--bg-elev);color:var(--text);border-color:var(--border);
}
html[data-theme="dark"] input::placeholder,
html[data-theme="dark"] textarea::placeholder{color:var(--text3);}
/* 深色下「浅色底 + 浅色字」组合的兜底可读性修复 */
html[data-theme="dark"] .bg-white,
html[data-theme="dark"] .bg-gray-50,
html[data-theme="dark"] .bg-gray-100,
html[data-theme="dark"] .bg-slate-50,
html[data-theme="dark"] .bg-slate-100{background:var(--bg-card)!important;}
html[data-theme="dark"] .text-gray-900,
html[data-theme="dark"] .text-gray-800,
html[data-theme="dark"] .text-slate-900,
html[data-theme="dark"] .text-slate-800,
html[data-theme="dark"] .text-black{color:var(--text)!important;}
html[data-theme="dark"] .text-gray-700,
html[data-theme="dark"] .text-gray-600,
html[data-theme="dark"] .text-slate-700,
html[data-theme="dark"] .text-slate-600{color:#C3D6CB!important;}
html[data-theme="dark"] .text-gray-500,
html[data-theme="dark"] .text-gray-400,
html[data-theme="dark"] .text-slate-500,
html[data-theme="dark"] .text-slate-400{color:var(--text2)!important;}
html[data-theme="dark"] .border-gray-100,
html[data-theme="dark"] .border-gray-200,
html[data-theme="dark"] .border-gray-300,
html[data-theme="dark"] .border-slate-200{ border-color:var(--border)!important;}

/* daily：快捷标签/品类按钮触控目标（2026-09-17 响应式审计：23~28px 高难点准） */
@media (max-width:760px){
  .tag{min-height:36px;padding:6px 12px;font-size:.78rem;}
  .cat{min-height:36px;}
}
/*__UX_POLISH_END__*/</style>
</head>
<body>
<div class="livery-stripe"></div>

<header class="topbar">
  <div class="t-title"><span class="ic">❓</span>日常问题</div>
  <span class="t-count" id="totalCount">– 条知识点</span>
  <span class="t-sub">销售 · 配送 · 病假 · 体检 · 电子发票 速查</span>
</header>

<div class="wrap">

  <!-- 搜索 -->
  <div class="search-box">
    <input id="q" type="search" placeholder="输入关键字，如：转账 / 病假材料 / 开票 / WIFI / 销转保" autocomplete="off" enterkeyhint="search">
    <button class="search-btn" id="searchBtn">搜索</button>
  </div>
  <div class="hot" id="hotBar"></div>

  <!-- 分类 -->
  <div class="cats" id="catBar"></div>

  <!-- 结果信息 -->
  <div class="res-info" id="resInfo"></div>

  <!-- 列表 -->
  <div id="list"></div>

  <div class="foot">
    ✈️ 资料整理自：4份OJT销售培训PPT、《销售和病假资料》、《常见问题解决20260814》及管理手册细则（2026.09 更新）<br>
    知识点为速查摘要，涉及标准流程的细节请以培训材料与手册原文为准 · 离线可用
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
"use strict";

/* ================= 图片资源（构建时注入 base64） ================= */
const IMG = __IMG_DATA__;

/* ================= 知识库数据 ================= */
const CATS = [
  {id:'all', name:'全部', ic:'🗂️'},

  {id:'after', name:'售后服务', ic:'🛎️'},
  {id:'crew', name:'乘务管理', ic:'👩‍✈️'},
  {id:'sick', name:'病假管理', ic:'🏥'},
  {id:'invoice', name:'电子发票', ic:'🧾'}
];
const HOT = ['转账附言','现金缴存','病假材料','SMP占位','开电子发票','WIFI订单','销转保','退税退款','医疗观察期','值班经理','网订餐未配送','跨境额度','补款账号','加机组','更换飞机'];

const DATA = [
/* ============ 💰 销售收款 ============ */
{id:'s1',cat:'sales',hot:true,src:'4月OJT / 汇总',q:'销售收款方式有什么要求？',
 t:['收款','人民币','外币','免税品','跨境','结算'],
 a:`<ul>

   <li>现货餐饮、纪念品、跨境商品：可收<strong>人民币或外币</strong>。</li>
   </ul>
   <div class="box tip">💡 请根据商品品类区分收款币种，避免结算时出现差错。</div>`},
{id:'s2',cat:'sales',hot:true,src:'4月OJT / 汇总',q:'转账有哪些要求？转账附言格式怎么写？',
 t:['转账','附言','账号','财务','错误'],
 a:`<ul>
   <li>由<strong>乘务长</strong>或其指定乘务员进行转账，收款户名为<strong>春秋航空股份有限公司</strong>。</li>

   <li><strong>微信扫码</strong>收款订单：不扫码即可。</li>
   <li><strong>支付宝离线收款</strong>的跨境/预售订单：引导旅客联系绿翼商城客服按退款操作，同时乘务员将相应订单联系绿翼客服；如是机上餐饮、纪念品现货订单，需<strong>联系销售组</strong>处理退款。</li>
   <li><strong>现货订单</strong>：已增加退货功能，可直接在销售系统内点「退货」。注意现货退款需<strong>后台审核 1~2 个工作日</strong>，与旅客做好说明；产生过退货订单的，配送系统获取销售数量时注意销售数是否正确并及时更正。</li>
   </ul>`},
{id:'s7',cat:'sales',hot:false,src:'常见问题解决20260814',q:'销售系统里实际卖的是乐事，订单做成了上好佳，怎么纠正？',
 t:['品名错误','销售','配送系统','四联单','手工修改'],
 a:`配送系统获取销售后，<strong>手工修改配送系统的「销售」数</strong>，并在<strong>纸质四联单上写清楚原因</strong>。`},
{id:'s8',cat:'sales',hot:false,src:'常见问题解决20260814',q:'「现金缴存」功能适用于免税品销售吗？',
 t:['现金缴存','免税品','封包','不适用'],
 a:`<strong>不适用！</strong>免税品销售收取的现金，由四号位<strong>封存在免税品封包内</strong>，航后投入<strong>免税品封包箱</strong>中。`},
{id:'s9',cat:'sales',hot:false,src:'常见问题解决20260814',q:'现货销售和预售订单做反了，如何相互转化？',
 t:['现货','预售','做反','订单','销售组'],
 a:`<ul>
   <li>旅客购买商品，订单做成<strong>预售</strong>但<strong>现货</strong>已给旅客且订单已上传：<strong>联系销售组</strong>，提供订单号和事件描述。</li>
   <li>旅客下了<strong>现货</strong>订单，无法现场交付或落地后坚持要<strong>邮寄</strong>：联系销售组，提供订单号和旅客收货地址。</li>
   </ul>`},
{id:'s10',cat:'sales',hot:false,src:'常见问题解决20260814',q:'销售做错了需要给公司补款，补款方式是什么？',
 t:['补款','银行转账','账号','附言','中国银行','销售做错','补给公司','转错'],
 a:`通过<strong>银行转账</strong>方式，客舱现货销售的公司收款账号：
   <ul>
   <li>开户行：<strong>中国银行</strong>；户名：<strong>春秋航空股份有限公司</strong>；账号：<strong>4468 6792 3492</strong>。</li>
   <li>转账必须填写<strong>附言</strong>，至少包括<strong>日期、航班号</strong>（详见「转账有哪些要求」条目）。</li>
   </ul>`},

/* ============ 🧺 网订餐（常见问题解决20260814） ============ */
{id:'w1',cat:'weding',hot:false,src:'常见问题解决20260814',q:'智慧客舱系统中未显示网订餐食的信息怎么办？',
 t:['网订餐','未显示','智慧客舱','X产品未享用单'],
 a:`<ul>
   <li>① 确认是否旅客自行购票，请旅客自行查看是否有<strong>支付记录</strong>。</li>
   <li>② 确认旅客是否把餐食预定在了<strong>回程航班</strong>上——可让旅客查询预定成功信息（APP 或手机短信），或下机后咨询 <strong>95524</strong> 客服。</li>
   <li>③ 最终<strong>以智慧客舱系统展示为准</strong>，可在销售系统填写「<strong>X产品未享用单</strong>」，相关工作人员收到反馈后处理。</li>
   </ul>`},
{id:'w2',cat:'weding',hot:true,src:'常见问题解决20260814',q:'网订餐食未配送（机上没有/漏配）怎么保障？',
 t:['网订餐','未配送','同款替代','销转保','等价金额','主食','X产品未享用单'],
 a:`<strong>如旅客需要</strong>：
   <ul>
   <li>使用机上<strong>同款商品</strong>替代，配送系统做「<strong>销转保</strong>」处理，纸质四联单填写机上物品使用情况，<strong>乘务长签字确认</strong>。</li>
   <li>机上没有同款商品：询问旅客订餐金额，<strong>按同等金额保障</strong>（可选品类：餐食、小吃、饮料）。</li>
   <li>预定的是<strong>主食类</strong>（米饭、面食）：可提供机上任意一份主食类产品。</li>
   <li>预定含<strong>矿泉水</strong>：可提供一瓶机组水/销售水。</li>
   </ul>
   <strong>如旅客不需要</strong>：乘务员填写「X产品未享用单」，相关工作人员收到反馈后处理。`},
{id:'w3',cat:'weding',hot:false,src:'常见问题解决20260814',q:'旅客只想要网订套餐里的部分餐食（如只要赠的橙汁）怎么办？',
 t:['网订餐','部分食用','退款','X产品未享用单'],
 a:`加热餐食前<strong>明确告知旅客：无法只吃一半退一半</strong>。可以为旅客登记「<strong>X产品未享用单</strong>」<strong>整份退款</strong>，然后按机上售价<strong>单独销售</strong>旅客需要的餐饮。`},
{id:'w4',cat:'weding',hot:false,src:'常见问题解决20260814',q:'旅客说登机前已致电 95524 要求退网订餐，机上怎么处理？',
 t:['网订餐','退款','95524','鲜食','常温餐','X产品未享用单'],
 a:`<ul>
   <li>购买的是<strong>常温餐或小吃饮料</strong>：填写「X产品未享用单」，申请退款。</li>
   <li>购买的是<strong>航食配送的鲜食</strong>：先告知旅客<strong>鲜食无法退款</strong>；旅客坚持要退，帮旅客填写「X产品未享用单」，并告知<strong>是否申请成功以后台审核为准</strong>。</li>
   </ul>`},

/* ============ 🛍️ 商品知识（常见问题解决20260814） ============ */
{id:'g1',cat:'goods',hot:true,src:'常见问题解决20260814',q:'跨境商品（带保税字样）的真伪怎么向旅客解释？',
 t:['跨境','保税','真伪','掌上海关','海关'],
 a:`跨境商品从<strong>正规渠道采购、国内保税仓发出</strong>，所有跨境进口商品都经<strong>海关严格把关</strong>。支持购买人通过中国海关官方 APP「<strong>掌上海关</strong>」注册登录，关联身份证后查询<strong>完整链路</strong>：报关清关时间、付款金额、购买人信息、征收关税等。`},
{id:'g2',cat:'goods',hot:false,src:'常见问题解决20260814',q:'跨境商品的税费问题怎么解释？退货要承担税费吗？',
 t:['跨境','税费','关税','消费税','增值税','退货'],
 a:`跨境商品<strong>不是免税品</strong>，仅<strong>减免关税</strong>，仍须缴纳<strong>消费税和增值税</strong>。如旅客因<strong>非商品质量问题</strong>提出退货退款，<strong>旅客需承担相关税费</strong>。`},
{id:'g3',cat:'goods',hot:true,src:'常见问题解决20260814',q:'跨境商品个人年度额度是多少？超额度退款/怎么查额度？',
 t:['跨境','额度','26000','5000','掌上海关','小程序'],
 a:`<ul>
   <li><strong>额度</strong>：每人每年 <strong>26000 元</strong>跨境额度（365 个自然日滚动累计）；单笔订单不超过 <strong>5000 元</strong>，同一订单商品数量不超过 <strong>10 个</strong>，多件需分开下单——<strong>下单前一定要告知旅客</strong>。</li>
   <li><strong>超额度</strong>预定将被海关拦截导致无法入境、订单退款。</li>
   <li><strong>查询方式</strong>：「掌上海关」APP 或微信小程序 → 首页 → 跨境电商个人消费信息，输入姓名和身份证号即可查看已消费额度和剩余额度。</li>
   </ul>`},
{id:'g4',cat:'goods',hot:true,src:'常见问题解决20260814',q:'商品介绍有哪些禁忌话术？',
 t:['介绍','禁忌','最优惠','最低价','免税店','买一赠一','套装'],
 a:`<ul>
   <li>不要出现<strong>极端描述</strong>：最优惠、最低价、最便宜。</li>
   <li>不要承诺「比免税店便宜」——各地免税店价格实时变动，平台还会有补贴。</li>
   <li>套装产品直接描述<strong>套装里包含什么</strong>，不要说「买一赠一」，避免旅客误以为买一套赠一套。</li>
   <li>注意<strong>一般贸易产品和跨境产品的区别</strong>，不要误导旅客。</li>
   </ul>`},
{id:'g5',cat:'goods',hot:false,src:'常见问题解决20260814',q:'一般贸易产品和跨境产品怎么区分？',
 t:['一般贸易','跨境','保税','直邮','发货仓库'],
 a:`<ul>
   <li><strong>跨境品</strong>（商品名称含「保税」字样）：正规渠道采购、<strong>国内保税仓发出</strong>，等同于在国外购买，以消费者个人名义报关通关，海关按个人行邮物品监管收税。</li>
   <li><strong>一般贸易</strong>：从品牌官方授权渠道集中采购、<strong>国内仓库发出</strong>，正品与链路资料可提供。</li>
   </ul>`},
{id:'g6',cat:'goods',hot:false,src:'常见问题解决20260814',q:'商品材质介绍不详细、有无包装/礼袋怎么查？',
 t:['包装','礼袋','详情页','实拍图'],
 a:`所有商品都在<strong>标签尾部</strong>备注是套装还是独立包装、商品包含内容、发货仓库等信息；客单价较高的详情页会备注有无礼袋。<strong>市场部已把产品实拍图、礼品袋图更新到产品详情页</strong>。`},
{id:'g7',cat:'goods',hot:false,src:'常见问题解决20260814',q:'旅客查跨境商品批次号显示已过期，怎么准确查询批次号信息？',
 t:['批次号','效期','生产日期','绿翼商城客服'],
 a:`跨境商品包装上一般<strong>不单独标注生产日期/有效日期，只标注生产批次号</strong>，具体生产日期按批次号查询，仓库按批次随机发货。如旅客需查询效期：收货后提供<strong>批次号照片</strong>（一般位于外盒，字母+数字；找不到就提供商品 6 面照）给<strong>绿翼商城客服</strong>帮助查询。`},
{id:'g8',cat:'goods',hot:false,src:'常见问题解决20260814',q:'旅客问米饭为什么可以放半年不坏，怎么说明？',
 t:['常温餐','保鲜','含气调理','保质期','鲜食'],
 a:`<ul>
   <li><strong>常温餐</strong>（秘制卤肉饭、番茄牛肉饭、炸酱面、意大利肉酱面等）：使用<strong>新含气调理保鲜加工技术</strong>——初加工、灭菌化处理、充氮换包装、多阶段升温调理杀菌，达到商业无菌要求，常温避光可储存<strong>半年至一年</strong>。</li>
   <li><strong>鲜食</strong>（仅网订）：需<strong>冷藏/冷冻</strong>保存，仅供配送航段销售，未售出的<strong>销毁</strong>。</li>
   </ul>`},

/* ============ 📷 桌面扫码（常见问题解决20260814） ============ */
{id:'c1',cat:'scan',hot:false,src:'常见问题解决20260814',q:'旅客座位二维码缺失或损坏怎么办？',
 t:['二维码','缺失','损坏','就近扫码','销售咨询群'],
 a:`<ul>
   <li><strong>成排/多座位缺失</strong>：反馈在销售咨询群（会有工作人员统计和定期补充）。</li>
   <li><strong>个别缺失</strong>：提醒旅客扫描<strong>就近二维码</strong>购买，配送时注意核对旅客手机号（注意沟通方式）。</li>
   <li>也可提醒旅客阅读机上菜单，将购买需求告知乘务组，或平飞后推车销售经过时购买（也可提供某座位二维码，购买后核对手机号配送）。</li>
   </ul>`},
{id:'c2',cat:'scan',hot:false,src:'常见问题解决20260814',q:'旅客扫码后不显示内容或座位信息有误怎么办？',
 t:['扫码','不显示','座位信息','撕掉二维码'],
 a:`<ul>
   <li>① 检查<strong>打开开始销售的航段</strong>是否准确。</li>
   <li>② 确认<strong>其他座位</strong>扫码是否正常。</li>
   <li>③ 确认不是本飞机二维码：将二维码<strong>拍照发销售咨询群</strong>，并<strong>撕掉此二维码</strong>。</li>
   </ul>`},
{id:'c3',cat:'scan',hot:false,src:'常见问题解决20260814',q:'旅客扫码支付成功（有付款记录）但销售系统查不到订单怎么办？',
 t:['支付成功','查不到订单','刷新','航班号','撕掉二维码','付款成功','没有订单','订单不见'],
 a:`<ul>
   <li>① 检查 IPAD<strong>网络</strong>是否正常，并<strong>刷新订单</strong>。</li>
   <li>② 乘务员可<strong>自己扫旅客扫过的二维码</strong>确认航班号信息（也可查看旅客手机上的订单确认座位、航班号）。</li>
   <li>③ 确认不是本航班二维码：拍照发销售咨询群，并<strong>撕掉此二维码</strong>。</li>
   </ul>`},

/* ============ 🛎️ 售后服务（常见问题解决20260814） ============ */
{id:'a1',cat:'after',hot:true,src:'常见问题解决20260814',q:'旅客售后问题（破损/退换货/订单信息错误/收货地址填错）找谁处理？',
 t:['售后','退换货','收货地址','绿翼商城','公众号','客服'],
 a:`在「<strong>春秋航空绿翼商城</strong>」微信公众号上联系商城客服协助处理。
   <ul>
   <li>示例（收货手机号填错）：公众号 → 在线服务 → 联系客服 → 提供填错的手机号查到订单 → 提供正确的收货人手机号、名字、地址，在线客服修改。</li>
   <li>如查询不到订单，需提供<strong>支付凭证详情截图</strong>（点开支付记录中的「更多」，显示「<strong>商家订单号</strong>」，截图给客服）。</li>
   </ul>`},
{id:'a2',cat:'after',hot:false,src:'常见问题解决20260814',q:'旅客需要延迟发货怎么办？（下单时一定要先问）',
 t:['延迟发货','稍后填写收货地址','30天','跨境','海关','晚点发货','推迟发货','发货时间'],
 a:`填写收货地址前<strong>一定要先询问旅客</strong>是否需要正常时效发货：
   <ul>
   <li><strong>需要延迟发货</strong>：销售订单选「<strong>稍后填写收货地址</strong>」，引导旅客关注绿翼商城公众号，确定能收货时联系客服填地址。仅支持发货日期距下单日期 <strong>&lt;30 天</strong>。</li>
   <li><strong>无需延迟</strong>：选「立即填写收货地址」即可。</li>
   <li><strong>已填地址再要求延迟</strong>：一般贸易（快递到家、飞亚达、卡西欧、纪念品）请旅客或协助旅客立即联系绿翼商城客服提供发货日期，客服处理；<strong>跨境商品只能按正常时效发货，一旦发货无法延迟</strong>。</li>
   </ul>
   <div class="box warn">⚠️ 延迟发货存在最终无法发出的风险（海关挂单导致漏单退单等）。</div>`},
{id:'a3',cat:'after',hot:false,src:'常见问题解决20260814',q:'微信扫码支付，旅客互相扫错了二维码（付了对方的商品）怎么处理？',
 t:['扫错码','退单','SMP工作证','订单编号','绿翼客服'],
 a:`第一时间提供「<strong>个人 SMP 工作证截图</strong>」及相关<strong>订单编号</strong>，关注「春秋航空绿翼商城」公众号 → 在线服务 → 联系客服处理<strong>退单</strong>。`},
{id:'a4',cat:'after',hot:false,src:'常见问题解决20260814',q:'怎么协助旅客查询机上订单的物流信息？',
 t:['物流','查询','公众号','SMP截图','订单号'],
 a:`告知旅客关注「春秋航空绿翼商城」公众号，右下角「<strong>机上订单</strong>」中用预订人手机号登录查询订单和物流。
   <div class="box tip">💡 如乘务员代查，必须直接提供 <strong>SMP 截图 + 订单号</strong>人工速查（避免多个不同账号查同一单的重复工作）。</div>`},
{id:'a5',cat:'after',hot:false,src:'常见问题解决20260814',q:'商品未收货前旅客不想要了想退货怎么办？',
 t:['退货','未收货','快递到家','跨境','客服'],
 a:`<ul>
   <li><strong>快递到家、飞亚达、卡西欧、纪念品</strong>：旅客可自己在绿翼商城订单提交退货、退款申请。</li>
   <li><strong>跨境商品</strong>（带保税字样）：需联系<strong>绿翼商城后台客服</strong>处理退货、退款。</li>
   </ul>`},
{id:'a6',cat:'after',hot:false,src:'常见问题解决20260814',q:'商品签收后不想要了想退货，支持 7 天无理由吗？',
 t:['7天无理由','退货','运费','跨境','拒收'],

/* ================= 渲染 ================= */
const $ = s => document.querySelector(s);
const totalEl = $('#totalCount');
let kw = '', cat = 'all';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initImgs(){
  const imgs = document.querySelectorAll('img[data-k]');
  imgs.forEach(im=>{ const k = im.getAttribute('data-k'); if(IMG && IMG[k]) im.src = IMG[k]; });
}
function catMeta(id){ const c = CATS.find(x=>x.id===id); return c; }

function renderHot(){
  $('#hotBar').innerHTML = '<span class="lbl">热门：</span>' + HOT.map(h=>`<button class="tag" onclick="setKeyword('${esc(h)}')">${h}</button>`).join('');
}
function renderCats(){
  const cnt = {}; DATA.forEach(d=>cnt[d.cat]=(cnt[d.cat]||0)+1);
  $('#catBar').innerHTML = CATS.map(c=>c.id==='all'
    ? `<button class="cat on" id="cat_all" onclick="setCat('all')">🗂️ ${c.name}<small>${DATA.length}</small></button>`
    : `<button class="cat" id="cat_${c.id}" onclick="setCat('${c.id}')">${c.ic} ${c.name}<small>${cnt[c.id]||0}</small></button>`).join('');
}
function setCat(id){ cat = id; document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on')); const el = document.getElementById('cat_'+id); if(el) el.classList.add('on'); applyFilter(); }
function setKeyword(k){ $('#q').value = k; $('#q').focus(); doSearch(); }
function toggleQA(id){
  const el = document.getElementById('qa_'+id);
  if(!el) return;
  const open = el.classList.contains('open');
  document.querySelectorAll('.qa.open').forEach(x=>x.classList.remove('open'));
  if(!open){ el.classList.add('open'); const body = el.querySelector('.qa-body'); if(body) initImgs(); }
}

/* ---------- 模糊匹配：包含 + 子序列 + 同音纠正 ---------- */
const HOMO = {'帐':'账','正':'账','兆':'缴','交':'缴','付':'附','张':'账','完':'皖','申':'身','身':'申','抵':'递','滇':'颠','综':'总','总':'综','恼':'道','到':'道'};
function norm(s){ return s.toLowerCase().replace(/\s+/g,''); }
function containsSeq(hay, q){ // 子序列匹配（容忍缺字/错序输入）
  let i=0; for(let j=0;j<hay.length && i<q.length;j++){ if(hay[j]===q[i]) i++; }
  return i===q.length;
}
function homonorm(s){
  let out='';
  for(const ch of s){ out += (HOMO[ch]||ch); }
  return out;
}
function searchScore(e){
  const qn = norm(kw);
  if(!qn) return 0;
  const hayQ = norm(e.q), hayA = norm(e.a), hayT = norm((e.t||[]).join('')), hayC = norm(catMeta(e.cat).name);
  let endText=false;
  if(hayQ.includes(qn) || hayT.includes(qn) || hayC.includes(qn)) return 100;
  if(hayA.includes(qn)) return 60;
  if(containsSeq(hayT, qn) || containsSeq(hayQ, qn) || containsSeq(hayC, qn)) return 40;
  if(containsSeq(hayA, qn)) return 25;
  // 同音纠正再试
  const hq = homonorm(qn), hQ = homonorm(hayQ), hA = homonorm(hayA), hT = homonorm(hayT);
  if(hQ.includes(hq) || hT.includes(hq) || hC_inc(hq)) return 50;
  if(hA.includes(hq)) return 30;
  return 0;
  function hC_inc(hq){ return homonorm(norm(catMeta(e.cat).name)).includes(hq); }
}
function mark(s){ if(!kw) return s; const qn=norm(kw); const idx=s.toLowerCase().indexOf(qn); if(idx<0) return s; if(qn.length===0) return s; return s.slice(0,idx)+'<mark>'+s.slice(idx,idx+qn.length)+'</mark>'+s.slice(idx+qn.length); }

function cardHtml(e){
  const c = catMeta(e.cat);
  const srcLabel = e.src||'';
  return `<div class="qa" id="qa_${e.id}">
    <div class="qa-head" onclick="toggleQA('${e.id}')">
      <div class="qa-q">${mark(e.q)}${e.hot?'':''}</div>
      <div class="qa-meta"><span class="badge ${e.cat}">${c.ic} ${c.name}</span><span class="qa-src">${srcLabel}</span></div>
      <span class="chev">▾</span>
    </div>
    <div class="qa-body"><div class="ans">${e.a}</div></div>
  </div>`;
}
function applyFilter(){
  let list = DATA.slice();
  let matched = [];
  if(kw){ list.forEach(e=>{ const sc = searchScore(e); if(sc>0) matched.push({e,sc}); }); matched.sort((a,b)=>b.sc-a.sc); list = matched.map(m=>m.e); }
  if(cat!=='all'){ if(kw){ list = list.filter(e=>e.cat===cat); } else { list = DATA.filter(e=>e.cat===cat); } }

  const wrap = $('#list');
  if(!list.length){
    $('#resInfo').innerHTML = (kw?`未找到与「<span class="hl">${esc(kw)}</span>」匹配的知识点`:'暂无内容') + `<button class="clear" onclick="clearAll()">清空</button>`;
    wrap.innerHTML = `<div class="empty"><div class="e-ic">🕵️</div><div class="e-t">没有找到相关知识点</div><div class="e-s">试试热门标签，或换个关键词（如：转账 / 公章 / 销转保 / 航医）。<br>支持模糊匹配，输入「zhuan」可搜「转账」类内容。</div></div>`;
    return;
  }
  // 分组渲染
  let html = '';
  if(!kw){
    CATS.forEach(c=>{
      if(c.id==='all') return;
      const items = list.filter(e=>e.cat===c.id);
      if(!items.length) return;
      html += `<div class="group-title">${c.ic} ${c.name}</div>` + items.map(cardHtml).join('');
    });
  } else {
    html = list.map(cardHtml).join('');
  }
  wrap.innerHTML = html;
  $('#resInfo').innerHTML = (kw
    ? `搜索「<span class="hl">${esc(kw)}</span>」共命中 <span class="hl">${list.length}</span> 条` + (cat!=='all'?` ＋ 分类【${catMeta(cat).name}】`:'') + `<button class="clear" onclick="clearAll()">清空</button>`
    : (cat==='all' ? '' : `分类：${catMeta(cat).ic} ${catMeta(cat).name}（${list.length} 条）`));
}
function clearAll(){ $('#q').value=''; kw=''; cat='all'; document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on')); const el=document.getElementById('cat_all'); if(el) el.classList.add('on'); applyFilter(); }
function doSearch(){ kw = $('#q').value.trim(); applyFilter(); }

/* ---------- 灯箱 ---------- */
function openLb(k){
  if(!IMG || !IMG[k]) return;
  $('#lbImg').src = IMG[k];
  const fig = document.querySelector(`img[data-k="${k}"]`);
  $('#lbCap').textContent = fig && fig.parentElement && fig.parentElement.querySelector('figcaption') ? fig.parentElement.querySelector('figcaption').textContent.replace('点击放大','') : '';
  $('#lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLb(){ $('#lightbox').classList.remove('show'); document.body.style.overflow=''; }
$('#lbClose').addEventListener('click', closeLb);
$('#lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLb(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });

/* ---------- 搜索事件 ---------- */
let deb = null;
$('#q').addEventListener('input', function(){ clearTimeout(deb); deb=setTimeout(doSearch,150); });
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
$('#searchBtn').addEventListener('click', doSearch);

/* ---------- 启动 ---------- */
totalEl.textContent = DATA.length + ' 条知识点';
renderHot();
renderCats();
clearAll();
</script>

<script id="mobile-native-js">
(function(){

  if(navigator.vibrate){
    addEventListener('pointerdown',function(e){
      var t=e.target;
      if(t&&t.closest&&t.closest('button,[onclick],a,[role="button"]')){
        try{navigator.vibrate(8)}catch(_){}

    },{passive:true,capture:true});
  }
  /* 2) 安全区自动注入：贴边的 fixed/sticky 条补 env(safe-area-inset-*)；
        无贴边条的页面则给 body 补，保证内容不钻进刘海/小白条 */
  var px=function(v){return parseFloat(v)||0};
  function patchOne(el,edge){
    var cs=getComputedStyle(el);
    if(edge==='top'){el.style.paddingTop='calc('+px(cs.paddingTop)+'px + env(safe-area-inset-top,0px))';}
    else{el.style.paddingBottom='calc('+px(cs.paddingBottom)+'px + env(safe-area-inset-bottom,0px))';}
  }
  function walk(){
    var vw=innerWidth,vh=innerHeight,gotTop=false,gotBot=false;
    var els=document.querySelectorAll('body *');
    for(var i=0;i<els.length;i++){
      var el=els[i];if(el.dataset.msa)continue;el.dataset.msa='1';
      var cs=getComputedStyle(el),pos=cs.position;
      if(pos!=='fixed'&&pos!=='sticky')continue;
      var r=el.getBoundingClientRect();
      if(r.width===0||r.height===0)continue;
      if(r.width>=vw*0.95&&r.height>=vh*0.9)continue; /* 全屏遮罩类不碰 */
      var wide=(r.width>=vw*0.9);
      if(!wide)continue;
      if(pos==='fixed'){
        var t=px(cs.top),b=px(cs.bottom);
        if(t>=0&&t<=6){patchOne(el,'top');gotTop=true;}
        else if(b>=0&&b<=2){patchOne(el,'bot');gotBot=true;}
      }else{
        var st=px(cs.top),sb=px(cs.bottom);
        if(cs.top!=='auto'&&st<=6){patchOne(el,'top');gotTop=true;}
        else if(cs.bottom!=='auto'&&sb<=2){patchOne(el,'bot');gotBot=true;}
      }
    }
    var b=document.body,bs=getComputedStyle(b);
    if(!gotTop){b.style.paddingTop='calc('+px(bs.paddingTop)+'px + env(safe-area-inset-top,0px))';}
    if(!gotBot){b.style.paddingBottom='calc('+px(bs.paddingBottom)+'px + env(safe-area-inset-bottom,0px))';}
  }
  function safe(){try{walk()}catch(_){}}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',safe)}else{safe()}
  addEventListener('load',safe);
  setTimeout(safe,800);
})();
</script>
