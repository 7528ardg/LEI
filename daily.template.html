<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#148453">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日常问题">
<meta name="format-detection" content="telephone=no">
<title>日常问题 · 春秋全能助手</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --primary:#148453;--primary-dark:#0C5F3A;--primary-light:#3E9E79;
  --primary-soft:#E8F3EE;--primary-mist:#F4F9F6;
  --gold:#F5B800;--gold-soft:#FEF6DC;
  --danger:#C62828;--danger-soft:#FDE7E7;
  --grad-primary:linear-gradient(135deg,#148453 0%,#1FA56A 100%);
  --bg:#F5F8F6;--bg-card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#9DB0A6;
  --border:#E5EDE9;--shadow:0 4px 14px rgba(20,132,83,.10);--shadow-lg:0 12px 32px rgba(20,132,83,.14);
}
html[data-theme="dark"]{
  --bg:#0F1A14;--bg-card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;
  --primary-soft:#1A3D2A;--primary-mist:#142E22;--danger-soft:#2A1616;--gold-soft:#2A2410;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
button{font-family:var(--font-sans);cursor:pointer;}
input{font-family:var(--font-sans);}

/* ===== 顶部 ===== */
.livery-stripe{height:3px;background:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 18px;transition:background .3s;backdrop-filter:blur(20px);}
.t-title{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800;color:var(--primary);white-space:nowrap;}
.t-title .ic{width:30px;height:30px;border-radius:9px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.t-count{font-size:.72rem;font-weight:600;color:var(--text2);background:var(--primary-soft);padding:3px 10px;border-radius:12px;white-space:nowrap;}
.t-sub{margin-left:auto;font-size:.74rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 容器 ===== */
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px;}

/* ===== 搜索区 ===== */
.search-box{display:flex;gap:8px;box-shadow:var(--shadow-lg);border-radius:16px;padding:8px;background:var(--bg-card);border:1px solid var(--border);transition:border-color .2s,box-shadow .2s;}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,132,83,.15);}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:.98rem;color:var(--text);padding:8px 10px;min-width:0;}
.search-box input::placeholder{color:var(--text3);}
.search-btn{border:none;background:var(--grad-primary);color:#fff;font-size:.9rem;font-weight:700;border-radius:11px;padding:8px 20px;transition:transform .15s,box-shadow .2s;box-shadow:var(--shadow);}
.search-btn:active{transform:scale(.96);}
.hot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.hot .lbl{font-size:.72rem;color:var(--text3);font-weight:600;}
.tag{font-size:.76rem;font-weight:600;color:var(--text2);background:var(--bg-card);border:1px solid var(--border);padding:4px 12px;border-radius:14px;transition:all .15s;}
.tag:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-mist);}
.tag.on{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ===== 分类 ===== */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.cat{font-size:.82rem;font-weight:700;color:var(--text2);background:var(--bg-card);border:1px solid var(--border);padding:6px 14px;border-radius:10px;transition:all .15s;}
.cat:hover,.cat.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.cat small{font-weight:600;opacity:.75;margin-left:3px;}

/* ===== 结果信息 ===== */
.res-info{margin:16px 0 10px;font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:8px;min-height:20px;}
.res-info .hl{color:var(--primary);font-weight:800;}
.res-info .clear{font-size:.74rem;color:var(--primary);background:var(--primary-soft);border:none;padding:3px 10px;border-radius:10px;font-weight:600;}

/* ===== 问答列表 ===== */
.group-title{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:800;color:var(--primary);margin:18px 2px 8px;}
.group-title::after{content:'';flex:1;height:1px;background:var(--border);}
.qa{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:box-shadow .2s,border-color .2s;}
.qa:hover{box-shadow:var(--shadow);}
.qa.open{border-color:var(--primary);box-shadow:var(--shadow-lg);}
.qa-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;}
.qa-q{flex:1;font-size:.92rem;font-weight:700;line-height:1.5;min-width:0;}
.qa-meta{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.badge{font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:9px;color:#fff;white-space:nowrap;}
.badge.sales{background:#148453;}.badge.deliver{background:#1E88E5;}.badge.inflight{background:#6D4EC2;}.badge.sick{background:#E8590C;}.badge.invoice{background:#B8860B;}
.qa-src{font-size:.66rem;color:var(--text3);background:var(--primary-mist);padding:2px 7px;border-radius:8px;white-space:nowrap;}
.chev{width:22px;height:22px;flex-shrink:0;color:var(--text2);transition:transform .25s;display:flex;align-items:center;justify-content:center;}
.qa.open .chev{transform:rotate(180deg);color:var(--primary);}
.qa-body{display:none;padding:2px 16px 16px;border-top:1px dashed var(--border);}
.qa.open .qa-body{display:block;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ans{font-size:.87rem;line-height:1.85;color:var(--text);}
.ans p{margin:8px 0;}
.ans ul{margin:8px 0 8px 20px;list-style:none;}
.ans ul li{position:relative;padding-left:16px;margin:5px 0;}
.ans ul li::before{content:'';position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:2px;background:var(--primary-light);}
.ans strong{color:var(--primary-dark);}
html[data-theme="dark"] .ans strong{color:#7FD4B0;}
.ans .box{border-radius:11px;padding:10px 13px;margin:10px 0;font-size:.84rem;line-height:1.8;}
.ans .tip{background:var(--primary-soft);color:var(--primary-dark);}
html[data-theme="dark"] .ans .tip{color:#8FD9B6;}
.ans .warn{background:var(--danger-soft);color:var(--danger);}
.ans .gold{background:var(--gold-soft);color:#8a6d00;}
.ans table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.78rem;}
.ans table th{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;}
.ans table th,.ans table td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
.ans table tr:nth-child(even) td{background:var(--primary-mist);}
.ans mark{background:#FFE374;color:#5c4600;border-radius:3px;padding:0 2px;}
html[data-theme="dark"] .ans mark{background:#8a7300;color:#ffe374;}
.imgs{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px;}
.fig{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg-card);cursor:zoom-in;transition:box-shadow .2s;}
.fig img{width:100%;display:block;max-height:340px;object-fit:contain;}
.fig figcaption{font-size:.72rem;color:var(--text2);background:var(--primary-mist);padding:6px 10px;line-height:1.6;}
.fig:active{transform:scale(.995);}
.fig .zoom-hint{float:right;font-size:.62rem;color:var(--text3);margin-left:6px;}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:46px 20px;color:var(--text3);}
.empty .e-ic{font-size:2.4rem;margin-bottom:10px;}
.empty .e-t{font-weight:700;color:var(--text2);font-size:.95rem;margin-bottom:6px;}
.empty .e-s{font-size:.8rem;line-height:1.9;}

/* ===== 底部 ===== */
.foot{margin-top:26px;padding:16px 0 10px;border-top:1px solid var(--border);text-align:center;font-size:.7rem;color:var(--text3);line-height:2;}

/* ===== 灯箱 ===== */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(8,20,14,.88);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;backdrop-filter:blur(4px);}
.lightbox.show{display:flex;animation:lbIn .2s;}
@keyframes lbIn{from{opacity:0;}to{opacity:1;}}
.lightbox img{max-width:100%;max-height:78vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox .lb-cap{margin-top:14px;color:#E8F3EE;font-size:.85rem;max-width:640px;text-align:center;line-height:1.7;}
.lightbox .lb-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;font-size:1.15rem;display:flex;align-items:center;justify-content:center;}
.lightbox .lb-close:active{transform:scale(.92);}
.hidden{display:none !important;}
@media(max-width:560px){
  .topbar{padding:10px 14px;}
  .t-sub{display:none;}
  .search-btn{padding:8px 14px;}
  .fig img{max-height:260px;}
}
</style>
</head>
<body>
<div class="livery-stripe"></div>

<header class="topbar">

<div class="wrap">

</div>

<div class="lightbox" id="lightbox">

 t:['发票','开票','电子发票','小程序','扫码','地面'],
 a:`<ul>
   <li>机上<strong>桌面扫码订单支持自助开票</strong>。</li>
   <li>补充新增：<strong>地面扫码订单可通过小程序直接开具电子发票</strong>，无需柜台排队。</li>
   </ul>
   <div class="box tip">💡 开票是基于订单关联的，先确认订单渠道（地面扫码单 / 机上桌面扫码单），再进入对应小程序开票。</div>`}
];

/* ================= 渲染 ================= */
const $ = s => document.querySelector(s);
const totalEl = $('#totalCount');
let kw = '', cat = 'all';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initImgs(){
  const imgs = document.querySelectorAll('img[data-k]');
  imgs.forEach(im=>{ const k = im.getAttribute('data-k'); if(IMG && IMG[k]) im.src = IMG[k]; });
}
function catMeta(id){ const c = CATS.find(x=>x.id===id); return c; }

function renderHot(){
  $('#hotBar').innerHTML = '<span class="lbl">热门：</span>' + HOT.map(h=>`<button class="tag" onclick="setKeyword('${esc(h)}')">${h}</button>`).join('');
}
function renderCats(){
  const cnt = {}; DATA.forEach(d=>cnt[d.cat]=(cnt[d.cat]||0)+1);
  $('#catBar').innerHTML = CATS.map(c=>c.id==='all'
    ? `<button class="cat on" id="cat_all" onclick="setCat('all')">🗂️ ${c.name}<small>${DATA.length}</small></button>`
    : `<button class="cat" id="cat_${c.id}" onclick="setCat('${c.id}')">${c.ic} ${c.name}<small>${cnt[c.id]||0}</small></button>`).join('');
}
function setCat(id){ cat = id; document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on')); const el = document.getElementById('cat_'+id); if(el) el.classList.add('on'); applyFilter(); }
function setKeyword(k){ $('#q').value = k; $('#q').focus(); doSearch(); }
function toggleQA(id){
  const el = document.getElementById('qa_'+id);
  if(!el) return;
  const open = el.classList.contains('open');
  document.querySelectorAll('.qa.open').forEach(x=>x.classList.remove('open'));
  if(!open){ el.classList.add('open'); const body = el.querySelector('.qa-body'); if(body) initImgs(); }
}

/* ---------- 模糊匹配：包含 + 子序列 + 同音纠正 ---------- */
const HOMO = {'帐':'账','正':'账','兆':'缴','交':'缴','付':'附','张':'账','完':'皖','申':'身','身':'申','抵':'递','滇':'颠','综':'总','总':'综','恼':'道','到':'道'};
function norm(s){ return s.toLowerCase().replace(/\s+/g,''); }
function containsSeq(hay, q){ // 子序列匹配（容忍缺字/错序输入）
  let i=0; for(let j=0;j<hay.length && i<q.length;j++){ if(hay[j]===q[i]) i++; }
  return i===q.length;
}
function homonorm(s){
  let out='';
  for(const ch of s){ out += (HOMO[ch]||ch); }
  return out;
}
function searchScore(e){
  const qn = norm(kw);
  if(!qn) return 0;
  const hayQ = norm(e.q), hayA = norm(e.a), hayT = norm((e.t||[]).join('')), hayC = norm(catMeta(e.cat).name);
  let endText=false;
  if(hayQ.includes(qn) || hayT.includes(qn) || hayC.includes(qn)) return 100;
  if(hayA.includes(qn)) return 60;
  if(containsSeq(hayT, qn) || containsSeq(hayQ, qn) || containsSeq(hayC, qn)) return 40;
  if(containsSeq(hayA, qn)) return 25;
  // 同音纠正再试
  const hq = homonorm(qn), hQ = homonorm(hayQ), hA = homonorm(hayA), hT = homonorm(hayT);
  if(hQ.includes(hq) || hT.includes(hq) || hC_inc(hq)) return 50;
  if(hA.includes(hq)) return 30;
  return 0;
  function hC_inc(hq){ return homonorm(norm(catMeta(e.cat).name)).includes(hq); }
}
function mark(s){ if(!kw) return s; const qn=norm(kw); const idx=s.toLowerCase().indexOf(qn); if(idx<0) return s; if(qn.length===0) return s; return s.slice(0,idx)+'<mark>'+s.slice(idx,idx+qn.length)+'</mark>'+s.slice(idx+qn.length); }

function cardHtml(e){
  const c = catMeta(e.cat);
  const srcLabel = e.src||'';
  return `<div class="qa" id="qa_${e.id}">
    <div class="qa-head" onclick="toggleQA('${e.id}')">
      <div class="qa-q">${mark(e.q)}${e.hot?'':''}</div>
      <div class="qa-meta"><span class="badge ${e.cat}">${c.ic} ${c.name}</span><span class="qa-src">${srcLabel}</span></div>
      <span class="chev">▾</span>
    </div>
    <div class="qa-body"><div class="ans">${e.a}</div></div>
  </div>`;
}
function applyFilter(){
  let list = DATA.slice();
  let matched = [];
  if(kw){ list.forEach(e=>{ const sc = searchScore(e); if(sc>0) matched.push({e,sc}); }); matched.sort((a,b)=>b.sc-a.sc); list = matched.map(m=>m.e); }
  if(cat!=='all'){ if(kw){ list = list.filter(e=>e.cat===cat); } else { list = DATA.filter(e=>e.cat===cat); } }

  const wrap = $('#list');
  if(!list.length){
    $('#resInfo').innerHTML = (kw?`未找到与「<span class="hl">${esc(kw)}</span>」匹配的知识点`:'暂无内容') + `<button class="clear" onclick="clearAll()">清空</button>`;
    wrap.innerHTML = `<div class="empty"><div class="e-ic">🕵️</div><div class="e-t">没有找到相关知识点</div><div class="e-s">试试热门标签，或换个关键词（如：转账 / 公章 / 销转保 / 航医）。<br>支持模糊匹配，输入「zhuan」可搜「转账」类内容。</div></div>`;
    return;
  }
  // 分组渲染
  let html = '';
  if(!kw){
    CATS.forEach(c=>{
      if(c.id==='all') return;
      const items = list.filter(e=>e.cat===c.id);
      if(!items.length) return;
      html += `<div class="group-title">${c.ic} ${c.name}</div>` + items.map(cardHtml).join('');
    });
  } else {
    html = list.map(cardHtml).join('');
  }
  wrap.innerHTML = html;
  $('#resInfo').innerHTML = (kw
    ? `搜索「<span class="hl">${esc(kw)}</span>」共命中 <span class="hl">${list.length}</span> 条` + (cat!=='all'?` ＋ 分类【${catMeta(cat).name}】`:'') + `<button class="clear" onclick="clearAll()">清空</button>`
    : (cat==='all' ? '' : `分类：${catMeta(cat).ic} ${catMeta(cat).name}（${list.length} 条）`));
}
function clearAll(){ $('#q').value=''; kw=''; cat='all'; document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on')); const el=document.getElementById('cat_all'); if(el) el.classList.add('on'); applyFilter(); }
function doSearch(){ kw = $('#q').value.trim(); applyFilter(); }

/* ---------- 灯箱 ---------- */
function openLb(k){
  if(!IMG || !IMG[k]) return;
  $('#lbImg').src = IMG[k];
  const fig = document.querySelector(`img[data-k="${k}"]`);
  $('#lbCap').textContent = fig && fig.parentElement && fig.parentElement.querySelector('figcaption') ? fig.parentElement.querySelector('figcaption').textContent.replace('点击放大','') : '';
  $('#lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLb(){ $('#lightbox').classList.remove('show'); document.body.style.overflow=''; }
$('#lbClose').addEventListener('click', closeLb);
$('#lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLb(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });

/* ---------- 搜索事件 ---------- */
let deb = null;
$('#q').addEventListener('input', function(){ clearTimeout(deb); deb=setTimeout(doSearch,150); });
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
$('#searchBtn').addEventListener('click', doSearch);

/* ---------- 启动 ---------- */
totalEl.textContent = DATA.length + ' 条知识点';
renderHot();
renderCats();
clearAll();
</script>
</body>
</html>
