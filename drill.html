<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<script>
/* __DRILL_20261012__ 场景演练 · 机上事件特殊演练（导演台 + 转盘定岗 + 旅客任务）
   双模式：
   · 导演模式（默认）：导演台 / 转盘定岗 / 事件看板 / 旅客卡包 / 剧本库；
     检测到本地同步服务（exam_system 的 /api/drill/*）时为「联机模式」，
     学员手机经 ?room=房码 加入，实时同步；无服务时自动降级「单机模式」。
   · 学员模式（URL 带 ?room=）：乘务员转盘定岗 / 旅客任务卡（模糊揭示）/ 事件看板。 */
(function(){
  /* 自嵌入检测：被壳层 iframe 载入时隐藏本模块自带顶栏（防顶栏先渲染再消失的闪烁） */
  try{
    if(window.self !== window.top){
      document.documentElement.setAttribute('data-embed','1');
      document.documentElement.style.setProperty('--topbar-h','0px');
    }
  }catch(e){}
  /* 板块权限守卫（仅导演模式）：fail-closed。
     · 管理员：与 issues.html 同款判定（role==='admin' 或 工号 100000）；
     · 班组长：__DRILL_LEADER_20261012__ 开放给班组长当导演 —— 壳层在考试系统
       登录时会把 is_manager/is_super 同步为 role='admin'（见 index.html SSO 块），
       这里再兜底读 exam_user_v1 的真实角色，覆盖「会话未同步但考试身份在」的情形。
     学员模式（?room=）不拦截 —— 房码即入场券，学员不是管理员。 */
  var isPlayer = false;
  try{ isPlayer = new URLSearchParams(location.search).has('room'); }catch(e){}
  if(isPlayer) return;
  var admin = false;
  try{
    var raw = localStorage.getItem('cabin_session_v1');
    if(raw){
      var s = JSON.parse(raw);
      if(s && (!s.exp || Date.now() <= s.exp) && (s.role === 'admin' || s['\u5de5\u53f7'] === '028981')) admin = true;
    }
  }catch(e){ admin = false; }
  if(!admin){
    try{
      var eu = JSON.parse(localStorage.getItem('exam_user_v1') || 'null');
      if(eu && (eu.is_manager || eu.is_super)) admin = true;
    }catch(e){}
  }
  if(admin) return;
  try{
    var n='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板块完善中</title></head><body style="margin:0"><div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;color:#0F2A1F;font-family:system-ui,-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;text-align:center;padding:24px"><div style="font-size:2.6rem">🎭</div><div style="font-size:1.18rem;font-weight:800">场景演练板块正在完善，敬请期待</div><div style="font-size:.85rem;color:#5b6b63;max-width:300px;line-height:1.7">本板块由管理员（导演）统一开放；参训学员请使用导演屏幕给出的带房码链接加入。</div></div></body></html>';
    document.open();document.write(n);document.close();
  }catch(e){}
  try{ window.stop(); }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#00A650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="场景演练">
<meta name="format-detection" content="telephone=no">
<title>场景演练 · 客舱小助手</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --primary:#148453;--primary-dark:#0C5F3A;--primary-light:#67AC91;
  --primary-soft:#E8F3EE;--primary-mist:#F4F9F6;
  --gold:#F5B800;--gold-soft:#FEF6DC;--gold-dark:#8A5A0B;
  --danger:#C62828;--danger-soft:#FDE7E7;
  --info:#2563eb;--info-soft:#E3ECFD;
  --grad-primary:linear-gradient(135deg,#148453 0%,#1FA56A 100%);
  --bg:#F5F8F6;--bg-card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#9DB0A6;
  --border:#E5EDE9;--shadow:0 4px 14px rgba(20,132,83,.10);--shadow-lg:0 12px 32px rgba(20,132,83,.14);
}
html[data-theme="dark"]{
  --bg:#0F1A14;--bg-card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;
  --primary-soft:#1A3D2A;--primary-mist:#142E22;--danger-soft:#2A1616;--gold-soft:#2A2410;--info-soft:#16283F;
  --shadow:0 4px 14px rgba(0,0,0,.35);--shadow-lg:0 12px 32px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
button{font-family:var(--font-sans);cursor:pointer;}
.livery-stripe{height:3px;background:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:12px 18px;gap:10px;backdrop-filter:blur(16px);}
.t-title{font-size:1.08rem;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:8px;}
.t-sub{font-size:.72rem;color:var(--text2);margin-left:auto;}
html[data-embed="1"] .livery-stripe{display:none!important}
html[data-embed="1"] header.topbar{display:none!important}
/* 副状态条：嵌入模式下仍然可见（模式/房码/连接状态） */
.subbar{max-width:1060px;margin:0 auto;padding:10px 14px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.badge{font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-light);}
.badge.gold{background:var(--gold-soft);color:var(--gold-dark);border-color:#F0D98A;}
.badge.gray{background:var(--bg);color:var(--text2);border-color:var(--border);}
.badge.red{background:var(--danger-soft);color:var(--danger);border-color:#F2B8B8;}
.subbar .sp{flex:1;}
.wrap{max-width:1060px;margin:0 auto;padding:14px 14px 60px;}
.main-scroll-container{display:block;}
/* ---- 页签 ---- */
.tabbar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;text-align:center;padding:9px 15px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);font-size:.86rem;font-weight:700;transition:all .2s;}
.tab.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--shadow);}
.view{display:none;}
.view.active{display:block;animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---- 卡片 ---- */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:.95rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.card-title .hint{font-size:.7rem;font-weight:600;color:var(--text3);margin-left:auto;}
.sub{font-size:.76rem;color:var(--text2);line-height:1.7;}
/* ---- 转盘 ---- */
.wheel-zone{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
.wheel-box{position:relative;width:340px;height:340px;flex-shrink:0;margin:0 auto;}
.wheel-svg{width:100%;height:100%;display:block;}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;font-size:1.5rem;line-height:1;color:var(--danger);text-shadow:0 2px 6px rgba(0,0,0,.18);}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:86px;height:86px;border-radius:50%;border:none;background:var(--grad-primary);color:#fff;font-size:1.05rem;font-weight:800;box-shadow:0 6px 18px rgba(20,132,83,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.wheel-center:disabled{filter:grayscale(.5);opacity:.6;}
.wheel-center small{font-size:.62rem;font-weight:600;opacity:.85;}
.wheel-side{flex:1;min-width:260px;}
/* ---- 表单元素 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:.84rem;font-weight:700;transition:all .18s;}
.btn:hover{border-color:var(--primary-light);color:var(--primary);}
.btn.primary{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--shadow);}
.btn.primary:active{transform:scale(.97);}
.btn.warn{background:var(--gold-soft);color:var(--gold-dark);border-color:#F0D98A;}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:#F2B8B8;}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:9px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;pointer-events:none;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.76rem;color:var(--text2);margin-bottom:6px;font-weight:700;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.88rem;outline:none;font-family:var(--font-sans);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.field textarea{min-height:72px;resize:vertical;line-height:1.6;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);font-size:.8rem;font-weight:700;transition:all .15s;}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-light);}
.chip:disabled{opacity:.4;}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg);}
.stepper button{border:none;background:transparent;color:var(--primary);font-size:1rem;font-weight:800;width:34px;height:34px;}
.stepper b{min-width:44px;text-align:center;font-size:.92rem;}
/* ---- 号位/角色 ---- */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.pos-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--bg);}
.pos-card .no{font-size:1.15rem;font-weight:800;color:var(--primary);}
.pos-card .who{font-size:.82rem;font-weight:700;margin-top:2px;}
.pos-card .duty{font-size:.7rem;color:var(--text2);margin-top:5px;line-height:1.6;}
.pos-card.empty{border-style:dashed;color:var(--text3);}
/* ---- 阶段条 ---- */
.phase-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.phase-chip{padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);font-size:.76rem;font-weight:700;color:var(--text2);text-align:left;line-height:1.35;}
.phase-chip.on{background:var(--grad-primary);color:#fff;border-color:transparent;}
.phase-chip.past{opacity:.55;}
.phase-chip small{display:block;font-size:.64rem;font-weight:600;opacity:.8;}
.clock-big{font-size:2.2rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:.5px;}
/* ---- 事件看板 ---- */
.ev{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg-card);box-shadow:var(--shadow);}
.ev-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.ev-t{font-size:.74rem;font-weight:700;color:var(--gold-dark);background:var(--gold-soft);border-radius:20px;padding:2px 10px;}
.ev-title{font-size:.9rem;font-weight:800;}
.ev-body{font-size:.8rem;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
.ev.phase{border-color:var(--primary-light);background:var(--primary-mist);}
.tag{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary);white-space:nowrap;}
.tag.bcast{background:var(--info-soft);color:var(--info);}
.tag.pax{background:var(--gold-soft);color:var(--gold-dark);}
.tag.crew{background:var(--primary-soft);color:var(--primary);}
/* ---- 旅客任务卡（模糊揭示） ---- */
.task{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg-card);box-shadow:var(--shadow);}
.task-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.task-title{font-size:.88rem;font-weight:800;}
.task-body{font-size:.8rem;color:var(--text2);line-height:1.75;margin-top:8px;white-space:pre-wrap;}
.task.masked .task-body{filter:blur(9px);user-select:none;pointer-events:none;}
.task .sev{font-size:.66rem;font-weight:800;border-radius:20px;padding:2px 9px;}
.sev1{background:var(--primary-soft);color:var(--primary);}
.sev2{background:var(--gold-soft);color:var(--gold-dark);}
.sev3{background:var(--danger-soft);color:var(--danger);}
.empty-slot{border:1px dashed var(--border);border-radius:12px;padding:16px;text-align:center;color:var(--text3);font-size:.78rem;margin-bottom:10px;}
/* ---- 日志 ---- */
.log-list{max-height:300px;overflow-y:auto;font-size:.76rem;line-height:1.9;color:var(--text2);}
.log-list b{color:var(--gold-dark);font-variant-numeric:tabular-nums;margin-right:6px;}
/* ---- 转盘结果弹层 ---- */
.mask{position:fixed;inset:0;background:rgba(10,30,20,.55);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
.mask.show{display:flex;animation:fadeIn .2s ease;}
.reveal-card{background:var(--bg-card);border-radius:20px;max-width:430px;width:100%;padding:28px 26px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.reveal-card .big{font-size:3.2rem;font-weight:900;color:var(--primary);line-height:1.15;margin:8px 0 4px;}
.reveal-card .who{font-size:1rem;font-weight:800;}
.reveal-card .duty{font-size:.8rem;color:var(--text2);line-height:1.8;margin-top:12px;text-align:left;background:var(--primary-mist);border:1px dashed var(--primary-light);border-radius:12px;padding:12px 14px;}
/* ---- 房间面板 ---- */
.room-code{font-size:2.6rem;font-weight:900;letter-spacing:10px;color:var(--gold-dark);background:var(--gold-soft);border:2px dashed #E8C96A;border-radius:14px;padding:10px 18px;display:inline-block;}
.join-url{font-size:.86rem;font-weight:700;color:var(--info);word-break:break-all;user-select:all;background:var(--info-soft);border-radius:10px;padding:10px 12px;line-height:1.6;}
/* ---- Toast ---- */
#toastBox{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:rgba(15,42,31,.92);color:#fff;font-size:.8rem;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tIn .25s ease;}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---- 学员端 ---- */
.player-wrap{max-width:560px;margin:0 auto;}
.my-pos{background:var(--grad-primary);border-radius:16px;padding:22px 20px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:var(--shadow);}
.my-pos .n{font-size:2.4rem;font-weight:900;line-height:1.1;}
.my-pos .w{font-size:.85rem;opacity:.92;margin-top:4px;}
.my-pos .d{font-size:.72rem;opacity:.85;margin-top:10px;line-height:1.7;text-align:left;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;}
.center-note{text-align:center;color:var(--text3);font-size:.82rem;line-height:1.9;padding:26px 10px;}
.spin-wait{font-size:.9rem;font-weight:800;color:var(--gold-dark);background:var(--gold-soft);border:1px dashed #E8C96A;border-radius:12px;padding:14px;text-align:center;animation:pulse 1.6s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
pre.code{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.7rem;line-height:1.7;overflow-x:auto;color:var(--text2);font-family:Consolas,monospace;}
.goal-li{font-size:.8rem;color:var(--text2);line-height:1.9;padding-left:1.4em;position:relative;}
.goal-li:before{content:"✓";position:absolute;left:0;color:var(--primary);font-weight:800;}
@media(max-width:640px){
  .wrap{padding:12px 10px 60px;}
  .wheel-box{width:280px;height:280px;}
  .card{padding:14px;}
  .clock-big{font-size:1.8rem;}
}
</style>
</head>
<body>
<div class="livery-stripe"></div>
<header class="topbar">
  <div class="t-title">🎭 场景演练</div>
  <div class="t-sub" id="hdScn">机上事件 · 特殊演练</div>
</header>

<div class="subbar" id="subbar"></div>

<main class="main-scroll-container">
  <!-- ================= 导演端 ================= -->
  <div class="wrap" id="dirRoot" style="display:none">
    <!-- ① 转盘定岗 -->
    <section class="view active" id="viewWheel">
      <div class="card" id="roomCard"></div>
      <div class="card">
        <div class="card-title">🎛️ 演练设置 <span class="hint">默认 1-4 号位；联机模式下学员扫码/输网址加入后在线转盘</span></div>
        <div class="wheel-zone">
          <div class="wheel-box">
            <div class="wheel-pointer">▼</div>
            <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 340 340"></svg>
            <button class="wheel-center" id="btnSpin" onclick="onSpinTap()">转动<br><small>定岗</small></button>
          </div>
          <div class="wheel-side">
            <div class="field">
              <label>乘务号位数（1-8，默认 4）</label>
              <div class="chips" id="posChips"></div>
              <div style="margin-top:8px"><button class="btn sm" onclick="randomPos()">🎲 随机号位数</button></div>
            </div>
            <div class="field">
              <label>旅客人数（若干，0-8）</label>
              <div class="stepper"><button onclick="stepPax(-1)">−</button><b id="paxN">4</b><button onclick="stepPax(1)">＋</button></div>
            </div>
            <div class="field">
              <label>演练场景</label>
              <select id="selScn" onchange="onScenarioChange()"></select>
            </div>
            <div class="field">
              <label>乘务员名单（可选，每行一人；上场顺序即名单顺序）</label>
              <textarea id="crewNames" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn primary" id="btnBegin" onclick="onBeginTap()">🎬 开始定岗</button>
              <button class="btn" onclick="onResetTap()">♻️ 重置</button>
            </div>
            <div class="sub" style="margin-top:10px" id="assignSummary"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🧑‍✈️ 号位名册</div>
        <div class="pos-grid" id="posGrid"></div>
      </div>
    </section>

    <!-- ② 导演台 -->
    <section class="view" id="viewDirector">
      <div class="card">
        <div class="card-title">⏱️ 演练时钟与阶段 <span class="hint">时间与场景变化全部由导演主导</span></div>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
          <div class="clock-big" id="simClock">--:--</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn sm" onclick="onClockTap(5)">+5 min</button>
            <button class="btn sm" onclick="onClockTap(10)">+10 min</button>
            <button class="btn sm" onclick="onClockTap(30)">+30 min</button>
          </div>
          <button class="btn primary sm" id="btnNextPhase" onclick="onNextPhaseTap()">推进到下一阶段 ▶</button>
        </div>
        <div class="phase-strip" id="phaseStrip"></div>
        <div class="sub" id="phaseTip"></div>
      </div>
      <div class="card">
        <div class="card-title">📣 注入事件 / 广播 <span class="hint">推送到全体或指定号位、旅客</span></div>
        <div class="field">
          <label>事件库（点击填入）</label>
          <div class="chips" id="injectLib"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">

/* ============================================================
   基础工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  var c=$('toastBox'), t=document.createElement('div');
  t.className='toast'; t.textContent=msg; c.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){t.remove();},320); }, 2400);
}
function fmtClock(base, offset){
  var m = /^(\d{1,2}):(\d{2})$/.exec(base||'14:10');
  var baseMin = m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : 850;
  var t = ((baseMin + (offset||0)) % 1440 + 1440) % 1440;
  var hh = String(Math.floor(t/60)).padStart(2,'0'), mm = String(t%60).padStart(2,'0');
  return hh + ':' + mm;
}
function scn(){ return SCENARIOS.find(function(s){ return s.id === cfg().scenarioId; }) || SCENARIOS[0]; }
function cfg(){ return (S && S.config) || {posCount:4,paxCount:4,scenarioId:'delay01',crewNames:[]}; }

/* ============================================================
   同步引擎：联机（/api/drill/*）优先，无服务自动降级单机
   ============================================================ */
var MODE = 'director';
var URL_ROOM = '';
try{
  var _rq = new URLSearchParams(location.search);
  if(_rq.has('room')){ MODE = 'player'; URL_ROOM = (_rq.get('room')||'').toUpperCase(); }
}catch(e){}

var Sync = { online:false, base:'', room:null, token:null, pid:null, rev:-1, timer:null, busy:false };
var S = null;                       // 当前状态视图（联机=服务端下发；单机=本地 reducer）
var revealedLocal = {};             // 单机模式的揭示状态 {taskId:true}
var spinning = false;               // 转盘动画锁

function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function findServer(){
  /* 返回 {online, base}：同源时 base 为 ''（注意不能用 !!base 判断在线） */
  var cands = [];
  try{ if(/^https?:$/.test(location.protocol)) cands.push(''); }catch(e){}
  var hosts = ['127.0.0.1'];
  try{ if(location.hostname && hosts.indexOf(location.hostname)<0) hosts.push(location.hostname); }catch(e){}
  hosts.forEach(function(h){ for(var p=8000;p<=8008;p++) cands.push('http://'+h+':'+p); });
  for(var i=0;i<cands.length;i++){
    try{
      var r = await fetch(cands[i]+'/api/drill/ping', {cache:'no-store'});
      if(r.ok){ var d = await r.json(); if(d && d.service==='drill-sync') return {online:true, base:cands[i]}; }
    }catch(e){}
  }
  return {online:false, base:''};
}
function api(path, opts){
  return fetch(Sync.base + path, Object.assign({cache:'no-store'}, opts||{}))
    .then(function(r){ return r.json().catch(function(){ return {ok:false,error:'响应异常'}; }); });
}
function apiAction(action, payload){
  return api('/api/drill/room/'+Sync.room+'/action', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({token:Sync.token, action:action, payload:payload||{}})
  });
}
function pollOnce(){
  if(!Sync.online || !Sync.room || Sync.busy) return Promise.resolve();
  return api('/api/drill/room/'+Sync.room+'?rev='+Sync.rev+'&token='+(Sync.token||''))
    .then(function(d){
      if(d && d.changed && d.ok){ Sync.rev = d.rev; S = d; renderAll(); }
    }).catch(function(){});
}
function startPoll(){
  if(Sync.timer) clearInterval(Sync.timer);
  Sync.timer = setInterval(pollOnce, 1200);
}

/* ---------------- 单机模式 reducer ---------------- */
function freshLocal(){
  return { code:'LOCAL', isDirector:true, rev:0,
    config:{posCount:4, paxCount:4, scenarioId:'delay01', baseTime:'14:10', crewNames:[]},
    players:[],
    state:{ status:'lobby', phaseIdx:0, baseTime:'14:10', clockMin:0,
      pool:[1,2,3,4], assignments:[], spinner:null, events:[], paxTasks:[], log:[], seq:0 } };
}
function applyLocal(action, p){
  p = p||{};
  var st = S.state, cfgO = S.config;
  var log = function(text){ st.log.push({t:st.clockMin, text:text}); };
  var ev = function(title,body,target){ st.seq++; st.events.push({id:'e'+st.seq, t:st.clockMin, title:title, body:body||'', target:target||'all'}); };
  if(action==='setup'){
    cfgO.posCount = Math.max(1, Math.min(8, p.posCount|0 || cfgO.posCount));
    cfgO.paxCount = Math.max(0, Math.min(8, p.paxCount|0));
    if(p.scenarioId) cfgO.scenarioId = p.scenarioId;
    st.pool = []; for(var i=1;i<=cfgO.posCount;i++) if(!st.assignments.some(function(a){return a.pos===i;})) st.pool.push(i);
    if(st.status==='ended') st.status='lobby';
    log('导演调整编制：'+cfgO.posCount+' 个乘务号位 / '+cfgO.paxCount+' 名旅客');
  }
  else if(action==='begin'){ st.status='assigning'; log('定岗开始：请乘务组成员依次上场转动转盘'); }
  else if(action==='spin'){
    var idx = st.pool.indexOf(p.pos);
    if(idx<0) return false;
    st.pool.splice(idx,1);
    st.assignments.push({pos:p.pos, name:p.name||'乘务员'});
    st.assignments.sort(function(a,b){return a.pos-b.pos;});
    log((p.name||'乘务员')+' 转中 '+p.pos+' 号位');
    if(!st.pool.length){ st.status='running'; log('定岗完成，演练就绪'); }
  }
  else if(action==='phase'){ st.phaseIdx = p.idx|0; if(p.clockMin!=null) st.clockMin = p.clockMin|0; log('场景推进到阶段 '+(st.phaseIdx+1)); }
  else if(action==='clock'){ st.clockMin = Math.max(-600, Math.min(1440, st.clockMin + (p.delta|0))); log('演练时钟 '+(p.delta>=0?'+':'')+(p.delta|0)+' 分钟'); }
  else if(action==='inject'){ ev(p.title, p.body, p.target); log('注入事件：'+p.title); }
  else if(action==='task'){ st.seq++; st.paxTasks.push({id:'e'+st.seq, pax:p.pax|0, title:p.title, body:p.body||'', hint:p.hint||'', revealed:false, at:st.clockMin}); log('向旅客 P'+(p.pax|0)+' 下发任务：'+p.title); }
  else if(action==='note'){ log('导演批注：'+(p.text||'')); }
  else if(action==='endRound'){ st.status='ended'; log('演练结束'); }
  else if(action==='reset'){
    var keep = S.config;
    S = freshLocal(); S.config = keep;
    S.state.pool = []; for(var j=1;j<=keep.posCount;j++) S.state.pool.push(j);
    S.state.log.push({t:0, text:'新一轮演练已重置'});
  }
  else return false;
  lsSet('cc_drill_local_v1', S);
  return true;
}

function act(action, payload, cb){
  if(MODE==='player' && Sync.online){ apiAction(action,payload).then(function(r){ cb&&cb(r); }); return; }
  if(Sync.online){
    Sync.busy = true;
    apiAction(action,payload).then(function(r){
      Sync.busy=false;
      if(!r || r.ok===false){ toast((r&&r.error)||'操作失败'); }
      pollOnce();
      cb&&cb(r);
    });
    return;
  }
  var ok = applyLocal(action,payload);
  if(!ok) toast('操作失败');
  renderAll();
  cb&&cb({ok:ok});
}

var PALETTE = ['#148453','#1FA56A','#67AC91','#F5B800','#F08A00','#E64A19','#2563eb','#7C5CBF'];
var wheelRot = 0;
function segPath(cx,cy,r1,r2,a0,a1){
  var pt = function(r,a){ return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1); };
  var large = (a1-a0) > Math.PI ? 1 : 0;
  return 'M'+pt(r2,a0)+' A'+r2+','+r2+' 0 '+large+' 1 '+pt(r2,a1)
       + ' L'+pt(r1,a1)+' A'+r1+','+r1+' 0 '+large+' 0 '+pt(r1,a0)+' Z';
}
function renderWheel(svgId){
  var svg = $(svgId||'wheelSvg'); if(!svg) return;
  var pool = (S && S.state && S.state.pool) || [];
  var n = pool.length, cx=170, cy=170, r2=163, r1=52;
  var seg = Math.PI*2/Math.max(n,1);
  var h = [];
  if(!n){
    h.push('<circle cx="170" cy="170" r="163" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>');
    h.push('<text x="170" y="176" text-anchor="middle" font-size="15" fill="var(--text3)">号位已定完</text>');
  }
  for(var i=0;i<n;i++){
    var a0 = -Math.PI/2 + i*seg, a1 = a0+seg, mid = (a0+a1)/2;
    var color = PALETTE[(pool[i]-1) % PALETTE.length];
    h.push('<path d="'+segPath(cx,cy,r1,r2,a0,a1)+'" fill="'+color+'" stroke="#fff" stroke-width="2"/>');
    var tr = (r1+r2)/2 + 2;
    var tx = cx + tr*Math.cos(mid), ty = cy + tr*Math.sin(mid);
    var deg = mid*180/Math.PI + 90;
    if(deg>90 && deg<270){ deg += 180; tr = (r1+r2)/2 - 2; tx = cx + tr*Math.cos(mid); ty = cy + tr*Math.sin(mid); }
    h.push('<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="800" fill="#fff" transform="rotate('+deg.toFixed(1)+' '+tx.toFixed(1)+' '+ty.toFixed(1)+')">'+pool[i]+'号位</text>');
  }
  h.push('<circle cx="170" cy="170" r="49" fill="var(--bg-card)" stroke="var(--border)" stroke-width="3"/>');
  svg.innerHTML = h.join('');
}
function animateTo(pos, poolBefore, done, svgId){
  var svg = $(svgId||'wheelSvg'); if(!svg){ done&&done(); return; }
  var idx = poolBefore.indexOf(pos);
  var n = poolBefore.length || 1;
  var segDeg = 360/n;
  /* 指针在顶部：转盘转 R 度后，第 i 段落到指针下需 R ≡ -(i*seg + seg/2) (mod 360) */
  var jitter = (Math.random()-0.5) * segDeg * 0.7;
  var targetMod = ((360 - (idx*segDeg + segDeg/2 + jitter)) % 360 + 360) % 360;
  var from = wheelRot % 360;
  var target = wheelRot + (360*5) + ((targetMod - from) % 360 + 360) % 360;
  var t0 = performance.now(), dur = 4200;
  spinning = true;
  (function step(t){
    var k = Math.min(1, (t-t0)/dur);
    var e = 1 - Math.pow(1-k, 4);            // easeOutQuart
    var r = from + (target-from)*e;
    svg.style.transform = 'rotate('+r+'deg)';
    if(k<1) requestAnimationFrame(step);
    else { wheelRot = target; spinning = false; done&&done(); }
  })(t0);
}

async function createRoom(){
  if(!Sync.online){ toast('未检测到同步服务，无法联机'); return; }
  var c = cfg();
  var names = ($('crewNames').value||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  try{
    var r = await api('/api/drill/room', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({config:{posCount:c.posCount, paxCount:c.paxCount, scenarioId:c.scenarioId, baseTime:scn().baseTime, crewNames:names}})});
    if(r && r.ok){
      Sync.room = r.code; Sync.token = r.token;
      Sync.rev = -1;                       // 强制下一拍全量拉取（建房响应的 rev 已是最新，直接用会导致轮询误判「无变更」不渲染）
      lsSet('cc_drill_dir_v1', {room:r.code, token:r.token});
      /* 学员手机访问不了 127.0.0.1 —— 用服务端报的局域网地址拼加入链接 */
      joinUrl = '';
      try{
        var ni = await api('/api/netinfo');
        if(ni && ni.ok && ni.urls && ni.urls.length){
          joinUrl = ni.urls[0].replace(/\/$/,'') + '/drill.html?room=' + r.code;
          if(ni.port && Sync.base && Sync.base.indexOf(':'+ni.port)<0){ /* 端口不一致时仍以 netinfo 为准 */ }
        }
      }catch(e){}
      if(!joinUrl) joinUrl = (Sync.base || location.origin) + '/drill.html?room=' + r.code;
      pollOnce(); toast('房间已创建：'+r.code);
    }else toast((r&&r.error)||'创建失败');
  }catch(e){ toast('创建失败：'+e); }
}

  var t = joinUrl || '';

function setPos(n){

  applyLocal('setup',{posCount:n}); renderAll();
}
function stepPax(d){

function randomPos(){

  setPos(n); toast('🎲 随机号位数：'+n);

function onBeginTap(){
  act('begin',{},function(){
    if(Sync.online && Sync.room) act('callSpin',{});
    switchTab('wheel'); toast('定岗开始，请第一位上场');
  });
}
function onResetTap(){
  if(!confirm('重置将清空定岗、事件与任务（保留编制与成员），确定？')) return;
  act('reset',{},function(){ revealedLocal={}; toast('已重置'); });
}
function localNextName(){
  var names = ($('crewNames').value||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var done = S.state.assignments.length;
  if(names.length) return names[done % names.length] + (done >= names.length ? '（补位）' : '');
  return '乘务员 ' + (done+1);
}
function onSpinTap(){
  if(spinning) return;
  /* ---- 联机模式（导演代转 / 学员本人转）：结果由服务端权威产生 ---- */
  if(Sync.online && Sync.room && S){
    var poolBefore = (S.state.pool||[]).slice();
    var svgId = (MODE==='player') ? 'plyWheelSvg' : 'wheelSvg';
    apiAction('spin',{}).then(function(r){
      if(r && r.ok){ spinResult(r.pos, poolBefore, svgId); return; }
      /* 导演代转但还没点名 → 自动点名下一位未定岗学员再转一次 */
      if(MODE==='director' && r && /还没轮到你/.test(r.error||'')){
        apiAction('callSpin',{}).then(function(){
          apiAction('spin',{}).then(function(r2){
            if(r2 && r2.ok) spinResult(r2.pos, poolBefore, svgId);
            else toast((r2 && r2.error) || '转动失败');
          });
        });
        return;
      }
      toast((r && r.error) || '转动失败');
    });
    return;
  }
  /* ---- 单机模式：本地随机 ---- */
  if(!S || S.state.status!=='assigning'){ toast('请先「开始定岗」'); return; }
  if(!S.state.pool.length){ toast('号位已全部定完'); return; }
  var poolLocal = S.state.pool.slice();
  var pos = poolLocal[Math.floor(Math.random()*poolLocal.length)];
  var name = localNextName();
  applyLocal('spin',{pos:pos, name:name});
  spinResult(pos, poolLocal, 'wheelSvg');
}
function spinResult(pos, poolBefore, svgId){
  if(!poolBefore || poolBefore.indexOf(pos)<0){
    poolBefore = (S.state.pool||[]).concat([pos]).sort(function(a,b){return a-b;});
  }
  animateTo(pos, poolBefore, function(){
    renderAll();
    var a = (S.state.assignments||[]).find(function(x){ return x.pos===pos; });
    showReveal(pos, a ? a.name : '');
  }, svgId);
}
function onPhaseTap(i){
  var sc = scn(), cur = sc.phases[i];
  var pm = /^(\d{1,2}):(\d{2})$/.exec(cur.sim);
  var phaseMin = pm ? (parseInt(pm[1],10)*60+parseInt(pm[2],10)) : 0;
  var bm = /^(\d{1,2}):(\d{2})$/.exec(scn().baseTime);
  var baseMin = bm ? (parseInt(bm[1],10)*60+parseInt(bm[2],10)) : 850;
  act('phase',{idx:i, clockMin: phaseMin-baseMin}, function(){
    act('inject',{title:'场景推进 · 第'+(i+1)+'阶段：'+cur.name, body:cur.bg, target:'all'});
    toast('已推进：'+cur.name);
  });
}
function onNextPhaseTap(){
  var i = Math.min(scn().phases.length-1, S.state.phaseIdx+1);
  onPhaseTap(i);
}
function onClockTap(d){ act('clock',{delta:d}); }

function exportLog(){
  var st = S.state, sc = scn();
  var lines = ['# 场景演练记录 · '+sc.name, '', '- 房间/模式：'+(Sync.online?('联机 '+Sync.room):'单机'), '- 导出时间：'+new Date().toLocaleString(), ''];

    }

    var mine = st.paxTasks.filter(function(t){ return t.pid===PLY.pid; });

      '<div class="d">你的场景完全由导演指派。任务卡默认模糊，点击「揭示任务」查看表演要求，演完可再隐藏。</div></div>';

      h += '<div class="task'+(masked?' masked':'')+'"><div class="task-head"><span class="tag pax">任务 · '+esc(fmtClock(st.baseTime,t.at))+'</span>'+

  var evs = st.events.filter(function(e){ return evVisibleToMe(e); }).slice().reverse();

function isMyTurnSafe(st){ return !!(st && st.spinner && st.spinner.pid===PLY.pid); }
function evVisibleToMe(e){

window._plySide = 'crew';
function pickSide(s){
  window._plySide = s;

  if(a&&b){ a.classList.toggle('on', s==='crew'); b.classList.toggle('on', s==='pax'); }
  var tip=$('sideTip');
  if(tip) tip.textContent = s==='crew' ? '乘务组：上场后转转盘随机定岗，事先不知道自己几号位。'

function doJoin(){
  var code = ($('jRoom').value||'').trim().toUpperCase();
  var name = ($('jName').value||'').trim();
  if(!/^[A-Z2-9]{4}$/.test(code)){ toast('请填写 4 位房间码'); return; }
  if(!name){ toast('请填写姓名'); return; }
  api('/api/drill/room/'+code+'/action', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'join', payload:{name:name, side:window._plySide}})})
    .then(function(r){
      if(!r || r.ok===false){ toast((r&&r.error)||'加入失败'); return; }
      PLY = {pid:r.playerId, token:r.token, name:name, side:window._plySide, pax:r.pax, crew:r.crew};
      Sync.room = code; Sync.token = r.token; Sync.rev = -1;
      lsSet('cc_drill_ply_v1', {room:code, pid:PLY.pid, token:PLY.token, name:name, side:PLY.side});
      toast('加入成功，欢迎 '+name);
      pollOnce();
    });
}

async function boot(){
  var _srv = await findServer();
  Sync.base = _srv.base;
  Sync.online = _srv.online;
  if(MODE==='player'){
    $('plyRoot').style.display='';
    var saved = lsGet('cc_drill_ply_v1', null);
    Sync.room = URL_ROOM || (saved ? saved.room : null);
    if(Sync.online){
      if(saved && saved.token && saved.room === URL_ROOM){
        /* 断线重连：先探一次状态确认身份仍有效 */
        Sync.room = saved.room; Sync.token = saved.token; PLY = saved;
        try{
          var d = await api('/api/drill/room/'+saved.room+'?rev=-1&token='+encodeURIComponent(saved.token));
          if(d && d.ok){ Sync.rev = d.rev; S = d; }
          else { PLY = {pid:null,token:null,name:'',side:'',pax:null,crew:null}; Sync.token=null; Sync.room=saved.room; }
        }catch(e){}
      }
      startPoll();
    }
    renderAll();
    return;
  }
  /* 导演模式 */
  $('dirRoot').style.display='';
  if(Sync.online){
    var saved = lsGet('cc_drill_dir_v1', null);
    if(saved && saved.room && saved.token){
      try{
        var d2 = await api('/api/drill/room/'+saved.room+'?rev=-1&token='+encodeURIComponent(saved.token));
        if(d2 && d2.ok){
          Sync.room = saved.room; Sync.token = saved.token; Sync.rev = d2.rev; S = d2;
        }
      }catch(e){}
