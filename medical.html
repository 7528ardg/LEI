/* ============================================================
   渲染
   ============================================================ */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function eqTags(ef) { if (!ef) return ''; return ef.split(',').map(x => x.trim()).filter(Boolean).map(x => '<span class="eq-tag">🛠 ' + EQRX[x] + '</span>').join(''); }

function lvChip(lv) {
    const m = { red: ['🔴 威胁生命', 'chip red'], yellow: ['🟡 紧急', 'chip yellow'], green: ['🟢 一般', 'chip green'] }[lv] || ['', ''];
    return '<span class="' + m[1] + '">' + m[0] + '</span>';
}

const TABS = [
    ['home', '🚨 分级处置'], ['diseases', '🩺 病种速查'], ['quiz', '🎯 练习闯关'],
    ['report', '📋 报告生成'], ['equip', '🧰 设备清单'], ['sources', '📚 资料来源'],
];

function render() {
    const app = document.getElementById('app');
    let h = '';
    h += '<div class="headbar"><div class="title">🚑 机上医疗急救<small>依据《客舱乘务员手册》01.10 · 红十字应急救护 · CCAR-121 · 国际文献（详见资料来源）</small></div>';
    h += '<div class="machine-switch"><button class="' + (state.machine === '320' ? 'on' : '') + '" onclick="setMachine(\'320\')">A320</button><button class="' + (state.machine === '321' ? 'on' : '') + '" onclick="setMachine(\'321\')">A321</button></div></div>';
    h += '<div class="menu">' + TABS.map(t => '<button class="m-tab' + (state.tab === t[0] ? ' active' : '') + '" onclick="goTab(\'' + t[0] + '\')">' + t[1] + '</button>').join('') + '</div>';
    h += '<div class="main-scroll-container">';
    if (state.tab === 'home') h += renderHome();
    if (state.tab === 'diseases') h += renderDiseases();
    if (state.tab === 'quiz') h += renderQuiz();
    if (state.tab === 'report') h += renderReport();
    if (state.tab === 'equip') h += renderEquip();
    if (state.tab === 'sources') h += renderSources();
    h += '</div>';
    app.innerHTML = h;
}

function goTab(t) { state.tab = t; render(); }
function setMachine(m) { state.machine = m; render(); }

        ['choke_baby_back', '<b>婴儿拍背</b>：头低臀高俯卧，禁用腹部冲击'],

/* 专项技能浮层 */
function openSkill(id) {
    const s = SKILLS.find(x => x.id === id);
    if (!s) return;
    closeSkill();
    let inner = '<div class="card"><div class="card-h" style="background:linear-gradient(135deg,#7f1d1d,#b91c1c);color:#fff">' + s.i + ' ' + s.n + ' ' + lvChip(s.lv) + '</div><div class="card-b">';
    inner += '<div class="sec-title" style="margin-top:0">🔍 症状识别</div><ul class="pts">' + s.sx.map(x => '<li class="warn">' + x + '</li>').join('') + '</ul>';
    inner += '<div class="sec-title">🧾 处置流程</div><ul class="pts">' + s.steps.map((x, i) => '<li><span class="step-tag">' + (i + 1) + '</span>' + x.t + '</li>').join('') + '</ul>';
    if (s.fb) inner += '<div class="warn-box">🚫 注意：' + s.fb + '</div>';
    if (s.imgs) inner += '<div class="fig-wrap">' + s.imgs.map(p => '<figure class="fig"><img src="' + imgSrc(p[0]) + '" alt="' + p[1] + '" loading="lazy"><figcaption>' + p[1] + '</figcaption></figure>').join('') + '</div>';
    if (s.eq) inner += '<div style="margin-top:10px">' + eqTags(s.eq) + '<span class="src-tag">设备按' + (state.machine === '320' ? 'A320' : 'A321') + '舱位设备图就近取用</span></div>';
    inner += '<div class="hint">📋 ' + s.report + '</div>';
    inner += '<div style="margin-top:12px;text-align:right"><button class="s-btn" onclick="closeSkill()">关闭</button></div></div></div>';
    const div = document.createElement('div');
    div.id = 'skillModal';
    div.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto';
    div.onclick = function (e) { if (e.target === div) closeSkill(); };
    div.innerHTML = '<div style="width:100%;max-width:640px">' + inner + '</div>';
    document.body.appendChild(div);
}
function closeSkill() { const m = document.getElementById('skillModal'); if (m) m.remove(); }

/* 常见病别名关键词：提升搜索命中（如 心梗→心肌梗塞、中风→脑卒中） */
const DIS_KW = {
    mi: '心梗 前胸痛 压榨 心前区', angina: '胸痛 冠心病 胸闷', stroke: '中风 脑血管意外 半身不遂 口眼歪斜',
    syncope: '昏倒 晕倒 眼前一黑 黑视', epilepsy: '羊癫疯 抽风 羊角风', convulsion: '抽风 抽搐',
    asthma: '喘 憋气 喘息', hyperventilation: '换气过度', abdomen: '肚子疼 腹痛 胀痛',
    nosebleed: '流鼻血', cut: '划伤 擦伤', burn1: '烫伤 烧伤 烫', burn2: '烫伤 烧伤 烫', burn3: '烫伤 烧伤 烫',
    fracture: '骨折 脱臼', heatstroke: '热射病', hypothermia: '失温', frostbite: '冻僵', psych: '精神异常 发疯'
};
function diseaseHay(d) { return (d.n + d.cat + d.sx.map(x => typeof x === 'object' ? x.w : x).join(' ') + ' ' + (DIS_KW[d.id] || '')).toLowerCase(); }

/* ---------- 病种速查 ---------- */
function renderDiseases() {
    let h = '<div class="card"><div class="card-h">🩺 机上常见病速查（共 ' + DISEASES.length + ' 种 · 手册7.13）</div><div class="card-b">';
    h += '<div class="filter-row"><input type="text" placeholder="🔍 搜索病名/症状关键词..." value="' + esc(state.search) + '" oninput="state.search=this.value;render()" style="max-width:240px">';
    h += '<select onchange="state.cat=this.value;render()" style="max-width:150px"><option value="all">全部系统</option>' + [...new Set(DISEASES.map(d => d.cat))].map(c => '<option value="' + c + '" ' + (state.cat === c ? 'selected' : '') + '>' + c + '</option>').join('') + '</select>';
    h += '<select onchange="state.lv=this.value;render()" style="max-width:130px"><option value="all">全部分级</option><option value="red" ' + (state.lv === 'red' ? 'selected' : '') + '>🔴 威胁生命</option><option value="yellow" ' + (state.lv === 'yellow' ? 'selected' : '') + '>🟡 紧急</option><option value="green" ' + (state.lv === 'green' ? 'selected' : '') + '>🟢 一般</option></select></div>';
    let list = DISEASES.filter(d => {
        if (state.cat !== 'all' && d.cat !== state.cat) return false;
        if (state.lv !== 'all' && d.lv !== state.lv) return false;
        if (state.search) { const q = state.search.trim().toLowerCase(); if (q && diseaseHay(d).indexOf(q) < 0) return false; }
        return true;
    });
    if (list.length === 0) h += '<div class="hint">未找到匹配病种，请调整筛选条件。</div>';
    list.forEach(d => {
        h += '<div class="card lv-' + d.lv + '" style="margin-bottom:12px"><div class="card-h">' + d.i + ' ' + d.n + ' ' + lvChip(d.lv) + '<span class="src-tag" style="margin-left:auto">来源：' + d.s + '</span></div><div class="card-b" style="padding-top:4px">';
        if (d.pop) h += '<div style="font-size:12.5px;color:#6b7280;margin:2px 0 8px">👥 好发/诱因：' + d.pop + '</div>';
        h += '<div class="sec-title" style="margin:6px 0 4px">🔍 症状识别</div><ul class="pts">' + d.sx.map(x => typeof x === 'object' ? '<li class="warn">⚠️ ' + x.w + '</li>' : '<li>' + x + '</li>').join('') + '</ul>';
        h += '<div class="sec-title" style="margin:8px 0 4px">🧾 处置流程</div><ul class="pts">' + d.st.map((x, i) => '<li><span class="step-tag">' + (i + 1) + '</span>' + x.t + '</li>').join('') + '</ul>';
        if (d.fb) h += '<div class="warn-box">🚫 注意：' + d.fb + '</div>';
        h += '<div style="margin-top:10px">' + eqTags(d.ef) + '</div>';
        if (d.rf) h += '<div class="hint">📋 报告：' + d.rf + '</div>';
        h += '</div></div>';
    });
    h += '</div></div>';
    return h;
}

/* ---------- 练习闯关 ---------- */
function renderQuiz() {
    const q = QUIZ[state.quizIdx];
    let h = '<div class="card"><div class="card-h">🎯 情景闯关 <span class="chip gray">已答 ' + state.quizSel.length + '/' + QUIZ.length + '</span></div><div class="card-b" id="quizBox">';
    if (state.quizDone) {
        const right = state.quizSel.filter(x => x).length;
        h += '<div style="text-align:center;padding:20px 0"><div style="font-size:42px">' + (right / state.quizSel.length >= 0.8 ? '🏆' : right / state.quizSel.length >= 0.6 ? '👍' : '📖') + '</div><div style="font-size:20px;font-weight:800;margin:8px 0">本次得分：' + right + ' / ' + state.quizSel.length + '</div><div class="hint">错题与解析请回看练习记录；建议复训练习每24个月一次（局方要求）。</div><div style="margin-top:14px"><button class="g-btn" onclick="restartQuiz()">🔄 再练一次</button></div></div>';
    } else {
        h += '<div class="hint" style="margin-top:0;margin-bottom:10px">第 ' + (Math.min(state.quizIdx, QUIZ.length - 1) + 1) + ' / ' + QUIZ.length + ' 题 · 一题一判，答后显示解析</div>';
        h += '<div style="font-size:16px;font-weight:700;color:#111827;margin-bottom:12px">' + esc(q.q) + '</div>';
        q.o.forEach((o, i) => {
            const cls = state.quizSel.length <= state.quizIdx ? '' : (i === q.a ? ' f-ok' : (state.quizSel[state.quizIdx] === i ? ' f-bad' : ''));
            const disabled = state.quizSel.length > state.quizIdx ? 'disabled' : '';
            h += '<button class="ans-btn' + cls + '" ' + disabled + ' onclick="answerQuiz(' + i + ')"><span class="kbd">' + String.fromCharCode(65 + i) + '</span>' + esc(o) + '</button>';
        });
        if (state.quizSel.length > state.quizIdx) {
            h += '<div class="' + (state.quizSel[state.quizIdx] === q.a ? 'hint" style="border-color:#10b981;background:#ecfdf5;color:#065f46' : 'warn-box') + '">💡 解析：' + q.e + '<br><span class="src-tag" style="margin-top:6px">依据：' + q.s + '</span></div>';
            h += '<div style="margin-top:12px;text-align:right"><button class="g-btn" onclick="nextQuiz()">' + (state.quizIdx >= QUIZ.length - 1 ? '查看成绩' : '下一题 →') + '</button></div>';
        }
    }
    h += '</div></div>';
    return h;
}
function answerQuiz(i) {
    if (state.quizSel.length > state.quizIdx) return;
    state.quizSel.push(i === QUIZ[state.quizIdx].a);
    if (i === QUIZ[state.quizIdx].a) state.quizScore++;
    render();
}
function nextQuiz() { if (state.quizIdx < QUIZ.length - 1) { state.quizIdx++; render(); } else { state.quizDone = true; render(); } }
function restartQuiz() { state.quizIdx = 0; state.quizDone = false; state.quizSel = []; state.quizScore = 0; render(); }

        h += '<div class="grid2" style="align-items:end">' +
            '<div><input type="text" placeholder="时间（如 14:25）" value="' + esc(t.t) + '" oninput="RPT.timeline[' + i + '].t=this.value"></div>' +
            '<div><input type="text" placeholder="处置/体征（如 吸氧4L/min，脉搏90）" value="' + esc(t.o) + '" oninput="RPT.timeline[' + i + '].o=this.value"></div></div>';
    });
    h += '<button class="add-row-btn" onclick="addTimeline()">＋ 添加处置记录</button>';
    h += '<div class="sec-title">💊 用药记录（含箱内药品须事先签署知情同意书）</div>';
    r.drugs.forEach((d, i) => {
        h += '<div class="grid2" style="align-items:end">' +
            '<div><input type="text" placeholder="药品名称" value="' + esc(d.n) + '" oninput="RPT.drugs[' + i + '].n=this.value"></div>' +
            '<div><input type="text" placeholder="剂量/方式/来源/效果" value="' + esc(d.dose) + '" oninput="RPT.drugs[' + i + '].dose=this.value"></div></div>';
    });
    h += '<button class="add-row-btn" onclick="addDrug()">＋ 添加用药记录</button>';
    h += '<div class="sec-title">🫁 吸氧记录（使用氧气瓶须同步记录CLB）</div><div class="grid3">';
    h += '<div><input type="text" placeholder="开始时间" value="' + esc(r.o2.start) + '" oninput="RPT.o2.start=this.value"></div>';
    h += '<div><input type="text" placeholder="流量(2/4 L/min)" value="' + esc(r.o2.flow) + '" oninput="RPT.o2.flow=this.value"></div>';
    h += '<div><input type="text" placeholder="结束时间" value="' + esc(r.o2.end) + '" oninput="RPT.o2.end=this.value"></div>';
    h += '<div style="grid-column:1/-1"><input type="text" placeholder="总用量(L) 备注" value="' + esc(r.o2.total) + '" oninput="RPT.o2.total=this.value"></div></div>';

}
function addTimeline() { RPT.timeline.push({ t: '', o: '' }); render(); }
function addDrug() { RPT.drugs.push({ n: '', dose: '', way: '口服', src: '', eff: '' }); render(); }
function nowStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function genReport() {
    const r = RPT;
    let txt = '';
    txt += '┌───────────────────────────────────────\n';
    txt += '  飞行中旅客紧急医学事件报告单（草稿）\n';
    txt += '  生成时间：' + nowStr() + '　机型：' + state.machine + '\n';
    txt += '└───────────────────────────────────────\n\n';
    txt += '一、航班信息\n';
    txt += '  航班号：' + (r.flight || '____') + '　日期：' + (r.date || '____') + '　机型/机号：' + (r.boat || state.machine + '/____') + '　航段：' + (r.seg || '____') + '\n\n';
    txt += '二、旅客信息\n';
    txt += '  姓名：' + (r.pname || '____') + '　性别：' + (r.psex || '____') + '　年龄：' + (r.page || '____') + '\n';
    txt += '  座位号：' + (r.pseat || '____') + '　目的地：' + (r.pdest || '____') + '　同行人：' + (r.pcompanion || '____') + '\n';
    txt += '  既往病史：' + (r.hist || '____') + '　过敏史：' + (r.allergy || '____') + '\n\n';
    txt += '三、事件情况\n';
    txt += '  发病时间：' + (r.onset || '____') + '　主要症状：' + (r.mainSx || '____') + '\n';
    txt += '  意识状态：' + r.conscious + '\n';
    txt += '  首次生命体征：体温 ' + (r.tmp || '____') + '℃｜脉搏 ' + (r.pulse || '____') + '次/分｜呼吸 ' + (r.resp || '____') + '次/分｜血压 ' + (r.bp || '____') + 'mmHg\n';
    txt += '  （危重伤患每10分钟复测一次并记录）\n\n';
    txt += '四、处置过程（时间轴）\n';
    r.timeline.forEach((t, i) => { if (t.t || t.o) txt += '  ' + (i + 1) + '. ' + (t.t || '____') + '　' + (t.o || '____') + '\n'; });
    txt += '\n五、用药记录（含箱内药品：使用前已签《应急医疗设备和药品使用知情同意书》□ ）\n';
    r.drugs.forEach((d, i) => { if (d.n || d.dose) txt += '  ' + (i + 1) + '. ' + (d.n || '____') + '｜' + (d.dose || '____') + '\n'; });
    if (r.o2.start || r.o2.end) {
        txt += '\n六、吸氧记录（氧气瓶使用已同步记录CLB □ ）\n';
        txt += '  开始：' + (r.o2.start || '____') + '　流量：' + (r.o2.flow || '____') + 'L/min　结束：' + (r.o2.end || '____') + '　总量：' + (r.o2.total || '____') + '\n';
    }
    txt += '\n七、机上协助者与证人\n';
    txt += '  医务人员：' + (r.docName || '____') + '　证件：' + (r.docId || '____') + '　电话：' + (r.docTel || '____') + '\n';
    txt += '  证人：' + (r.wit || '____') + '\n';
    txt += '  疑似传染病通知地面检疫：' + r.quarantine + '\n\n';
    txt += '八、签名\n';
    txt += '  处理人：＿＿＿＿　乘务长：＿＿＿＿　机长：＿＿＿＿　协助者/证人签名：＿＿＿＿\n';
    txt += '  （本报告单由乘务长保管；落地后上报航空医师/客舱部值班经理）\n';
    document.getElementById('reportPreview').innerHTML = esc(txt).replace(/\n/g, '<br>');
    window.__rptText = txt;
}
function copyReport() {
    const t = window.__rptText || (genReport(), window.__rptText);
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => toast('已复制报告草稿')).catch(() => toast('复制失败，请手动选择'));
}
function clearReport() {
    Object.keys(RPT).forEach(k => {
        if (k === 'timeline') RPT[k] = [{ t: '', o: '' }];
        else if (k === 'drugs') RPT[k] = [{ n: '', dose: '', way: '口服', src: '', eff: '' }];
        else if (k === 'o2') RPT[k] = { start: '', flow: '4', end: '', total: '' };
        else if (k === 'conscious') RPT[k] = '清醒';
        else if (k === 'quarantine') RPT[k] = '否';
        else RPT[k] = '';
    });
    render();
}

    h += '</div></div>';

}
