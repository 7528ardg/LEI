{cat:'职业形象-着装', icon:'💼', src:'服务规范 2.2.1', t:['着装','着装要求','制服','仪容仪表','衬衫马甲','迎送客着装','制服标准','穿戴规范'],
q:'客舱乘务员着装有什么基本要求？',
a:'<ul><li>执行航班需着公司统一配发的制服和配饰，不得穿私自定制的制服执行航班。</li><li>制服应整洁大方得体、熨烫平整、无破损脱线、纽扣齐全；着制服不得佩戴私人饰物、不得与非制服混穿；须着同一批次发放的制服，避免上下装明显色差。</li><li>客舱机组准备会、进退场及航后讲评会着装标准必须统一。</li><li>客舱服务时须统一着衬衫、马夹（女乘）；女乘食品销售时着围裙，进洗手间时不得着围裙。</li><li>迎送客时乘务长可根据气温决定机门口迎送客着装，冬季可穿大衣但两人须统一。</li></ul>'},
{cat:'职业形象-着装', icon:'💼', src:'服务规范 2.2.3', t:['着装','穿戴标准','衬衫袖子','裙子下沿','丝巾','领带夹','皮鞋','制服穿戴'],
q:'制服穿戴的具体标准有哪些？',
a:'关键标准：衬衣须将所有纽扣扣好、袖管不可卷起、下摆束入裙/裤内，男乘须佩戴肩章、衬衫口袋仅可放一支笔；裙子下沿不得高于膝盖5厘米；女乘丝巾三种花式（牛仔型/丝巾花结/糖果结）均系于颈部右侧；男乘领带长度以下端刚好盖在皮带扣为宜，领带夹夹在衬衣第三、四颗纽扣正中间；男乘须着黑色纯色西装袜，女乘着裙配灰色连裤袜；皮鞋可选黑色、无饰物、非漆皮的皮鞋且清洁完好。'},
{cat:'职业形象-发型妆容', icon:'💼', src:'服务规范 2.3/2.4', t:['发型','妆容','发色','挑染','淡妆','口红','发型标准','妆容标准'],
q:'发型和妆容有什么要求？',
a:'<strong>发型</strong>：禁止修剪过于时尚怪异的发型；女乘头发禁止挑染，焗发颜色只能单一黑色或单一深棕色，男乘只能单一黑色；保持清洁无碎发无头皮屑，梳理整齐，不得使用假发套（发量少可适当用假发片但不能有痕迹）。<strong>妆容</strong>：以淡妆为宜、干净整洁、妆面清新自然，用色稳妥不夸张，口红、腮红、眼影同属一套妆容体系、颜色和谐，禁止荧光、亮粉与过于前卫的妆面。'},
{cat:'职业形象-言行规范', icon:'💼', src:'服务规范 2.7', t:['言行规范','服务忌语','十字礼貌用语','禁用语言','文明用语','服务用语','言行举止'],
q:'值勤期间言行规范有什么要求？',
a:'值勤期间严禁使用服务忌语（如"真麻烦""自己看""别问我""你怎么搞的"等）；应使用服务规范用语，勤用十字文明礼貌用语"您好、请、谢谢、对不起、再见"；与旅客沟通注意语气、态度热情、吐字清晰、语速适中；对旅客的询问先回应再行动、态度耐心，无法当场答复的应记录并转告乘务长或地面，不随意承诺。'},
{cat:'工作要求-航前准备', icon:'💼', src:'服务规范 3.2.4', t:['客舱温度','24-26','23-25','白雾','灯光100%','登机广播','空调温度','客舱环境'],
q:'旅客登机前客舱环境怎么调整？',
a:'（1）锁闭前舱洗手间；（2）灯光调节100%；（3）客舱温度：<strong>夏秋季24-26℃、冬春季23-25℃</strong>，可结合旅客感受适当调整，夜间航班可适当调高；（4）防止客舱出现白雾：登机前乘务长与机长确认驾驶舱已将客舱温度调至<strong>24℃</strong>，湿热天气注意减少白雾；（5）调节预录"登机广播"；（6）打开登机音乐调到合适音量。'},
{cat:'工作要求-客舱卫生', icon:'💼', src:'服务规范 3.2.2.1', t:['客舱卫生','座椅口袋摆放','安全带一字','洗手间标准','烤箱油渍','卫生标准','整理标准','清洁'],
q:'客舱卫生整理有哪些标准？',
a:'（1）烤箱优先检查烤架无油渍、托盘无油渍碳渍；（2）座椅、座椅口袋、小桌板、地面无明显垃圾杂物；（3）座椅口袋物品由外至内顺序：《出口座位旅客须知卡》（仅出口）→《安全须知卡》→清洁袋1个→其它刊物；（4）安全带呈"一"字状摆放，座椅扶手全部放下；（5）头片污损用备份头片更换；（6）洗手间：台面地面无明显垃圾水迹、卷纸抽纸齐全（卷纸前段叠三角形、抽纸拉出第一张）、马桶清洁盖板放下、洗手间香珠保质期7天。'},
{cat:'工作要求-迎客', icon:'💼', src:'服务规范 3.3.2', t:['迎客','问候','鞠躬','数客','标准话术','迎客话术','登机问候','行礼'],
q:'迎客问候有什么要求和标准话术？',
a:'迎客时面带微笑、目光亲切和蔼、主动问候每一位经过身边的旅客，使用礼貌用语明确指引旅客找座位；数客时不可将计数器放在旅客面前。客梯车登机：首位旅客踏上客梯车平台后机门口乘务员行<strong>15-30度鞠躬</strong>，后续行点头礼；廊桥登机：首位旅客到达廊桥操控台平行位置时行15-30度鞠躬。循环人数不得超过30位。标准话术："您好/早上好…，欢迎登机！""请往里走。""请当心脚下台阶。"'},
{cat:'工作要求-引导入座', icon:'💼', src:'服务规范 3.3.3', t:['引导入座','指引手势','五指并拢','疏通过道','调换座位','入座引导','指引话术','手势'],
q:'引导旅客入座有什么标准手势和要求？',
a:'引导旅客入座时注意指引手势：<strong>五指并拢、手心朝上</strong>；右手方向用右手指示、左手方向用左手指示、身后方向要转身指示；指示时避免手臂挡住旅客通行。标准话术："您的座位是*排*座，靠窗/中间/靠过道""先生/女士，麻烦您侧一下身，让身后旅客先过一下好吗，谢谢！"旅客需互相调换座位的，让其待其他旅客上机完毕后再更换。'},
{cat:'工作要求-行李摆放', icon:'💼', src:'服务规范 3.3.4', t:['手提行李','摆放行李','行李摆放','行李架','大不压小','松散物品','行李整理','行李安放'],
q:'旅客手提行李摆放有什么要求？',
a:'除孕妇、UM、残疾人、行动不便、担架、重病患者外，由旅客自行摆放手提行李；乘务员主动整理行李架，原则<strong>大不压小、重不压轻、竖直并列、有序排放</strong>；发现旅客行李中有饮料瓶、水杯等松散物品时提醒取出，避免漏水掉落。摆放后与旅客确认位置，并向特殊旅客介绍旅客服务组件、洗手间等设施。'},
{cat:'特殊旅客-轮椅旅客', icon:'💼', src:'服务规范 4.3.3', t:['轮椅旅客','轮椅','轮椅旅客服务','WCHR','WCHS','WCHC','特殊服务通知单','轮椅服务'],
q:'轮椅旅客服务有什么规范？',
a:'（1）已预约轮椅旅客：向地面索取《旅客特殊服务通知单》确认信息并签字；先于其他旅客登机，安排在便于照顾的位置，协助放置/取回随身物品；落地后要求地面人员在通知单上签字确认。（2）飞行途中临时申请：目视肢残/伤病、60周岁以上等按规定提供轮椅保障，无法判断需提供医院诊断材料核验，其他情况委婉拒绝。（3）通项：应安排在<strong>靠过道座位</strong>，行动不便者靠洗手间，不得安排在应急出口；落地前提醒机长通知地面准备轮椅，下降安检前告知错峰离机；协助上下机前征求本人意见并确认廊桥/客梯车无霜冰雪积水。'},
{cat:'特殊旅客-婴儿', icon:'💼', src:'服务规范 4.4', t:['婴儿服务','INF','婴儿安全带','婴儿救生衣','冲奶粉','唤醒婴儿','婴儿旅客','带婴儿'],
q:'机上婴儿旅客服务有什么规范？',
a:'婴儿指满14天未满2周岁旅客，出生不足14天及不足90天早产婴儿不予承运。服务要点：（1）协助提拿摆放行李，将奶瓶尿片放便于取拿处；（2）帮旅客系好安全带，<strong>告知不要将婴儿系在安全带内</strong>，主动提供婴儿安全带和婴儿救生衣；（3）介绍呼唤铃、通风器、婴儿护理板洗手间等设施；（4）主动询问是否需冲洗奶瓶、冲调奶粉，免费提供热水；（5）调整通风器避免直对婴儿；（6）下降时婴儿睡眠中要提醒唤醒（防客舱压力压迫耳膜），必要时喂奶；（7）婴儿救生衣正常情况不要打开损坏，也不得带下飞机。'},
{cat:'特殊旅客-UM', icon:'💼', src:'服务规范 4.5', t:['无成人陪伴儿童','UM','无人陪专用袋','空中生活情况','点心饮料','无人陪伴儿童','儿童服务'],
q:'无成人陪伴儿童（UM）机上服务有什么规范？',
a:'UM指满5周岁不满12周岁无成年陪伴乘机儿童。（1）优先登机，无法优先的安排最后登机；向地面索取《旅客特殊服务通知单》或《无成人陪伴儿童乘机服务单》确认信息并签字；（2）重点确认接送人姓名、地址、电话、家长特殊要求及随身行李；（3）乘务长确认UM胸前"无人陪专用袋"，没有的由乘务长提供并填好无人陪记录单挂于胸前；（4）就座后介绍安全带、呼唤铃、阅读灯、洗手间等设施，乘务长提供玩具（如有）落地后收回；（5）机上销售环节为UM提供<strong>饮料及点心各一份</strong>（参考华夫+橙汁，或同等价格点心饮料），食品种类数量记录在无人陪记录单"空中生活情况"栏，配送系统用"修订"记录并注明原因；（6）国际航班帮助填写CIQ单据；（7）下降时睡眠中唤醒。'},
{cat:'特殊旅客-孕妇', icon:'💼', src:'服务规范 4.6', t:['孕妇服务','PGNT','孕妇座位','餐食服务','特别关照','孕妇旅客','孕妇关怀'],
q:'孕妇旅客机上服务有什么规范？',
a:'孕妇旅客（PGNT）服务要点：主动提供帮助（提放行李、递送物品等）；座位尽量安排宽敞便于照顾，避免靠近应急出口等不安全位置；航班中加强巡视关照，及时回应呼唤铃，按需提供温水和帮助；若孕妇出现身体不适及时报告乘务长，必要时联系地面或医疗支援；下降安检后可用以错峰离机，避免拥挤。'},
{cat:'特殊旅客-老年旅客', icon:'💼', src:'服务规范 4.7', t:['老年旅客','AGED','无陪老年旅客','座位安排','协助服务','老年乘客','无陪伴老人'],
q:'老年旅客服务有什么规范？',
a:'老年旅客（AGED）服务要点：主动协助提放行李、搀扶上下机（不可背抱）；座位尽量便于乘务员照顾，避免应急出口附近位置；关注老人冷暖与身体状况，及时提供热水等服务；下降前提醒带好随身物品并安排错峰离机；无陪老年旅客需重点关照、了解接机人信息并做好地面交接。'},
{cat:'特殊旅客-伤病残疾', icon:'💼', src:'服务规范 4.8', t:['伤病旅客','残疾旅客','残障旅客','协助服务','服务规范','伤残旅客','行动不便'],
q:'伤病/残疾旅客服务有什么规范？',
a:'伤病旅客指需他人照料或医疗协助的旅客；残疾旅客（残障旅客）及行动不便旅客按各自情况提供服务。服务要点：先征求旅客意见再提供帮助、不刻意关注伤残部位；协助摆放行李、使用洗手间等，提供必要照顾；原则上不安排在应急出口；机上出现不适及时报告乘务长并视情联系医疗支援；做好与地面人员交接。'},
{cat:'特殊旅客-担架用氧', icon:'💼', src:'服务规范 4.9', t:['担架旅客','用氧旅客','STCR','OXYG','运输要求','担架','氧气旅客'],
q:'担架旅客/用氧旅客（OXYG）服务有什么要求？',
a:'担架旅客（STCR）需占用座位空间并拆除部分座椅等特殊布置，运输前须经公司批准并满足适航及承运要求，由机组按既定程序配合安置；用氧旅客（OXYG）机上用氧须经公司批准并在符合规定的条件下由机组按程序提供，用氧过程中加强观察，出现异常立即报告机长并寻求医疗协助。此类服务严格按公司特种运输规定执行。'},
{cat:'特殊旅客-盲人旅客', icon:'💼', src:'服务规范 4.10', t:['盲人旅客','BLND','导盲犬','引领服务','运输要求','盲人','导盲犬服务'],
q:'盲人旅客服务有什么规范？',
a:'盲人旅客（BLND）服务要点：主动引领入座，介绍周围设施（呼唤铃、洗手间、座椅安全带等）；提供帮助前先征求意见，引导时轻扶上臂、走在旅客左前方半步并提示台阶等障碍；如有需求协助摆放行李；如携带导盲犬，引导其安置在指定区域并遵守携犬乘机要求；做好与地面人员交接，确保接送衔接顺畅。'},
{cat:'特殊旅客-聋哑旅客', icon:'💼', src:'服务规范 4.11', t:['聋哑旅客','聋人','哑人','DEAF','DUMB','书写沟通','听力障碍','沟通辅助'],
q:'聋哑旅客服务有什么规范？',
a:'聋哑旅客（DEAF/DUMB）服务要点：通过<strong>书写、手势、图示</strong>等方式与旅客沟通，语气和表情保持耐心友善；介绍安全带、呼唤铃、洗手间等设施时用文字或图示说明；必要时提供纸笔协助；遇紧急情况通过发光、拍肩等可感知方式提示；若旅客单独乘机，做好地面与接站衔接。'},
{cat:'特殊旅客-首乘旅客', icon:'💼', src:'服务规范 4.14', t:['首乘旅客','第一次乘机','服务规范','介绍设施','首次乘机','首飞旅客','关怀'],
q:'首乘旅客服务有什么规范？',
a:'首乘旅客指第一次乘坐飞机的旅客。服务要点：主动识别并给予特别关注（可佩戴首乘标识）；热情介绍乘机流程与机上设施（安全带、呼唤铃、洗手间、通风器、阅读灯等），示范正确使用；耐心解答疑问、缓解紧张情绪；起降颠簸等关键阶段加强关照与提醒；做好与地面接站衔接。'},
{cat:'特殊航班-不正常航班', icon:'💼', src:'服务规范 5.3.3', t:['延误','不正常航班','延误广播','20分钟','供餐要求','延误话术','航延','晚点'],
q:'航班延误期间客舱服务怎么做？',
a:'（1）旅客客舱等待时保持环境适宜，可放登机音乐；（2）获取明确信息后乘务长第一时间广播（先统一口径），向旅客解释原因、致歉、说明动态与保障方案，此后<strong>每隔20分钟广播更新一次</strong>；（3）尊享飞和重要旅客个别沟通优先告知；（4）内部敏感信息严禁对外公布、不得当着旅客面传递；（5）供餐要求：地面等待<strong>60分钟以内</strong>按需提供饮用水；<strong>60-120分钟</strong>用托盘主动发放一次性纸杯水；<strong>≥120分钟</strong>联系商务调度配送饮用水及餐食/干点（电话021-32315821）；（6）延误超3小时（含）且无明确起飞时间，接AOC指令组织旅客下机休息，重新登机须重新清点人数、做安保检查；（7）旅客要求延误/取消书面证明的及时提供，原因须真实与对外公布一致。'},
{cat:'特殊航班-霸机处置', icon:'💼', src:'服务规范 5.3.5', t:['霸机','霸机旅客','群体性事件','安抚','报告','占机','霸机处置','客舱值守'],
q:'发生旅客霸机怎么处置？',
a:'（1）发生霸机或霸机倾向时，乘务组及时报告<strong>航空安全员和飞行机组</strong>，由飞行机组通知公司AOC；（2）地面时尽快通知航站工作人员；（3）<strong>不得发生客舱无工作人员的情况</strong>：如飞行机组决定离机，乘务组须指派至少1名客舱乘务员留在客舱协助安抚旅客情绪、劝导下机，直至与航站工作人员妥善完成交接。'},
{cat:'服务话术-服务技巧', icon:'💼', src:'服务规范 6.2', t:['服务技巧','托盘服务','餐车服务','热饮温度','递送物品','服务技能','热饮服务','托盘技巧'],
q:'客舱服务有哪些操作技巧和注意事项？',
a:'<strong>托盘服务</strong>：四指并拢放托盘底部、虎口固定、大拇指放边沿（不进入托盘内）；"人动盘不动"；托盘上每次最多放9杯杯装饮料，饮料放靠近身体一侧；递送不超过6杯可用1/2小托盘。<strong>物品递送</strong>：正面面对旅客、禁止手对手交接、尖锐物头朝自己。<strong>餐车服务</strong>：缓慢推行、遇旅客伸脚先语言提醒、服务时必须踩刹车、拉车控制速度。<strong>热饮服务</strong>：热饮温度控制在<strong>60-70℃以内、容量不超过7成</strong>，放置于小桌板严禁手对手交接；原则上不为小旅客提供热饮，严禁为无陪儿童提供热饮；颠簸时暂停热饮服务。<strong>冷饮</strong>：倾倒时低于腰部高度，碳酸饮料倾斜30-45度，手拿杯/瓶下部三分之一处。'},
{cat:'服务话术-标准话术', icon:'💼', src:'服务规范 6.3', t:['投诉处理','投诉话术','服务话术','标准话术','道歉话术','主动服务','投诉应对','客户投诉'],
q:'旅客投诉时用什么标准话术处理？',
a:'处理旅客投诉要点：先倾听、不打断、与旅客共情致歉，再了解情况给出解决方案；语气温和、态度诚恳。常用标准话术："非常抱歉给您带来不愉快的体验，我马上为您处理""您的心情我非常理解，感谢您的宝贵意见"等。当无法当场解决的问题应明确告知处理流程与时限，并及时转交乘务长或地面处理、跟踪回访。'},
{cat:'服务话术-禁忌话术', icon:'💼', src:'服务规范 6.5', t:['禁忌话术','话术禁忌','服务禁语','忌语','统一口径','舆情','禁语','敏感表述'],
q:'特殊情况下的禁忌话术有哪些？',
a:'航班上发生特殊情况时，告知旅客的口径必须和公司保持统一，避免话术不当引发投诉舆情。典型<strong>禁忌话术</strong>：救生衣被误拆时"你不需要知道怎么使用"；涉及安全时"今天的飞机坏了""今天飞机上有炸弹"；航司自身原因时"机长生病了要换机长等一等""机长正在赶来的路上""乘务员晕倒了要临时换人"；保障部门原因时"地面商务工作不到位人数没点对""飞机被车撞了要维修"；其他活动时"今天有军事活动不能起飞"。应使用规范、统一口径的解释话术。'},
{cat:'尊享飞服务', icon:'💼', src:'服务规范 7.1', t:['尊享飞','尊享飞服务','前舱座位','30KG行李额','优先登机','尊享','尊享权益','行李额度'],
q:'尊享飞服务包含哪些内容？',
a:'尊享飞是超越经济舱服务标准的高性价比服务产品。主要权益：<strong>尊享前舱座位</strong>（A320第1、2排；A321第1-3排）、私密空间、比经济舱多20%-40%腿部空间、VIP值机柜台和优先登机（仅限虹桥/浦东/石家庄/沈阳出港）、<strong>30KG免费行李额</strong>（手提升级限1件10KG，尺寸20*40*55cm内）、个性化餐饮（餐点时间提供正餐/点心餐）、全流程温馨服务（姓氏服务等）。旅客可经春秋航空APP或官方渠道查询尊享飞权益与服务内容，乘务员按购票订单信息逐一核对后提供对应服务。'},
{cat:'尊享飞服务-流程', icon:'💼', src:'服务规范 7.2', t:['尊享飞服务流程','尊享飞流程','2号位','蹲跪式服务','姓氏服务','迎客','服务流程','尊享飞服务'],
q:'尊享飞服务流程是什么？',
a:'尊享飞服务由<strong>2号位乘务员</strong>负责。登机前：检查尊享飞环境（座椅/地毯/小桌板/壁板/洗手间）、机供品交接清点、核对餐食、获取旅客信息（IPAD下载并全部上客后刷新）。登机后：主动问候、提供姓氏服务、引导入座；持IPAD对照名单确认，主动自我介绍表达欢迎，介绍时采取<strong>蹲跪式服务</strong>；核对换座信息；向旅客介绍尊享飞服务内容；有尊享飞餐饮的需确认是否叫醒休息旅客；无餐食供应的提供矿泉水和湿纸巾；提醒中度（含）以上颠簸。落地送客时按手册7.2.5流程。'},
{cat:'尊享飞服务-特殊情况', icon:'💼', src:'服务规范 7.2.9/7.2.10', t:['尊享飞换座','尊享飞配餐数量不符','非尊享飞旅客','购票质疑','配餐异常','换座','配餐核实'],
q:'尊享飞旅客座位/配餐异常怎么处理？',
a:'（1）尊享飞旅客被安排在其他座位区域时，乘务组应按尊享飞服务要求主动做好座位调整与告知，保障其核心权益；（2）遇非尊享飞旅客声称已购买尊享飞服务、或核对发现尊享飞配餐数量与实际旅客数不一致时，乘务组应核实旅客购票信息并在机上销售系统或地面渠道核实后妥善处理，向旅客做好解释致歉、记录风险沙盘并视情上报，避免投诉。核实与处理细节按公司现行相关规定执行。'},
{cat:'机上销售-免税品', icon:'💼', src:'服务规范 8.1.4/8.1.5', t:['免税品销售','免税品','烟酒化妆品','香烟整条','海关规定','免税','机上免税','购物'],
q:'机上免税品销售有什么规定？',
a:'（1）免税品种类以烟、酒、化妆品为主，机上在售范围与价格按免税销售清单核对执行，未在售或缺货的做好解释；（2）<strong>香烟类产品整条销售，不允许私自拆卖</strong>，销售时计算好数量避免旅客违反入境规定；（3）购买烟酒提醒旅客注意入境地/出境地海关要求，<strong>商品不接受退换货</strong>；（4）注意包装盒完整；（5）海关规定：机组人员携带物品以个人旅途必需或零星自用为限，<strong>空勤人员没有免税额度</strong>；严禁违规销售机上免税品；严禁替不明身份的人捎带物品；机组成员携带物品须经安全检查方可上机。'},
{cat:'机上销售-机供品', icon:'💼', src:'服务规范 8.3', t:['机供品清点','单据填写','四联单','4号位','交接','机供品','清点交接','单据'],
q:'机供商品清点和单据填写有什么规范？',
a:'机供品清点与单据填写由<strong>4号位乘务员</strong>负责，乘务长复核。要点：按《机供商品交接清单》核对种类数量，逐项清点避免漏项；四联单填写规范、字迹清晰，航前航后交接双方签字确认；使用机供品配送系统如实操作，确保系统数据与实物一致；办理退、换、缺、损的及时按流程在系统中修订并注明原因；航后分类收纳、按指定位置放置机供商品。'},
{cat:'乘务长管理-航后讲评', icon:'💼', src:'服务规范 9.5', t:['航后讲评','绩效评价','销转保','物品归还','舆情管理','讲评','绩效复盘'],
q:'乘务长航后讲评怎么做？',
a:'（1）<strong>总结提升</strong>：对航班重点关注点讲评，通报典型案例及特殊事件，指出不足，以正向激励为主，评价组员整体情况；确认已完成销售系统和配送系统操作、销售缴款。（2）<strong>绩效评价</strong>：客观公正评价组员并做好绩效沟通，违规组员及时纠偏、严重者开罚单扣分。（3）<strong>信息反馈与物品归还</strong>：第一时间上报特殊事件，带回并上交单据（特殊旅客单、餐食配备单、机供品单等），归还IPAD、门禁卡（仅浦东）、台湾通行证等。（4）<strong>舆情管理</strong>：重大/群体性事件及时上报，不得随意接受媒体采访或擅自发表言论。（5）<strong>销转保签字确认</strong>：与4号位核实销转保情况并完成签字和单据上交。'},
{cat:'乘务长管理-国际航班取消', icon:'💼', src:'服务规范 9.6', t:['国际航班取消','注销出关','边检手续','航班变更','出关手续','注销手续','边检'],
q:'国际/地区航班取消或变更，机组出关手续怎么办？',
a:'（1）已办理出关手续但国际/地区航班取消：所有机组成员必须返回国际出发大厅出入境管理处（出发边防）办理<strong>注销手续</strong>，完成注销后从该处出关，严禁从机坪私自离开；（2）国际航班临时调整为另一国际航班：已办妥出境手续的机组需<strong>重新办理边检手续</strong>，不得直接执行变更后的航班；（3）国际/地区与国内航班临时对换：已办妥出境手续且航班变更的机组，需先在出境员工通道办理出境注销手续；国内调整为国际航班需按要求办理出境手续。'},
{cat:'乘务长管理-转场程序', icon:'💼', src:'服务规范 9.7', t:['浦东转虹桥','转场程序','地转虹桥','出境手续','AOC','转场','出境注销'],
q:'浦东国际/地区航班地转虹桥程序怎么走？',
a:'仅适用于浦东国际/地区航班地转至虹桥机场。（1）收到AOC发布的转场指令后，乘务调度负责告知当班乘务组；（2）尚未在浦东办理出境手续的乘务组，接到转场通知后根据公司要求前往虹桥机场办理出境手续执行航班；（3）已在浦东办理出境手续的乘务组，前往出境员工通道办理相应注销/转场手续，严禁私自离岗。转场中涉及证件、签封等衔接事项按公司现行相关规定执行，确保机组身份与装载手续相符后再执行航班。'},
{cat:'职业形象-发型妆容', icon:'💼', src:'服务规范 2.4 妆容', t:['妆容','妆容标准','化妆标准','化妆','女乘妆容','指甲','指甲油标准','男乘胡须'],
q:'乘务员妆容有什么标准？指甲有什么要求？',
a:'女乘：执行航班前必须化妆（春日元气妆或秋日氛围妆），妆容得体自然靓丽，须包含底妆、眉毛、眼线、睫毛、眼影、腮红、口红；整体妆面不得有荧光、不得使用亮粉、不得过于前卫；航班上及时补妆保持面部不油亮、妆容完整；不得使用浓重刺鼻香水；口红、腮红、眼影须同一妆容体系不可混搭，禁止仅涂唇彩。指甲：清洁无污垢，长度从手心看不超<strong>2毫米</strong>；甲油颜色限裸色系（透色/裸粉/裸杏）或小法式（前段白色且不超2毫米），禁止磨砂、金属、带亮片、渐变、猫眼、装饰物等。男乘：航前必须净面、剃胡须、修剪鼻毛，不留长指甲、不得使用指甲油，可使用无色护唇油或润唇膏。'},
{cat:'职业形象-飞行装具', icon:'💼', src:'服务规范 2.8 飞行装具', t:['飞行装具','必带物品','针线包','化妆包','箱包','登机证','携带物品','装具'],
q:'执行航班要带哪些飞行装具？箱包有什么要求？',
a:'执行航班或备份任务必带：针线包（至少缝衣针一枚、黑线和白线各一卷）、常用药品（风油精/清凉油、创可贴）、钱袋和两个点数器（乘务长携带）、围裙（女乘）、化妆包（女乘，含洗面奶/化妆水/乳液/隔离/粉底液/粉饼/眉笔/眼线笔/眼影/睫毛夹/睫毛膏/腮红/口红）、备份丝袜（女乘）、矫正镜乘务员备好隐性与框架眼镜。其他要求：佩戴公司统一登机证挂带及保护套，进客舱后登机证（含挂带保护套）放入个人箱包，严禁收于裤袋或衬衫口袋；须使用公司统一箱包禁止私人箱包，飞行箱LOGO完整；箱包外仅可各挂一个长宽厚≤9×5×1cm的纯色行李牌/挂件，须有明显信息标签；同时携带挎包和飞行箱时右手拉飞行箱、挎包放飞行箱上；航班销售必须使用钱袋（不允许用清洁袋）。'},
{cat:'工作要求-客舱巡视', icon:'💼', src:'服务规范 3.6 客舱巡视', t:['客舱巡视','巡舱','巡视要求','巡舱要点','巡舱频次','巡视规范','巡视'],
q:'客舱巡视有什么频次要求？巡视时要注意什么？',
a:'巡视姿态：缓步走、上身挺直、脚步不过重过大过急、不左右摇晃，保持微笑，与旅客目光交汇时点头致意。频次：乘务长起飞前安全检查、下降前安全检查各完成一次<strong>通舱</strong>巡视，巡航中每隔<strong>10分钟</strong>巡视一次；客舱乘务员除滑行/起飞/下降关键阶段外必须始终保持客舱有人巡视（静态销售、为旅客服务视为巡视）；返回服务间后另一名乘务员立即接替。要点：观察旅客动态、异常及时报告乘务长或安全员；及时制止违规使用电子设备；随时监控出口座位旅客动态；提醒长时间站立过道/在客舱奔跑或站椅子上就座；委婉劝阻随意换座（关注被拒换座旅客及付费座位旅客感受）；维护客舱卫生（劝阻气味强烈/带果皮瓜壳的自带食物，提供清洁袋纸巾）；主动为旅客开关通风口/阅读灯/遮阳板、收杂物、统一口径回答问题、提醒保管财物；特别关注老年旅客、带小孩旅客。'},
{cat:'特殊旅客-客舱宠物', icon:'💼', src:'服务规范 4.15 带宠物旅客', t:['客舱宠物','宠物','宠物箱','宠物绑带','猫狗','宠物进客舱','宠物运输'],
q:'旅客携带宠物进客舱有什么规定？乘务员怎么服务？',
a:'客舱宠物指符合特定条件、可随旅客进入客舱的家庭驯养猫狗，仅支持9C国内直达航班（不支持中转联程/通程）。申请限制：不受理单独乘机的未成年人、老年/伤病/残疾/孕妇等特殊旅客及单独携带婴儿或儿童成人的申请。机上服务：(1)登机前将一次性座椅套铺在宠物占用的两个座位（不足可用垃圾袋代替）；(2)登机后乘务员用绑带把宠物箱固定在靠窗和中间座位（乘务长须确认其他旅客登机前完成固定；纵向绑带从椅下穿过勿压救生衣、勿压座椅垫，需两人协助），检查绑定牢固、锁扣完好；(3)提醒旅客全程不能打开宠物箱锁扣、不得将宠物放出、禁止机上喂食饮水、下机前不得解绑；(4)对宠物毛发过敏旅客调整座位或提供口罩；(5)关舱门前有旅客拒绝同乘：先引导调座，仍不同意则携带宠物旅客办理<strong>免费退票或免费改签</strong>后续航班；(6)落地后回收绑带放回原位置，安排宠物旅客最后下机；(7)物料（每份含2件座椅套、2根绑带、1个备用锁扣）每机5份、口罩10只，少于等于3份时通过销售系统"X产品未享用单"告知市场管理部增配。'},
{cat:'特殊航班-超售', icon:'💼', src:'服务规范 5.5 航班超售', t:['超售','拉减旅客','超售赔偿','改签赔偿','自愿者','超售处理','拉减顺序'],
q:'航班超售怎么处理？拉减顺序和赔偿标准是什么？',
a:'超售指销售座位数超过实际可利用座位数的行为。处理原则：先寻找付费旅客中的<strong>自愿者</strong>动员改乘；仍不足时按以下顺序拉减：享受优惠票的公司职工及家属→本站始发本公司员工（紧急维修任务人员除外）→经停本站本公司员工→其他非公司重要宾客的免票旅客→其他普通旅客（按值机时间倒序）。超售时优先保证：执行国家紧急公务旅客及随行人员、携带人体捐献器官的OPO工作人员、有特殊服务需求旅客（老弱病残孕、客舱宠物、UM等）及必需陪伴人、现役军人警察消防救援人员、团体旅客、转机衔接时间较短的联程旅客、有特殊困难急于成行旅客。赔偿：退票免退票费并赔200元；改乘后续航班延迟2小时以下赔200元、2（含）-4小时（不含）赔400元、4小时（含）以上赔600元；不向持公务免票、员工或宾客优惠票旅客提供现金赔偿。'},
{cat:'机上销售-收款', icon:'💼', src:'服务规范 8.4 销售收款', t:['收款','机上收款','销售二维码','扫码购物','现场收款','现金收款','外币','机上发票'],
q:'机上销售二维码和现金收款有什么注意事项？',
a:'机上销售二维码：4号位上机后（机上销售系统）完成二维码商品录入并点击"开始销售"；迎客期间4号位/乘务长视情进行扫码购物广播提示，其他号位引导有需求旅客扫码下单；起飞前安全检查时4号位点击"结束销售"并刷新系统避免漏单漏送；飞机在地面等待期间在确保安全工作前提下视情完成商品配送。现场收款注意：收现金当场<strong>唱票</strong>、及时找零、注意钱币真伪；国际/地区航班只收取汇率换算表内的币种、<strong>不收硬币</strong>；外币无相应币种找零时经旅客同意按公司当月发布汇率兑换成人民币找给旅客；机上购物需开发票的，告知旅客通过公众号"春秋航空绿翼商城—机上订单—输入预定人手机号—查询—申请开票"办理。'},
{cat:'职业形象-言行规范', icon:'💼', src:'服务规范 2.5 饰物', t:['饰物','首饰','项链','耳钉','戒指','手表','智能手表','配饰'],
q:'乘务员可以佩戴哪些饰物？有什么标准？',
a:'基本要求：仅可佩戴项链（含吊坠）、细戒各一件，耳钉一对（女乘），全体必须佩戴手表/智能手表一块；手腕及脚踝不得佩戴手链、手镯、脚链、红绳、佛珠、护身符等；着制服不得佩戴牙套、"美瞳"隐形眼镜。具体标准：(1)项链/挂件置于衬衫衣领内不得显露；(2)戒指材质仅限金银、宽度不超过5毫米，不得镶嵌珍珠宝石（允许全嵌入式钻戒），只能戴在中指或无名指；(3)耳钉仅限白色珍珠款、直径不超过8mm，两边耳垂各戴一个，<strong>男乘禁止佩戴耳钉耳环</strong>；(4)手表表盘纯色无卡通/照片图案，表带钢制限金银黑、皮质限黑白灰棕，禁止工艺卡通夸张手表、禁止运动手环；智能手表签到时<strong>电量不低于80%</strong>，飞行全程调飞行模式并关闭蓝牙、无线连接，不可设密码须直接显示时间。'},
{cat:'职业形象-仪态行为', icon:'💼', src:'服务规范 2.6 仪态标准', t:['仪态','站姿','坐姿','走姿','仪容仪表','举止','仪态标准'],
q:'乘务员站姿、坐姿、走姿有什么标准？',
a:'站姿：上身正直、抬头挺胸收腹、腰直肩平、双眼平视、保持微笑；避免歪斜弯腰驼背趴伏依靠等。男乘两脚分开与肩同宽、双臂自然下垂或双手相握放于背后腰部；女乘双手虎口交叉（右手在上握左手四指）重叠于腹部、双膝靠紧、双脚呈V字45度或丁字型。坐姿：入座轻稳缓、腰部挺起、脊柱伸直、躯干颈腿脚正对前方，离座轻缓；男乘双腿正放、双脚分开与肩同宽、小腿与大腿成90度、双手五指并拢放大腿；女乘坐姿双腿双膝双脚并拢、双手相叉放裙沿（或横摆式两腿向侧倾斜45度脚尖内收）；避免跷二郎腿、双腿抖动摇晃等。走姿：标准站姿基础上向前迈步（距离一脚掌到一脚掌半），挺胸收腹双肩平稳、双臂以肩为支点30-35度自然摆动，脚步不过重过大过急、不左右摇晃，目光与旅客相遇微笑点头致意，女乘巡视客舱双手自然相握放腹部。'},
{cat:'工作要求-服务规范', icon:'💼', src:'服务规范 3.8 其它服务规范', t:['服务顺序','驾驶舱服务','机上广播','广播员','先里后外','广播资格','乘务广播'],
q:'客舱服务有什么顺序要求？驾驶舱服务和机上广播有什么规定？',
a:'服务顺序：各项服务均须<strong>"先里后外、先女后男、先老后幼、先职务高后职务低"</strong>。驾驶舱服务：由<strong>2号位乘务员</strong>负责、乘务长协助；上机后准备热毛巾/湿纸巾/垃圾袋等服务用品（热毛巾湿纸巾放机长座椅左右侧储物格、垃圾袋套座椅两侧垃圾箱，不得放操作台）、摆放饮用水和飞行机组饮料、按用餐时间为机组供餐；飞行时间70分钟（含）以上航段每小时进行不超过5分钟的机组沟通；机长和副驾驶提供不同餐食，若相同则两人进餐间隔须超<strong>1小时</strong>；驾驶舱内机组正在通讯或关键操作时不得打断；<strong>严禁将装满热水的烧水杯拿进驾驶舱</strong>（只能在服务间完成加水）；乘务长将进入驾驶舱时间及交流时长记录在风险沙盘。机上广播：进行客舱广播须取得<strong>广播员资格</strong>（颠簸和特殊情况除外），乘务长指定其他广播员须在风险沙盘注明原因和姓名，按《客舱广播手册》执行；正常语种顺序中文/英文（日本航线中文/日文/英文）。'},
{cat:'特殊航班-重要旅客', icon:'💼', src:'服务规范 5.1 重要旅客航班', t:['重要旅客服务','VIP','VIP服务','VIP怎么服务','要客怎么服务','VVIP','要客服务','靠枕'],
q:'机上重要旅客（VVIP/VIP/CIP）怎么服务？',
a:'服务对象：VVIP/VIP/CIP。信息获取：通过 SMP 航前准备、智慧客舱查看重要旅客信息，<strong>信息不一致时，以航班起飞前智慧客舱的信息作为依据</strong>；航前准备完成后记录在《飞行工作记录本》；乘务长务必航前点击智慧客舱查询当日保障情况；重要旅客信息（姓名/职位/航班信息/偏好等）须<strong>严格保密</strong>，不得私自传播泄露讨论，特殊情况（备降、取消、错乘等）使用纸质单据交接。准备会：传达信息并分工保障区域、确认仪容证件、提醒保密、将VIP信息报告机长。上机后准备：按标准检查客舱/服务舱/娱乐/洗手间设施；2号位按《重要旅客餐食、机供品配备标准》清点并报乘务长复核；靠枕去除外包装整齐放重要旅客座椅上（航徽方向一致正面朝旅客）、拖鞋放座椅前方口袋安全须知卡后侧露出1/3鞋面。迎客：站姿端正优雅、面带微笑，旅客到登机口行15-30度鞠躬主动问好，外籍旅客用英文或其母语问候；携女伴随行称呼"男方姓氏+夫人"（如"XX先生，您好，欢迎登机！"）；引导入座、合理安置行李衣物。'},
{cat:'机上销售-退餐退款', icon:'💼', src:'服务规范 8.5 未享受增值服务', t:['退餐','退餐流程','餐食退款','航班延误退餐','X产品未享用单','退款','退餐标准'],
q:'旅客要退机上餐食/增值服务怎么办？',
a:'（1）因公司原因延误错过用餐时间或延误超<strong>4个小时</strong>旅客提出退餐：乘务员在机上销售系统填<strong>《X产品未享用-旅客确认单》</strong>请旅客确认后提交，告知拨打公司服务热线<strong>021-95524</strong>申请退款；当班4号位将退餐数量记录在《春秋航空机供商品交接清单》，乘务长记录在《风险沙盘工作流程管理》，未记录产生的损失由乘务组承担。（2）非常温餐食（旅客提前预定、各航食公司提供、保质期1日）：航班延误<strong>3小时及以上</strong>且旅客未食用方可退款，乘务长在系统内为其填写确认单并上传。（3）非公司原因延误、旅客强行要求退款：先解释致歉安抚，仍态度强硬的在系统填确认单让旅客确认提交，并告知拨打客服电话申请退款，乘务长记录风险沙盘。（4）团队餐退订：团队餐费由旅行社为旅客支付、无法单独退订，按地面退订规则处理。'},
{cat:'工作要求-飞行关键阶段', icon:'💼', src:'服务规范 3.4', t:['电子设备','手机','飞机上能用手机吗','手机怎么用','飞行模式','PED','有线耳机','充电'],
q:'机上便携式电子设备（PED）使用有什么规定？',
a:'（1）<strong>飞行关键阶段</strong>（滑行/起飞/下降/着陆）<strong>禁用有线耳机等配件</strong>（紧急情况时耳机线会成为撤离阻碍）；笔记本电脑等大型设备起飞下降时须妥善存放（体积大易阻挡撤离通道）；具备飞行模式的手机起飞前须调至<strong>飞行模式并关闭WiFi</strong>（具备机上WiFi的飞机除外）；<strong>不具备飞行模式</strong>的手机/老年机/卫星电话/带移动电话功能的手表/对讲机/遥控玩具等<strong>飞行全程禁用</strong>；超过规定尺寸的PED仅可在巡航时使用。（2）机上<strong>不提供旅客充电电源</strong>（机载电源电压和频率参数与一般电子设备不同），可告知旅客下机后到候机楼充电。（3）春秋航空于<strong>2018年1月21日</strong>起在所有飞机上有条件开放使用便携式电子设备。（4）机长发现电子干扰并怀疑来自机上PED时，可授权要求关闭；在低能见度飞行阶段等特殊情况下要求关闭。（5）标准话术：起飞/下降前提醒"请收起小桌板，打开遮阳板，确认电子设备已调成飞行模式（并关闭WiFi）"。'},
{cat:'工作要求-平飞服务', icon:'💼', src:'服务规范 3.5', t:['平飞服务','平飞广播','报刊发放','服务准备','烧水器','平飞','广播'],
q:'平飞后各号位服务准备工作怎么安排？',
a:'(1)<strong>乘务长</strong>：起飞后20分钟/平飞时参照规范调节客舱灯光，进行"平飞广播"（1小时（含）以内航班可视情况播放）；(2)<strong>2号位</strong>：拉上前服务间、尊享飞门帘，打开前服务间烧水器或咖啡壶；(3)<strong>3号位</strong>：收起并固定旋转座椅、打开后舱洗手间供旅客使用、协助4号位准备机上销售商品；(4)<strong>4号位</strong>：打开后服务间烧水器或咖啡壶、准备机上销售商品、推餐车销售航线整理好食品销售餐车；(5)<strong>5/6号位</strong>：协助4号位准备机上销售商品。报刊发放：报纸配送超30份由3号位自1排至最后一排发放（不足30份乘务长折叠放书报架，起飞下降期间存放妥当）；发放一种报纸折叠摆扇形、两种报纸竖版放横版后露出报头，身体与手臂成45度角，右手握刊物左上端、报纸面对旅客递送。'},
{cat:'特殊旅客-其他', icon:'💼', src:'服务规范 4.12 其他特殊旅客', t:['O舱','保密旅客','机要交通员','外交信使','KOL','犯罪嫌疑人','O舱旅客','特殊旅客'],
q:'O舱旅客、保密旅客、机要交通员/外交信使怎么服务？',
a:'(1)<strong>O舱旅客</strong>：信息前置——乘务长提前将旅客座位信息告知全体乘务员，可通过SMP通讯录了解O舱旅客隶属部门；灵活服务——过站时间充足时登机前摆放好机组水，时间紧张改为登机后送水并问候；主动关怀——巡舱时主动问候（如"旅途辛苦了"）；重点关照——5人以上"O"舱团队旅客（很可能为公务出行）乘务长应亲自关注；全程用心做好迎客、秩序维护、环境与广播。(2)<strong>保密旅客</strong>：指根据接待单位要求不公布身份的旅客，信息应予以保密、不得透露给无关人员，座位按接待单位要求办理。(3)<strong>机要交通员/外交信使</strong>：事先办妥定座和购票手续，可按规定预留座位，携带机要文件或信袋较多提前申请；可安排<strong>航班第一排</strong>座位，如该航班有重要旅客可酌情向后安排。(4)犯罪嫌疑人（被押解人员）的安保要求及措施详见《客舱乘务员手册》。(5)<strong>KOL</strong>（"意见领袖"、媒体人等有舆论传播效应的旅客）：没有特殊服务项目，但客舱内重点关注、保持良好服务态度。'},
{cat:'服务话术-特殊情况', icon:'💼', src:'服务规范 6.4', t:['延误话术','延误怎么解释','延误解释','怎么解释延误','解释话术','机组调配','机械故障','延误广播'],
q:'航班不正常时（机组原因/机械故障/旅客原因）怎么向旅客解释？',
a:'(1)<strong>机组问题</strong>（机组晚签到/晚进场、健康问题临时调换、漏带证件或证件丢失、过站衔接不足、未按规定领取资料、乘务组临时调换等）："女士们/先生们，由于公司原因/机组调配，我们的飞机暂时不能起飞。对此我们深表歉意。（我们大概还需等待大约__分钟。）"(2)<strong>机械故障</strong>（内部自身飞机问题、外部被机场特种车辆碰撞、换轮胎、机门盖板掉落等）："女士们/先生们，非常抱歉，因突发机械故障，我们目前需要对飞机进行检查，无法按时起飞。对此我们深表歉意。（我们大概还需等待大约__分钟。）"(3)<strong>旅客原因</strong>（等待OPO/团队旅客/重要旅客、同机遣返（不让旅客入关要求随机返回）、旅客拒绝登机/霸占飞机等）："女士们/先生们，非常抱歉，由于前段航班旅客突发情况……目前尚有部分地面保障手续未完成，工作人员正在积极处理，请您耐心等待，谢谢。"广播应平静、清晰、口径统一，各小类情形的规范表述按《客舱服务规范》6.4有关条款并结合公司现行规定执行，确保对外口径与公司一致。'},
{cat:'工作要求-岗位职责', icon:'💼', src:'服务规范 3.1', t:['岗位职责','乘务长职责','2号位','4号位','各号位分工','号位分工','分工'],
q:'乘务组各号位（乘务长/2-7号）岗位职责大概怎么分工？',
a:'按服务规范3.1岗位职责分工（A320，7人制）：<strong>预先准备阶段</strong>：全员登录乘务门户（CC）系统或"春秋之家"手机客户端网上准备、填写飞行工作记录本、确认证件和装具；乘务长负责领取物品及资料。<strong>直接准备阶段</strong>：全员参加客舱机组准备会、机组航前协同会；客舱设备检查、安保检查、机供品配备（乘务长/2/3/4号负责，机组餐配备乘务长/2号负责，3/4/5号协助）；驾驶舱服务由2号位负责；客舱卫生整理全员。<strong>飞行实施阶段</strong>：旅客登机前确认无外来人和物、上客前最后准备（仪容仪表）、迎客（全员）；出口座位旅客评估由乘务长负责（其他号位协助）；手提行李确认2/3/4/5号；四核对由乘务长/2号；确认随机文件乘务长（2号协助）；舱门滑梯预位操作（双人制）2/3/4/5号；安全演示、禁/限用电子设备2/3/4/5号（其余协助）；起飞前安全检查2/3/4/5号。具体职责对照表见服务规范3.1原文。'},
{cat:'工作要求-送客卫生', icon:'💼', src:'服务规范 3.7', t:['送客','送客话术','卫生打扫','过站清洁','收拾客舱','送客标准','打扫卫生'],
q:'送客和客舱卫生打扫有什么要求？',
a:'送客（空中服务最后环节）：(1)为防旅客物品遗留机上，乘务长在旅客下机时进行提醒检查随身物品广播——<strong>A320两次</strong>、<strong>A321三次</strong>（《客舱广播手册》3.1.2）；(2)保持标准站姿、微笑、使用送客标准用语，如"再见，请走好/请慢走""请小心台阶""请带好您的全部手提行李"；滑行时提醒"请等到飞机完全停稳后再站起来"；(3)下客期间旅客需使用机上洗手间应开放满足要求；(4)3号位从最后一排送客至前服务间，4号位、8号位分别送客至21/31排、21排后开始卫生打扫/安保检查。<strong>卫生打扫</strong>：旅客下机完毕后立即进行、下一段登机前完成，原则清洁完成时间<strong>8分钟（A320）/9分钟（A321）</strong>；清理座椅区域（座椅、座椅口袋、小桌板）和地面；摆放座椅口袋物品顺序：出口座位旅客须知卡（仅出口座位）→安全须知卡（正面朝外）→清洁袋1个→其它刊物（A321的29F仅放安全须知卡和出口座位旅客须知卡）；安全带摆"一"字状、扶手全部放下、整理并更换污损的一次性头片。'},
{cat:'特殊航班-群体事件', icon:'💼', src:'服务规范 5.4', t:['群体性事件','旅客闹事','占机','旅客群体事件','安抚旅客','群体事件','闹事处置'],
q:'怎么防止和处置旅客群体性事件？',
a:'客舱乘务组工作程序：(1)<strong>收集征兆</strong>：收集机上旅客群体性事件征兆的信息，飞机推出之前反馈给地面商务和机长；推出后报告机长，机长通过ACARS告知AOC签派；(2)配合商务人员做好机上旅客的<strong>安抚和服务</strong>工作；(3)旅客<strong>占机</strong>时，视现场情况留下部分成员（<strong>不少于两人</strong>）处理客舱安全和服务工作，发生特情时组织旅客应急撤离。信息报告原则：注意核实信息的<strong>真实性和准确性</strong>；遵守<strong>果断决策处置、及时逐级上报</strong>的原则。'},
{cat:'特殊航班-包机', icon:'💼', src:'服务规范 5.2 包机航班', t:['包机','包机航班','包机服务','客舱布置','包机保障','机上布置'],
q:'包机航班怎么保障？',
a:'包机航班保障要点：(1)<strong>准备会</strong>：乘务长至生产派遣处领取客舱布置用品；提前组织召开乘务组准备会，<strong>至少比正常进场时间提前15分钟进场</strong>；确认证件、仪容仪表和精神状态；与组员确认航班性质、旅客性质、民族宗教习惯和禁忌并作提示，告知服务流程；组织参加飞行机组协同准备会。(2)<strong>客舱布置</strong>：按客舱装饰布置图执行，<strong>起飞前1小时完成</strong>；指定临时衣帽存放处（按旅客座位布局指定相应行李架区域，将衣物存放袋放入行李架）。(3)<strong>物品确认</strong>：乘务长按《包机航班餐食、机供品配备清单》与地面服务部飞机保障处书面确认机供品（核对运转箱数量及签封号码）；确认机组和旅客餐食配送；前、后舱内场乘务员清点食品、饮料、纪念品并整理食品车/饮料车/纪念品车、摆放洗手间卫生用品。(4)<strong>环境卫生</strong>：确认机上卫生达标并签字交接，客舱温度22-24℃、亮度适宜，打开登机音乐，检查客舱布置（宣传海报平整对称、装饰物粘贴牢固且表面无尖锐处）。(5)<strong>设备设施</strong>：检查应急设备、服务设备完好。'},
{cat:'尊享飞服务-特殊情况', icon:'💼', src:'服务规范 7.3 临时变更机型', t:['临时变更机型','更换机型','尊享飞第三排','机型保障','换飞机','机型变更','换机'],
q:'临时更换机型（如A321换A320）对尊享飞旅客怎么保障？',
a:'主要针对<strong>A321临时变更为A320</strong>时的保障：因换型导致尊享飞旅客人数超过<strong>12人</strong>时，地面服务部将其余尊享飞旅客保障在<strong>第三排</strong>。保障要求：(1)机型改变不影响旅客原有尊享飞权益（详见7.1.2）；(2)第三排尊享飞旅客仍按原要求服务；(3)尊享飞服务时<strong>无需拉上尊享飞门帘</strong>；(4)因换型致尊享飞人数超12人<strong>无需上报SQM系统</strong>，仅在风险沙盘工作流程管理中记录即可。补偿与投诉：原A321第三排尊享飞旅客被安排至A320第三排时，问候时增加话术告知"因计划调配临时更换飞机，尊享飞权益和服务不受影响，航班结束后可至春航APP或小程序在线客服处申报补偿"；解释后仍不满需投诉的可启用空地联动流程或填写意见卡，落地后交接上报。'},
{cat:'特殊旅客-重要旅客', icon:'💼', src:'服务规范 4.2 重要旅客', t:['重要旅客','VVIP','VIP','CIP','IP','附加服务旅客','要客','要客服务'],
q:'重要旅客分哪些等级（VVIP/VIP/CIP/IP）？出问题怎么上报？',
a:'重要旅客（4.2）等级与定义：(1)<strong>VVIP</strong>（国家政要级，VERY VERY IMPORTANT PERSON）：中共中央总书记、中央政治局常委/委员/候补委员，国家主席、副主席，全国人大委员长/副委员长，国务院总理、副总理、国务委员，全国政协主席/副主席，中央军委主席/副主席，最高人民检察院检察长、最高人民法院院长；外国国家元首、政府首脑、议会议长及副议长、联合国秘书长。(2)<strong>VIP</strong>（VERY IMPORTANT PERSON）与<strong>CIP</strong>（COMMERCIAL IMPORTANT PERSON）：公司级重要旅客，指对公司声誉、效益、发展影响较大的群体，由总裁办判定保障级别。(3)<strong>IP</strong>（部门级重要旅客，又称附加服务旅客）：与本部门业务发展密切相关、提供特定服务的旅客群体，信息通过SMP航前准备、智慧客舱查看，各载体信息不一致时以航班起飞前智慧客舱信息为依据（另有通知除外），按附加服务旅客信息提供姓氏尊称服务、餐食服务等。<strong>VVIP重特大突发事件报送</strong>：启动条件为运输保障出现旅客受伤、群体性事件、公司名誉品牌形象受重大影响等；乘务员应在事发后<strong>10分钟内</strong>致电服务管理部值班手机首报（时间、航班信息、旅客信息、事件起因性质、基本过程、涉及人数及处理措施），处置过程中续报，处置结束时终报（事件性质、处置结果、整改措施）。'},
{cat:'特殊旅客-集团客户', icon:'💼', src:'服务规范 4.13 集团客户', t:['集团客户','大客户','赠送水','纸杯水','集团客户服务','赠送饮品'],
q:'集团客户旅客怎么服务？',
a:'集团客户（4.13）指与春秋航空有效签约的集团客户。服务规范：乘务员查阅智慧客舱中集团客户旅客信息，在<strong>起飞前</strong>为集团客户旅客赠送<strong>纸杯水或机组水</strong>；如无法在起飞前完成，可在<strong>平飞后</strong>完成。如航班计划飞行时间在<strong>1小时以内</strong>，将赠送水放入旅客座椅口袋内。'},
{cat:'机上销售-机供品管理', icon:'💼', src:'服务规范 8.2 机上物品摆放标准', t:['机上物品摆放','摆放标准','延误纸杯','备份安全须知','机供品','物品摆放','摆放'],
q:'机上物品摆放标准是什么？',
a:'机上物品摆放按标准清单执行（8.2，分机型/前后舱），以A320型180飞机前舱（无储物柜）为例：101/102乘务员飞行包；107舱单、货单、GD单、旅客名单、特殊旅客交接单、餐食交接单、各类入境卡、海关申报单等、IPAD、点数器；108机组餐具、机组水果、配餐、手套；120乘务员箱包、杀虫剂、消毒用品、防鼠装置、备份菜单、备份安全须知、备份头片、备份香片；121机组使用机供品；122机组使用机供品及延误纸杯（150只）；123机组水；122/123后部保温箱。A320 186型、A321型与有储物柜机型编号略有差异（101延误纸杯150只等），执行时按本机型规定的摆放标准图执行，摆放位置与数量与本机型装载要求一致。'},
{cat:'机上销售-机供品管理', icon:'💼', src:'服务规范 8.6 不合格销售类机供品', t:['不合格机供品','临保期','过期食品','问题餐食','食品下架','临期食品','不合格食品'],
q:'发现不合格机供品（过期/变质食品）怎么处理？临保期怎么算？',
a:'不合格销售类机供品处理（8.6）：航班交接或执行航班时检查食品类产品，初步判定不合格无法销售的，将不合格产品信息记录在《春秋航空机供商品交接清单》中，并在配送系统中通过"修订"修改。<strong>食品类</strong>：(1)判定是否过期、发霉、腐败、有异物及与商品标签成份不符，一经发现及时停止销售；(2)按最小销售单位下架并记录；(3)记录须含航班号、航班日期、名称、不合格内容、数量，报告人注明原因、修改数量、签字确认；(4)<strong>临保期要求</strong>：保质期一年（含）以上不足两年的为45天，半年（含）以上不足一年30天，90天（含）以上不足半年20天，30天（含）以上不足90天10天，10天（含）以上不足30天2天，10天以下1天；发现临保商品已配上航班，单独区分存放不销售，航后回退机供品；外站无交接时单独存放并SQM报告；(5)回基地后交接销售单与不合格食品饮料；(6)过夜航班可航后自行销毁，并通过机上销售系统"问题餐食"模块反馈上传。<strong>非食品类</strong>：进行库存区分管理，不合格商品标注并分开存放。'},
{cat:'乘务长管理-飞行前准备', icon:'💼', src:'服务规范 9.2 飞行前准备', t:['乘务长准备','网上信息获取','航班携带物品','准备会','号位分配','乘务长工作','网上准备'],
q:'乘务长飞行前准备（网上信息/物品领取/准备会）有哪些要求？',
a:'乘务长飞行前准备（9.2）：<strong>网上信息获取</strong>：查看航班/组员信息，重点确认组员配置符合勤务派遣、飞行小时，提前做好号位分配——确保乘务组至少一名客舱乘务员年龄大于24周岁；A320/A321后舱乘务员飞行小时总和不低于500小时，A321的8号位乘务员必须有E标识，不符时乘务长有权调配号位；规定时间内完成网上准备并确认重要旅客信息；填写飞行记录本（签到时间、日期、飞机号、航班号、机组人员信息、预计起降时间、业务学习重点等）；学习安全和业务通告。<strong>航前物品领取</strong>（国内）：提前至勤务保障室领取IPAD、签封（按需），确认重要旅客相关物品交接，领取航班携带物品并在《航班携带物品交接单》签名（原则上不允许携带私人物品，特殊需部门经理同意；业务袋不超过A4纸大小、数量不多于3个，规格不符或信息不齐全乘务长有权拒收）；涉及更换飞行机组的确认领取后续航班任务书；外站有勤务保障室（沈阳、宁波、石家庄、深圳等）时监督组员酒测。国际航班另领门禁卡（仅浦东出港）、入出境登记表、机组健康申报表（按需）及台湾地区航线证件。<strong>准备会</strong>：检查组员仪容仪表（着装、发型、妆容、饰物）、已全部完成网上准备（未做网上准备的应通知乘务调度取消航班资格），并通过"春秋之家"确认组员完成健康自评。'},
{cat:'乘务长管理-电讯检疫', icon:'💼', src:'服务规范 9.8 电讯检疫', t:['电讯检疫','有疫申报','无疫申报','检疫','登机检疫','入境检疫','申报'],
q:'电讯检疫的有疫申报/无疫申报怎么执行？',
a:'电讯检疫（9.8）指入境航空器实行有疫申报和无疫申报两种办法，适用于上海虹桥、浦东国际机场。<strong>有疫申报</strong>：入境航空器发现以下情况需有疫申报——航行中发现传染病/疑似传染病，或发现呕吐、腹泻、发热、寒战、皮疹等症状人员，或病因不明的病人；人员死亡；发现死亡动物或来源不明活动物；发现医学媒介生物；航空器装载活动物（携带/托运宠物犬、猫除外）；发现用于携带感染性物质的容器破损；其他需向检验检疫机构申报的情况。客舱乘务员发现上述情况应<strong>第一时间报告机长</strong>，由机长申请有疫申报；实行有疫申报的航空器入境时，客舱乘务员向检疫官员提交总申报单、旅客名单、货物舱单、灭蚊证书（来自黄热病疫区）等；机场检疫部门收到报告后实施<strong>登机检疫，未获检疫官员许可不能打开舱门</strong>。<strong>无疫申报</strong>：未发现有疫情况则实行无疫申报，不实施登机检疫，到达后即可上下人员；总申报单、旅客名单在到达后30分钟内由地面商务送交指定地点。'},
{cat:'乘务长管理-军民合用机场', icon:'💼', src:'服务规范 9.9 军民合用机场', t:['军民合用机场','遮光板','禁止拍照','遮阳板','军民合用','军民合用航线','拍照限制'],
q:'执飞军民合用机场有什么特别要求？',
a:'军民合用机场（9.9）：遵义新舟、连云港、泉州、常州、潍坊、张家口、忻州、泸州、威海、库尔勒、喀什、和田、无锡、九江、宜宾、盐城、南充、德宏芒市、釜山金海、南宁吴圩等为军民合用机场，按军事保密要求对军用飞机及设备保密，<strong>机组和旅客禁止拍照</strong>。工作程序：乘务组在军民合用机场航班起降、滑行期间认真观察旅客，发现拍照及时制止并解释（注意方式方法避免投诉）；其中泉州、潍坊、张家口、忻州、威海、无锡、九江、遵义新舟、盐城、常州、德宏芒市、南宁吴圩机场在<strong>起飞和下降阶段需指导旅客关闭遮阳板</strong>。预录广播在旅客全部登机结束/关门安全示范广播播放前和下降安全检查广播结束后播放（内容见《客舱广播手册》）。注意事项：以机长通知为依据；无法确定是否需关闭遮光板可提前询问飞行机组；有要求不得打开遮光板时不播报含"打开遮光板"的安全检查广播词，采用人工广播提示；关键阶段发现旅客不配合可播放预录/人工广播个别提醒，多次提示仍不配合按《客舱乘务员手册》扰乱行为与"机闹"行为处置要求执行；实施舱门操作程序前需打开机门遮光板观察机外情况；乘务长航前准备会告知乘务员禁止对军民合用机场拍摄和对外讨论敏感信息。'},
{cat:'乘务长管理-运行资源', icon:'💼', src:'服务规范 9.10 航班运行时资源的获取', t:['乘务调度','加配餐食','机组餐','机组餐食','值班经理','临时过夜','机组餐标准','运行保障'],
q:'航班运行中遇到资源问题该找谁（乘务调度/值班经理）？机组餐怎么安排？',
a:'航班运行时资源的获取（9.10）：乘务组遇到以下情况由<strong>乘务长直接联系乘务调度</strong>：加配餐食（机组临时加餐等）、值勤期问题、机组车辆保障问题、临时过夜安排（住宿、用餐、车辆等）、过站休息安排。遇到以下情况由乘务长及时报告<strong>值班经理</strong>（值班经理及时上报AOC值班）：机械原因（长航线客舱服务设备损坏如马桶、APU问题导致客舱温度高）；旅客原因（旅客矛盾引发大范围不满、中止旅行导致大范围不满）；不正常航班（延误、备降、返航导致的旅客大范围不满）；机供品配备问题（外站机供品、销售产品、机组餐食配备不足可能引发舆情）。<strong>航班餐食计划性保障</strong>：机组签到时间在11:30-13:30、17:30-19:30范围且符合地面用餐条件的航班，机组人员在地面酒店用餐、机上不再配送机组餐食；因公司保障原因未能地面用餐的，航食保障时间虹桥1小时、浦东1.5小时、外站2小时，超过时间由乘务长直接联系乘调安排配餐，在此时间以内或外站无航食代理人保障的改用机上餐食；外站机组餐食标准早餐30元/人、午/晚餐50元/人、夜宵30元/人、其他时段点心餐30元/人。'},
{cat:'特殊旅客-总述', icon:'💼', src:'服务规范 4.1 概述', t:['特殊旅客概述','特殊旅客范围','特殊旅客服务总述','特殊旅客','特殊旅客服务','特殊旅客类型','特殊旅客服务大全'],
q:'《客舱服务规范》中特殊旅客服务包括哪些？',
a:'《客舱服务规范》第四章"特殊旅客服务"（4.1概述起）规定了各类特殊旅客的服务规范，主要包括：重要旅客（VVIP/VIP/CIP/IP）、婴儿旅客、无成人陪伴儿童、孕妇旅客、老年旅客、轮椅旅客、伤病旅客、残疾旅客、临时患病旅客、醉酒旅客、首乘旅客、携带客舱宠物旅客、集团客户等类型。各类型均有定义、载运/服务要求与话术（如首乘旅客"F"标识服务、宠物进客舱规定等），详见服务规范第四章各节。'},
{cat:'工作要求-总述', icon:'💼', src:'服务规范 2.1 概述', t:['职业形象概述','工作要求概述','服务规范第二章','职业形象','工作要求','职业形象标准','服务规范'],
q:'《客舱服务规范》对职业形象与工作要求有哪些内容？',
a:'《客舱服务规范》第二章"职业形象与工作要求"对乘务员职业精神面貌提出总体要求（2.1概述），并分别在后续章节给出具体标准：制服着装规范（2.2）、（职业形象其他细项）、妆容与指甲标准（2.4）、饰物佩戴标准（2.5）、仪态标准（站姿/坐姿/走姿，2.6）、飞行装具（2.8）等；第三章"工作要求"按航前准备、旅客登机、服务实施、送客卫生等各号位岗位职责（3.1）与流程（3.4-3.8）提出具体操作要求。'},
{cat:'服务话术-总述', icon:'💼', src:'服务规范 6.1 概述', t:['服务话术概述','服务技巧','话术总述','话术','服务用语','话术大全'],
q:'《客舱服务规范》中服务技巧与话术包括哪些？',
a:'《客舱服务规范》第六章"服务技巧话术"汇总了机上服务中的标准用语与处置话术，包括：特殊情况下标准解释话术（机组原因/机械故障/旅客原因三类，6.4）、销售与服务情境话术等，并对查验证件、加收费用、航延处置等场景规定了规范表述。机上销售相关合规话术与禁忌参照第七章机上销售及销售规范（如不得使用比价、绝对化、饥饿营销表述）。'},
{cat:'手册管理', icon:'💼', src:'服务规范 1.1-1.3 手册概述', t:['手册概述','适用范围','手册修订','手册分发','编制修订','概述','手册管理','手册使用'],
q:'《客舱服务规范》的概述、编制修订和分发控制？',
a:'《客舱服务规范》（服务规范 1.x）是客舱服务部机上服务工作的标准依据，规定了职业形象、工作要求、特殊旅客服务、特殊航班服务、服务技巧话术、尊享飞服务、机上销售管理及乘务长管理关键点等章节内容；手册的编制和修订由客舱服务部按公司手册管理规定组织，并明确适用范围；手册分发和控制遵循公司手册管理要求（电子版由手册持有部门负责，修订后需及时更新，手册持有人应使用现行有效版本）。'},
{cat:'乘务长管理-航前检查', icon:'💼', src:'服务规范 9.3 航前检查和准备', t:['航前检查','设备检查','应急灯光申请','餐食清点','机供品交接','检查准备','设备清单'],
q:'乘务长航前检查和准备（设备/餐食/环境）有哪些要求？',
a:'乘务长航前检查和准备（9.3）：<strong>设备检查</strong>：带队提前上机，第一时间按《客舱设备检查单》逐一检查个人号位应急设备的位置、数量及有效性并汇报（经停过站更换乘务组的也需检查）；除检查单项目外还需检查洗手液、机上门帘、演示包物品、垃圾箱盖板、烤箱烤架，发现问题及时报告/更换并填写CLB；检查应急灯光及撤离信号前须先向机长申请获同意（经停有旅客留在机上先广播提示防恐慌）；查阅CLB要求组员对故障修复情况复查确认；进行内话测试；通过FAP面板查看清、污水状况、按《航班加水量方案》确认清水量；巡视客舱通过抽查提问了解组员检查情况；尽快通知机务维修，无法修复及时报告机长并填写CLB。<strong>机供品、餐食管理</strong>：按单据清点餐食机供品，确保数量、种类和保质期，与机供品交接、缺漏协调解决（餐食问题由乘务长与乘调/机供品/外站站长联系，外站无站长联系航站商务或地服代理人，餐食标准早餐30/午餐50/晚餐50/夜宵30/点心餐30元每人）；确认机供品种类数量与配备单一致；关注加机组人员配餐、网订餐食、尊享飞餐食配餐；提醒做好餐食冷藏、四号位按航线加配机供品；检查机供品签封完好、签封号与配备单一致；餐食机供品问题影响服务时向机长汇报、向值班经理请示，不影响上客、联系加配更换，未能及时解决向旅客致歉并快速补救、拍照取证、记录在风险沙盘并上报SQM；乘务长亲自签字确认机组配餐交接单并注明接收时间。<strong>客舱环境</strong>：毛毯靠垫头片等用品包装外观完好、干净整洁、无异味。'},
{cat:'乘务长管理-登机送客', icon:'💼', src:'服务规范 9.4 旅客登机---送客', t:['迎客管理','关机门前','升级手提行李','携带物品交接单','送客与安保检查','迎客','送客','登机管理'],
q:'乘务长在登机（迎客）和送客阶段管理哪些事项？',
a:'乘务长旅客登机—送客（9.4）：<strong>迎客管理</strong>：带领乘务组热情迎客、掌握节奏、营造温馨氛围；及时组织完成重要旅客、尊享飞旅客及特殊旅客的服务与交接；检查《航班携带物品交接单》信息填写齐全、物品规格符合规定、包装盖有安检章（无安检章要求送交人开包装检查）；监控乘务员迎客状态和客舱登机秩序、确保有效疏通过道；规范灵活回答旅客问询，及时处理座位重号、超大行李、餐食未到等特殊情况（重点关注关机门时间）；<strong>升级手提行李最大可售数量</strong>：A320型广深始发航线12个（不含尊享飞）、A320型非广深航线14个、A321型9个（国际航线暂未恢复销售）；遇醉酒旅客或携带危险品可疑旅客等问题及时向机长汇报由机长决定是否承载，同时报告值班经理及SQM（原则：控制事态、尽早解决、不影响正点上客起飞）；对登机后下机中止旅行的旅客应仔细查明下机原因、防止随身物品和托运行李遗留机上。<strong>关机门前管理</strong>：进行"关门前安全提示"广播避免错载旅客；确认责任乘务员完成出口座位评估（不符合要求或要求调换座位的及时更换、确保飞行全程人员一致）；关机门前手提行李确认广播，行李架摆放原则大不压小、重不压轻、竖直并列、有序排放，严防行李滑落砸伤。送客与安保检查按9.4.10（参3.7送客要求）。'},
{cat:'乘务长管理-登机送客', icon:'💼', src:'服务规范 9.4.1 乘务长关机门流程', t:['关机门','关舱门','舱门管理','离机确认','航班准点','下机处理'],
q:'乘务长关机门（关舱门）前要完成哪些确认？',
a:'乘务长关机门前应做好以下确认（9.4）：(1)确认旅客人数与登机情况，逐项核对是否存在多/少旅客、托运行李是否都上机；(2)确认出口座位旅客评估完成且符合要求，需调换的已调整到位；(3)进行"关门前安全提示"广播，防止错载旅客；(4)确认责任乘务员已完成手提行李确认，行李架摆放规范、无滑落风险；(5)与机长、地面协调关机门时机，兼顾正点；(6)对登机后下机中止旅行的旅客，查明离机原因并防止物品遗留。'},
{cat:'乘务长管理-登机送客', icon:'💼', src:'服务规范 9.4.2 乘务长送客流程', t:['送客流程','下客管理','错峰离机','旅客离机','列队送客','送客话术'],
q:'乘务长在送客（下客）阶段要管理哪些事项？',
a:'乘务长送客阶段（9.4）要点：(1)组织乘务组规范站姿、列队送客，使用标准送客话术并提醒带好随身行李；(2)通过广播提示旅客检查随身物品、防止机上遗留（A320两次/A321三次）；(3)协调下客节奏，引导特殊旅客（轮椅、老年、带婴儿等）错峰或优先下机；(4)旅客下机期间如需使用机上洗手间应开放满足；(5)下客完成后组织客舱卫生打扫与安保检查，及时回收并交接单据物品。'},
{cat:'特殊旅客-总述', icon:'💼', src:'服务规范 4.1.1 特殊旅客服务通则', t:['特殊旅客通则','载运限制','特殊旅客申请','机上照顾','服务原则'],
q:'特殊旅客服务有哪些通用原则和载运限制？',
a:'特殊旅客服务的通用要点（4.1）：(1)提前核实旅客运输要求和所需服务，必要时索要相关通知单或证明并签字确认；(2)座位安排尽量便于乘务员照顾，一般不建议靠近应急出口等不安全位置；(3)机上主动关照、及时回应呼唤铃，按需提供帮助，帮助前先征求旅客意见；(4)起飞前、下降前等关键阶段加强对特殊旅客的关注与提醒；(5)与地面做好乘机信息与服务交接。凡涉及不适宜承运的情形（如不在承运范围的伤病、婴幼儿不足月龄等）应按承运规定办理，细节按公司现行相关规定执行。'},
{cat:'乘客需求问答', icon:'💼', src:'服务规范 2.3.1 发型细节', t:['发型细节','女乘发型','男乘发型','染发','发型检查','盘发'],
q:'乘务员发型检查的重点和常见疑问有哪些？',
a:'发型检查重点（结合2.3/2.4）：(1)发色——女乘焗发只能单一黑色或单一深棕色、男乘只能单一黑色，禁止挑染；(2)清洁整齐——无碎发、无头皮屑，梳理整齐；(3)不建议使用假发套，发量少可适当用假发片但不能有痕迹；(4)男乘发型保持利落、前发不遮眉、侧发不盖耳、后发不触衣领为宜；(5)长发的女乘宜盘发或扎起，避免散落遮挡面容。具体造型要求按公司现行相关规定执行。'},
{cat:'职业形象-妆容', icon:'💼', src:'服务规范 2.4.1 妆容细节', t:['补妆','补妆要求','口红颜色','妆面保持','乘务员形象'],
q:'航班中乘务员如何保持妆容和形象？',
a:'航班中保持妆容与形象要点（结合2.4）：(1)航班中及时补妆，保持面部不油亮、妆容完整，口红、腮红等不脱妆明显；(2)妆容颜色同属一套体系，禁止混搭与仅涂唇彩；(3)不使用浓重刺鼻的香水；(4)供餐服务、迎送客等环节保持整洁，头发不凌乱、饰物不松脱；(5)用餐、使用洗手间后及时检查整理仪容。具体标准按公司现行相关规定执行。'},
{cat:'职业形象-饰物', icon:'💼', src:'服务规范 2.5.1 饰物细节', t:['黑色手表','表带要求','珍珠耳钉','戒指宽度','饰品标准'],
q:'乘务员手表和饰物的日常维护有哪些注意？',
a:'饰物维护注意（结合2.5）：(1)手表表盘纯色无卡通/照片图案，表带钢制限金银黑、皮质限黑白灰棕；(2)智能手表签到时电量不低于80%，飞行全程调飞行模式并关闭蓝牙与无线连接，不设密码须直接显示时间；(3)戒指仅限金银、宽不超5毫米，只戴中指或无名指；(4)耳钉仅限白色珍珠款、直径不超8mm，男乘禁止佩戴耳钉耳环；(5)勤检查饰物是否松动、避免工作或清洁时丢失损坏。'},
{cat:'职业形象-仪态行为', icon:'💼', src:'服务规范 2.6.1 仪态细节', t:['礼貌动作','指引动作','递物姿势','双手递送','行为举止'],
q:'客舱服务中有哪些礼仪动作和递送姿势要求？',
a:'礼仪动作要点（结合2.6/6.2）：(1)递送物品尽量正面面对旅客、双手或单手规范递交，避免手对手硬塞；(2)尖利物品刃口朝自身、柄部递向旅客；(3)指引时五指并拢、手心朝上，方向与身体一致；(4)递送茶杯时扶杯底部或杯把，避免触碰杯沿；(5)交谈时目光正视、面带微笑，音量语速适中。具体规范按公司现行相关规定执行。'},
{cat:'工作要求-岗位职责', icon:'💼', src:'服务规范 3.1.1 岗位职责细节', t:['3号位','5号位','6号位','8号位','号位设置','职责分工'],
q:'3号位、5/6号位、8号位等号位职责有哪些？',
a:'（以A320/A321为例）3号位：平飞后协助4号位准备销售商品、发放报刊、参与客舱服务与卫生保障；5/6号位：协助4号位准备机上销售商品，参与迎客、送客、巡检与卫生清理；8号位（A321，需有E标识）：负责后舱相应区域的服务与舱门操作、送客与安保检查配合等。各机型号位设置与星级不同，职责按服务规范3.1号位职责对照表并结合公司现行相关规定执行。'},
{cat:'工作要求-航前准备', icon:'💼', src:'服务规范 3.2.1 航前卫生与接口交接', t:['航前接口','交接班','防护用品','机上动力','外场保障'],
q:'航班交接与航前准备中，前班/外场接口需要注意什么？',
a:'航前接口与交接要点（结合3.2）：(1)与前班次或外站保障对接机组用具、机供品、餐食与单据，逐项核对并签字；(2)确认机上动力、服务设备（烤箱、烧水器、洗手间等）可由机上电源正常工作，必要时地面申请接驳；(3)补充防护与服务用品，检查数量与保质期；(4)确认客舱卫生与前舱机用品状态达标后签字交接；(5)发现缺漏或异常及时报乘务长协调解决，并记录。细节按公司现行相关规定执行。'},
{cat:'工作要求-航前准备', icon:'💼', src:'服务规范 3.2.3 儿童座椅与安全设备', t:['儿童座椅','婴儿摇篮','安全带挂钩','设备检查','机上安全'],
q:'航前准备中儿童座椅、安全带等专用设备如何检查摆放？',
a:'航前检查专用设备要点（结合3.2/4.4）：(1)对照检查单确认婴儿摇篮、儿童安全座椅、安全带延长带等是否齐全完好；(2)固定于规定位置并核对有效期，装设后检查结实可靠；(3)检查安全带金属扣与插销功能正常，座椅安全带"一"字摆放上客前复位；(4)告知携带儿童旅客正确使用专用设备的方法；(5)任何缺失或故障及时报告并处理。具体清单按公司现行相关规定执行。'},
{cat:'工作要求-迎客', icon:'💼', src:'服务规范 3.3.1 迎客须知与广播', t:['迎客广播','登机音乐','登机秩序','安全提示','上客保障'],
q:'旅客登机时迎客阶段要注意哪些广播与秩序？',
a:'迎客阶段要点（结合3.3）：(1)上客前播放登机音乐、调节好登机口广播"登机广播"；(2)规范有序迎客、及时疏通过道，避免拥挤堵塞；(3)对特殊旅客与重要旅客做好优先安排与引导；(4)遇携带超大行李、座位问题等及时分流处理、保障上客节奏；(5)关注关机门时间，合理引导登机进度。具体话术与流程按公司现行相关规定执行。'},
{cat:'工作要求-迎客', icon:'💼', src:'服务规范 3.3.5 登机秩序与占机处理', t:['登机秩序','登机占座','座位纠纷','秩序维护','上客保障'],
q:'迎客时遇到座位重叠或登机秩序问题怎么处理？',
a:'登机秩序处理（结合3.3）：(1)先礼貌核实座位号，必要时靠机供系统或登机牌确认，避免与旅客争执；(2)超售、换座等情况发生的座位重叠，及时协调引导并安抚旅客；(3)遇旅客间座位纠纷，将其隔离、分别安抚，乘务长协调处理；(4)保持数客准确、舱门人数与舱单一致；(5)影响正点或关舱门的及时上报。细节按公司现行相关规定执行。'},
{cat:'工作要求-客舱卫生', icon:'💼', src:'服务规范 3.2.2.2 洗手间补充整理', t:['洗手间整理','增加用品','卷纸','垃圾袋','途中清洁'],
q:'航班中洗手间清理补充和垃圾桶处理怎么安排？',
a:'洗手间途中管理（结合3.2.2.1）：(1)定期查看洗手间台面、地面是否水迹垃圾，及时清理补充，卷纸抽纸保持齐全；(2)卷纸前段叠三角形、抽纸拉出第一张便于拿取；(3)垃圾箱及时倾倒套袋，保持可视容量充足；(4)香珠等清新用品到期及时更换；(5)下降前收紧开机门规定下客后清理。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-轮椅旅客', icon:'💼', src:'服务规范 4.3.1 轮椅旅客登机', t:['轮椅登机','特殊服务通知单','地面协调','轮椅交接','登机车'],
q:'轮椅旅客登机前乘务组要和地面做哪些协调对接？',
a:'轮椅旅客登机对接（结合4.3.3）：(1)上客前从地面索取《旅客特殊服务通知单》确认服务类型（WCHR/WCHS/WCHC）并签字；(2)按约定安排其先于其他旅客登机并引导至合适座位；(3)提前与地面确认升降设备、客梯车、廊桥等登机保障，避免弄湿弄滑；(4)确认撤除轮椅等设备与随身行李的取放；(5)落地前提醒机长通知地面备好轮椅、主动对接地面人员完成交接签字。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-婴儿', icon:'💼', src:'服务规范 4.4.1 婴儿安全带与护理', t:['婴儿护理','奶瓶','奶粉','空座位','婴儿安全'],
q:'机上为婴儿提供冲奶、护理服务有哪些注意？',
a:'婴儿护理注意（结合4.4）：(1)主动询问是否需冲奶，免费提供热水，水温以适宜冲奶温度为佳；(2)冲泡奶粉前确认奶瓶清洁，示范安全喂奶；(3)告知旅客婴儿使用专用婴儿安全带并系好，切勿将婴儿直接系在大人安全带内；(4)主动介绍婴儿护理板洗手间、呼唤铃等设施；(5)提醒不要在飞行中让婴儿独自坐于小桌板上。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-UM', icon:'💼', src:'服务规范 4.5.1 无人陪儿童安全', t:['UM安全','UM交接','接机人','降落后','无人陪服务'],
q:'无人陪伴儿童（UM）落地后的交接怎么办？',
a:'UM落地交接（结合4.5）：(1)下降前再次确认UM随身行李、单据及胸前"无人陪专用袋"；(2)落地后引导UM优先或错峰下机，由乘务组与地面/接机人当面交接，核对接送人身份、单据与随身物品；(3)无人接时保持与地面联系直至妥善交接到监护人或接机代表；(4)记录"空中生活情况"含餐食、饮料发放情况供接机人了解；(5)不将UM单独留在机上或机坪。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-孕妇', icon:'💼', src:'服务规范 4.6.1 孕妇旅客保障', t:['孕妇餐食','孕妇健康','空乘关照','温水服务','机上关怀'],
q:'孕妇旅客机上餐食和健康关照有哪些要点？',
a:'孕妇旅客保障（结合4.6）：(1)按需提供温水、清淡饮食，避免刺激性饮品；(2)适时提醒通风器使用，避免长时间憋闷，建议适量起身活动；(3)加强巡视、及时回应呼唤铃，观察气色与不适，必要时报告乘务长并经同意寻求医疗协助；(4)下降时提醒错峰离机，主动协助提拿行李、留意脚下；(5)如出现腹痛、见红等异常立即按应急处置和报告程序处理。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-老年旅客', icon:'💼', src:'服务规范 4.7.1 老年旅客关怀', t:['老年关怀','长者服务','热水','出入境填单','乘机陪同'],
q:'无陪老年旅客和普通老年旅客服务有哪些注意？',
a:'老年旅客服务补充（结合4.7）：(1)普通老年旅客主动关照冷暖、及时供热水、协助如厕与摆放行李；(2)无陪老年旅客重点确认接送人信息、全程重点关照并按约定做好地面交接；(3)下降前提醒去洗手间、带好随身物品并安排错峰离机；(4)帮助填写海关/出入境单据时可提供必要协助；(5)对行动不便或因健康原因不宜出行的按承运规定沟通。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-伤病残疾', icon:'💼', src:'服务规范 4.8.1 伤病残疾旅客协助', t:['协助如厕','协助用机','协助服务','身体不适','病情上报'],
q:'伤病/残疾旅客机上突发不适怎么处置？',
a:'机上突发不适处置（结合4.8）：(1)保持冷静，先安抚并侧向其头部、开放气道；(2)立即报告乘务长，乘务长组织客舱急救并按需广播求助医务专业人员；(3)不使用成文的医学判断，仅提供基本帮助与照料；(4)条件具备时联系机长与地面医疗支援，做好下降接续记录；(5)任何涉及旅客健康安全的事件按要求上报。具体急救程序按《客舱乘务员手册》及公司现行规定执行。'},
{cat:'特殊旅客-担架用氧', icon:'💼', src:'服务规范 4.9.1 担架用氧保障', t:['氧气供应','担架安置','特殊布置','医疗设备','识别风险'],
q:'用氧旅客/担架旅客的承运条件与机上保障有哪些？',
a:'（结合4.9）装载与保障要点：(1)该类旅客承运须满足承运与适航要求并经公司批准，提前获取相关证明；(2)担架旅客需占用座区并可能拆除座椅等特殊布置，由机组按程序协调安置；(3)用氧旅客机上用氧符合承运规定，用氧期间机组加强观察与配合；(4)途中加强关注，出现异常立即报告机长并按程序寻求医疗协助；(5)降落与地面衔接提前安排。细节按公司特种运输现行规定执行。'},
{cat:'特殊旅客-盲人旅客', icon:'💼', src:'服务规范 4.10.1 盲人引领', t:['引领就座','引导上机','感官提示','他人口头协助','残疾人服务'],
q:'盲人旅客需要行走、就座时怎么配合协助？',
a:'盲人旅客协助（结合4.10）：(1)上机时走在旅客左前方半步距离，提示脚下台阶、门槛等障碍；(2)轻扶其手臂或让旅客扶住乘务员手臂，速度放慢；(3)坐定后口头介绍附近设施位置并让其可触及（如安全带插扣、呼唤铃）；(4)提供帮助前先说明意图并征求同意；(5)落地前主动引导，交接地乘务员。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-聋哑旅客', icon:'💼', src:'服务规范 4.11.1 聋哑沟通', t:['书写沟通','手势沟通','脑后有感知','听力障碍','沟通协助'],
q:'聋哑旅客需求表达不清时怎么确认需求？',
a:'聋哑旅客沟通（结合4.11）：(1)准备纸笔，通过书写简要问题确认需求，一次只问一个问题；(2)配合手势与口型、放慢语速、吐字清晰；(3)在需要时用图示（如安全带系法、洗手间位置）帮助理解；(4)确认理解后再操作，避免误解；(5)情急时寻求其他旅客以手语协助或请地面人员接应。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-首乘旅客', icon:'💼', src:'服务规范 4.14.1 首乘介绍', t:['首乘讲解','禁烟提示','安全演示','食遍流程','乘机指引'],
q:'首乘旅客首次乘机常问哪些问题？怎么回应？',
a:'首乘常见疑问回应（结合4.14）：(1)是否可开启手机等电子产品——按飞行模式规定引导；(2)洗手间位置与使用方法——指引并介绍；(3)是否提供餐食——结合航线与销售规范说明；(4)颠簸感——解释正常并提醒系好安全带；(5)下机拿行李——告知按序离机及随身物品提醒。对无法当场答复的转告乘务长或地面。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-客舱宠物', icon:'💼', src:'服务规范 4.15.1 宠物运输细节', t:['宠物箱','宠物座椅套','宠物锁扣','宠物过敏','宠物低飞'],
q:'宠物箱在机上固定和离机时有哪些注意？',
a:'宠物进客舱细节（结合4.15）：(1)固定时纵向绑带从椅下穿过、勿压救生衣与座椅垫，两人配合并检查锁扣牢固；(2)全程提醒旅客勿打开锁扣将宠物放出、勿机上喂食饮水，下机前不解绑；(3)对宠物毛发过敏旅客调整座位或提供口罩；(4)落地后回收绑带放回原位、安排宠物旅客最后下机；(5)拒绝同乘时先调座、仍拒绝则携带宠物旅客办免费退改签。细节按公司现行相关规定执行。'},
{cat:'特殊航班-重要旅客', icon:'💼', src:'服务规范 5.1.1 重要旅客餐食', t:['VIP餐食','要客餐食','餐食配备','优先配餐','餐食确认'],
q:'重要旅客的餐食配备和服务怎么安排？',
a:'重要旅客餐食（结合5.1）：(1)2号位按《重要旅客餐食、机供品配备标准》清点并报乘务长复核；(2)按旅客偏好与习惯提供，尊重民族宗教禁忌；(3)供餐时间合理安排，避免打扰休息；(4)用餐时关注及时续加水饮；(5)餐食与配餐数量不符及时协调解决。细节按公司现行相关规定执行。'},
{cat:'特殊航班-包机', icon:'💼', src:'服务规范 5.2.1 包机特殊旅客', t:['包机旅客','包机宗教','包机餐食','包机安全','包机保障'],
q:'包机航班上不同旅客群体和特殊需求怎么协调？',
a:'包机服务协调（结合5.2）：(1)准备会确认航班性质、旅客性质、民族宗教习惯和禁忌并作提示；(2)按需准备相应餐食与饮品、避开禁忌；(3)客舱布置兼顾美观与安全，装饰粘贴牢固；(4)加强秩序维护与安保检查，确保机上安全；(5)特殊需要及时与地面/领队沟通协调。细节按公司现行相关规定执行。'},
{cat:'特殊航班-群体事件', icon:'💼', src:'服务规范 5.4.1 群体事件处置', t:['群体事件处置','逐级上报','AOC','地面商务','应急处置'],
q:'群体性事件处置中信息上报和配合配合分工怎么落实？',
a:'（结合5.4）处置分工与上报：(1)收集征兆并按要求在飞机推出前反馈地面商务、机长，推出后报告机长并由机长经ACARS告知AOC签派；(2)配合商务安抚和服务；(3)占机时留下不少于两人处理客舱安全与服务；(4)信息上报核实真实准确、逐级及时；(5)任何人不得擅自发布对外口径。细节按公司现行相关规定执行。'},
{cat:'特殊航班-超售', icon:'💼', src:'服务规范 5.5.1 超售改签', t:['超售改签','自愿改签','改签补偿','拉减给赔','超售处理'],
q:'超售改签和自愿改乘怎么引导旅客办理？',
a:'超售自愿改乘引导（结合5.5）：(1)向旅客说明超售情况与补偿方案，用语诚恳不误导；(2)优先寻找自愿者改签后续航班并说明补偿标准（延迟2小时以下200元、2-4小时(不含)400元、4小时(含)以上600元）；(3)不足时按既定拉减顺序执行并做好安置；(4)改签信息及时录入系统、跟进后续航班保障；(5)不向持公务免票、员工或宾客优惠票旅客提供现金赔偿。细节按公司现行相关规定执行。'},
{cat:'服务话术-服务技巧', icon:'💼', src:'服务规范 6.2.1 服务效率', t:['服务效率','同时兼顾','同步服务','排队应对','服务衔接'],
q:'客舱服务高峰时段（如同时多个呼唤铃）怎么安排提高效率？',
a:'高峰时段效率（结合6.2）：(1)合理规划服务动线、按区域分头响应，号位之间配合不重复来回；(2)托盘与餐车精确装载控制数量、及时补货；(3)同时服务的旅客按启发顺序自然衔接、用点头或简短回应安抚等待；(4)关注重点（热饮限量、颠簸暂停等）优先保障安全；(5)服务间隙快速整理归位下一轮用品。细节按公司现行相关规定执行。'},
{cat:'服务话术-标准话术', icon:'💼', src:'服务规范 6.3.1 投诉话术细节', t:['意见处理','补救服务','反馈跟进','投诉安抚','售后回应'],
q:'旅客意见/投诉的反馈、补救和跟进怎么做完整？',
a:'投诉意见处理闭环（结合6.3）：(1)受理环节认真记录时间、诉求与承诺事项；(2)能当场补救的及时补救并致歉；(3)无法当场解决的明确处理时限与渠道并转交乘务长/地面；(4)后续跟进确认处理结果，必要时回访；(5)将典型问题按流程反馈以供改进。细节按公司现行相关规定执行。'},
{cat:'服务话术-特殊情况', icon:'💼', src:'服务规范 6.4.1 备降返航话术', t:['备降话术','返航话术','无行李话术','落地话术','航班变更话术'],
q:'航班备降、返航等情况怎么向旅客说明解释？',
a:'备降返航解释（结合6.4）：(1)备降——播报因天气/油量/其他原因备降，说明目的、安排与后续；(2)返航——解释返航原因、返航目的地与落地安排，安抚情绪；(3)更新动态、稳定旅客，不擅自承诺补偿；(4)落地前期做好接站与协助准备；(5)统一口径、不展开内部信息。细节按公司现行相关规定执行。'},
{cat:'服务话术-禁忌话术', icon:'💼', src:'服务规范 6.5.1 违禁表述', t:['违禁词','销售违禁','严禁表述','统一说法','口径一致'],
q:'会遇到哪些易引发投诉的违禁表达需要避免？',
a:'（结合6.5）避免的违禁表达：(1)判断、绝对化、攀比性用语（如"最""保证""唯一"）；(2)公开质疑航班原因或他人（如说飞机坏了等危险表达）；(3)与公司口径不一致的安慰与承诺；(4)将其它部门、旅客归责的表达；(5)涉及安全和保密的内部信息。遇无法确定如何表达的情形改用统一、稳妥的说法并按公司现行规定处理。'},
{cat:'尊享飞服务', icon:'💼', src:'服务规范 7.1.1 尊享飞权益细节', t:['尊享飞权益','尊享飞行李','尊享飞值机','尊享飞餐饮','尊享飞休息'],
q:'尊享飞在值机、行李和餐食上有哪些具体权益保障？',
a:'（结合7.1）具体保障：(1)值机——VIP值机柜台和优先登机（仅限虹桥/浦东/石家庄/沈阳出港，按运行确认）；(2)行李——尊享飞享30KG免费行李额，手提升级限1件10KG且尺寸20*40*55cm内；(3)餐食——餐点时间提供正餐/点心餐；(4)座位——尊享前舱座位与多20%-40%腿部空间；(5)服务——姓氏服务等全流程温馨服务。实际保障与旅客购票订单及各站安排保持一致，如有出入及时协调解决。'},
{cat:'尊享飞服务-流程', icon:'💼', src:'服务规范 7.2.1 尊享飞迎客细节', t:['尊享飞迎客','尊享飞登机','尊享飞引导','蹲跪式','尊享飞话术'],
q:'尊享飞旅客登机时的迎客引导有哪些细节？',
a:'（结合7.2）迎客细节：(1)登机前确认环境与机供品，获取旅客名单并全部上客后刷新；(2)主动问候、提供姓氏服务、引导入座；(3)持IPAD对照名单确认，自我介绍表达欢迎，介绍时采用<strong>蹲跪式服务</strong>；(4)核对换座信息；(5)介绍尊享飞服务内容，无餐食供应提供矿泉水和湿纸巾。细节按公司现行相关规定执行。'},
{cat:'尊享飞服务-特殊情况', icon:'💼', src:'服务规范 7.3.1 尊享飞换型沟通', t:['换型补偿','尊享飞投诉','尊享飞延误区','在线客服','申报补偿'],
q:'尊享飞旅客因换型产生不满或投诉怎么处理？',
a:'（结合7.3）处理要点：(1)换型问候话术主动告知"因计划调配临时更换飞机，尊享飞权益和服务不受影响"；(2)提示可在航班结束后至春航APP或小程序在线客服申报补偿；(3)解释后仍不满的可启用空地联动流程或填写意见卡；(4)落地后按规定交接上报；(5)处置全程口径统一、态度诚恳。细节按公司现行相关规定执行。'},
{cat:'机上销售-免税品', icon:'💼', src:'服务规范 8.1.1 免税品销售细节', t:['免税酒类','免税烟','限量规定','海关限量','销售话术'],
q:'机上免税烟酒销售的限量提示和话术要点？',
a:'（结合8.1）要点：(1)香烟整条销售、不拆卖，销售时计算数量避免超出入境限额；(2)购买前提醒旅客注意入境地/出境地海关对烟酒的数量规定；(3)说明商品不接受退换货；(4)话术上以建议口吻提醒、不施压不催促；(5)若旅客现场酒驾等特殊情形做好适当提醒。细节按公司现行相关规定执行。'},
{cat:'机上销售-机供品管理', icon:'💼', src:'服务规范 8.2.1 物品交接', t:['机供品交接','单据审核','入库出库','交接明确','盘库'],
q:'机供品航前航后交接和账实核对怎么操作？',
a:'（结合8.2/8.3）交接要点：(1)航前按《机供商品交接清单》逐项清点确认数量、种类、保质期；(2)航后对销售剩余、退换缺损各环节核对并更新配送系统；(3)四联单规范填写、双方签字；(4)处理退、换、缺、损在系统以"修订"记录并注明原因；(5)分类收纳、账实一致，发现差异及时核实追究。细节按公司现行相关规定执行。'},
{cat:'机上销售-机供品', icon:'💼', src:'服务规范 8.3.1 四联单', t:['四联单','清点记录','签字交接','单据管理','机供品台账'],
q:'机供品四联单怎么填写和使用？',
a:'（结合8.3）四联单填写：(1)填写机组、航段、交接地点、数量等基本栏清楚完整；(2)数字改写处当面更正、双方签字；(3)航前出发联、航后交接联分别用途分明、不混用；(4)乘务长复核签字；(5)航后按机供品配送系统要求归档上交。细节按公司现行相关规定执行。'},
{cat:'机上销售-收款', icon:'💼', src:'服务规范 8.4.1 收款话术', t:['收款话术','找零话术','发票话术','销售话术','扫码话术'],
q:'机上销售收款有哪些规范话术和动作口诀？',
a:'（结合8.4）收款话术与动作：(1)现金收款当场唱票、及时找零、核验真伪；(2)外币按当月汇率表、不收硬币、找零经同意换人民币；(3)二维码收款引导扫码购物广播；(4)需要发票告知公众号"春秋航空绿翼商城—机上订单—输入手机号—查询—申请开票"；(5)避免催促、重复收款，坚持"一单一收"。细节按公司现行相关规定执行。'},
{cat:'机上销售-退餐退款', icon:'💼', src:'服务规范 8.5.1 退款单据', t:['退款单据','X产品未享用','退款流程','航延退款','退款时限'],
q:'X产品未享用确认单的填写和退款时限怎么掌握？',
a:'（结合8.5）确认单与退款：(1)因公司原因延误超过4小时旅客退餐，请旅客确认后由乘务员在机上销售系统填写《X产品未享用-旅客确认单》；(2)告知拨打公司服务热线021-95524申请退款并记录4号位与乘务长填写单据；(3)非常温餐食（提前预订）航班延误3小时以上且未食用方可退款；(4)团队餐由旅行社支付、不可单独退订按地面规则处理；(5)及时在系统提交、跟进退款进度。细节按公司现行相关规定执行。'},
{cat:'机上销售-机供品管理', icon:'💼', src:'服务规范 8.6.1 临保期计算', t:['临保期','临保天数','保质期计算','临期审批','临期处理'],
q:'不同保质期的商品临保期天数怎么对应？',
a:'（结合8.6）临保期天数：保质期一年（含）以上不足两年为45天；半年（含）以上不足一年30天；90天（含）以上不足半年20天；30天（含）以上不足90天10天；10天（含）以上不足30天2天；10天以下1天。发现临保商品已配上航班则单独区分存放不销售、航后回退机供品；外站无交接时单独存放并SQM报告。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-飞行前准备', icon:'💼', src:'服务规范 9.2.1 准备会检查', t:['准备会检查','仪容检查','网上准备','健康自评','组员检查'],
q:'乘务长准备会对组员要检查确认哪些事项？',
a:'（结合9.2）准备会检查：(1)逐一确认组员仪容仪表（着装、发型、妆容、饰物）符合要求；(2)确认全部完成网上准备，未做的应通知乘务调度取消航班资格；(3)通过"春秋之家"确认组员完成健康自评；(4)传达重要旅客、特殊旅客与航班保障要求；(5)分工号位、明确责任并回答组员疑问。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-航前检查', icon:'💼', src:'服务规范 9.3.1 应急设备', t:['应急设备','撤离设备','救生衣','灭火瓶','氧气瓶','检查确认'],
q:'航前检查中应急设备和撤离信号要确认什么？',
a:'（结合9.3）应急设备检查：(1)按《客舱设备检查单》逐一确认应急设备的位置、数量与有效性并汇报；(2)检查救生衣、灭火瓶、氧气瓶、急救包等完好且压力/数量符合要求；(3)检查应急灯光及撤离信号前先征得机长同意，经停有旅客先广播提示；(4)确认设备舱盖完好、便于取用；(5)发现问题及时报告/更换并填写CLB。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-登机送客', icon:'💼', src:'服务规范 9.4.17 迎送客突发事件', t:['迎送客事件','登机突发','座位重号','超大行李','托运反馈'],
q:'迎客阶段遇到座位重号、超大行李等突发怎么处理？',
a:'（结合9.4）迎客突发处理：(1)座位重号——礼貌核实登机牌/系统后协调换座、安抚旅客；(2)超大行李——按客舱行李规定分流到货舱或要求托运，避免堵塞影响安全；(3)对登机后下机中止旅客查清原因、防物品遗留；(4)醉酒或携危险品可疑旅客及时报告机长并按其决定处理；(5)控制事态、不影响正点并同步上报。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-航后讲评', icon:'💼', src:'服务规范 9.5.1 讲评细节', t:['讲评重点','绩效沟通','事件上报','讲评方式','奖惩沟通'],
q:'乘务长如何做好绩效沟通和讲评方式技巧？',
a:'（结合9.5）讲评技巧：(1)以正向激励为主、先肯定后改进建议；(2)客观具体、对事不对人；(3)对违规组员及时纠偏并做好后续跟踪；(4)重大/群体事件及时上报、不对外发表；(5)讲评记录存档作为绩效依据。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-国际航班取消', icon:'💼', src:'服务规范 9.6.1 机组手续', t:['机组出关','注销手续','出境手续','边防','航班变更'],
q:'国际航班变更时机组出关手续的常见情形有哪些？',
a:'（结合9.6）常见情形：(1)国际航班取消——返国际出发大厅出入境管理处办注销后从该处出关；(2)国际临时改另一国际航班——重新办边检手续；(3)国际/地区与国内临时对换——出境员工通道先办出境注销；(4)国内调国际——按要求办出境手续；(5)任何变更均不得私自离境。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-转场程序', icon:'💼', src:'服务规范 9.7.1 转场衔接', t:['转场衔接','转场通知','虹桥手续','浦东注销','转场保障'],
q:'浦东转虹桥转场中证件与交接怎么衔接？',
a:'（结合9.7）转场衔接：(1)按AOC指令由乘务调度通知当班乘务组；(2)未办理出境手续的按要求前往虹桥办理；(3)已办出境手续的到出境员工通道办注销/转场；(4)确保机组证件、签封与装载手续一致；(5)全程按公司现行相关规定执行并保持与调度沟通。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-电讯检疫', icon:'💼', src:'服务规范 9.8.1 检疫申报状态', t:['有疫界定','无疫申报','检疫隔离','申报时限','检疫文件'],
q:'哪些情况属于有疫申报范围需要立即报告？',
a:'（结合9.8）有疫申报情形：航中发现传染病/疑似或呕吐腹泻发热寒战皮疹等症状人员或病因不明病人；人员死亡；发现死亡动物或来源不明活动物；医学媒介生物；载运活动物（宠物犬猫除外）；携带感染性物质的容器破损；其他需向检验检疫机构申报的情况。发现后第一时间报告机长由其申请有疫申报，登机检疫获许可前不可开舱门。细节按公司现行相关规定执行。'},
{cat:'乘务长管理-军民合用机场', icon:'💼', src:'服务规范 9.9.1 军民合用具体机场', t:['军民合用名单','关闭遮光板机场','禁拍管控','军民机场','遮光板机场'],
q:'军民合用机场中需要关闭遮光板的有哪些？',
a:'（结合9.9）需在起飞下降阶段指导旅客关闭遮阳板的机场：泉州、潍坊、张家口、忻州、威海、无锡、九江、遵义新舟、盐城、常州、德宏芒市、南宁吴圩等；其余军民合用机场按机长通知和军事保密要求执行。不可确定是否需关闭时可提前询问飞行机组，有要求不打开遮光板时不播报含"打开遮光板"的检查广播词，采用人工广播。下表明细按公司现行相关规定执行。'},
{cat:'乘务长管理-运行资源', icon:'💼', src:'服务规范 9.10.1 运行保障细则', t:['运行保障','资源保障','航班保障','乘调联系','值班上报'],
q:'航班运行中机械、旅客等问题要第一时间找谁？',
a:'（结合9.10）上报分工：机械原因（客舱设备损坏、APU致客舱温度高）——乘务长及时报告值班经理并上报AOC值班；旅客原因（大范围不满、中止旅行致不满）——报告值班经理；不正常航班（延误备降返航致大范围不满）——报告值班经理；机供品/餐食配备不足——乘务长联系乘务调度加配或协调。加配餐食、值勤期、机组车辆、临时过夜、过站休息等直接联系乘务调度。细节按公司现行相关规定执行。'},
{cat:'服务话术-总述', icon:'💼', src:'服务规范 6.1.1 话术使用原则', t:['话术原则','话术运用','语速语气','礼貌用语','沟通原则'],
q:'使用服务话术时需要把握哪些共同原则？',
a:'服务话术运用原则（结合6章）：(1)语气温和、态度诚恳、语速适中、吐字清晰；(2)以旅客为中心，先倾听后回应、注意共情；(3)涉及航班变更、延误等统一口径、不夸大不承诺；(4)规范使用十字礼貌用语；(5)遇不能当场答复的转乘务长或地面。这些原则贯穿销售、投诉、航延等各情境，具体按公司现行相关规定执行。'},
{cat:'工作要求-总述', icon:'💼', src:'服务规范 2.1.1 乘务员职业形象总体要求', t:['职业形象总体','仪容总体','作风形象','形象自律'],
q:'乘务员职业形象的总体要求是什么？',
a:'（结合2.1）总体要求：着装整洁统一、仪容得体大方、言行规范文明、举止有礼得体、岗在位全程保持专业形象；制服整齐、配饰规范、妆容淡雅、发式清爽符合标准；对旅客始终礼貌热情、保持良好精神状态。这是对全体乘务员的基本职业作风要求，具体标准见2.2-2.8各条目并按公司现行相关规定执行。'},
{cat:'手册管理', icon:'💼', src:'服务规范 1.1.3 手册概述细节', t:['手册阅读','手册学习','手册应用','手册结构'],
q:'乘务员如何正确阅读和应用《客舱服务规范》？',
a:'阅读应用建议：(1)先总览章节结构（职业形象与工作要求、工作要求、特殊旅客、特殊航班、服务话术、尊享飞、机上销售、乘务长管理）；(2)按岗位和场景查阅对应条目，理解意图而非死记；(3)遇到实际情景回到手册核对口径；(4)手册修订后及时学习更新内容、停止使用旧版；(5)对确无明确规定或与公司其他规定不一致的情况按公司现行相关规定执行。'},
{cat:'职业形象-言行规范', icon:'💼', src:'服务规范 2.7.1 言行细节', t:['言行细节','沟通细节','服务表达','服务态度','微笑服务'],
q:'值勤期间与旅客沟通，除了忌语还要注意哪些言行细节？',
a:'言行细节补充（结合2.7）：(1)使用规范、得体的服务用语，多用于感谢与抱歉；(2)对特殊人群（老人、儿童、外籍旅客）适当放慢语速、耐心表达；(3)不公开议论旅客、不评论航班与机组成员的私人信息；(4)保持微笑与眼神交流，避免背身或冷脸相对；(5)回答不了的问题不敷衍，记录并转交乘务长或地面处理。细节按公司现行相关规定执行。'},
{cat:'职业形象-飞行装具', icon:'💼', src:'服务规范 2.8.1 装具细节', t:['装具检查','备份物品','针线包','化妆包','装具维护'],
q:'飞行装具的备份和检查有什么补充注意？',
a:'装具补充要点（结合2.8）：(1)针线包至少缝衣针一枚、黑线白线各一卷，定期检查有无短缺；(2)化妆包用品按清单备齐并及时补足，避免临时缺料；(3)备份丝袜随身携带以应对破损；(4)钱袋与点数器航前核验数量，销售必须使用钱袋；(5)发现装具缺失或损坏及时补充申报。细节按公司现行相关规定执行。'},
{cat:'工作要求-飞行关键阶段', icon:'💼', src:'服务规范 3.4.1 关键阶段电子设备', t:['关键阶段','电子设备管控','起飞下降','安全提示','手机提醒'],
q:'滑行/起飞/下降等关键阶段乘务员如何管控电子设备？',
a:'关键阶段电子设备管控（结合3.4）：(1)起飞下降前通过广播与巡视督促旅客收起电子设备、关闭无线功能；(2)重点紧盯是否有有线耳机、未关蓝牙等违规使用；(3)对违规及时礼貌提醒并说明原因，必要时报告乘务长；(4)关闭客舱灯光期间同步检查屏幕光源；(5)全程统一口径，避免引发旅客恐慌。细节按公司现行相关规定执行。'},
{cat:'工作要求-平飞服务', icon:'💼', src:'服务规范 3.5.1 短线平飞', t:['短线航班','短航线','平飞安排','快速服务','服务精简'],
q:'航段短（1小时（含）以内）航班平飞阶段怎么安排服务？',
a:'短航线平飞服务（结合3.5）：(1)平飞广播可视情况播放，简化不必要环节；(2)及时开启烧水器、咖啡壶等服务设备，缩短准备时间、加快供饮节奏；(3)销售与供餐按短线流程适当精简；(4)各号位按分工快速衔接、减少服务空档；(5)留足关键阶段准备时间，不因压缩服务而影响安全。细节按公司现行相关规定执行。'},
{cat:'工作要求-客舱巡视', icon:'💼', src:'服务规范 3.6.1 巡视观察', t:['异常观察','安全隐患','巡视配合','出口座位','客舱安全'],
q:'客舱巡视时如何发现异常并做好安全配合？',
a:'巡视观察与配合（结合3.6）：(1)重点留意久坐不动、面色异常、行为反常的旅客；(2)关注电子烟、明火等安全隐患与可疑物品并防范；(3)维护出口座位与通道畅通，劝阻旅客占用通道；(4)发现异常先安抚再报告乘务长或安全员；(5)巡视与销售、服务结合安排，不遗漏客舱死角。细节按公司现行相关规定执行。'},
{cat:'工作要求-送客卫生', icon:'💼', src:'服务规范 3.7.1 收尾细节', t:['卫生死角','遗留物品检查','座椅复位','保洁互检','收尾检查'],
q:'送客和卫生打扫阶段有哪些易遗漏的细节要避免？',
a:'送客打扫易漏点（结合3.7）：(1)检查座椅周边及脚下是否遗留个人物品（耳机、证件、手机等）；(2)座椅口袋是否残留纸屑杂物、刊物是否按序摆放；(3)安全带复位、扶手放下，便于下一段上客；(4)洗手间及时清理并补充卷纸抽纸；(5)保洁完成后按"逐区检查、双人互检"避免死角。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-重要旅客', icon:'💼', src:'服务规范 4.2.1 要客座位迎送', t:['VIP座位','要客迎送','要客保障','要客餐食','保密要求'],
q:'为重要旅客（VIP）安排座位和迎送有哪些要求？',
a:'VIP保障补充（结合4.2/5.1）：(1)座位一般安排在便于照顾且不靠应急出口的位置；(2)迎送时行15-30度鞠躬、规范问候、主动引导；(3)餐食、机供品按《重要旅客餐食、机供品配备标准》安排与复核；(4)离机安排与信息交接配合地面完成；(5)全程保密、不对外公布重要旅客信息。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-其他', icon:'💼', src:'服务规范 4.12.1 其他特殊情形', t:['特殊情形','押解','醉酒旅客','重点保障','分类识别'],
q:'除常见类型外还有哪些需要特别关照的旅客情形？',
a:'其他特殊情形（结合4.12）：(1)被押解人员等安保要求按《客舱乘务员手册》执行；(2)对醉酒、滋事旅客加强巡视与安抚，必要时由安全员处置；(3)对接受治疗、使用医疗设备的旅客确认承运条件后再安排；(4)对VIP、集团客户、KOL等重点对象按相应条目提供服务；(5)对不确定的分类先识别再对号入座、妥善处理。细节按公司现行相关规定执行。'},
{cat:'特殊旅客-集团客户', icon:'💼', src:'服务规范 4.13.1 集团客户服务细节', t:['集团客户识别','赠水服务','智慧客舱','服务落实','大客户服务'],
q:'集团客户旅客的识别和赠送水服务怎么落实？',
a:'集团客户细节（结合4.13）：(1)通过智慧客舱识别集团客户并关注其座位；(2)起飞前为集团客户旅客赠送纸杯水或机组水，时间不足以平飞后补发；(3)计划飞行时间1小时（含）以内的将赠送水放入座椅口袋；(4)服务过程保持主动、得体，避免打扰休息；(5)记录发放情况，便于有异议时核实。细节按公司现行相关规定执行。'},
{cat:'工作要求-服务规范', icon:'💼', src:'服务规范 3.8.1 广播与服务顺序细节', t:['广播员要求','服务顺序','机组沟通','先里后外','广播规范'],
q:'执行机上广播和服务顺序时有哪些常被忽略的细节？',
a:'广播与服务顺序细节（结合3.8）：(1)进行客舱广播须取得广播员资格，通航关切与特殊情况除外，指定其他广播员要在风险沙盘注明原因和姓名；(2)各项服务注意"先里后外、先女后男、先老后幼、先职务高后职务低"的顺序；(3)驾驶舱服务由2号位负责、乘务长协助，机组通讯或关键操作时不打断、不把装满热水的烧水杯带进驾驶舱；(4)乘务长将进入驾驶舱时间与交流时长记录在风险沙盘；(5)广播内容与顺序按《客舱广播手册》执行。细节按公司现行相关规定执行。'},
];

/* ---- 同品类合并：选了两款同类型（两种精华/两种水/两支口红）时，自动合成"组合介绍"，不硬搭配 ---- */
function combineSameType(items){
  const groups = {};
  items.forEach(p => { (groups[p.t] = groups[p.t] || []).push(p); });
  const blocks = [];
  Object.keys(groups).forEach(t => {
    const g = groups[t];
    if(g.length === 1){
      const p = g[0];
      blocks.push(`**${p.n}**：${p.s}。用法：${p.u}（主打${p.m}）。`);
    }else{
      blocks.push(`**「${t}」多款组合（${g.map(p=>p.n).join(' + ')}）**：这几款同属${t}但分工不同——${g.map(p=>`${p.n}主打${p.m}（${p.s}）`).join('；')}。搭配建议：${g.map((p,i)=>`${i===0?'先用':i===g.length-1?'最后再用':'随后用'}${p.n}${p.u.slice(0,12)}`).join('；')}，按"先打底后叠加、先功能后修护"的顺序使用，1+1>2，比单独用任何一款更事半功倍。`);
    }
  });
  return blocks.join('\n');
}

/* ===================== 知识覆盖层合并（数据包 kb + 旧版 kb_overlay_v1 双读；损坏数据静默忽略） ===================== */
(function(){
  var POOLS = { daily: KB, ccm: window.KB_CCM_RAW, mgm: window.KB_MGM_RAW, svc: window.KB_SVC_RAW };
  // 旧协议兼容：kb-admin 旧版写的 kb_overlay_v1 覆盖层（新协议未装时仍生效）
  function applyLegacy(){
    try{
      var raw = localStorage.getItem('kb_overlay_v1');
      if(!raw) return;
      var ov = JSON.parse(raw);
      if(!ov || ov.magic !== 'kb-overlay-v1') return;
      for (var lib in POOLS){
        var arr = (ov.byLib && ov.byLib[lib]) || [];
        if(!arr.length) continue;
        var pool = POOLS[lib];
        if(!Array.isArray(pool)) continue;
        arr.forEach(function(e){
          if(!e || !e.q) return;
          var idx = -1;
          for (var i = 0; i < pool.length; i++){
            if(pool[i] && e.src && pool[i].src === e.src){ idx = i; break; }
          }
          if(idx >= 0) pool[idx] = e; else pool.push(e);
        });
      }
    }catch(err){ console.warn('旧知识覆盖层合并失败（已忽略）', err); }
  }
  // 新协议：type='kb' 数据包，按 lib 分桶，数据包优先级高于旧覆盖层（后执行）
  // 注意：KB 条目 src 非唯一（同章节多条问答），故不用 applyMapToArray（其多命中去重会误删同章节条目），
  //       沿用旧覆盖层语义：upsert 替换第一条命中/缺失 push，delete 删除第一条命中
  function applyPacks(){
    try{
      if(!window.PACKS) return;
      for (var lib in POOLS){
        var pool = POOLS[lib];
        if(!Array.isArray(pool)) continue;
        var m = PACKS.buildPackMap(localStorage, 'kb', { lib: lib });
        var map = m.map, kills = m.kills;
        for (var key in map){
          var e = map[key];
          if(!e || !e.q) continue;
          var idx = -1;
          for (var i = 0; i < pool.length; i++){
            if(pool[i] && e.src && pool[i].src === e.src){ idx = i; break; }
          }
          if(idx >= 0) pool[idx] = e; else pool.push(e);
        }
        for (var k2 = 0; k2 < kills.length; k2++){
          for (var j = 0; j < pool.length; j++){
            if(pool[j] && pool[j].src === kills[k2]){ pool.splice(j, 1); break; }
          }
        }
      }
    }catch(err){ console.warn('数据包知识覆盖合并失败（已忽略）', err); }
  }
  function apply(){ applyLegacy(); applyPacks(); }
  apply();
  // 库管理模块写入覆盖层/数据包时，无需刷新即可生效（外壳 iframe 缓存场景）
  window.addEventListener('storage', function(ev){
    if(ev && (ev.key === 'kb_overlay_v1' || ev.key === 'packs_index' || (ev.key && ev.key.indexOf('pack:') === 0))) apply();
  });
})();

  const t = text.trim();
  // 命令前缀（去/打开/进入/转到 等强导航词 + 模块）——避免误伤普通问句（如"复飞怎么操作""手册里怎么规定"）
  const hasCmd = /^(去|到|打开|进入|帮我打开|转到|跳去|切到|切换到|我要(去|到))\s*/.test(t);
  if(!hasCmd) return null;
  const rules = [
    { re:/考|试|训练|刷题|练一练|模拟|答题|错题|题库|培训/, mod:'quiz' },
    { re:/绩效|排名|评分|考核结果|班组|分数|数据看板/, mod:'performance' },
    { re:/美妆|化妆品|护肤|话术|销售|推销|彩妆|香水|机上商城/, mod:'beauty' },
    { re:/医疗|急救|CPR|救护|心肺复苏|受伤|生病|急救箱/, mod:'medical' },
    { re:/手册|奖惩|奖惩记录|管理制度|管理规定/, mod:'manual' },
    { re:/日常|生活|常用|小知识|FAQ|基础/, mod:'daily' },
    { re:/风险|预警|天气|台风|气象|航线风险/, mod:'risk' },
    { re:/库管理|知识库管理|题库管理|数据同步/, mod:'kbadmin' },
    { re:/事件报告|事件上报|报告中心|报告流程|上报事件|事件流程/, mod:'report' },
  ];
  for(let i = 0; i < rules.length; i++){
    if(rules[i].re.test(t)) return { mod: rules[i].mod };
  }
  return null;
}
function detectIntent(text){
  // 0. 总调度：明确的"去X模块"命令直接跳转
  const jmp = detectJumpIntent(text);
  if(jmp) return 'jump';
  // 1. 话术生成意图
  if (/(写|生成|来|要|给|帮我|我要|来一段|编|做).{0,4}(销售话术|话术|稿子|台词|推销词|销售词)|销售话术|话术稿|稿子|台词/.test(text)) return 'script';
  // 2. 知识库意图：按关键词命中排序（在当前选中的知识库内检索）
  const hits = kbSearch(text, 3, currentKbPool());
  if (hits.length) return 'kb';
  // 3. 其他：自由问答（交给 AI；无 AI 则引导）
  return 'chat';
}

/* 发送入口 */
function ask(q){
  addMsg('user', esc(q));
  process(q);
}
function sendMsg(){
  const v = el('qaInput').value.trim();
  if(!v) return;
  el('qaInput').value = '';
  qaInput.style.height = 'auto';
  updateSendBtn();
  ask(v);
}
/* 发送按钮：空输入禁用 */
function updateSendBtn(){
  const btn = el('sendBtn');
  const on = el('qaInput').value.trim().length > 0;
  if(btn) btn.disabled = !on;
}

/* 知识库检索：按关键词命中数排序，返回 Top N（更稳的模糊匹配；pool 决定从哪个库检索）
   命中时对原文与"去【的】字"后的文本双向匹配，解决【PBE的操作 → PBE操作】这类问法
   泛标签（如"操作""使用""检查"）不参与计分，避免设备 A 的操作问题串出设备 B（如"氧气瓶的操作"误出滑梯） */
const GENERIC_TAGS = new Set(['操作','使用','检查','方法','步骤','流程','标准','要求','怎么','如何','什么','哪个','哪些','多久','多少','几点','注意','处理','做法','规定','程序','支持','提供','时候','地方','时间']);
function kbSearch(text, n, pool){
  pool = pool || KB;
  const low = String(text).toLowerCase();            // 忽略大小写：um/UM、pbe/PBE 等缩写均可命中
  const norm = low.replace(/的/g,'');
  const scored = pool.map(k => {
    let score = 0;
    (k.t || []).forEach(kw => { if (kw && !GENERIC_TAGS.has(kw) && (low.indexOf(kw.toLowerCase()) >= 0 || norm.indexOf(kw.toLowerCase()) >= 0)) score += kw.length; });
    // 命中条目标题也算
    const ql = k.q ? k.q.toLowerCase() : '';
    if(ql && low.length >= 2 && low.indexOf(ql.slice(0, Math.min(4, ql.length))) >= 0) score += 2;
    return { k, s: score };
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  return scored.slice(0, n || 3);
}
async function process(text){
  // AI 回复风格快捷切换命令：/风格 班组 · /风格 正式 · /风格 精简 · /风格 热情（不检索知识库）
  const styleHit = text.trim().match(/^\/风格\s*(\S+)/);
  if (styleHit){
    const styleMap = { '班组':'chat','口语':'chat','chat':'chat','正式':'pro','专业':'pro','pro':'pro','精简':'pithy','高效':'pithy','pithy':'pithy','热情':'warm','贴心':'warm','warm':'warm' };
    const key = styleMap[styleHit[1]];
    if (key){ localStorage.setItem('spring_ai_style', key); addMsg('bot', '已切换为「' + AI_STYLE_NAMES[key] + '」。'); return; }
    addMsg('bot', '可选风格：<b>/风格 班组</b>（默认口语）· <b>/风格 正式</b> · <b>/风格 精简</b> · <b>/风格 热情</b>。也可以到 ⚙️AI设置 里选择保存。');
    return;
  }
  const intent = detectIntent(text);
  if (intent === 'jump'){ const j = detectJumpIntent(text); if(j && j.mod){ const names = { quiz:'📚 培训考核', performance:'📊 绩效管理', beauty:'💄 美妆话术', medical:'🚑 医疗急救', manual:'📕 手册奖惩', daily:'❓ 日常问题', risk:'⚠️ 风险预警', report:'🗂 事件报告', kbadmin:'📇 库管理' }; addMsg('bot', '⏭ 为你切换到 <b>' + (names[j.mod]||j.mod) + '</b> 模块…'); setTimeout(()=>jumpTo(j.mod), 600); return; } }
  if (intent === 'script'){ startWizard(); return; }
  const pool = currentKbPool();
  if (intent === 'kb'){ const hits = kbSearch(text, 3, pool); await typing(''); clearTyping(); kbReply(hits, text); return; }
  // 自由对话
  if (SpringAI.isEnabled()){
    await typing(''); clearTyping();
    try{
      const sys = AI_STYLES[currentAiStyle()];
      // 关联当前知识库（日常库/乘务员手册/管理手册）上下文，增强准确性
      const kbCtx = kbSearch(text, 2, pool);
      const srcHint = '【当前用户选择的检索库：' + currentPoolLabel() + '】';
      const userMsg = (kbCtx.length
        ? ('【相关已知资料（来自 ' + currentPoolLabel() + '）】\n' + kbCtx.map(x => x.k.q + '\n' + x.k.a.replace(/<[^>]+>/g,'')).join('\n\n') + '\n\n')
        : (srcHint + '\n')) + '【用户问题】' + text + '\n\n请基于上述资料并结合你的知识，用刚才说的口语化方式回答。';
      const messages = [];
      if (aiLastResp) messages.push({ role:'assistant', content: aiLastResp });
      messages.push({ role:'user', content: userMsg });
      const resp = await SpringAI.chatLLM([{ role:'system', content: sys }].concat(messages), { temperature:0.75, maxTokens:700 });
      aiLastResp = resp;
      addMsg('bot', mdToHtml(resp));
      return;
    }catch(e){
      addMsg('bot', '😅 AI 连不上（' + esc(String(e.message||e)) + '）。让我先用内置知识库试试……');
      const low = String(text).toLowerCase();
      const hits = pool.filter(k => low.length>1 && k.t.some(kw => !GENERIC_TAGS.has(kw) && low.indexOf(String(kw).toLowerCase())>=0)).slice(0,2).map(k => ({ k, s:1 }));
      if(hits.length){ kbReply(hits, text); return; }
    }
  }
  kbReply([], text);
}

/* 知识回复（按当前选中的知识库渲染来源与相关推荐）
   命中多条时：只把与【首条同范畴(cat)】的命中展开为答案（如 PBE I型/II型 同属"烟雾火警设备"会并列）；
   其它范畴的命中（如"氧气瓶的操作"误出的滑梯）不再当答案，仅作为"你可能想问"推荐芯片 */
function kbReply(hits, rawText){
  rawText = rawText || '';
  const pool = currentKbPool();
  const isManualPool = qaSource !== 'daily';
  if (hits && hits.length){
    // 收集命中条目的关联标签（滤掉泛词，避免把全库拉下水）
    const relSet = new Set();
    hits.forEach(x => (x.k.rel || []).forEach(t => { if (t && !GENERIC_TAGS.has(t)) relSet.add(String(t).toLowerCase()); }));
    // 在当前库中找匹配 rel 且未被展示的条目，按命中数排序取前 3
    const shownIds = new Set(hits.map(x => x.k.q));
    const cands = [];
    pool.forEach(k => {
      if (shownIds.has(k.q)) return;
      let score = 0;
      (k.t || []).forEach(kw => { const kl = String(kw).toLowerCase(); if ([...relSet].some(r => kl.indexOf(r) >= 0 || r.indexOf(kl) >= 0)) score += kw.length; });
      if ((k.rel || []).some(r => relSet.has(String(r).toLowerCase()))) score += 100;
      if (score > 0) cands.push({ k, s: score });
    });
    cands.sort((a,b) => b.s - a.s);
    const related = cands.slice(0, 3).map(x => x.k);
    const relHtml = related.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)">
      <div style="font-size:.76rem;font-weight:800;color:var(--primary-dark);margin-bottom:6px">📎 你可能还想了解（${currentPoolLabel()}）：</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">${related.map(k => `<button class="w-chip" onclick="ask('${esc(k.q).replace(/'/g,"\\'")}')">${k.icon} ${esc(k.q)}</button>`).join('')}</div>
    </div>` : '';
    const jumpBtn = (k) => {
      if (isManualPool) return `<button class="jump-btn" onclick="setQaSource('daily',null)">💬 去日常库再问 ➔</button>`;
      if (k.cat==='医疗急救') return '<button class="jump-btn" onclick="jumpTo(\'medical\')">查看医疗急救 ➔</button>';
      if ((k.cat||'').indexOf('销售')===0 || (k.src||'').indexOf('OJT')>=0) return '<button class="jump-btn" onclick="jumpTo(\'daily\')">日常问题详情 ➔</button>';
      return '<button class="jump-btn" onclick="jumpTo(\'manual\')">手册奖惩详情 ➔</button>';
    };
    // 主体：与首条得分差距 ≤2 的命中展开为答案（保留 PBE I型/II型这类同分并列；性能 vs 操作等不同角度只保留得分最高的），
    // 其余命中 →「你可能想问」推荐芯片，避免"滑梯的性能"把"滑梯如何操作"也当答案并列输出
    const topS = hits[0].s;
    const main = hits.filter(x => topS - x.s <= 2);
    const other = hits.filter(x => topS - x.s > 2);
    const otherChips = other.length ? `<div style="margin-top:8px;font-size:.78rem;color:var(--text2)">💡 你可能想问：${other.slice(0,3).map(x => `<button class="w-chip" style="margin-right:5px;margin-top:3px" onclick="ask('${esc(x.k.q).replace(/'/g,"\\'")}')">${x.k.icon} ${esc(x.k.q)}</button>`).join('')}</div>` : '';
    addMsg('bot', `<div style="font-size:.7rem;color:var(--text3);margin-bottom:6px">🔎 来源：${currentPoolLabel()}</div>` + main.map(x =>
      `<div style="margin-bottom:14px;padding-bottom:12px;${main.length>1?'border-bottom:1px dashed var(--border)':''}">
        <div class="qa-title"><span class="qi">${x.k.icon}</span><span>${esc(x.k.q)}</span></div>
        ${x.k.a}
        <div class="srcline">
          <span class="src-badge">📚 ${esc(x.k.src)}</span>
          ${jumpBtn(x.k)}
        </div>
      </div>`
    ).join('') + otherChips + relHtml);
    return;
  }
  const near = pool.filter(k => k.cat && k.t && textSimilarity(rawText, k.q) > 0);
  const nearHtml = near.length ? `<div style="margin-top:6px;font-size:.78rem;color:var(--text2)">💡 你可能想问：${near.slice(0,3).map(k => `<button class="w-chip" style="margin-right:5px;margin-top:3px" onclick="ask('${esc(k.q).replace(/'/g,"\\'")}')">${k.icon} ${esc(k.q)}</button>`).join('')}</div>` : '';
  addMsg('bot', `<div class="kbox">🤷 当前【${currentPoolLabel()}】还没有直接命中"<b>${esc(rawText)}</b>"。</div>
  <div style="font-weight:700;margin:8px 0 4px">你可以：</div>
  <ul>
  <li>换个关键词再问（日常库：如「日常管理分」「病假材料」「位置上报」「迟到」「拒飞」；客舱乘务员手册01.10库：如「撤离口令」「CPR」「出口座位」「值勤限制」；客舱服务部管理手册01.14库：如「酒测」「复训」「备份」「仪容」；客舱服务规范00.07库：如「着装」「迎客话术」「尊享飞」「延误服务」「UM」）；</li>
  <li>点下面按钮切换到<b>另一个知识库</b>再问（跨库试试，很多时候只是放错了库）；</li>
  <li>点 <b>⚙️ AI设置</b> 接入在线 AI 后自由提问；</li>
  <li>或直接去对应板块精确搜索。</li>
  </ul>
  ${nearHtml}
  <div class="srcline"><span class="src-badge">切换知识库</span>
    <button class="jump-btn" onclick="setQaSource('daily',null)">💬 日常库</button>
    <button class="jump-btn" onclick="setQaSource('ccm',null)">📘 乘务员手册01.10</button>
    <button class="jump-btn" onclick="setQaSource('mgm',null)">📗 管理手册01.14</button>
    <button class="jump-btn" onclick="setQaSource('svc',null)">💼 服务手册规范00.07</button>
  </div>
  <div class="srcline"><span class="src-badge">直达板块</span><button class="jump-btn" onclick="jumpTo('manual')">📕 手册奖惩</button> <button class="jump-btn" onclick="jumpTo('daily')">❓ 日常问题</button> <button class="jump-btn" onclick="jumpTo('beauty')">💄 美妆话术</button></div>`);
}
function textSimilarity(a,b){ return a.indexOf(b)>=0 || b.indexOf(a)>=0; }

/* markdown 极简渲染（标题/列表/加粗） */
function mdToHtml(s){
  s = esc(s);
  s = s.replace(/```[\s\S]*?```/g, m => '<pre style="background:var(--primary-mist);padding:8px;border-radius:8px;overflow-x:auto;font-size:.8rem">'+m.slice(3,-3).trim()+'</pre>');
  s = s.replace(/^### (.*)$/gm, '<div style="font-weight:800;margin-top:8px;color:var(--primary-dark)">$1</div>');
  s = s.replace(/^## (.*)$/gm, '<div style="font-weight:800;margin-top:10px;font-size:1.02rem;color:var(--primary-dark)">$1</div>');
  s = s.replace(/^# (.*)$/gm, '<div style="font-weight:900;margin-top:12px;font-size:1.1rem">$1</div>');
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\* (.*)$/gm, '• $1');
  s = s.replace(/^[-•] (.*)$/gm, '<div style="padding-left:4px">• $1</div>');
  s = s.replace(/\n{2,}/g, '<br/><br/>').replace(/\n/g, '<br/>');
  return s;
}

/* ===================== 话术向导 ===================== */
function startWizard(){
  wizard.active = true; wizard.cats = []; wizard.dura = '3'; wizard.budget = 'mid';
  addMsg('bot', `<div class="wizard">
    <div class="wz-bar"><span class="wz-no">1</span> 选择产品品类（可多选）</div>
    <div class="wz-opts" id="wz-cats">${SCRIPT_CATS.map(c => `<button class="wz-opt" data-k="${c.key}" onclick="toggleCat('${c.key}',this)">${c.label}</button>`).join('')}</div>
    <div class="wz-bar"><span class="wz-no">2</span> 时长档位</div>
    <div class="wz-opts" id="wz-dura">${DUR_OPTS.map(d => `<button class="wz-opt ${d.k==='3'?'sel':''}" onclick="pickDura('${d.k}',this)">${d.l}</button>`).join('')}</div>
    <div class="wz-bar"><span class="wz-no">3</span> 话术定位</div>
    <div class="wz-opts" id="wz-budget">${BUDGET_OPTS.map(d => `<button class="wz-opt ${d.k==='mid'?'sel':''}" onclick="pickBudget('${d.k}',this)">${d.l}</button>`).join('')}</div>
    <button class="wz-gen" id="wz-go" onclick="doGenerate()" disabled>✨ 生成话术稿</button>
  </div>`);
  renderChat();
}
function toggleCat(k, btn){
  const i = wizard.cats.indexOf(k);
  if (i >= 0){ wizard.cats.splice(i,1); btn.classList.remove('sel'); }
  else { if (wizard.cats.length >= 3){ return; } wizard.cats.push(k); btn.classList.add('sel'); }
  el('wz-go').disabled = wizard.cats.length === 0;
}
function pickDura(k, btn){
  wizard.dura = k;
  document.querySelectorAll('#wz-dura .wz-opt').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}
function pickBudget(k, btn){
  wizard.budget = k;
  document.querySelectorAll('#wz-budget .wz-opt').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}
async function doGenerate(){
  if(!wizard.cats.length){ return; }
  const out = buildScript(wizard);
  wizard.active = false;
  addMsg('bot', `<div style="word-break:break-word"><div class="qa-title"><span class="qi">📄</span><span>话术稿生成结果（可复制到剪贴板）</span></div>
    <div class="script-out">${esc(out)}</div>
    <div class="act-row">
      <button class="cp-btn" onclick="copyScript(this)">📋 复制全文</button>
      <button class="jump-btn" onclick="jumpTo('beauty')">💄 去美妆话术生成完整版 ➔</button>
    </div></div>`);
  renderChat();
}
function copyScript(btn){
  const box = btn.closest('.bubble').querySelector('.script-out');
  const text = box.textContent;
  const done = () => { btn.textContent = '✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制全文',1500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* 重置 */
function resetChat(){
  chat.msgs = [];
  wizard.active = false;
  const inp = el('qaInput'); if(inp){ inp.value=''; inp.style.height='auto'; updateSendBtn(); }

}
