window.KB_MGM_RAW = [
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.30 客舱安全底线和红线', t:['安全底线','红线','运输航空责任事故','空防事故','一般征候','严重征候'], q:'客舱安全底线有哪些？', a:'<ul><li>客舱安全目标底线：杜绝运输航空责任事故；防止劫、炸机等非法干扰事件，杜绝空防事故；防止人为原因严重征候、一般征候；防止重大安全隐患。</li><li>严重征候如：飞行中客舱起火或冒烟；飞行中遇颠簸或机组操纵造成3人（含）以上轻伤。</li><li>一般征候如：非飞行阶段客舱起火冒烟（灯泡冒烟、烤箱食物冒烟等除外）；餐车、储物柜滑出跌落致航空器受损或人员轻伤；颠簸或操纵造成3人（不含）以下轻伤。</li></ul>（详见《安全管理程序手册》5.21.3）'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.30 客舱安全底线和红线', t:['底线','红线','直接经济损失','黑名单','重大隐患','质量偏差'], q:'触碰安全底线的严重质量偏差包括哪些？', a:'安全质量底线（特别严重质量偏差）主要包括：违反国家、行业法规造成特大影响；因人为原因或管理不善致火灾等；危害航空公共安全的违法违纪；伪造、销毁、丢失或损坏绝密级文件或泄露绝密信息；失职渎职造成公司财物直接经济损失30万元（含）以上；被加入民航失信黑名单；被判定为民航重大隐患；应急启动不当造成特大影响等。具体红线样例详见《安全管理程序手册》5.21。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.30 客舱安全底线和红线', t:['红线','奖惩','绩效考核','就高从重','安全绩效考核'], q:'触碰安全红线后如何考核处理？', a:'对未达到公司红线、底线的行为，部门按本手册6.7奖惩管理细则处理。实施安全奖惩时，所依据条款不一致的按就高从重的原则处理。部门对涉及人员、责任处/分部进行安全绩效积分考核，依据6.7奖惩管理、4.26安全绩效积分、4.10不合格项目与纠正预防、4.29客舱安全生产绩效奖惩规定执行。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','酒精测试','超标标准','局方标准','mg/100mL','0.04'], q:'酒精测试超标的标准是多少？', a:'<ul><li>局方标准：呼出气体酒精浓度≥0.04克/210升，或血液酒精浓度≥40mg/100mL，即视为超标。</li><li>公司标准（更严）：血液酒精浓度≥10mg/100mL即视为超标。</li><li>换算公式：血液浓度(mg/100mL)=呼出气体浓度(mg/L)×220。</li></ul>数值显示小于10mg/100mL视为正常。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','复测','确认检测','15分钟','20分钟'], q:'酒测异常后怎么复测确认？', a:'盐测确认检测需在首次检测后15分钟（含）-20分钟（含）进行，在指定地点等待，期间不得饮酒、进食、吸烟，不得使用漱口水、口香糖、薄荷糖。若第一次复测仍≥10mg/100mL，须在首次检测后30分钟（含）-35分钟（含）进行第二次复测。确认检测须有除航医/检测人员、受检者之外的第三方在场，确认结果与首次不一致的以确认结果为准，大于0或违规者不得执行航班任务。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','拒绝','酒测停飞','终身停飞处理','局方标准'], q:'酒测超标或拒绝酒测会怎么处理？', a:'<ul><li>计划签到前12小时至前30分钟以外出现超局方标准的，接受安监部调查处理。</li><li>签到前30分钟（含）以内超公司标准的，按事故/差错标准和奖惩规定处理。</li><li>酒测达到或超过局方标准，可给予终身停飞处理。</li><li>拒绝酒测的乘务员应立即暂停派遣，由值班经理更换人员并报SQM；仍拒绝的，安监部将发出暂停运行职位通知。</li></ul>训练期间超标的同样处理。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','记录','保存','12个月','德尔格','检测仪'], q:'酒测记录保存多久？酒测仪由谁管理？', a:'值班经理在每日值班工作记录中记录当天酒测抽查情况，电子版记录由安全保卫质量处保存12个月。手持"德尔格"酒测仪由安全保卫质量处统一管理并使用，主要用于检查与调查核实工作，特殊需要时可授权值班经理使用。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.33 客舱部值班管理规定', t:['仪容','仪容仪表','发型','发色','扣分','值班经理'], q:'航前仪容仪表检查查什么，不达标会怎样？', a:'虹桥、浦东值班经理需对每日出港航班乘务组进行仪容仪表检查，主要查：着装是否规范、整洁（如皮鞋、熨线）；妆发是否符合要求（如发型、发色、碎发等）。对仪容仪表不符合要求的人员记录扣分，并拍照上传至值班经理微信群。乘务员值勤期间仪容仪表不符合规定、着装不注意言行规范的还会扣业务质量分。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.33 客舱部值班管理规定', t:['值班手机','调度','值守','虹桥','交接','畅通'], q:'值班手机由谁保管，有什么要求？', a:'值班经理手机（客舱部值班手机18017321071）由虹桥值班经理保管及主控。每日虹桥值班经理交接班时同时交接值班手机，并随身携带，确保值班手机处于可接通状态；如需临时离开或进行机坪检查，也要保持值班手机随时可接通。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.33 客舱部值班管理规定', t:['安全事件','报告','值班','劫炸机','火警','紧急撤离'], q:'机上发生哪些安全事件需第一时间报告？', a:'接到飞行中餐车/储物柜滑出、航空器部件脱落、释压或紧急下降、紧急滑梯非正常放出、火警、严重颠簸伤人、机上急救等，值班经理须第一时间报告航务部、安监部；劫炸机等非法干扰、驾驶舱门异常、旅客携带刀具、中止旅行、押解遣返、枪支弹药运输等重要安保事件须立即报告运行指挥部、保卫部。旅客受伤须报告运行指挥部、航卫处、服务管理部。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.33 客舱部值班管理规定', t:['航前检查','酒测','装具','证件','网上准备','值班经理'], q:'值班经理航前检查都检查哪些内容？', a:'主要包括：乘务员签到酒测；乘务长准备会质量（含仪容仪表、证件装具、电子手册、设备检查单检查）；飞行装具携带（训练合格证、电子体检合格证、隐形眼镜备份、空勤登机证、飞行工作记录本等）；电子手册及检查单版本；航前抽查提问；签到后吸烟情况；网上准备完成情况等。检查记录于《客舱部值班经理工作日志》。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','外基地','外基地酒测','归档','设备故障'], q:'外基地或酒测设备故障时怎么酒测？', a:'外基地执行航班或备份任务时，乘务组签到前由乘务长组织组员酒测（先输入工号再吹气）。设备故障时：有航医的由航医用手持仪抽查；手持仪也不能用则对超标人员再次用自助设备确认；两者都不可用则由航医目视检查。外基地酒测超标建议向航医说明情况准备确认检测。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['资格类训练','新雇员','初始训练','定期复训','转机型','重获资格'], q:'客舱乘务员资格类训练有哪些？', a:'资格类训练包括：新雇员训练、初始训练、转机型训练、差异训练、定期复训、重获资格训练、乘务长训练、客舱乘务教员训练、客舱乘务检查员训练。除资格类外还有提升类训练，如民航乘务中级英语考试、客舱广播员考试、英语托业、日语广播员考试等。年度培训计划由乘务培训处每年年末制定，并形成红文报局方。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['培训','迟到','课堂纪律','取消资格','8小时','奖惩'], q:'培训考勤与课时有什么要求？', a:'<ul><li>迟到、早退、无故不参加训练或违反课堂纪律的，月底提交综合管理处进行奖惩分考核。</li><li>参训人员迟到10分钟（不含）以上，取消当日参训资格。</li><li>除飞机飞行训练及航线经历检查外，客舱乘务教员实施训练及乘务员每天接受训练的课时不应超过8小时。</li></ul>'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['复训','定期复训','到期月','日历月','餐补'], q:'定期复训的时间安排和餐补怎么算？', a:'定期复训在要求进行训练或检查的那个日历月之前一个或之后一个日历月中完成，均视为在所要求的日历月中完成。参加定期复训的学员及授课教员按公司统一标准发放餐补。危险品资质维护须在当月完成。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['初始新雇员','专业化形象','化妆','标准发型','岗前培训'], q:'初始新雇员除了大纲培训还要学什么？', a:'初始新雇员还需完成非规章类培训，包括：客舱乘务员专业化形象（个人形象、职业礼仪、执勤形象要求、美容化妆、乘务员标准发型，≥15小时）；形体姿态训练（站走蹲坐、手势鞠躬握手迎客）；机上销售（≥5小时）；申办空勤登机证专业课程（1.5小时）；机上救护及机上销售、化妆实操等。外籍乘务员需增加语言和文化差异课程。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.3 学员管理规定', t:['学员','入队','手册考核','补考','放单','实习生'], q:'学员入队有什么考核和流程？', a:'学员入队前需在培训中心完成入队手册考核，不通过有一次补考机会，补考不合格不安排入队；作风量化评估不合格的学员也不安排入队。入队后由客舱分部负责日常管理，乘务培训处负责带飞及检查质量和进度监控。学员带飞期间因工作表现不满足要求的，退回培训中心。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.3 学员管理规定', t:['学员','带飞','换教员','申诉','权利'], q:'乘务学员对带飞教员或放单结果有异议怎么办？', a:'飞机飞行训练中，学员如对带飞教员有异议，可向乘务培训处提出一次更换教员申请。资格鉴定检查（放单检查）过程中，如对放单检查结果有异议，可以不在鉴定表上签字，并于当日内向乘务培训处提出书面申诉。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.11 近期经历要求的管理', t:['近期经历','12个月','2个航段','机型','复训','预报','近期经历要求','最近经历'], q:'近期经历要求是什么？忘记飞会怎样？', a:'客舱乘务员应于前12个日历月之内，在局方可服务的同一种机型上至少飞行2个航段，方可在此机型担任客舱乘务员。任一连续12个日历月内未完成2个航段的，视为失去该机型近期经历；未如实反馈近期经历参加定期复训的，视为资质无效并追究个人诚信问题。失去近期经历须重新建立，否则不能参加定期复训。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.11 近期经历要求的管理', t:['近期经历','重新建立','检查鉴定','初始训练','放单','合格通知单'], q:'近期经历失效如何重新建立？', a:'超过12个日历月未飞但资质在有效期内的乘务员，办理复飞时由乘务培训处填《近期经历检查鉴定摘要申请表》，在乘务检查员监督下于同一机型至少完成2个航段，填写鉴定表判断是否合格。合格的由乘务培训处填《近期经历检查合格通知单》交生产派遣处，方可安排后续航班；不合格的关闭资质并安排参加该机型初始训练。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.15 证件管理规定', t:['训练合格证','证件','有效期','复训登记','复核'], q:'客舱乘务员训练合格证怎么管理？', a:'训练合格证由乘务培训处制作、打印、发放并做有效性监控。发放前采用双人制复核信息（姓名、编号、性别、出生日期、国籍、机型资格、最近一次复训日期、下次年度复训到期月等），持证人核对无误后正楷签名。具有机型资格、最近一次年度复训日期、下次年度复训到期月任一变化时需重新制作。乘务员需对训练合格证有效期自我监控。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.15 证件管理规定', t:['训练合格证','收回','离职','退休','调岗'], q:'离职、退休或调岗后训练合格证怎么处理？', a:'客舱乘务员退休、离职或调岗后不再使用训练合格证时，由乘务培训处依据员工离职手续清单收回尚在有效期内的训练合格证并妥善管理。国际/地区证件因公务续办期间由乘务培训处进行证件锁闭；乘务员个人须妥善保管护照、港澳通行证，日籍、泰籍乘务员负责本人护照办理及保管。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.16 飞行时间累计管理规定', t:['飞行时间','累计','300小时','见习乘务员','离职','回归'], q:'离职或转岗后恢复飞行，飞行时间怎么累计？', a:'曾离职、转岗后恢复在本公司飞行的乘务员，可至乘务培训处开具飞行时间证明。取得春秋航空见习乘务员资格且在该岗位飞行满300小时后，原有飞行时间可全部累计入个人总飞行时间；取得带班乘务长资格且在该岗位飞行满300小时后，原有乘务长飞行时间可全部累计入乘务长飞行时间。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.16 飞行时间累计管理规定', t:['飞行时间','他航','2年','证明','不累计'], q:'曾在其他航空公司工作的飞行时间能不能累计？', a:'曾在其他航司服务过、停止飞行时间≤2年（最后一次飞行日期至恢复申请提交日），且能提供部门认可的原公司飞行时间证明（需含部门、联系人、联系电话及原公司公章）的，在取得见习乘务员资格并飞行满300小时后，原有飞行时间可全部累计。暂停派遣超2年或无法提供认可的证明，其原有飞行时间不予累计。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['培训记录','台账','30个日历日','签到表','存档'], q:'培训记录和台账有什么要求？', a:'培训专员于当月训练结束后30个日历日内完成《培训记录单》并做好台账，包含应到/实到人数、人员名单、缺席名单、考核情况、培训情况。每期培训结束将《年度培训签到表》及考核单存档。安保训练结束后30个日历日内完成安保训练记录并上传SQ系统。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.17 A类客舱乘务教员、客舱乘务检查员胜任力评估管理规定', t:['教员','检查员','胜任力','评估','聘任','解聘'], q:'客舱乘务教员/检查员的胜任力怎么评估？', a:'胜任力考评由综合胜任力、基础胜任力、核心胜任力三大维度构成。评估结果作为岗位聘任、评优评先、培训发展及续聘/解聘的核心依据，按年度考评总分划分层级。考评遵循多维立体、正向引导、差异化、发展导向原则。具体权重和细则由乘务培训处按年度管理重点在年度考评通告中明确。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['业务等级','乘务员','乘务长','见习','教员','检查员'], q:'空勤业务等级分哪些？', a:'业务等级类别包括：见习安全/乘务员、普通安全/乘务员、见习乘务长（无英语证书）、带班乘务长、乘务长、客舱乘务教员、客舱乘务检查员。双照人员在涉及乘务员晋/降级时，安全员和乘务员等级应同步晋/降级。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['晋级','普通乘务员','1000小时','绩效B','测评','扣分'], q:'晋升普通乘务员的条件是什么？', a:'<ul><li>实际飞行时间满1000小时（小时累计按5.16规定）；</li><li>上一年度绩效为B（含）以上；</li><li>申请晋级前12个月，安全质量分、业务质量分、日常管理分扣分合计≤25分；</li><li>申请晋级前12个月病事假累计≤22天；</li><li>有以下一般及以上级别差错行为的不予晋级；</li><li>人事测评分需达4.177分（满分5分），2次未通过则本次晋级流程终止。</li></ul>由本人向所属分队长申请并填写晋级申请表。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['晋级','晋升乘务长','乘务长','英语证书','CET','托业','见习乘务长'], q:'晋升带班乘务长或乘务长的条件？', a:'晋升带班乘务长需取得以下任一英语证书（未取得前先晋见习乘务长）：乘务中级英语；CET-4/6（分数≥425）；TEM-4/8；托业（分数≥450）。晋升乘务长：见习乘务长不得直接申请（须先晋带班）；带班乘务长等级期间实际飞行满1000小时；上一年度绩效B（含）以上；前12个月三项扣分合计≤25分；病事假≤22天；有一般及以上差错该年度不予晋级；人事测评分≥4.177分（2次未过终止）。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['晋级考试','CBT','90分','补考','30天','流程终止','考试不及格','考试不合格','考试不过怎么办'], q:'晋级CBT考试多少分通过？能补考吗？', a:'所有晋级、恢复等级CBT考核需达到90分（含）以上方可通过对。晋级考试不合格的给一次补考机会，补考时间需与首次考试间隔30天及以上；补考仍不合格的，本次晋级流程终止。晋级流程中的CBT考试需在人事测评完成后的30天内完成（以接收到考试通知时间起算）。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['降级','季度PK','后50%','乘务长','延长','恢复'], q:'什么情况下会季度降级？', a:'季度PK成绩（CBT考试+人事测评）合计得分排名后50%的人员实施季度降级：乘务长降业务等级一级；降级后等级为见习乘务员的，需在见习乘务员岗位延长降级时间；往届季度降级还未恢复等级、再次参加季度PK又被降级的，延长目前等级的恢复时间。普通乘务员（含见习以下）同理按降级要求处理。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['降级','年终绩效','D档','C档','500小时','资质失效'], q:'年终绩效评价D档或连续两年C档会怎样？', a:'上一年度评级为D档或连续两年评级为C档的人员，由部门决定进行转岗、劝退、降级500小时或延长晋级500小时的处理。带班（见习）乘务长岗位年度评级为D档或连续两年C档的，视为带班（见习）乘务长资质失效。因怀孕病假致年度低绩效且符合扣分条件的，可不降级/延长处理。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['降级','身体原因','6个月','身体原因暂停派遣','100小时','会不会降级'], q:'身体原因暂停派遣会不会降级？', a:'身体原因暂停派遣超过6个月（含）的人员需进行降级：见习乘务员延长100小时晋级；普通乘务员降为见习乘务员等级100小时；带班乘务长/乘务长/客舱乘务教员/客舱乘务检查员等级降为普通乘务员等级100小时。降级时间以CCMS调整等级日期起至提交恢复申请表日期为区间计算。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['恢复等级','RQT','200小时','测评','90分','见习'], q:'降级后怎么恢复原等级？', a:'恢复等级需通过360人事测评，并按相应等级参加晋级CBT考核90分（含）以上，CBT可补考一次、间隔30天及以上，补考不过流程终止。普通乘务员等级在飞满100小时后方可申请恢复（恢复原普通等级）。RQT训练后：原普通乘务员从见习乘务员等级开始恢复，飞满200小时恢复普通等级，该200小时期间三项扣分合计≤5分、病事假≤5天，否则该年度不予恢复。带班/乘务长/教员/检查员由低到高逐级恢复。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['双照','同步','晋降级','安全员','乘务员','资质'], q:'双照人员乘务员等级调整时安全员等级会变吗？', a:'会。双照人员涉及的所有晋/降级，安全员和乘务员等级应同步晋/降级。因安全员资质问题致乘务员等级同步降级的，需先完成安全员相应训练、放单后才可申请恢复等级；因乘务员资质问题致安全员等级同步降级的，同理需先完成乘务员恢复流程。恢复顺序依据恢复等级后主要履职部门确定。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 9.1 空勤人力资源管理程序', t:['实力测算','需求人数','公式','组数','缺口','实力需求'], q:'空勤人员实力需求怎么测算？', a:'实力需求人数=月飞行总小时×组系数/期望月飞行时间；保障航班所需组数=月飞行总小时/期望月飞行时间；组人数=（月度总人数+因航班加机组人数）/月度航段总数；人力缺口数=需求乘务员总人数-现有实力人数。现有实力人数=在册人数-培训人数-假期人数-停飞人数-管理人员+变量人数。生产派遣处每月负责测算。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 9.1 空勤人力资源管理程序', t:['疲劳值','850小时','70.83','月平均','年飞行时间'], q:'部门的疲劳系数是怎么算的？', a:'月底疲劳值=在册人数月度平均飞行时间/70.83；年度疲劳值=在册人数年平均飞行时间/850。持有有效训练合格证的客舱乘务员，连续12个日历月平均总飞行时间不得超过850小时，这也是部门保障人员实力的基本要求。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.10 备份人员管理规定', t:['备份','公司备份','家中备份','待命','解备'], q:'备份分哪几种？有什么基本要求？', a:'备份分为公司备份（在公司指定地点待命）和家中备份（在家休息待命）。公司备份须在计划备份时间内至公司备份，未收到另行通知可在备份结束时间直接解备；所在基地当日无后续航班的可申请提前解备。家中备份为24小时备份，须保证接到备上航班电话后3小时内可赶到公司执行任务，并做好随时备上航班的准备。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.10 备份人员管理规定', t:['备份','13分钟','准备室','网上准备','3.5小时','派遣'], q:'备份人员被临时派遣执行航班有什么要求？', a:'公司备份人员接到临时派遣任务，须在通知后15分钟内到达准备室；距离航班计划起飞时间3.5小时以内的临时派遣，AOC专员需在系统中标注"已完成网上准备"。备份人员须保持留于部门的电话真实有效且通讯畅通，按执行航班要求着装化妆、携带过夜物品，完成酒测和签到后可到指定休息场所休息，并保持休息室整洁。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.10 备份人员管理规定', t:['家备','家中备份','3小时','24小时','待命'], q:'家中备份有什么具体要求？', a:'家中备份为24小时备份。家备人员在家休息时应做好随时备上航班任务的准备，须保证在接到备上航班电话后3小时内可以赶到公司执行航班及相关任务。备份时间记录保存在CCMS系统中。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.5 航班留人或调整管理规定', t:['留人','航班调整','长期','近期','临时','CCMS'], q:'航班留人/调整分哪几种？', a:'分为：长期留人计划（提前30个日历日制定，通常指有年度计划安排的工作）；近期留人计划（航班计划发布前15个日历日以上，不涉及航班预排）；临时留人计划（航班计划发布前15日（含）以内，影响航班预排或已发布航班，由生产派遣处根据运行情况决定审批）。均通过CCMS系统占位，由生产派遣处经理审批。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.5 航班留人或调整管理规定', t:['占位','留人占位','地面工作','教员培训','复训','审批'], q:'留人占位类型有哪些？谁来审批？', a:'留人占位类型包括地面工作、教员培训、复训、考试等。地面工作/教员授课/考试类由各需求处室通过CCMS"请假占位"模块申请，生产派遣处经理审批；复训类用训练系统，由乘务培训处申请及审批。占位通常计入值勤。各需求处室每月25日前提交次月需求。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.5 航班留人或调整管理规定', t:['空勤干部','飞行计划','20日','22日','25日','锁班'], q:'空勤干部的飞行计划怎么提交？', a:'生产派遣处计划员每月20日17:30前将空勤干部飞行计划OA反馈至各空勤干部；干部需于每月22日18:00前将次月工作计划反馈；计划员汇总后经部门总经理审核签字，于每月25日17:30前发至生产派遣处经理，并在CCMS"飞行占位"中完成锁班以保障干部飞行小时。干部10天（含）以内临时留人需自找替飞人员。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.9 客舱乘务疲劳管理规定', t:['疲劳','850小时','12个月','总飞行时间','限制'], q:'乘务员飞行时间的疲劳限制是多少？', a:'为避免长期疲劳飞行，持有有效训练合格证的客舱乘务员，连续12个日历月平均总飞行时间不得超过850小时。执行《运行手册》5.10"值勤期限制、飞行时间限制和休息要求"的所有要求。地面行政办公时间、培训时间均不得计入休息期内。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.9 客舱乘务疲劳管理规定', t:['疲劳','会议','培训','考核','4个日历日','24小时'], q:'连续飞行几天后不能安排会议培训？', a:'安排培训、考核、会议等任务时需充分考虑疲劳：乘务员连续飞行4个日历日的最后一个飞行值勤期结束的24小时内，不得安排其执行培训、考核、会议等任务。占用休息期进行录屏会议学习或考核的，参照6.7奖惩管理扣罚。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.9 客舱乘务疲劳管理规定', t:['休息期','00:00','06:00','打扰','短信','值班'], q:'休息期乘务员会不会被打扰？', a:'每日00:00至06:00应避免拨打处于休息期中的乘务员电话，尽量采用短信留言等无打扰方式联络；在值勤任务中有安排休息的机组，应避免在休息期中打扰。已完成任务环（串）的机组，其获得的连续48小时休息期中应包含两个完整的昼夜节律低谷时间休息机会。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.9 客舱乘务疲劳管理规定', t:['疲劳报告','不处罚','无惩罚','上报','分队'], q:'感到疲劳能上报吗？会被处罚吗？', a:'可以，该类报告不会受到处罚。乘务员认为因排班、延误、生活事件等原因造成疲劳或不适、航班连线疲劳度高，可能对飞行安全造成不利影响时，应及时向所属分队报告，由分队结合近期航班连线、生活状况等因素进行初步评估。部门还会定期开展机组疲劳调查并调整航班连线。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.11 乘务排班管理系统操作及使用管理规定', t:['CCMS','排班','航班计划','每周五','19点','值勤'], q:'乘务排班管理系统CCMS有哪些功能？', a:'CCMS（网址ccms.9cair.com）具备航班编排功能（对乘务员值勤时间、飞行值勤期、飞行时间、休息期及疲劳管理、资质有效期进行验证，严禁发布不符合规定的航班）、运行监控功能（对P章限制超限预警）和数据储存功能（历史数据永久存档、不可篡改、可追溯）。航班计划一般于每周五19:00前公布下周计划。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.9 客舱乘务疲劳管理规定', t:['驻外','酒店','休息场所','过夜','机场附近'], q:'过夜驻外休息场所有什么要求？', a:'为机组提供适宜的休息场所，选址优选机场附近、保证机组的睡眠机会、减少通行时间损耗，要求安全、干净、整洁、安静。过夜驻地酒店选择由客舱部亲自参与，保证酒店符合要求。航班长延误致值勤时间增加的，需第一时间安排休息场所，若休息场所无法满足且超过飞行值勤期最大限制时间时，不得安排继续执行航班，应尽快调整航班。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['停飞','类型','刑事','背景审查','证照失效','通报'], q:'什么情况会被停飞？', a:'停飞类型包括：因涉嫌刑事犯罪被立案侦查且被采取刑事强制措施期间，或未撤销案件/未做终止侦查决定的；受到局方、公司/部门管理类处理（通报类）；不符合背景审查；有效职业证照资质失效的。停飞人员的空勤证需回收。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['暂停派遣','休假','处理性','懒散','事件调查'], q:'什么情况会被暂停派遣？', a:'暂停派遣类型包括：休假（病假、事假、其他假期）；分队处理性暂停派遣（不配合班组/分队/分部管理、个人舆情或作风形象造成不良影响、分队评估业务能力不足、个人思想不稳定、特殊情况需部门获批）；其他非处理性原因（离职意向、产假/病假结束等待训练或恢复派遣、事件调查）。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['停飞','通报','7个日历日','培训计划','恢复派遣'], q:'通报类停飞的处理流程是什么？', a:'涉及局方、公司/部门管理类处理（通报类）的停飞，停飞自7个日历日起（不低于通报要求）。由分队长/班组长与责任人沟通，分队长制定培训计划、学习内容并督办完成，恢复派遣前学习内容由分部与安全保卫质量处共同评估。不符合背景审查的停飞，员工需配合政审，分部跟进。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['身体原因','暂停派遣','地面班','随诊','恢复','身体原因暂停派遣'], q:'身体原因暂停派遣有什么要求？', a:'客舱乘务员出现身体不适应立即报告航空医师，并在SMP提交身体原因暂停派遣申请并上传医学证明；应积极报告治疗恢复情况、听从航医就医指导。此类暂停派遣人员不安排地面班。身体原因临时停飞不超过30天且自觉疾病已痊愈的，可走身体原因恢复派遣流程。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['产假','病假','20天','恢复派遣','恢复训练','确认清单'], q:'产假或病假（≥20天）结束怎么恢复？', a:'产假到期、病假（≥20天）结束等待训练期间的暂停派遣，此类人员不安排公司地面班。分队安排学习业务通告、最新手册、服务规范、培训系统课程，完成学习后填写《暂停运行派遣人员恢复运行前业务学习确认清单》并签字，考核通过后评估恢复派遣。产假到期不参加恢复训练的按病事假流程处理。暂停期间体检合格证过期失效的，需先完成体检方可参加训练。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.4 停飞、暂停/恢复派遣人员管理', t:['资质失效','停飞','补考','恢复派遣','钉钉','培训专员','证照失效'], q:'资质证照失效停飞后怎么恢复？', a:'有效职业证照资质失效的停飞，由分队长沟通并制定培训计划，分部督办完成。资质类考核需补考的，培训专员发起钉钉停飞流程并抄送相关人员；补考通过后培训专员发起钉钉恢复派遣流程，流转至综合管理处审批并抄送安全保卫质量处及生产派遣处。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.6 加入机组管理规定', t:['加机组','年假','探亲假','户口所在地','往返'], q:'休年假探亲假可以加机组往返吗？', a:'享有年假/探亲假（连续工作满一年）的空勤人员，每年可加机组往返本人或配偶户口所在地一次，只能选择本人或配偶户口所在地的点对点直达航班（无直达的，可选户口所在地省份内任一城市）。春运、暑运期间不得申请休假加机组。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.6 加入机组管理规定', t:['加机组','申请','96小时','72小时','审批'], q:'加机组申请要提前多久提交？', a:'已公布航班：须在航班计划起飞前提前96小时将加机组申请单提交至各处/分部经理审批，经审批后分队长于起飞前提前72小时交生产派遣处经理审批。未公布航班：航班发布日（每周五）10:00前提交各处/分部经理，12:00前交生产派遣处。取消或变更须在起飞前10小时报AOC专员。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.6 加入机组管理规定', t:['加机组','临时','5小时','72小时','因公','不准'], q:'临时加机组有什么规定？', a:'临时加机组仅受理因临时公务派遣或航班生产需要，不接受私人原因。部门只接受距离计划起飞前5小时外、72小时内的因公临时加机组申请；任何航班计划起飞时刻前5小时内，不接受任何形式的加机组申请。临时加机组原则上不得占用旅客座位，需生产派遣处经理评估确认座位数量。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.6 加入机组管理规定', t:['加机组','因私','2名','旅客座位','国际航线'], q:'加机组的核定有什么限制？', a:'因私加机组不得占用旅客座位，每个航班因私加入机组的空勤人员不得超过2名（含）。国际/地区航班不接受除合同/协议已明确人员以外的因私加机组申请。加机组的乘务员须在所加航班签到前5分钟到达机组准备室签到，携带物品中不得有危险品、毒品、非法刊物等禁运物品。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.11 会议管理', t:['会议','分队长','提前5个工作日','占位','请假','怎么组织'], q:'分队/班组会怎么组织？', a:'分队长/班组长需提前5个工作日将会议时间上报分部经理并告知形式；确定参会名单后至少提前15天填《航班留人/调整申请单》交生产派遣处经理审批，通过CCMS"请假占位"申请地面工作类型占位。会议内容涵盖本月工作要求、通报绩效最高最低人员、表扬、问题回访、专项提升培训、下月计划等。参会人员须携带飞行工作记录本做纪要。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.11 会议管理', t:['会议','纪律','迟到','请假','补会','扣罚'], q:'会议纪律有哪些？迟到或缺席会怎样？', a:'参会人员需按时参会并签到，着装干净得体，会中不做与会议无关的事。因特殊原因无法参会的提前24小时向分队长报告，按病事假流程批假。未参会且未提前请假按无故不参会处罚（参照6.7扣罚）；晚于指定时间到会不得参加当天会议并考核绩效；未参会人员须在7个工作日内补会，超时未补会扣罚并由分部经理督办。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.11 会议管理', t:['会议','会议纪要','分部经理','5个工作日','OA'], q:'会议纪要和签到表怎么归档？', a:'分部会议完成后5个工作日内，分部经理指派负责的分队长将会议签到表（含补会人员）和会议纪要以OA形式发送分部经理并抄送分管副总。分队长还需将完整会议内容的录屏课件上传至"一点知识"培训平台，未现场参会人员须上平台完成对应录屏学习，且禁止将学习任务安排在该人员休息期内。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['制服','换发标准','使用年限','大衣','套装'], q:'制服的换发标准和使用年限是多久？', a:'男乘（含安全员、双照）：制式大衣一件用六年、制式套装二套用四年、长短袖衬衫各二件用一年、单皮鞋一双用一年、肩章一副用一年、领带一条用一年、拉杆行李箱一只用四年、过夜袋一只用六年、风衣一件用四年。女乘（女乘务长）：制式大衣一件用六年、制式套装二套用四年、衬衫各二件用一年、单皮鞋一双用一年、丝巾一条用一年、围裙一件用二年、拉杆行李箱一只用四年、过夜袋一只用六年、化妆包一只用四年、发饰一套用一年、丝袜一套用一年、风衣一件用四年。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['制服','申领','SMP','收货确认','换购'], q:'怎么申领制服？', a:'综合管理处根据后勤基建部集中订购时间发布订购通知，各客舱分部提醒员工在集中订购时间内完成制服申领（SMP员工服务-制服申领）。申领完毕后员工根据系统提示完成收货确认及相关售后。非标配类物件如羽绒服、劳保用品等由乘务员自行按需换购。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['制服','变更','主题航班','评估','整洁得体'], q:'主题航班要临时变更制服款式可以吗？', a:'如遇主题航班需临时变更/增加制服款式，由安全保卫质量处组织相关业务人员进行评估，要求制服整洁、大方、得体，面料透气性好、穿着舒适，尺寸款式不影响乘务员开关舱门和行李架、取用和操作应急设备等。评估通过后由综合管理处向公司后勤基建部提交采购申请。新形象试点涉及制服变更/增加的参照此规定。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['会务','会议','会前30分钟','议程','签到表'], q:'开会前需要做什么准备？', a:'组织处须在SMP-会议管理中预定会议室避免冲突；确定议题、议程、与会者、时间地点并通知；涉及多处的议题事先通知协调；议程责任处提前将内容以PPT上交汇总；会议当天须在会前30分钟做好会场布置（桌椅摆放、卫生），准备好会议材料及签到表。会后2个工作日内做会议总结并编写会议纪要发与会者OA邮箱。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['会议','禁止手机','会场纪律','主持人'], q:'会议实施期间有哪些纪律？', a:'会议须按时举行并于开幕宣布议程；主持人按议程紧凑高效掌握节奏并确定议题结果；会议期间禁止使用手机。会议组织处每周对会议决策跟踪形成工作督办表；会议结束后确保会议室干净整洁、桌椅回归原位。违反会议纪律的，扣除本人及处/队经理当月绩效。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['采购','办公用品','固定资产','低值易耗品','2000元'], q:'办公用品和固定资产怎么区分？', a:'办公用品指日常办公使用、价格低于2000元的用品（如笔、纸张、计算器）；单价2000元以上属固定资产；单价400元～2000元之间、使用年限一年以上的办公及生产用品属低值易耗品。办公用品通过公司统一采购平台采购，低值易耗品和固定资产通过ERP采购申请流程办理，均需部门总经理审批。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['例会','服务例会','安全例会','每月5日','服委会'], q:'部门安全/服务例会怎么开？', a:'安全例会按4.13部门安全例会管理工作程序执行。服务例会：客舱服务部每月召开本部门内部服务会议，一般在服委会结束后召开，每月5日前向服务总监和服务管理部上报本月服务会日期并邀请服务管理部专人参与，传达服委会会议精神、部门服务质量状况及下一步工作，与会人员包括服务质量小组和基层管理干部。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['发文','红文','OA','公文','签批'], q:'公司级红文怎么发布？', a:'有对外或对内发布公司级红文需求的，由部门人员起草，部门总经理初审后由综合管理处经理在OA"公文管理"发起红文流程，经公司相关领导审核批准后发布。排版文字格式以总办发布模板为准。需打印纸质版红文的，待流程结束发布后至相关部门打印盖章。'},
{cat:'任职资格', icon:'📘', src:'管理手册 2.4 岗位说明书', t:['客舱乘务员','学历','大专','18周岁','无犯罪记录'], q:'做客舱乘务员需要什么资格？', a:'任职资格：学历大专及大专以上；政治要求无犯罪记录；年龄年满18周岁；身体要求持有现行有效的CAAC颁发的航空人员体检合格证；能正确听说读写中文、无影响沟通的口音和口吃。培训要求按《客舱乘务员训练大纲》完成初始新雇员培训、航线资格检查并考核合格，取得有效训练合格证，并按要求完成定期复训。'},
{cat:'任职资格', icon:'📘', src:'管理手册 3.1 人力资源管理', t:['实习转正','合同签订','学员','放单','见习'], q:'实习学员什么时候签合同？', a:'学员放单结束后签订合同。综合管理处人事专员收到乘务培训处提供的放单学员名单后，根据名单安排学员放单后合同签订（详见5.3学员管理规定）。学员实习转正合同签订由综合管理处人事专员负责落实。'},
{cat:'任职资格', icon:'📘', src:'管理手册 3.1 人力资源管理', t:['离职','手续','证件回收','空勤登机证','离职清单'], q:'离职手续怎么办理？证件也要交吗？', a:'离职需收取航班所有涉及证件，如空勤登机证、航空安全员执照（如适用）、乘务训练合格证等，并按离职手续清单收取发放的工作物品、手册和资料，由办理人签字确认。涉及双照人员由安全员管理部配合，民航安全员执照如能转入公司按重获资格培训，培训费用自理。具体流程详见手册员工入职/离职/实习终止/调岗管理规定。'},
{cat:'任职资格', icon:'📘', src:'管理手册 3.1 人力资源管理', t:['调岗','调动','交接','手续','证照'], q:'调岗需要办什么手续？', a:'调岗需办理调岗手续及工作交接（详见员工入职/离职/实习终止/调岗管理规定），涉及空勤资质、证照的按相应规定收回或转移。空勤人员转岗时应按需维护其业务等级、资质结束日期（转岗运送按6.8业务等级管理规定执行）。具体流程细节以手册原文为准。'},
{cat:'任职资格', icon:'📘', src:'管理手册 5.3 学员管理规定', t:['入队材料','身份证','二寸彩照','建行卡','学信网','学员入队','材料'], q:'学员入队要提交哪些材料？', a:'入队需提交：身份证头像面和国徽面；二寸彩照（入队照）；户口本（首页和本人页）；中国建设银行储蓄卡（一类卡）；学历/学位证书（含英语四六级证书等）；学信网学籍验证报告（打印《教育部学历证书电子注册备案表》）；社保缴费证明；有工作经历的提供退工/离职证明原件。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务检查','监督检查','计划','每月28日','公示'], q:'服务监督检查计划怎么制定的？', a:'安全保卫质量处负责制定部门年度、月度服务监督检查计划。部门于每年12月31日前发布次年年度计划，每月28日前制定下月部门服务监督检查计划并予以公示。检查包含日常检查、整改落实、跟踪验证、回头看验证四部分，方法包括台账检查、线上检查、分队/分部业务检查等。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务检查','不合格','整改','3个工作日','绩效'], q:'服务检查不合格怎么处理？', a:'对检查发现的问题由安全保卫质量处下发整改单并跟踪验证、回头看验证；触及服务底线红线、频发或有升级风险的，限定整改日期，通常3个工作日内责任处/分部/队反馈纠正预防措施并纳入整改闭环。涉及人员违章违规的需跟踪验证1-3个月。检查不合格项纳入服务绩效考核。检查结果不晚于检查后3天公示。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务检查','申诉','复核','争议','现场讲评'], q:'对服务检查结果有异议可以申诉吗？', a:'检查中发现的问题可现场讲评，并请被检查处/队负责人或当事人签字认可。对检查结果存有分歧或争议的，被检查处/队有权向安全保卫质量处申请复核。检查中如发现重大服务事件、瞒报漏报虚报的，按公司《服务事件、差错、违规标准》进行调查。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务问题','跟踪','旅客点评','投诉','分队整改'], q:'旅客点评或服务投诉重复发生怎么办？', a:'对于发生的服务问题（含旅客点评问题以及服务投诉），分队应引起重视。如重复发生多起，视为分队管理缺失，安全保卫质量处将要求分队进行整改并跟踪验证。安全保卫质量处对纠正预防情况进行跟踪验证，并将不合格项纳入服务绩效考核。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务监督','审查','检查单','台账','交接','服务检查','检查前'], q:'服务检查前要准备什么？', a:'安全检查前需提前至少2个工作日发布检查内容、需提供的台账、提交截止时间等信息；检查人员实施检查前要熟悉相关服务标准规范流程、分析收集服务事件、查阅上次监察发现的问题及纠正预防措施以便复查。检查使用服务质量检查单，记录完整准确可追溯。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.30 客舱安全底线和红线', t:['红线','作风纪律','值勤','充电宝','装具'], q:'值勤期间的作风红线有哪些行为类规定？', a:'涉及作风纪律类红线样例包括但不限于：值勤期间使用充电宝、个人飞行装具携带不全等（具体按《安全管理程序手册》5.21及《客舱乘务员手册》3.17.9执行）。未发现自身飞行时间、飞行值勤期、休息期超限未报告的也属作风纪律问题，参照奖惩规定处理。具体扣分标准以奖惩细则为准。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.1 人力资源管理', t:['年度休假','复训月份','避开','年休假计划'], q:'排年休假要避开什么时间？', a:'空勤人员年度休假计划需注意避开个人复训月份，以免影响复训安排。相关部门（综合管理处）协助监督一线人员年度休假计划不涉及其个人复训月份。年休假申请原则、实施办法及待遇详见手册3.1.10假期管理（以手册原文为准）。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.11 乘务排班管理系统操作及使用管理规定', t:['航班计划','发布','预排','在线','乘务门户'], q:'航班计划什么时候公布？在哪里看？', a:'计划专员预先制定航班计划并合理绑定备份，尽量避免非计划的机组调配。根据航班预排及发布要求，每周五19:00前公布下周的航班计划。乘务员可通过乘务门户（CC系统）、SMP/SMP和排班系统查询航班任务。排班系统会对值勤期、飞行时间等做超限验证和预警。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 5.15 证件管理规定', t:['台湾证','入台证','赴台证','签注','证照'], q:'台湾证照（入台证/通行证）怎么办理？', a:'入台证（台湾地区入出境许可证）、赴台通行证（往来台湾通行证签注）由乘务培训处协同人力资源部办理，办完后与机组运行保障室交接；办理及续办期间由客舱分部收取相关证件并协助收集材料，生产派遣处负责证件续办期间的人员航班调整。乘务员须按季度完成国际/地区证件的办理、续办。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 3.1 人力资源管理', t:['考勤','出勤','仪容','着装','地面班'], q:'空勤管理人员出勤有什么仪容着装要求？', a:'空勤管理人员在地面出勤期间需着制服或正装，保持干净整洁、仪表端庄（检查/审核等工作场景分别按相应规定执行）。因前一日航班落地后休息期已满足12小时但次日该上班的，在符合值勤期与休息期前提下须到公司上班。具体出勤要求详见手册3.1.8空勤管理人员考勤管理。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.4 综合保障', t:['员工服务','制服申领','SMP','后勤','综合管理处','制服问题'], q:'制服问题找谁反馈和解决？', a:'员工反馈制服问题由各分部收集并提交综合管理处处理；综合管理处负责年度制服更换人员名单统计、制服发放及处理分部反馈的制服问题。制服申领通过SMP员工服务-制服申领完成，非标配类物件（羽绒服、劳保用品等）由乘务员自行按需换购。'},
{cat:'综合管理', icon:'📘', src:'管理手册 5.1 客舱乘务员培训和考核管理规定', t:['培训计划','月度','乘务培训处','名单','留人'], q:'乘务员月度培训计划怎么定？', a:'春秋航空培训中心制定新雇员、初始训练月度计划；乘务培训处每月初根据年度计划制定次月各类资格训练名单并完成任务编排，对学员和教员进行系统留人、录入系统。月度培训计划需包含培训日期、培训类别、科目、课时、完成时限等。培训专员每月月底前填写《培训计划表》明确各要素。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.8 业务等级管理', t:['A321','8号位','资质维护','放单','标识E'], q:'A321机型8号位资格怎么维护？', a:'培训专员将参加A321培训人员名单书面提供给综合管理处，综合管理处参照外基地晋升带班乘务长条件筛选（按运行需求视情调整），报各分部经理、安全保卫质量处经理审核后反馈培训专员。名单内人员完成A321放单检查后，由培训专员在CCMS系统中维护8号位资质，标识为E。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.4 服务监督检查', t:['服务红线','底线','服务事件','差错'], q:'服务红线底线和差错怎么判定？', a:'服务管理重点防控服务事件、差错、违规，按公司《服务事件、差错、违规标准》（CQH-SQMM-3.15）判定处理。检查中如发现重大服务事件、瞒报漏报虚报等按该标准进行调查，服务差错或事故也同样按该标准执行。触及部门服务底线、红线的问题频发或有升级风险的，下发整改单限期整改。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.35 酒精测试管理规定', t:['酒测','签到','吹气','1-2秒','视频','SMP'], q:'酒测具体怎么操作？', a:'酒测时向吹嘴处（建议25cm以内）吹气1-2秒，经仪器分析2-3秒后显示屏显示结果并语音提醒。数值小于10mg/100mL即正常；大于等于10mg/100mL应主动联系航医或检测人员确认检测。过夜站点未配备航医且无空勤管理员的，立即通过SMP远程问诊与航医建立联系，并保持在视频可见范围内接受监督式确认检测。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.33 客舱部值班管理规定', t:['酒测','重点人员','外基地','预先检测','酒测仪'], q:'酒测重点人员或外基地怎么预检？', a:'外基地重点人员由基地队长/班组长航前完成酒测预检；队长/班组长临时不在准备室的，重点人员需使用部门酒测记录仪自行完成预检并拍照发给队长/班组长。若签到前部门预先检测结果显示有数值，值班经理立即联系乘务调度申请更换人员执行航班。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.3 学员管理规定', t:['学员','退训','直接退训','退回培训中心','放单'], q:'学员什么情况会被退回或退训？', a:'学员带飞期间因工作表现、自身原因等不满足带飞要求的退回培训中心。触发直接退训情况的予以直接退训且不再安排重新入队，具体触发情形详见于手册5.3学员管理规定（如违纪违规、作风不合格等，以手册原文为准）。学员放单结束后未及时签订合同的由综合管理处跟踪办理。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 9.1 空勤人力资源管理程序', t:['实力','在册人数','监控','上报','运行标准部'], q:'空勤人员在册人数怎么监控上报？', a:'生产派遣处每月统计部门空勤人员在册人数并上报运行标准部，由运行标准部报监管局和管理局备案；综合管理处负责在册人数监控并上报公司人力资源部，按年度计划储备空勤人员数量。每月6日前报送上月《客舱实力报表》。安全保卫质量处负责检查在册与需求实力是否符合计划。'},
{cat:'考勤休假', icon:'📘', src:'管理手册 3.1.10.12', t:['请假','请假怎么请','请假流程','年假申请','事假','婚假','产假申请'],
q:'空勤人员请假怎么申请？不同假期走什么流程？',
a:'不同假期申请方式不同：<ul><li><strong>年假/疗养假、产假、哺乳假</strong>：在 SMP 系统填写申请时间段、假期类型、请假事由提交，报告所属分部经理/分队长审核，再经 CCMS"请假占位管理"由生产派遣处计划员最终审核。</li><li><strong>婚假、护产假、丧假、事假、考试假</strong>：至分队长处通过<strong>钉钉</strong>流程申请；事假、考试假审批以航班保障为前提依先后顺序安排。</li><li><strong>事假</strong>：需提前至少一天提出申请；事假不满1天按1天计算，期间每天扣工资固定部分除以当月工作日天数。</li><li>如已有一天以内航班计划需紧急申请护产假、丧假，可向客舱值班经理（18017321071）申请先行调整航班，事后尽快补完手续，否则按旷工处理。</li></ul>'},
{cat:'考勤休假', icon:'📘', src:'管理手册 3.1.10.12.3', t:['病假申请','病假怎么请','病假怎么办','病假流程','请病假','病假单据','医疗观察期'],
q:'空勤人员请病假的具体流程是什么？',
a:'（1）第一时间以电话或现场告知形式通知<strong>航医</strong>，同时在 SMP"请假管理"中提交申请；<strong>批复完成才算请假成功</strong>；（2）请假时间距航班签到12小时内（含12小时）和20:00后请假的，航医批复后需主动致电<strong>值班经理</strong>报备，由值班经理通知AOC专员（乘务）调整航班（电话32315814）；距签到3小时以内的还需向所属分队报备；（3）已开具病假单的提交流程时附上，未开具的在提交后24小时内单独上传；（4）原则上不晚于请假后<strong>5个日历日</strong>将病假单据上交总部，最晚每月30日上交上月26日-本月25日的单据（挂号单原件、药费单原件、病假证明原件、病例记录本复印件），逾期加扣日常管理分10分并按旷工处理；（5）身体康复后联系航医申请恢复飞行资质；如体检暂不符合飞行要求，进入<strong>医疗观察期</strong>评估；（6）续病假视为新流程需重新发起。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.15.5.8', t:['证件续办','证件到期','护照续办','港澳通行证','证件过期','证照换发'],
q:'护照、港澳通行证等国际/地区证件到期怎么续办？',
a:'（1）乘务培训处每月检查证件有效性，并在证件到期至少一个月前告知持有人续办；<strong>证件持有人发现过期或距到期不满一个月，应主动告知乘务培训处</strong>；（2）收到 SMP 证照到期提示后<strong>3天内</strong>在 SMP 发起证照换发流程，<strong>不得私自续办</strong>；（3）特殊情况需提前换发的告知分队长，由分队长 OA 邮件告知乘务培训处申请换发流程；（4）续办期间可通过 SMP"我的档案"证明证件在续办中；（5）需在申请的截止日期30天前完成证件上传；（6）<strong>未接到公司通知私自续办导致无法执行航班、或未及时上报新证信息的，视为遗失证件处理</strong>；（7）因私使用国际/地区证件需至少提前10个工作日钉钉发起"因私使用申请表"，由行政专员在 CCMS 操作证件锁闭；（8）因私原因无证不能飞行的经济损失和补办费用由本人承担。'},
{cat:'业务管理', icon:'📘', src:'管理手册 6.10 C-EFB管理', t:['C-EFB','电子飞行包','智慧客舱','C-EFB维护','iPad'],
q:'客舱电子飞行包（C-EFB）乘务员职责有哪些？',
a:'C-EFB（客舱电子飞行包）是存储、查询和使用运行所需手册和信息，支持客舱运行、培训平台和资质管理的电子信息装置（含智慧客舱等）。客舱机组职责：(1)日常维护，保持航班运行期间软件及相关数据最新有效，航前保证设备<strong>电量满足生产需要</strong>；(2)按手册正确使用和操作，有效处置飞行期间正常、非正常及紧急情况；(3)航前领取设备时检查完好、可正常使用；(4)妥善保管个人C-EFB设备。管理分工：业务标准处负责使用政策和智慧客舱后台维护、保持运行资料有效性；综合管理处负责设备采购预算、发放回收、维修报废、资产管理盘点、备份设备管理。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.8 重要航班保障', t:['重要旅客','VVIP','VIP','CIP','附加服务旅客','要客'],
q:'重要旅客航班怎么保障？VVIP/VIP/CIP/IP分别指什么？',
a:'重要旅客分类：①<strong>VVIP</strong>=国家政要级重要旅客；②<strong>VIP/CIP</strong>=公司级重要旅客（指对公司声誉、效益、发展等具有较大影响的群体，由总裁办判定保障级别）；③<strong>IP</strong>=部门级重要旅客（附加服务旅客），指与部门业务发展密切相关、由申请部门总经理确认并申请，可选服务含托运行李额、升级手提行李、机上餐饮、国际航线客舱座位、尊享飞服务等。保障流程：购票成功后服务专员在销售系统提交附加服务申请，经部门总经理或其授权人员审批；数据推送 SMP、智慧客舱，乘务员在 SMP 航前准备、智慧客舱查看旅客选择的服务信息，<strong>信息不一致时以航班起飞前智慧客舱的信息为准</strong>；乘务组按服务信息为重要旅客提供保障服务。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.15 伤病亡旅客处理', t:['伤病亡','旅客受伤','旅客死亡','第一时间报告','善后小组'],
q:'机上旅客受伤/死亡事件，乘务组怎么报告和处置？',
a:'旅客伤病亡事件（适用于9C实际承运航班机上及上下机过程）：(1)<strong>第一时间报告原则</strong>：事发后/落地后<strong>2小时内</strong>，乘务组立即联系机场医疗急救机构安排救助（涉及治安刑事或死亡还须联系机场公安），立即拨打服务管理部值班电话<strong>180-1732-1077（24×7）</strong>汇报，并拨打值班经理电话；值班经理按受损程度与责任划分决定是否派人陪同/垫付。(2)<strong>第一时间调查原则</strong>：安全保卫质量处调查，提交书面调查报告时限：轻微受伤24小时内、一般受损12小时内、失能或死亡6小时内。(3)<strong>善后统一原则</strong>：公司统筹善后、统一对外信息发布，部门听从善后小组指令；客舱范围伤病亡事件由安全保卫质量处统筹与旅客/家属沟通协商。(4)<strong>收集保全证据原则</strong>：第一时间收集视频、音频、事情经过等证据保存至结案。'},
{cat:'生产派遣管理', icon:'📘', src:'管理手册 10.6 客舱配餐', t:['机组餐','配餐','配餐规则','机组正餐','干点餐'],
q:'乘务组配餐（机组餐）有什么规则？',
a:'配餐基本规则（当地时间）：06:00-09:00早餐（有地面保障能力或酒店能提供早餐的就地用餐、不配机组餐）；11:00-13:30午餐、17:00-19:00晚餐（正餐），公司有地面保障能力的站点可调整为地面用餐，空中和地面用餐<strong>只能二选一</strong>避免重复配备；22:00-05:00配正餐、干点餐或两者组合；航段单程飞行时间<strong>4小时（含）以上需配机组正餐</strong>；同一套机组执行相邻两个航段在同一时间区间内只配一段机组餐。特殊规则：国际计划起飞前6小时、国内计划起飞前4小时不再支持加餐；特殊航班按特殊规则基于机组人数强制配餐或不配餐。配餐计划由乘调席位每日11:45-12:00在航空餐饮管理系统（ams.9cair.com）生成确认。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.4 乘务长管理规定', t:['乘务长','乘务长资格','乘务长竞聘','乘务长条件','乘务长要什么条件','乘务长需要什么条件','乘务长条件有哪些','怎么当乘务长','竞聘乘务长','飞行时间','广播员资格'],
q:'竞聘乘务长需要哪些资格条件？',
a:'乘务长资格要求（5.4.5）：(1)大专及以上文化程度；(2)<strong>3年</strong>客舱乘务员岗位工作经历，实际飞行时间满足<strong>3500小时（上海基地）/2700小时（非上海基地）</strong>；(3)近3年未发生人为责任原因的安全/安保一般差错、一般安全质量及以上事件（管理责任除外）；(4)持有现行有效的体检合格证和训练合格证；(5)按《客舱乘务员训练大纲》完成乘务长培训并考核合格。选聘进入条件还须：上一年度绩效应为B（含）以上（怀孕病假致C/D、且三项扣分合计≤10分、航班生产积分扣分≤500分可豁免）；竞聘前12个月安全质量分/业务质量分扣分合计≤25分、病事假≤22天；6个月内未涉及作风问题清单及以上；取得客舱广播员资格；40周岁（不含）以下需取得相应英语证书（非上海基地除外）。'},
{cat:'综合管理', icon:'📘', src:'管理手册 7.12 示范组', t:['示范组','春秋之翼','示范组招募','纳新','示范组标准'],
q:'示范组（春秋之翼）怎么加入？招募标准是什么？',
a:'示范组名称"春秋之翼"，每年组织一次招募纳新（期间人员流失超过总人数10%及时开启补位），聘用期一年。招募方式：自主报名、分队推荐两种渠道，安全保卫质量处复核无误后面试（分队推荐人员可经内部投票决定是否免试招录），名单公示不少于3天。招募标准：报名前12个日历月内未涉及客舱作风清单、无安全违规及以上事件（含作风）、无服务违规及以上事件；安全质量分、业务质量分扣分合计≤25分，病事假≤22天；非重点人员；原示范组成员调回上海基地后同时满足上述条件可提交《示范组员申请表》经分队评估和审核后重新进入。'},
{cat:'综合管理', icon:'📘', src:'管理手册 3.10 绩效考核', t:['绩效考核','绩效考核多少分','绩效多少分不合格','绩效不合格','绩效怎么算不合格','绩效不合格怎么算','绩效分数','绩效分','80分','班组长75分'],
q:'月度绩效考核多少分算不合格？',
a:'月度绩效考核合格分为<strong>80分</strong>：(1)职能处室专员月度绩效分<strong>低于80分</strong>即为月度绩效考核不合格；(2)<strong>班组长低于75分</strong>为不合格；(3)分队长及处室级干部<strong>低于70分</strong>为不合格。绩效合格指员工工作表现达到岗位基本要求或预期标准，完成岗位职责内的主要工作任务，实现预先设定的绩效目标（如KPI、OKR等）。考核分部门总经理考核与部门内员工考核两个层面，由综合管理处汇总初审、报部门总经理审批后报送公司人力资源部。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.26 安全绩效积分', t:['安全绩效积分','安全积分','绩效评估','结果型','行为型','任务型'],
q:'部门安全绩效积分怎么评？分几类项目？',
a:'安全绩效积分旨在通过数字量化测量 SMS/SeMS 相关要素、客观把握安全状态。评价项目分三类：(1)<strong>结果型</strong>：评估《安全责任书》确定的高风险后果不安全事件（严重差错、严重质量偏差及以上；局方定义的一二类事件；核心风险如颠簸处置、灭火（锂电池）处置、证件管控）和低风险后果不安全事件（违规不安全事件及一般差错/安全质量偏差）；(2)<strong>行为型（过程型）</strong>：评估 SMS/SeMS 管理要求实施项目（安全责任落实、岗位资质（含CRM）、安全信息、风险管理、规章标准、监督审核、事件调查、纠正预防、应急管理）；(3)<strong>任务型</strong>：评估安全任务完成情况（年度安全重点工作、安全整顿、系统评价、纠正预防措施、安全工作会部署等）。月度评估：分队/处室每月1次，安全基础分100分按细则递减，另有安全激励分；结果由总经理助理（安全）审核、部门总经理最终审批。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.9 舆情管理', t:['舆情','舆情上报','舆情怎么上报','舆情上报怎么报','舆情管理','负面舆情','舆情预警'],
q:'发现涉及部门的舆情信息怎么上报？',
a:'（1）全体员工须对任何途径获知的关于部门的舆情信息<strong>主动上报</strong>（电话、信息、邮件等方式均可），积极配合参与部门任何舆情事件的调查、核实及回复，实事求是，杜绝虚假、欺骗、包庇等行为；（2）安全保卫质量处负责舆情收集、分类统计，每日监控公司舆情管理群，根据公司判定的舆情预警等级通知所涉及的处/队负责人或人员，要求其在规定限期内反馈；（3）责任处/队严格按要求在限期内反馈回复，如实调查核实，涉及人员问题的须对其后续工作情况进行<strong>1至3个月</strong>跟踪验证并做好记录；（4）部门总经理根据舆情预警等级判断指导，必要时将该舆情信息上报公司或通知公司相关部门。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.20 乘务长资质管理', t:['乘务长解聘','乘务长被解聘','乘务长解聘条件','乘务长什么情况被解聘','乘务长降级','乘务长暂停','乘务长资质','质量周报','暂停','降级','解聘'],
q:'乘务长在什么情况下会被暂停、降级或解聘？',
a:'乘务长资质暂停、降级及解聘规定（能者上、不胜任者让、劣者汰）：<strong>解聘</strong>：服务严重差错事件及以上（管理连带/当事人）；较大/严重安全失信行为（安全严重差错/严重质量偏差、作风红线样例事件等）；年度内服务一般差错累计满2次、或安全一般差错事件/一般安全质量偏差事件累计满2次（管理连带/当事人）；因自身服务态度原因触发质量周报及以上问题累计满2次；乘务长岗位年度绩效D档（按部门统一要求转岗、劝退、降级800小时或延长晋级800小时）。<strong>暂停乘务长岗位派遣、执行乘务员岗位</strong>：同类型安全违规问题累计2次及以上（或民航局有效投诉2次及以上）→<strong>200小时/80天</strong>；同类型服务违规问题累计2次及以上→<strong>150小时/60天</strong>；质量周报累计满3次及以上按对应类型处理。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.7 双照人员', t:['双照人员','双照','安全员乘务员','双照训练','停飞'],
q:'双照人员（既是安全员又是乘务员）有没有专门管理规定？',
a:'双照人员日常管理及训练由乘务培训处与安全员管理部协调：(1)乘务培训处负责传达安全员管理部传达的双照人员各项信息，并确保双照人员乘务员训练与安全员训练<strong>时间无冲突</strong>（占位冲突时向安全员管理部训练专员发起调整申请）。(2)日常训练：收到安全员管理部月度复习资料须通知隶属客舱服务部的双照人员；季度训练时长不足人员，通知所属分队办理<strong>停飞手续</strong>直至日常训练满足；日常训练考核补考不合格人员停飞信息，通知分队办理停飞直至重获资质训练满足。(3)近期经历：客舱部双照人员按5.11"近期经历要求管理"执行；安管部双照人员次月乘务近期经历名单由乘务培训处培训专员每月月底OA发安管部综合处及安全中队。(4)双照人员安全员岗位等级及资质维护详见《安全员管理部管理手册》。'},
{cat:'奖惩扣分', icon:'📘', src:'管理手册 6.7 奖惩管理', t:['安全质量分','业务质量分','日常管理分','航班生产积分','辅收绩效分','热情度积分'],
q:'安全质量分、业务质量分、日常管理分、航班生产积分分别是什么？',
a:'客舱部对空勤人员的量化分主要有六类（6.7.4）：(1)<strong>安全质量分</strong>：评定航班工作中安全工作质量与安全工作作风；(2)<strong>业务质量分</strong>：评定航班工作中服务质量、运行质量；(3)<strong>日常管理分</strong>：评定日常行为与作风表现；(4)<strong>航班生产积分</strong>：按航班生产出勤情况奖励或扣罚，评估航班生产任务完成情况（如非出勤天数涉及调整航班1天的航班生产积分积-50分）；(5)<strong>辅收绩效分</strong>：评定机上销售（辅收）工作质量；(6)<strong>热情度积分</strong>：根据员工积极配合中队、分部工作给予的奖励积分。加减分由各客舱分部统计汇总，综合管理处负责各类加减分统计汇总及申诉最终评定（安全质量分、业务质量分申诉由安全保卫质量处最终评定）。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.21 心理健康', t:['心理健康','EAP','心理援助','心理疏导','睡眠障碍'],
q:'空勤人员心理健康促进（EAP）有哪些安排？',
a:'心理健康促进由综合管理处经理配合飞行标准管理部开展：组织乘务员参与心理健康<strong>评估、心理健康讲座、团体辅导、个体咨询等EAP服务活动</strong>，并对心理评估结果跟踪干预。需求调研通过问卷调查、资料收集、定性访谈形式开展；各客舱分部持续关注乘务员心理状态，发现异常及时报告，收集需求并反馈意见，组织开展空勤管理干部与乘务员沟通会。"职业发展关键节点及特殊压力时期"包括：晋级、降级等职业晋升关键期；婚育/离异/丧亲等个人危机、健康危机、重大疾病诊断等重大生活事件；航空事故或灾难后等。<strong>心理胜任力重点人员</strong>：经民航体检鉴定机构明确因心理疾病或认知障碍鉴定不合格或暂不合格；经专科医院诊断有睡眠障碍、焦虑、抑郁、躯体化障碍等心理疾病；有明显行为及心理异常但不肯配合就医。发现异常应通过正常渠道报告，配合接受EAP服务。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.29 安全生产绩效奖惩', t:['安全生产绩效奖惩','安全奖惩','安全处罚','不安全事件调查申述单','安全申诉'],
q:'客舱安全生产绩效奖惩（安全奖惩）怎么执行？可以申诉吗？',
a:'安全生产绩效奖惩旨在对安全生产和管理过程中先进事迹和不安全行为进行奖惩，发挥激励导向作用。责任追究基本原则：依法依规、公平公正、事实清楚、证据确凿、尽职免责、失职追责、错责相当、宽严相济，具体责任判定按<strong>"谁调查、谁处理"</strong>原则。职责：安全保卫质量处负责调查并提出奖惩意见、监督落实，结果纳入员工个人安全绩效档案；奖惩按公司《安全管理程序手册》5.20执行，部门补充按本手册6.7奖惩管理加扣分；<strong>降岗、降职、降薪、免职、辞退、开除</strong>等行政处罚由综合管理处报人力资源部执行。申诉：被考核人对事件调查和处理不认可，可向所在处室/分部提出<strong>书面申诉</strong>，填写《不安全事件调查申述单》，处室/分部复核后重新上报安全保卫质量处审核或调查，部门总经理审批复核结果，<strong>申诉有效的须撤销/更改原有记录</strong>（事件通报、定性更改或撤销的）。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.10 服务明星', t:['服务明星','服务明星评选','委屈奖','服务表扬','季度明星'],
q:'服务明星怎么评选？评选标准是什么？',
a:'服务明星评选由安全保卫质量处组织（发布评选信息、跟踪协调），客舱分部（各分队）推荐候选人，副总经理确定最终名单并上报部门总经理。评选周期：常规<strong>每季度评选一次季度服务明星</strong>，<strong>年度评选一次年度服务明星</strong>（按服务管理部年度、月度计划落实）。评选标准：主要结合<strong>质量报加分、是否有服务表扬事迹、是否积极参与部门服务质量工作的推进</strong>等维度择优；候选人需提交电子版照片（制服半身照、生活照）及服务明星演讲稿或先进事迹。另有<strong>委屈奖申请程序</strong>（对按规定服务中受委屈的员工给予肯定与激励，见7.10.7）。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.13 兼职乘务员', t:['兼职乘务员','地兼乘','兼职飞行','兼职客舱乘务员'],
q:'兼职乘务员怎么管理？分哪几类？',
a:'兼职乘务员指通过社会招聘或公司内部招聘形成的<strong>非全职飞行</strong>的乘务员，分两类：(1)<strong>兼职客舱乘务员</strong>：公司通过社会招聘的兼职乘务员，或公司内部非客舱服务部/非地面服务部编制的乘务员；(2)<strong>地面服务部兼职乘务员</strong>：隶属上海春华航空地面服务部，简称"地兼乘"。管理分工：客舱综合兼职分队负责航班生产申请受理、派遣计划通知生产派遣处、晋级和恢复等级申请的受理与资格审核、飞行前业务水平考核、飞行前飞行信息审核；地兼乘轮岗期间回客舱服务部飞行前需业务考试及成绩统计，轮岗前回收、轮岗后发放空勤登机证；生产派遣处负责计划编排航班任务；乘务培训处接收培训/体检安排反馈；安全保卫质量处负责监督检查与空勤登机证管理发放；综合管理处负责奖惩统计汇总、与地服部对接日常管理并上报等级调整信息。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.18 异地派驻', t:['异地派驻','外站管理','帮飞','短派','派驻'],
q:'乘务员异地派驻（外站帮飞/短派）怎么管理？',
a:'异地派驻人员指在<strong>非其行政所属基地</strong>运行的人员（属地人员=在其本场运行的人员）。管理要点：(1)对派驻至外基地的上海乘务员实行<strong>"包干制度"</strong>，由相应分部经理总负责，外基地按划分表由对口分部经理/副经理本人或其指定人员作为<strong>异地派驻临时管理人员</strong>；(2)派驻外站员工发生问题，除追究当事人所属分部经理、分队长、班组长管理责任外，还追究对应管理责任人及异地派驻临时管理人员的管理责任；(3)当外站乘务组在属地的<strong>帮飞或短派高于属地人员20%</strong>时，启动异地派驻临时管理人员的配备；(4)临时管理人员负责异地派驻人员监督检查和现场管理、开展安全教育培训并传达重要文件/会议精神、落实首问责任制及时反馈问题、协助违规人员调查及停飞期间工作安排与监督；(5)实际属地和外站划分以OA邮件或通告为准。'},
{cat:'组织机构与职责', icon:'📘', src:'管理手册 2.1 客舱服务部组织机构与岗位设置', t:['组织架构','处室','分部','5处室7分部','技术评审委员会'],
q:'客舱服务部组织机构（处室/分部）怎么设置？',
a:'客舱服务部（2.1）由各处室及各客舱分部组成：<strong>5个处室</strong>——综合管理处、安全保卫质量处、业务标准处、生产派遣处、乘务培训处；<strong>7个客舱分部</strong>——客舱虹桥分部、客舱浦东分部、客舱综合一分部、客舱综合二分部、客舱双照分部、客舱河北分部、客舱兰州分部。<strong>客舱技术评审委员会</strong>由部门总经理组织设立，是部门运行及管理工作的评审机构：主任为客舱服务部总经理，委员含客舱部副总经理（标准、训练）、总经理助理（安全/运行）、各处室经理（含副）、分部经理、客舱检查员代表，外部门委员为安监部客舱监察员、运标部客舱运行标准专员（名单见每年发布的聘文）。'},
{cat:'组织机构与职责', icon:'📘', src:'管理手册 1.2/1.4/1.5/1.6/1.9/1.10/2.5/2.6/2.7/2.8 航前合规', t:['确认飞行资料','飞行装具','挎包','操作资格','进出驾驶舱','飞行前证件','航前','装具'],
q:'乘务员航前需要确认哪些资料、装具和资格？',
a:'航前合规要求（管理手册系列）：<strong>确认体检合格</strong>（1.2）；<strong>确认飞行资料</strong>（1.5）——按机型/航线要求携带和确认各类飞行文件资料；<strong>确认飞行装具</strong>（1.6）——证件、装具在位有效；<strong>完成飞行前机供品及服务准备</strong>（1.9，与客舱服务规范3.x一致）；<strong>确认挎包、器械</strong>（1.10，涉及空勤登机证与器械管理按12.14航空安全员器械管理规定）。操作类合规：<strong>遵守操作资格</strong>（2.5）——仅具备相应机型/职位资格方可执行相应任务；<strong>遵守安全带使用</strong>（2.6）、<strong>遵守进出驾驶舱</strong>（2.7，仅2名值勤乘务员且经机长同意进入）等。具体以各章节原文为准。'},
{cat:'运行合规', icon:'📘', src:'管理手册 2.9/2.10/2.11/2.12/2.13/2.14/2.15/2.16 运行阶段合规', t:['运行阶段','巡航值守','离机前任务','飞后讲评','航空器安保检查','非法干扰','各阶段'],
q:'乘务员在运行各阶段（值守/离机/讲评/安保）有哪些合规要求？',
a:'运行阶段合规（2.9-2.16系列）：<strong>遵守运行阶段要求</strong>（2.9）——按规定在值勤位就座、系好安全带等；<strong>保持驾驶舱和客舱间通讯畅通</strong>（2.10）；<strong>遵守巡航中的值守要求</strong>（2.11）；<strong>离机前完成飞行任务</strong>（2.12）——离机前完成机上各类记录与交接（飞行记录本、起飞时间等）；<strong>完成飞行后讲评</strong>（2.13，同5.7航后讲评）；<strong>完成航空器安保检查</strong>（2.14）——按安保检查制度完成航段客舱安保检查；<strong>完成非法干扰行为报告</strong>（2.15）——发现非法干扰情况按程序报告处置；<strong>遵守携带武器规定</strong>（2.16，涉及押运/安保特殊航班）。各条目执行细节详见手册对应章节原文。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.1/4.2/4.3/4.4/4.5 安全政策与风险', t:['安全政策','安全目标','安全生产责任','安全信息报告','安全风险'],
q:'部门安全政策目标、信息报告和风险管理程序有什么要求？',
a:'安全/安保管理基础程序（4.1-4.5）：<strong>4.1 安全/安保政策与目标</strong>——确立部门安全政策和目标，与公司安全管理体系一致；<strong>4.2 全员安全生产责任制建设方案</strong>——明确各级岗位安全生产责任；<strong>4.3 安全政策和目标管理</strong>——政策目标的制定、宣贯、评估；<strong>4.4 安全/安保信息报告管理工作程序</strong>——员工发现不安全事件/隐患按程序上报（如无惩罚报告、SQM等渠道），做到及时、真实、准确；<strong>4.5 部门安全风险管理工作程序</strong>——危险源识别、风险评估、管控措施及有效性与闭环管理（结合隐患排查、风险沙盘机制）。具体程序内容与表格详见手册4.1-4.5原文。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.6/4.7/4.8 检查审核事件调查', t:['持续检查','审核','事件调查','安全监督'],
q:'部门安全持续检查、审核、事件调查程序怎么运转？',
a:'安全监督类程序（4.6-4.8）：<strong>4.6 安全/安保持续检查工作程序</strong>——通过日常/专项检查发现运行中的安全与安保问题，明确检查的组织、频次和问题处理；<strong>4.7 安全/安保审核工作程序</strong>——对安全体系要素进行内部审核，审核发现的不合格项纳入纠正闭环；<strong>4.8 安全/安保事件调查程序</strong>——对不安全事件开展调查，遵循依法依规、事实清楚、证据确凿、尽职免责、失职追责等原则查明原因、认定责任、提出整改。检查/审核/调查发现的问题按4.10不合格项目与纠正预防程序闭环。执行细节以手册原文为准。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.9/4.10/4.11 绩效测量与纠正', t:['安全绩效测量','不合格项目','纠正预防','系统评价'],
q:'安全绩效测量、不合格纠正、数据分析与系统评价程序？',
a:'安全绩效与改进程序（4.9-4.11）：<strong>4.9 安全绩效测量工作程序</strong>——对各安全绩效指标进行测量和监测（安全信息报告数量、事件率等）；<strong>4.10 不合格项目与纠正预防管理程序</strong>——不合格类型分违规不合格、一般不合格、观察项和严重不合格，来源包括二三方审核发现、风险管理和事件调查发现、部门数据分析和系统评价发现及监督检查发现等；发现后制定纠正预防措施并审批，措施落实后需评估验证有效性，形成闭环；<strong>4.11 数据分析与系统评价管理程序</strong>——利用数据分析评价安全绩效与体系适宜性、有效性。具体模板以手册原文为准。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.12/4.13/4.14/4.15 绩效例会教育文件', t:['安全绩效管理','安全例会','安全教育培训','安全文件记录'],
q:'安全绩效管理规定、安全例会和教育培训、文件记录程序？',
a:'安全运行保障类程序（4.12-4.15）：<strong>4.12 部门安全绩效管理规定</strong>——安全绩效指标设定、考核与结果应用（与4.26安全绩效积分联动）；<strong>4.13 部门安全例会管理工作程序</strong>——定期召开安全例会，研究安全形势与隐患整改；<strong>4.14 安全教育培训工作程序</strong>——按年度计划开展安全教育培训并记录培训档案；<strong>4.15 安全/安保文件及记录工作程序</strong>——安全类文件与记录的编制、审批、发布、保存和销毁。各类程序适用范围、时间节点以手册原文为准。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.16/4.17/4.18 消防与防汛', t:['消防安全','宿舍消防','防汛抗台','消防检查'],
q:'部门消防安全、集体宿舍消防和防汛抗台预案？',
a:'消防与灾害类程序（4.16-4.18）：<strong>4.16 消防安全管理规定</strong>——部门办公及运行场所消防管理，明确消防检查、隐患整改和消防器材管理；<strong>4.17 集体宿舍消防安全管理规定</strong>——空勤集体宿舍用电、用火、逃生通道与消防器材管理要求，严禁违规用电等；<strong>4.18 防汛抗台处置预案</strong>——汛期/台风季节的预案启动、人员值班、航班运行调整与应急处置要求。具体条款以手册原文章节为准。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 4.19/4.20/4.21 应急与档案', t:['应急处置','风险评估专家小组','安全绩效档案'],
q:'应急处置管理程序、风险评估专家小组、安全绩效档案？',
a:'应急与档案类程序（4.19-4.21）：<strong>4.19 应急处置管理程序</strong>——突发事件的应急响应、信息上报、处置流程与总结；<strong>4.20 客舱风险评估专家小组工作程序</strong>——组建客舱风险评估专家小组，对客舱安全风险开展专业评估；<strong>4.21 安全绩效档案管理规定</strong>——为员工建立安全绩效档案，安全奖惩、事件等信息记入档案并按规定保存。具体要求以手册原文为准。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.1/7.2 服务文化', t:['服务文化','服务理念','服务目标','微笑传真情','首问责任制'],
q:'公司/部门的服务文化、服务目标和使命是什么？',
a:'服务文化（7.1-7.2）：公司服务文化是在长期为旅客服务过程中形成的服务理念、职业观念等服务价值取向的总和；部门以公司服务质量方针<strong>"安全、准点、便捷、绿色"</strong>为核心构建服务文化。<strong>客舱服务目标</strong>：提供"安全、准点、便捷、温馨"的高性价比航空运输服务；<strong>使命</strong>：在航班服务中展现乘务员年轻、充满活力的精神面貌，为旅客提供个性化、精准化的高品质服务；<strong>愿景</strong>：通过客舱服务品质助力公司成为东北亚地区低成本航空公司的领导者。<strong>服务理念</strong>：微笑传真情、服务暖人心——以旅客为中心、主动热情微笑服务、坚持首问责任制，重点关注机上温度气味与广播质量、做好重点人员与重点航班保障。'},
{cat:'服务管理', icon:'📘', src:'管理手册 7.3/7.5/7.6/7.7/7.14 服务质量管理', t:['服务信息报告','服务教育培训','服务绩效管理','服务质量管理','服务风险'],
q:'服务信息报告、服务教育培训、服务绩效/质量/风险管理有什么规定？',
a:'服务管理程序（7.3/7.5-7.7/7.14）：<strong>7.3 服务信息报告管理规定</strong>——服务表扬、投诉、意见建议等信息的收集报告；<strong>7.5 服务教育培训</strong>——按计划开展服务类培训教育；<strong>7.6 服务绩效管理</strong>——服务绩效指标设定与考核（与质量报、服务明星等联动）；<strong>7.7 服务质量管理</strong>——服务质量检查、问题整改与改进（含质量报加分）；<strong>7.14 服务风险管理程序</strong>——识别服务风险并采取防控措施。详细流程以手册原文为准。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.1/8.2/8.3 分队班组管理', t:['班组建设','五到班组','五到是什么','班组五到','五到','分队长','班组长','心理疏导'],
q:'分队/班组管理有什么规定（理念、基本要求、五到班组）？',
a:'分队/班组管理（8.1-8.3）：<strong>管理理念</strong>——党建引领、班组先行，党员发挥模范带头作用；以班组成员为主体将核心文化理念融入日常管理，营造积极向上、充满活力的团队氛围；加强爱岗敬业、诚实守信、遵章守纪、团结和谐、开拓创新和提升执行力为主要内容的班组文化建设，可组织公益活动、党建、旗袍文化、太极、足球、团队凝聚力等活动。<strong>基本要求</strong>——分队长/班组长必须坚持党的领导、发挥党员先锋模范作用，推动分队/班组制度化规范化；分队/班组是管理"<strong>心理疏导员</strong>"，发挥"赋能、预防、干预"作用，及时识别员工异常情绪并发挥"发现、疏导、上报"作用；分队长/班组长应关心一线安全想在前、安全思想工作做在前、遵守安全制度走在前、安全管理工作干在前，做到嘴勤耳勤眼勤手勤腿勤尽职尽责；落实"<strong>五到</strong>"班组工作——安全教育到班组、手册执行到班组、技能培训到班组、风险防控到班组、作风建设到班组；通过定期排摸沟通了解员工工作/生活思想状况与困难，提供解决办法。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.5 热情度积分管理', t:['热情度积分','积分','积极工作','学分','兑换'],
q:'热情度积分什么用？怎么加分？',
a:'热情度积分（8.5）：指根据员工<strong>积极配合部门工作</strong>给予奖励累计量化的数字，用于鼓励积极参与、支持部门工作的员工获得更多晋升、培训、休假等机会。评定职责：分队长负责热情度积分评定、统计、汇总、积分兑换及存档。加分细则：奖惩分、工作评定已涵盖的不再重复加分；<strong>班组长及以上管理干部不享受热情度加分</strong>；每月加分上限参照8.5.5；每月15日前分部经理将热情度积分数据上报综合管理处进行兑换存档。'},
{cat:'人员管理', icon:'📘', src:'管理手册 8.8/8.9/8.10/8.12/8.14/8.15/8.16/8.17/8.19 人员管理与评优', t:['属地分配','外站管理','团建','最佳分队','红河乘务员','班组长任职资格','分部先进','年终述职'],
q:'人员属地分配、外站管理、评优评选（最佳分队/先进/班组长任职/述职）有哪些规定？',
a:'人员管理与评优系列（8.8-8.19）：<strong>8.8 属地分配及调整规则</strong>——乘务员行政属地/基地分配与调整规则；<strong>8.9 外站管理规定</strong>——外站驻站/派驻期间的管理要求（与8.18异地派驻衔接）；<strong>8.10 团建活动</strong>、<strong>8.12 最佳分队/班组评选</strong>——按评选标准定期评选先进分队班组；<strong>8.13 兼职乘务员</strong>（见人员管理条目）、<strong>8.14 红河乘务员管理规定</strong>、<strong>8.15 乘务长、乘务员绩效管理</strong>——个人绩效目标、考核与结果应用；<strong>8.16 班组长/分队长任职资格</strong>——任班长、分队长的资质条件与选拔；<strong>8.17 分部先进评选标准</strong>、<strong>8.19 年终述职</strong>——管理人员年度述职。各规定详见手册对应章节原文。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.5/5.6 教员检查员管理', t:['乘务教员','A类教员','B类教员','教学事故','检查员'],
q:'客舱乘务教员（A类/B类/其他类）和检查员怎么管理？',
a:'客舱乘务教员管理（5.5）：按《客舱乘务员训练大纲》分两类——<strong>A类客舱乘务教员</strong>履行客舱乘务学员飞行经验指导（带飞）职责；<strong>B类客舱乘务教员</strong>履行地面理论、实操及考核训练职责；另有其他类教员担任礼仪类、销售类和救生类教学。<strong>教学事故</strong>包括但不限于：违反国家法律法规或公司规章、违背师德或影响教师形象；体罚学员、品行不良、侮辱学生影响恶劣；经教学检查或学生与同行教员反映效果差、调查评估属实且整改期内无改进；违反教学纪律不完成教学任务或拒绝履行职责工作；工作失职造成重大责任事故或运输安全严重差错；未经许可擅自对外授课或内部资料移用外泄；教员授课评分年度低于4.5分等。客舱乘务检查员管理按5.6（检查员资质、聘任与职责）。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.8/5.9/5.13/5.14/5.19/5.20/5.21 训练体系', t:['重获资格训练','CRM训练','训练机构','乘务员档案','干部培训'],
q:'重新获得资格、CRM、训练机构、档案和干部培训怎么管理？',
a:'训练体系管理（5.8-5.19系列）：<strong>5.8 重新获得资格训练管理规定</strong>——长时间未飞行/资格失效人员的复训要求与流程；<strong>5.9 客舱乘务员CRM训练管理规定</strong>——机组资源管理（CRM）训练的实施与要求；<strong>5.13 客舱训练机构管理</strong>——训练机构资质、设施与管理；<strong>5.14 客舱乘务员档案和记录管理规定</strong>——人员训练、资质、体检等档案的建立与记录管理；<strong>5.19 客舱管理干部培训管理程序</strong>（及5.20培训方案）——管理干部培训的申报、实施与记录；<strong>5.21 客舱服务部内训师管理规定</strong>——内训师选拔与授课管理。具体要求以手册原文为准。'},
{cat:'业务与实力管理', icon:'📘', src:'管理手册 6.1/6.2/6.3/6.4/6.5/6.6/6.11 业务标准管理', t:['业务管理','标准管理','资料管理','项目管理','飞机选型','新开航线','程序评估'],
q:'业务、标准、资料、项目管理及飞机选型、新开航线、程序评估怎么管？',
a:'业务管理系列（6.1-6.11）：<strong>6.1 业务管理</strong>——客舱业务管理制度与流程；<strong>6.2 标准管理</strong>——客舱服务与安全标准制定维护；<strong>6.3 资料管理</strong>——客舱业务资料（手册、通告）发布与受控；<strong>6.4 项目管理</strong>——客舱相关项目的立项、推进与验收；<strong>6.5 飞机选型/改装、投入运行前准备管理程序</strong>——新机型/改装飞机客舱准备；<strong>6.6 新开航线管理</strong>——新开航线客舱保障准备；<strong>6.11 客舱工作程序的评估</strong>——对客舱工作程序定期评估修订。业务等级管理见6.9/6.8（A321 8号位资质维护等）。各程序详见手册原文。'},
{cat:'客舱运行管理', icon:'📘', src:'管理手册 10.1/10.2/10.3/10.4/10.7/10.8 客舱运行', t:['航班计划','派遣','AOC专员','航班连线','运行准点率','新增基地'],
q:'客舱航班生产计划、派遣和AOC专员管理怎么运作？',
a:'客舱运行管理（10.1-10.8）：<strong>10.1 客舱生产计划及派遣管理规定</strong>——通过客舱机组资源生产计划管理提高生产力、降低人力成本；生产派遣处经理负责排班规则参数设置、航班发布审核监控；计划专员负责航班连线分配与编排、航班发布审核、部门留人保障、特需航班人员保障及不正常航班调度；AOC专员（乘务）参与公司AOC值班，确保飞行实施24小时有效监控，协助AOC指挥保障航班正常运行，值班期间确保48小时内客舱乘务员飞行时间、飞行值勤期和休息期符合规章要求，对不合规航班调整。<strong>10.2 客舱运行岗位人员培训管理</strong>、<strong>10.3 航班计划编排工作程序</strong>、<strong>10.4 AOC专员（乘务）工作程序</strong>、<strong>10.7 新增基地、过夜点、航站楼变更管理程序</strong>、<strong>10.8 运行准点率</strong>详见手册对应章节。'},
{cat:'安全/安保管理', icon:'📘', src:'管理手册 12.14 航空安全员器械管理', t:['航空安全员','器械管理','安全员器械'],
q:'航空安全员器械怎么管理？',
a:'航空安全员器械管理（12.14）按程序执行：安全保卫质量处负责航空安全员器械（含执勤器械/装备）的登记、保管、发放与回收等日常管理，器械使用须符合相关规定；具体配备种类、台账与交接流程以手册12.14原文为准。'},
{cat:'任职资格', icon:'📘', src:'管理手册 3.9 乘务长任职资格评定', t:['乘务长任职资格','乘务长评定','乘务长考评','怎么评乘务长','乘务长任职资格评定','乘务长怎么评'], q:'乘务长任职资格怎么评定？', a:'乘务长任职资格评定（3.9）每年<strong>5月份</strong>启动：综合管理处发布通知并按筛选条件筛出考评候选人，经安全保卫质量处审核、各客舱分部推荐后组织考核。<strong>筛选条件</strong>：(1)乘务长等级（从带班乘务长岗位起）飞行时间不得少于<strong>2000小时</strong>；(2)考核期内安全质量分、业务质量分和日常管理分扣分合计须<strong>积正分</strong>；(3)考核期内年终绩效考评成绩为<strong>A（含）以上</strong>或有公司级项目经理经历；(4)销售指标完成率高于考核期内人均指标完成率。<strong>考核标准</strong>：(1)乘务长CBT考核占<strong>40%</strong>，成绩<strong>90分（不含）以下不进入下一轮</strong>；(2)理论答辩占<strong>60%</strong>；(3)附加分：英/日语口语考核合计上限5分；年度公司先进+3分、部门先进+1分。'},
{cat:'培训管理', icon:'📘', src:'管理手册 5.8 重新获得资格训练管理规定', t:['重新获得资格','重获资格训练','重获资格','失去资格恢复','复飞通知单'], q:'失去资格后怎么重新获得资格训练？', a:'重新获得资格训练（5.8）适用于：逾期未完成复训、局方或公司检查未通过、违规达到公司级及以上严重差错，以及因怀孕/伤病/体检等原因失去资格的客舱乘务员。<strong>训练周期</strong>：一年开展四次、<strong>每季度开班一次</strong>。<strong>训练说明</strong>：暂停派遣期间<strong>体检合格证到期或失效</strong>的，须先完成客舱乘务员体检后方可参加理论训练。<strong>流程</strong>：(1)培训专员OA通知各客舱分部下批训练计划，分队长确认参训名单；(2)完成理论学习一周内，学员向所属分队长提出<strong>复飞申请</strong>，分部填写钉钉《空勤人员复飞通知单》；(3)培训专员在CCMS维护学员等级，安排<strong>带飞/航班评估</strong>及航线资格检查。'},
{cat:'综合管理', icon:'📘', src:'管理手册 8.17 分部先进评选标准', t:['先进评选','公司先进','部门先进','评先进','先进标准','评选先进','乘务长','乘务员'], q:'乘务长/乘务员评先进有什么标准？', a:'先进评选（8.17）：<strong>公司级先进</strong>——乘务长、乘务员须同时满足：(1)本年度个人为公司做出<strong>重大贡献</strong>；(2)个人完成了年度工作指标；(3)<strong>成功处置机上安全事件、杜绝安全事故，为公司挽回损失</strong>；(4)本年度服务评价加分、表扬累计<strong>12次</strong>。分队长/班组长另要求：个人表现突出或领导本分队/班组工作取得卓越成绩、本分队/班组完成年度工作指标；分部经理另要求：表现突出多次收到公司表扬、完成本处室年度工作指标。部门级先进范围为乘务长、乘务员，具体标准以手册8.17.2原文为准。'},
];
