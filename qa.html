<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#148453">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="你问我答">
<meta name="format-detection" content="telephone=no">
<title>你问我答 · 春秋全能助手</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --primary:#148453;--primary-dark:#0C5F3A;--primary-light:#3E9E79;
  --primary-soft:#E8F3EE;--primary-mist:#F4F9F6;
  --gold:#F5B800;--gold-soft:#FEF6DC;
  --danger:#C62828;--danger-soft:#FDE7E7;
  --grad-primary:linear-gradient(135deg,#148453 0%,#1FA56A 100%);
  --grad-bot:linear-gradient(160deg,#0E6E48 0%,#178F5C 100%);
  --grad-user:linear-gradient(135deg,#0C5F3A 0%,#148453 45%,#1FA56A 100%);
  --bg:#F5F8F6;--bg-card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#9DB0A6;
  --border:#E5EDE9;--shadow:0 4px 14px rgba(20,132,83,.10);--shadow-lg:0 12px 32px rgba(20,132,83,.14);
  --ring:0 0 0 3px rgba(20,132,83,.16);
}
html[data-theme="dark"]{
  --bg:#0F1A14;--bg-card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;
  --primary-soft:#1A3D2A;--primary-mist:#142E22;--danger-soft:#2A1616;--gold-soft:#2A2410;
  --shadow:0 4px 14px rgba(0,0,0,.35);--shadow-lg:0 12px 32px rgba(0,0,0,.45);
  --grad-bot:linear-gradient(160deg,#0C5F3A 0%,#14593F 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s;}
button{font-family:var(--font-sans);cursor:pointer;}
input,textarea{font-family:var(--font-sans);}
a{color:var(--primary);text-decoration:none;}
button:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--ring) !important;}

/* ===== 顶部 ===== */
.livery-stripe{height:3px;background:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px;transition:background .3s;backdrop-filter:blur(20px);}
.logo{display:flex;align-items:center;gap:9px;min-width:0;}
.logo-badge{width:34px;height:34px;border-radius:11px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;box-shadow:var(--shadow);}
.t-title{font-size:1rem;font-weight:800;color:var(--text);white-space:nowrap;line-height:1.15;}
.t-title small{display:block;font-size:.58rem;font-weight:600;color:var(--text3);letter-spacing:.5px;margin-top:1px;}
.t-ai{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.ai-status{font-size:.66rem;font-weight:700;padding:4px 10px 4px 7px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:var(--bg-card);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.ai-status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.ai-status.on{color:#0B7A43;border-color:#A8E6C4;background:#EFFBF4;}
.ai-status.on::before{background:#0B7A43;box-shadow:0 0 0 3px rgba(11,122,67,.15);}
.ai-status.off{color:#C62828;border-color:#F2B8B8;background:#FDF1F1;}
.ai-status.off::before{background:#C62828;box-shadow:0 0 0 3px rgba(198,40,40,.12);}
.icon-btn{display:inline-flex;align-items:center;gap:4px;min-height:32px;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);font-size:.73rem;font-weight:700;padding:0 10px;border-radius:10px;transition:all .18s;white-space:nowrap;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-mist);transform:translateY(-1px);}

/* ===== AI 新手接入教程 ===== */
.ai-tut{background:var(--primary-mist);border:1px dashed var(--primary);border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.7;}
.ai-tut summary{cursor:pointer;font-weight:800;color:var(--primary-dark);font-size:12.5px;}
.ai-tut ol{padding-left:18px;margin:6px 0 2px;}
.ai-tut li{margin:3px 0;}
.ai-tut .tut-link{display:inline-block;margin-top:4px;color:var(--primary);font-weight:700;}
.ai-warn{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:9px 11px;margin-bottom:12px;font-size:11.5px;color:#7a5c00;line-height:1.7;}
.ai-warn b{color:#6b5200;}

/* ===== 消息容器 ===== */
.chat-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px 6px;scrollbar-width:thin;}
.chat-wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:6px;}

/* 消息（气泡+尾巴+时间） */
.msg{display:flex;gap:9px;max-width:92%;animation:msgIn .28s cubic-bezier(.2,.8,.3,1);}
.msg.user{align-self:flex-end;flex-direction:row-reverse;gap:8px;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:var(--shadow);user-select:none;}
.avatar.bot{background:var(--grad-bot);}
.avatar.user{background:linear-gradient(135deg,#7C3AED,#A78BFA);font-size:.72rem;font-weight:800;color:#fff;}
.bubble{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:.9rem;line-height:1.75;box-shadow:var(--shadow);word-break:break-word;overflow-wrap:break-word;color:var(--text);}
.msg.user .bubble{background:var(--grad-user);color:#fff;border:none;border-radius:16px 4px 16px 16px;box-shadow:var(--shadow);}
.bubble ul{padding-left:18px;margin:4px 0;}
.bubble ol{padding-left:20px;margin:4px 0;}
.bubble li{margin:3px 0;line-height:1.7;}
.bubble strong{color:var(--primary-dark);font-weight:700;}
.msg.user .bubble strong{color:#fff;}
.bubble table{width:100%;border-collapse:collapse;margin:7px 0;font-size:.82rem;}
.bubble th,.bubble td{border:1px solid var(--border);padding:6px 9px;text-align:left;line-height:1.55;}
.bubble th{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;}
.bubble code{background:var(--primary-mist);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:.82em;}
.ts{display:block;text-align:right;font-size:.62rem;color:var(--text3);margin-top:6px;user-select:none;}
.msg.user .ts{color:rgba(255,255,255,.72);}

/* KB 答案增强 */
.kbox{background:var(--primary-mist);border-left:3px solid var(--primary);padding:9px 12px;margin:8px 0;border-radius:0 10px 10px 0;font-size:.84rem;color:var(--text);}
.kbox.warn{background:var(--gold-soft);border-left-color:var(--gold);}
.srcline{font-size:.7rem;color:var(--text3);margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.src-badge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-mist);border:1px solid var(--border);color:var(--text2);font-size:.66rem;font-weight:700;padding:2px 9px;border-radius:12px;}
.jump-btn{border:none;background:var(--primary-soft);color:var(--primary);font-size:.7rem;font-weight:700;padding:4px 12px;border-radius:12px;transition:all .18s;display:inline-flex;align-items:center;gap:4px;min-height:26px;}
.jump-btn:hover{background:var(--primary);color:#fff;transform:translateY(-1px);box-shadow:var(--shadow);}
.qa-title{display:flex;align-items:flex-start;gap:8px;font-weight:800;font-size:.94rem;color:var(--text);margin-bottom:8px;}
.qa-title .qi{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;}

/* ===== 快捷提问（欢迎卡） ===== */
.welcome{border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-lg);background:var(--bg-card);}
.welcome-head{padding:16px 16px 13px;background:var(--grad-primary);color:#fff;}
.welcome-head .w-ttl{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:9px;}
.welcome-head .w-desc{font-size:.78rem;opacity:.92;margin-top:5px;line-height:1.6;}
.welcome-body{padding:12px 14px 14px;}
.w-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:560px){.w-cats{grid-template-columns:repeat(4,1fr);}}
.w-cat{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--bg-card);border-radius:13px;padding:10px 11px;color:var(--text);transition:all .18s;}
.w-cat:hover{border-color:var(--primary);background:var(--primary-mist);transform:translateY(-2px);box-shadow:var(--shadow);}
.w-cat .wc-ic{font-size:1.05rem;}
.w-cat .wc-tl{font-size:.8rem;font-weight:700;color:var(--text);}
.w-cat .wc-st{font-size:.66rem;color:var(--text3);line-height:1.45;}
.w-tips{margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.w-tips .lbl{font-size:.68rem;color:var(--text3);font-weight:700;}
.w-chip{font-size:.72rem;font-weight:600;color:var(--text2);background:var(--primary-mist);border:1px solid var(--border);padding:4px 11px;border-radius:14px;transition:all .16s;}
.w-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}

/* ===== 话术向导 ===== */
.wizard{display:flex;flex-direction:column;gap:11px;}
.wz-bar{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:800;color:var(--primary-dark);}
.wz-bar .wz-no{width:20px;height:20px;border-radius:50%;background:var(--grad-primary);color:#fff;font-size:.68rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.wz-opts{display:flex;flex-wrap:wrap;gap:8px;}
.wz-opt{border:1px solid var(--border);background:var(--bg-card);color:var(--text2);font-size:.8rem;font-weight:600;padding:7px 13px;border-radius:11px;transition:all .18s;}
.wz-opt:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);}
.wz-opt.sel{background:var(--grad-primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px);}
.wz-gen{background:var(--grad-primary);color:#fff;border:none;font-size:.88rem;font-weight:800;padding:10px 20px;border-radius:12px;box-shadow:var(--shadow-lg);align-self:flex-start;transition:all .18s;display:inline-flex;align-items:center;gap:6px;}
.wz-gen:not(:disabled):hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
.wz-gen:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;}
.script-out{white-space:pre-wrap;background:var(--primary-mist);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:.84rem;line-height:1.78;max-height:360px;overflow-y:auto;color:var(--text);}
.cp-btn{border:none;background:var(--gold);color:#6b5200;font-size:.74rem;font-weight:700;padding:6px 14px;border-radius:11px;align-self:flex-start;transition:all .18s;display:inline-flex;align-items:center;gap:4px;min-height:30px;}
.cp-btn:hover{filter:brightness(1.04);box-shadow:var(--shadow);transform:translateY(-1px);}
.act-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}

/* ===== 打字指示 ===== */
.typing{display:inline-flex;gap:4px;padding:8px 2px;align-items:center;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--primary-light);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
.think-label{font-size:.72rem;color:var(--text3);margin-left:8px;}

/* ===== 知识库来源切换 ===== */
.src-tabs{max-width:800px;margin:0 auto;display:flex;gap:6px;padding:0 12px 7px;flex-shrink:0;}
.src-tab{flex:1;border:1px solid var(--border);background:var(--bg-card);color:var(--text2);font-size:.72rem;font-weight:700;padding:7px 4px;border-radius:12px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;min-width:0;}
.src-tab small{font-weight:600;color:var(--text3);font-size:.6rem;display:block;margin-top:1px;}
.src-tab:hover{border-color:var(--primary);color:var(--primary);}
.src-tab.active{background:var(--grad-primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow);}
.src-tab.active small{color:rgba(255,255,255,.8);}

/* ===== 输入区 ===== */
.input-area{border-top:1px solid var(--border);background:var(--bg-card);padding:8px 12px calc(9px + env(safe-area-inset-bottom));flex-shrink:0;}
.input-box{max-width:800px;margin:0 auto;display:flex;gap:9px;align-items:flex-end;}
.ti-wrap{flex:1;display:flex;align-items:flex-end;background:var(--bg);border:1.5px solid var(--border);border-radius:16px;padding:7px 12px;transition:border-color .2s,box-shadow .2s;}
.ti-wrap:focus-within{border-color:var(--primary);box-shadow:var(--ring);background:var(--bg-card);}
.ti{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:.94rem;padding:6px 2px;min-height:30px;max-height:124px;resize:none;line-height:1.5;}
.ti::placeholder{color:var(--text3);}
.send-btn{height:46px;width:46px;min-width:46px;border:none;background:var(--grad-primary);color:#fff;font-size:1.05rem;font-weight:800;border-radius:16px;box-shadow:var(--shadow);transition:all .18s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn:not(:disabled):active{transform:scale(.93);}
.send-btn:not(:disabled):hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.tip-bar{max-width:800px;margin:5px auto 0;font-size:.66rem;color:var(--text3);text-align:center;line-height:1.6;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
}
</style>
<script>
/* 客舱小助手数据包引擎（_sync_packs.py 自动注入；改 docs/_packs_engine.js 后重跑 python _sync_packs.py） */
//__PACKS_ENGINE_START__
/* =============================================================================
 * 客舱小助手 · 数据包引擎 v1（M1.1 单一来源）
 * -----------------------------------------------------------------------------
 * 目的：让"内容数据包"（知识库/销售/题库）以 JSON 覆盖层形式覆盖内嵌基线，
 *       实现"改内容不改代码"。本文件为纯逻辑、零 DOM 依赖，
 *       浏览器挂 window.PACKS / Node 挂 module.exports（供单测与构建校验）。
 *
 * 覆盖语义（与方案文档一致）：
 *   1. 优先级：数据包覆盖层 > 内嵌基线
 *   2. 合并：按 packs_index 中 installedAt 升序逐包执行，同 key 后装者胜
 *   3. delete：从最终视图移除该 key（对基线与已 upsert 的覆盖均生效）
 *   4. 过期：appliedUntil < 今天 → 不参与合并但保留在索引（expired 标记，不删数据）
 *   5. 损坏防护：magic 不符 / JSON 损坏 → 静默忽略该包（控制台仅 warn）
 *
 * 存储抽象：所有函数首参为 store，接口 { getItem(k)->string|null,
 *           setItem(k,v), removeItem(k) }；浏览器传 localStorage，测试传内存实现。
 * -----------------------------------------------------------------------------
 * 数据包 JSON 结构（存 localStorage 键 pack:{packId}）：
 * {
 *   magic: 'cabin-data-pack-v1',
 *   packId: 'sales-2026-09',      // 全局唯一；同 packId 重装 = 整包覆盖升级
 *   type: 'kb' | 'sales' | 'quiz' | 'notice',   // notice 消费端 M2 接入
 *   lib: '',                       // 仅 kb 包：空=全库应用，'ccm'|'mgm'|'svc'|'daily'=单库
 *   title: '秋季机上销售包',
 *   version: 3,                    // 展示用；排序靠 installedAt
 *   issuedAt: '2026-08-29',
 *   appliedUntil: '2026-12-31',    // 缺省=永不过期
 *   items: [ { op:'upsert'|'delete', key:'estee-007', data:{...} } ]
 * }
 * packs_index 索引（存 localStorage 键 packs_index）：
 * { magic:'cabin-packs-index-v1', packs:[ {packId,type,title,version,installedAt,source} ] }
 * ============================================================================= */
(function (global) {
  'use strict';

  var PACKS_MAGIC = 'cabin-data-pack-v1';
  var PACKS_INDEX_MAGIC = 'cabin-packs-index-v1';
  var PACKS_INDEX_KEY = 'packs_index';
  var PACK_KEY_PREFIX = 'pack:';

  function fmtDay(d) {
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var dd = d.getDate();
    return y + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (dd < 10 ? '0' + dd : '' + dd);
  }

  /* ---------------- 索引读写 ---------------- */
  function readIndex(store) {
    try {
      var raw = store.getItem(PACKS_INDEX_KEY);
      if (!raw) return null;
      var idx = JSON.parse(raw);
      if (!idx || idx.magic !== PACKS_INDEX_MAGIC || !Array.isArray(idx.packs)) return null;
      return idx;
    } catch (e) { return null; }
  }
  function writeIndex(store, packs) {
    try {
      store.setItem(PACKS_INDEX_KEY, JSON.stringify({ magic: PACKS_INDEX_MAGIC, packs: packs }));
      return true;
    } catch (e) { return false; }
  }
  /* ---------------- 包读写 ---------------- */
  function readPack(store, packId) {
    try {
      var raw = store.getItem(PACK_KEY_PREFIX + packId);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || p.magic !== PACKS_MAGIC || p.packId !== packId) return null;
      return p;
    } catch (e) { return null; }
  }
  /* 写入原始包数据（不校验语义，供 installPack 内部使用；失败抛给调用方判定） */
  function writePackRaw(store, pack) {
    store.setItem(PACK_KEY_PREFIX + pack.packId, JSON.stringify(pack));
  }

  /* ---------------- 包索引元信息列表 ---------------- */
  /* optType 为空返回全部类型；now 注入当前时间（测试固定日期用） */
  function listPacks(store, optType, now) {
    var idx = readIndex(store);
    if (!idx) return [];
    var today = fmtDay(now || new Date());
    var out = [];
    for (var i = 0; i < idx.packs.length; i++) {
      var e = idx.packs[i];
      if (optType && e.type !== optType) continue;
      var p = readPack(store, e.packId);
      var until = p && p.appliedUntil ? String(p.appliedUntil) : '';
      out.push({
        packId: e.packId,
        type: e.type,
        title: e.title || e.packId,
        version: e.version != null ? e.version : 1,
        installedAt: e.installedAt || '',
        source: e.source || 'import',
        appliedUntil: until,
        expired: !!(until && until < today),
        itemCount: p && Array.isArray(p.items) ? p.items.length : 0,
        valid: !!p
      });
    }
    return out;
  }
  function countPackType(store, type, now) {
    var list = listPacks(store, type, now);
    var active = 0, expired = 0;
    for (var i = 0; i < list.length; i++) {
      if (list[i].expired) expired++; else active++;
    }
    return { total: list.length, active: active, expired: expired, packs: list };
  }

  /* ---------------- 核心：构建某类型的最终覆盖视图 ---------------- */
  /* opts: { now:Date, lib:string }；lib 仅对 kb 包生效（空=全库，'ccm' 等=单库）
   * 返回 { map:{key:data}, kills:[keys], expired:[packIds] }
   *   map   = 所有 upsert 后最终生效的数据（已按后装者胜消解）
   *   kills = 声明过 delete 的 key 集合（对基线生效）
   *   expired = 因过期而未参与合并的 packId 列表 */
  function buildPackMap(store, type, opts) {
    opts = opts || {};
    var today = fmtDay(opts.now || new Date());
    var queryLib = opts.lib || '';
    var map = {};
    var kills = [];
    var expired = [];
    var idx = readIndex(store);
    if (!idx) return { map: map, kills: kills, expired: expired };
    var pending = [];
    for (var i = 0; i < idx.packs.length; i++) {
      var e = idx.packs[i];
      if (e.type !== type) continue;
      var p = readPack(store, e.packId);
      if (!p || !Array.isArray(p.items)) continue;
      if (p.lib && queryLib && p.lib !== queryLib) continue;  // 包声明单库且与查询库不符
      if (p.appliedUntil && String(p.appliedUntil) < today) { expired.push(e.packId); continue; }
      pending.push({ p: p, installedAt: e.installedAt || '' });
    }
    pending.sort(function (a, b) {
      return a.installedAt < b.installedAt ? -1 : (a.installedAt > b.installedAt ? 1 : 0);
    });
    for (var j = 0; j < pending.length; j++) {
      var items = pending[j].p.items;
      for (var k = 0; k < items.length; k++) {
        var it = items[k];
        if (!it || !it.key) continue;
        if (it.op === 'delete') {
          delete map[it.key];
          if (kills.indexOf(it.key) < 0) kills.push(it.key);
        } else if (it.op === 'upsert') {
          map[it.key] = it.data;  // 后装者胜；同 key 被重新 upsert 时"复活"，kills 仍记录
        }
      }
    }
    return { map: map, kills: kills, expired: expired };
  }

  /* ---------------- 消费端辅助：把覆盖视图应用到基线数组 ---------------- */
  /* arr: 内嵌基线数组（必须可原地修改——splice/下标赋值，绝不重建，保持外部引用）
   * res: buildPackMap 返回结果
   * keyOf: item -> key 字符串
   * 顺序：先按 kills 移除基线命中项，再按 map upsert（命中就地替换并去重，缺失 push） */
  function applyMapToArray(arr, res, keyOf) {
    keyOf = keyOf || function (it) { return it && it.id ? String(it.id) : ''; };
    var map = res.map || {};
    var kills = res.kills || [];
    var upserted = 0, deleted = 0;
    if (kills.length) {
      for (var i = arr.length - 1; i >= 0; i--) {
        if (kills.indexOf(keyOf(arr[i])) >= 0) { arr.splice(i, 1); deleted++; }
      }
    }
    var keys = Object.keys(map);
    if (!keys.length) return { upserted: upserted, deleted: deleted };
    var idxByKey = {};
    for (var j2 = 0; j2 < arr.length; j2++) {
      var kj = keyOf(arr[j2]);
      if (!idxByKey.hasOwnProperty(kj)) idxByKey[kj] = [];
      idxByKey[kj].push(j2);
    }
    for (var m = 0; m < keys.length; m++) {
      var mk = keys[m];
      var hit = idxByKey.hasOwnProperty(mk) ? idxByKey[mk] : null;
      if (hit && hit.length) {
        arr[hit[0]] = map[mk];
        for (var r = hit.length - 1; r >= 1; r--) arr.splice(hit[r], 1);  // 去重（保留首个位置）
      } else {
        arr.push(map[mk]);
      }
      upserted++;
    }
    return { upserted: upserted, deleted: deleted };
  }

  /* ---------------- 安装 / 移除 / 迁移 ---------------- */
  function installPack(store, pack, source, now) {
    if (!pack || pack.magic !== PACKS_MAGIC) return { ok: false, reason: 'magic' };
    if (!pack.packId || typeof pack.packId !== 'string') return { ok: false, reason: 'packId' };
    if (!pack.type) return { ok: false, reason: 'type' };
    if (!Array.isArray(pack.items)) return { ok: false, reason: 'items' };
    var idx = readIndex(store) || { packs: [] };
    var ts = (now || new Date()).toISOString();
    // 同 packId 重装 = 整包覆盖升级（删除旧索引条目再追加，保持时间序）
    idx.packs = idx.packs.filter(function (e) { return e.packId !== pack.packId; });
    idx.packs.push({
      packId: pack.packId,
      type: pack.type,
      title: pack.title || pack.packId,
      version: pack.version != null ? pack.version : 1,
      installedAt: ts,
      source: source || 'import'
    });
    try { writePackRaw(store, pack); } catch (e) { return { ok: false, reason: 'storage' }; }
    if (!writeIndex(store, idx.packs)) return { ok: false, reason: 'index' };
    return { ok: true, packId: pack.packId, installedAt: ts };
  }
  function removePack(store, packId) {
    var idx = readIndex(store);
    if (!idx) return { ok: false, reason: 'no-index' };
    var n0 = idx.packs.length;
    idx.packs = idx.packs.filter(function (e) { return e.packId !== packId; });
    if (idx.packs.length === n0) return { ok: false, reason: 'not-found' };
    try { store.removeItem(PACK_KEY_PREFIX + packId); } catch (e) {}
    writeIndex(store, idx.packs);
    return { ok: true };
  }
  /* 旧版知识覆盖层（kb_overlay_v1）→ kb-legacy 数据包（幂等，已迁移则跳过）
   * opts: { legacyKey, legacyMagic, now }；成功后删除旧键 */
  function migrateLegacyOverlay(store, opts) {
    opts = opts || {};
    var key = opts.legacyKey || 'kb_overlay_v1';
    var magic = opts.legacyMagic || 'kb-overlay-v1';
    // 幂等优先：已迁移过（无论旧键是否仍在）→ already，不再重复建包
    var idx0 = readIndex(store);
    var already0 = idx0 && idx0.packs.some(function (e) { return e.packId === 'kb-legacy'; });
    if (already0) return { ok: false, reason: 'already' };
    var raw;
    try { raw = store.getItem(key); } catch (e) { return { ok: false, reason: 'read' }; }
    if (!raw) return { ok: false, reason: 'empty' };
    var ov;
    try { ov = JSON.parse(raw); } catch (e) { return { ok: false, reason: 'corrupt' }; }
    if (!ov || ov.magic !== magic || !ov.byLib || typeof ov.byLib !== 'object') return { ok: false, reason: 'magic' };
    var items = [];
    for (var lib in ov.byLib) {
      if (!Object.prototype.hasOwnProperty.call(ov.byLib, lib)) continue;
      var arr = ov.byLib[lib];
      if (!Array.isArray(arr)) continue;
      for (var i = 0; i < arr.length; i++) {
        var e = arr[i];
        if (!e || !e.q) continue;
        items.push({ op: 'upsert', key: e.src || (lib + '-' + i), data: e });
      }
    }
    if (!items.length) return { ok: false, reason: 'empty-items' };
    var pack = {
      magic: PACKS_MAGIC,
      packId: 'kb-legacy',
      type: 'kb',
      lib: '',
      title: '旧版知识覆盖层（自动迁移）',
      version: 1,
      issuedAt: '',
      appliedUntil: '',
      items: items
    };
    var r = installPack(store, pack, 'migrate', opts.now);
    if (!r.ok) return r;
    try { store.removeItem(key); } catch (e) {}
    return { ok: true, itemCount: items.length };
  }

  var PACKS = {
    MAGIC: PACKS_MAGIC,
    INDEX_MAGIC: PACKS_INDEX_MAGIC,
    INDEX_KEY: PACKS_INDEX_KEY,
    readIndex: readIndex,
    writeIndex: writeIndex,
    readPack: readPack,
    listPacks: listPacks,
    countPackType: countPackType,
    buildPackMap: buildPackMap,
    applyMapToArray: applyMapToArray,
    installPack: installPack,
    removePack: removePack,
    migrateLegacyOverlay: migrateLegacyOverlay
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = PACKS;           // Node（单测 / 构建校验）
  }
  if (typeof window !== 'undefined') {
    window.PACKS = PACKS;             // 浏览器（qa / beauty / quiz / kb-admin）
  } else if (typeof globalThis !== 'undefined') {
    globalThis.PACKS = PACKS;
  }
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));
//__PACKS_ENGINE_END__
</script>

<script>
/* ===================== 多行输入自适应（与底部输入联动共用，见启动段） ===================== */
const qaInput = document.getElementById('qaInput');

/* ===================== SpringAI 客户端（与美妆板块共用同一套配置） ===================== */
const SpringAI = (function(){
  const CFG_KEY = 'spring_ai_cfg';
  const PROVIDERS = {
    zhipu:       { key:'zhipu',       name:'智谱 GLM-4-Flash-250414（免费）', base:'https://open.bigmodel.cn/api/paas/v4', model:'glm-4-flash-250414',    hint:'open.bigmodel.cn 免费注册，GLM-4-Flash 系列免费调用' },
    siliconflow: { key:'siliconflow', name:'硅基流动 GLM-4-9B-0414（免费）',  base:'https://api.siliconflow.cn/v1',        model:'THUDM/GLM-4-9B-0414',    hint:'siliconflow.cn 免费开源模型，注册送体验额度' }
  };
  const getCfg = () => {
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); return Object.assign({ provider:'zhipu', apiKey:'', endpoint:'', model:'' }, c); }
    catch(e){ return { provider:'zhipu', apiKey:'', endpoint:'', model:'' }; }
  };
  const setCfg = (c) => { try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} };
  const isEnabled = () => { const c = getCfg(); return !!(c.apiKey && String(c.apiKey).trim().length > 10); };
  const resolve = (c) => {
    const p = PROVIDERS[c.provider] || PROVIDERS.zhipu;
    return { base:(c.endpoint || p.base).replace(/\/+$/,''), model:(c.model || p.model) };
  };
  async function chatLLM(messages, opts){
    opts = opts || {};
    const c = getCfg();
    const r = resolve(c);
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), opts.timeout || 25000);
    // 智谱 flash 系列 temperature 上限为 1.0，防止 400
    const t = Math.min(opts.temperature != null ? opts.temperature : 0.85, 1.0);
    try{
      const res = await fetch(r.base + '/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + c.apiKey },
        body: JSON.stringify({ model:r.model, messages:messages, temperature:t, max_tokens:(opts.maxTokens || 800), stream:false }),
        signal: ctrl.signal
      });
      if(!res.ok){
        let msg = 'HTTP ' + res.status;
        try{ const d = await res.json(); msg = (d.error && (d.error.message || d.error.code)) || msg; }catch(e){}
        throw new Error(msg);
      }
      const data = await res.json();
      const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      return text.trim();
    } finally { clearTimeout(timer); }
  }
  function openSettings(cb){
    const c = getCfg();
    const old = document.getElementById('sa-modal'); if(old) old.remove();
    const ov = document.createElement('div');
    ov.id = 'sa-modal';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;';
    const optHtml = Object.values(PROVIDERS).map(p => `<option value="${p.key}" ${c.provider===p.key?'selected':''}>${p.name}</option>`).join('');
    const notEnabled = !isEnabled();
    const tutStep = { // 各服务商新手接入步骤（仅保留免费模型）
      zhipu: '<ol><li>打开 <b>open.bigmodel.cn</b> 注册/登录（手机号即可）；</li><li>进控制台「API Keys」→ 新建 API Key → 复制（格式形如 id.xxxx）；</li><li>把 Key 粘贴到下方输入框；</li><li>点「🔌 测试连接」，显示“连接成功”即通过；</li><li>点「保存并启用」完成。页面会变成 <b>AI 已连接</b>。</li></ol>官方链接：<a class="tut-link" target="_blank" rel="noopener" href="https://open.bigmodel.cn/">open.bigmodel.cn</a>　默认模型 GLM-4-Flash-250414 完全免费，够日常使用。',
      siliconflow: '<ol><li>打开 <b>siliconflow.cn</b> 注册；</li><li>左侧「API 密钥」→ 新建 → 复制（sk- 开头）；</li><li>粘贴到下方输入框；</li><li>点「🔌 测试连接」通过后「保存并启用」。</li></ol>官方链接：<a class="tut-link" target="_blank" rel="noopener" href="https://siliconflow.cn/">siliconflow.cn</a>　默认模型 GLM-4-9B-0414（免费开源）。'
    };
    const tutHtml = (p) => `<div style="font-weight:700;color:var(--primary-dark,#0c5f3a);margin-top:6px">以「${p.name}」为例，接入只需 5 步：</div>${tutStep[p.key] || tutStep.zhipu}<div style="margin-top:8px;color:#7a5c00;background:#fef6dc;border-radius:8px;padding:7px 9px">🔐 说明：Key 只保存在你自己浏览器本地（localStorage），不上传服务器；不想要了随时可以清掉。</div>`;
    ov.innerHTML = [
      '<div style="background:var(--bg-card,#fff);color:var(--text,#17301f);border-radius:16px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;max-height:92vh">',
      '  <div style="padding:15px 18px;background:linear-gradient(135deg,#148453,#1fa56a);color:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">',
      '    <div style="font-weight:800;font-size:15px">🤖 AI 智能设置</div>',
      '    <button id="sa-close" style="border:none;background:rgba(255,255,255,.25);color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1">✕</button>',
      '  </div>',
      '  <div style="padding:14px 18px;overflow-y:auto">',
      (notEnabled ? '<div class="ai-warn">⚠️ <b>当前未接入 AI</b>：现在只用内置四库和规则生成，回答可能有点“人机感”，自由问答也有限。按下面教程接入后就是<b>满血版</b>——更自然、更口语、想问什么都行。</div>' : ''),
      `<div class="ai-tut"><details id="sa-tut" ${notEnabled ? 'open' : ''}><summary>📖 新手接入教程（第一次用必看，约 1 分钟）</summary><div id="sa-tut-body">${tutHtml(Object.values(PROVIDERS).find(p => p.key === c.provider) || PROVIDERS.zhipu)}</div></details></div>`,
      '    <div style="font-size:12px;color:var(--text2,#5a6f65);margin-bottom:10px">接入在线 AI 后可自由问答，Key 仅存本机，用完可清除。</div>',
      '    <label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--text2,#5a6f65)">AI 服务商</label>',
      `    <select id="sa-provider" style="width:100%;padding:9px 10px;border:1px solid var(--border,#e5ede9);border-radius:9px;margin-bottom:12px;background:var(--bg-card,#fff);color:var(--text,#17301f);font-size:13px">${optHtml}</select>`,
      '    <label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--text2,#5a6f65)">AI 回复风格</label>',
      `    <select id="sa-style" style="width:100%;padding:9px 10px;border:1px solid var(--border,#e5ede9);border-radius:9px;margin-bottom:6px;background:var(--bg-card,#fff);color:var(--text,#17301f);font-size:13px">${Object.entries(AI_STYLE_NAMES).map(([k,n]) => `<option value="${k}" ${currentAiStyle()===k?'selected':''}>${n}</option>`).join('')}</select>`,
      '    <div style="font-size:11px;color:var(--text3,#9db0a6);margin-bottom:12px">💬 两种便捷切换：①重启前在此选择并保存；②对话中发 <b>/风格 精简</b> 等命令实时切换（不做知识库检索）。</div>',
      '    <label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--text2,#5a6f65)">API Key</label>',
      '    <input id="sa-key" type="password" placeholder="粘贴你的 API Key（sk-...）" value="'+c.apiKey+'" style="width:100%;padding:9px 10px;border:1px solid var(--border,#e5ede9);border-radius:9px;margin-bottom:6px;background:var(--bg-card,#fff);color:var(--text,#17301f);font-size:13px">',
      '    <div id="sa-status" style="font-size:11px;color:#c62828;margin-bottom:10px"></div>',
      '    <details style="font-size:12px;color:var(--text2,#5a6f65);margin-bottom:12px">',
      '      <summary style="cursor:pointer">高级（可选：自定义接口地址/模型名，默认无需填写）</summary>',
      '      <input id="sa-endpoint" type="text" placeholder="接口地址（留空用默认）" value="'+c.endpoint+'" style="width:100%;padding:8px 10px;border:1px solid var(--border,#e5ede9);border-radius:8px;margin-top:8px;background:var(--bg-card,#fff);color:var(--text,#17301f);font-size:12px">',
      '      <input id="sa-model" type="text" placeholder="模型名（留空用默认）" value="'+c.model+'" style="width:100%;padding:8px 10px;border:1px solid var(--border,#e5ede9);border-radius:8px;margin-top:8px;background:var(--bg-card,#fff);color:var(--text,#17301f);font-size:12px">',
      '    </details>',
      '    <div id="sa-provider-hint" style="font-size:11px;color:var(--text3,#9db0a6);line-height:1.6">💡 '+PROVIDERS.zhipu.hint+'</div>',
      '  </div>',
      '  <div style="padding:12px 18px;background:var(--primary-mist,#f4f9f6);display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border,#e5ede9);flex-shrink:0">',
      '    <button id="sa-test" style="border:1px solid var(--primary,#148453);background:#fff;color:var(--primary,#148453);padding:8px 14px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer">🔌 测试连接</button>',
      '    <button id="sa-save" style="border:none;background:linear-gradient(135deg,#148453,#1fa56a);color:#fff;padding:8px 18px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer">保存并启用</button>',
      '  </div>',
      '</div>'
    ].join('');
    document.body.appendChild(ov);
    const $ = (id) => document.getElementById(id);
    const providerSelect = () => Object.values(PROVIDERS).find(p => p.key === $('sa-provider').value) || PROVIDERS.zhipu;
    $('sa-provider').onchange = () => { const p = providerSelect(); $('sa-provider-hint').textContent = '💡 ' + p.hint; const tb = $('sa-tut-body'); if(tb) tb.innerHTML = tutHtml(p); };
    $('sa-status').textContent = SpringAI.isEnabled() ? '已配置，当前为在线 AI 模式' : '';
    $('sa-close').onclick = () => ov.remove();
    ov.onclick = (e) => { if(e.target === ov) ov.remove(); };
    $('sa-test').onclick = async () => {
      const tmp = { provider:$('sa-provider').value, apiKey:$('sa-key').value.trim(), endpoint:$('sa-endpoint').value.trim(), model:$('sa-model').value.trim() };
      localStorage.setItem('spring_ai_cfg', JSON.stringify(tmp));
      const st = $('sa-status');
      st.style.color='#e65100'; st.textContent='⏳ 正在测试连接…';
      try{
        const t0 = Date.now();
        const text = await chatLLM([{ role:'user', content:'你好，请只回复四个字：连接成功' }], { maxTokens:20, temperature:0 });
        st.style.color='#148453'; st.textContent='✅ 连接成功（' + (Date.now()-t0) + 'ms）：' + text.slice(0,30);
      }catch(e){
        st.style.color='#c62828'; st.textContent='❌ 连接失败：' + String(e.message || e);
      }
    };
    $('sa-save').onclick = () => {
      const v = { provider:$('sa-provider').value, apiKey:$('sa-key').value.trim(), endpoint:$('sa-endpoint').value.trim(), model:$('sa-model').value.trim() };
      localStorage.setItem('spring_ai_style', $('sa-style').value);
      setCfg(v);
      ov.remove();
      updateAiStatus();
      if(cb) cb(v);
    };
  }
  return { isEnabled, chatLLM, openSettings, getCfg, setCfg, PROVIDERS };
})();

function currentAiStyle(){
  const s = localStorage.getItem('spring_ai_style');
  return (s && AI_STYLES[s]) ? s : 'chat';
}

function updateAiStatus(){
  const el = document.getElementById('aiStatus');
  if(SpringAI.isEnabled()){ el.className='ai-status on'; el.textContent='AI 已连接'; }
  else { el.className='ai-status off'; el.textContent='AI 未连接'; }
}
function openAiSettings(){ SpringAI.openSettings(); }

/* ===================== 跳转其他板块（嵌入时通知外壳切换；独立打开时直接跳转） ===================== */
function jumpTo(mod){
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type:'spring-switch', module:mod }, '*');
      return;
    }
  }catch(e){}
  const map = { quiz:'quiz.html', performance:'performance.html', beauty:'beauty.html', manual:'manual.html', daily:'daily.html', risk:'risk-lite.html', medical:'medical.html', report:'report.html', kbadmin:'kb-admin.html' };
  window.open(map[mod] || (mod + '.html'), '_blank');
}

{cat:'销售财务',icon:'📦',src:'5月OJT',t:['配送系统','备注','报备','数量修改'],

 a:`<ul>

 <li>历史教训：退回颈枕等给机供品应改「原库存」，不要用其他选项，否则修订数据异常被处罚。</li>

{cat:'销售财务',icon:'🧾',src:'7月OJT / 手册 3.5.7.6',t:['销转保','保转销','修订','航班结算'],

{cat:'扣分规则',icon:'🛡️',src:'手册 6.7.9.1',t:['安全质量分','什么情况扣安全质量分','安全'],

{cat:'扣分规则',icon:'⭐',src:'手册 6.7.9.2',t:['业务质量分','什么情况扣业务质量分','服务'],

 a:`业务质量分衡量<strong>航班服务质量与运行质量</strong>（6.7.4.3），常见场景：

 </ul>
 <div class="kbox">⭐ 提示：业务质量分是年终绩效与<strong>竞聘乘务长</strong>的重要依据，扣分直接影响晋级门槛。</div>`,

{cat:'扣分规则',icon:'✈️',src:'手册 6.7.4.5/6.7.9.3.4',t:['航班生产积分','生产积分','出勤'],

{cat:'绩效考核',icon:'📊',src:'手册 8.15',t:['绩效评级','绩效怎么评','SABCD','月度考核','评级'],
 q:'绩效评级 S/A/B/C/D 怎么评出来的？降级标准是什么？',
 a:`<strong>绩效评级（月度/年度）</strong>依据考核维度：安全 35% / 业务 25% / 运行 15% / 综合 10% / 工作评定 15%（销售为单项考核，8.15.4.1）。

{cat:'绩效考核',icon:'📉',src:'手册 6.8.7/6.8.8',t:['降级','什么情况降级','怎么恢复等级','恢复','恢复等级'],

 a:`<strong>安全底线 / 红线分值（6.7.8）</strong>：

 <li><strong>安全红线</strong>：一般差错 / 安全质量事件 -20 分；严重差错 -40 分。</li>

 </ul>`},
{cat:'特殊旅客',icon:'🧒',src:'日常库 · 特殊旅客',t:['UM规定','无陪儿童规定','数量限制','5-12岁','UM几人','最多载几个','最多能载几个'],

{cat:'机组成员职责与资格', icon:'📘', src:'CCM 3.1.4', t:['训练类别','新雇员训练','初始训练','定期复训','转机型'],
q:'客舱乘务员的训练类别包括哪些？',
a:'客舱乘务员必须按民航规章和公司规定接受并保持相应资格的各类训练，训练类别包括：<ul><li><strong>新雇员训练</strong>：进入公司的客舱乘务员参加的基础阶段训练</li><li><strong>初始训练</strong>：取得客舱乘务员资格、首次承担机型任务前的训练</li><li><strong>转机型训练</strong>：由一种机型转为另一种机型时的训练</li><li><strong>差异训练</strong>：同一机型构型或设备存在差异时的补充训练</li><li><strong>定期复训</strong>：按规定周期进行的保持资格与更新知识的复训</li><li><strong>重新获得资格训练</strong>：资格失效或长期未复训后重新获得的训练</li><li>乘务长资格训练、客舱乘务教员资格训练、客舱乘务检查员资格训练</li><li>危险品训练、安保训练</li></ul>各类训练的进入条件、训练内容、课时与考核要求见《客舱乘务员训练大纲》。'},
{cat:'机组成员职责与资格', icon:'📘', src:'CCM 3.1.2.2', t:['乘务长职责','客舱管理','执行协调','客舱程序','乘务长'],

{cat:'机组成员职责与资格', icon:'📘', src:'CCM 3.2.1.1', t:['失能','低于最低配备','机组成员失能','最低配备不足','继续飞行'],

{cat:'机组成员职责与资格', icon:'📘', src:'CCM 3.2.1.1', t:['外籍乘务员','语言能力','最低配备','不计入'],

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.2', t:['飞行值勤期限制','DT','14小时','16小时','18小时20小时','飞行值勤期'],
q:'客舱乘务员飞行值勤期DT的上限和相应配备是怎样的？',
a:'飞行值勤期（DT）限制：<ul><li>最低数量配备时 <strong>DT≤14小时</strong></li><li>最低数量+1名：14＜DT≤16</li><li>最低数量+2名：16＜DT≤18</li><li>最低数量+3名或以上：18＜DT≤20</li></ul>注：发生意外运行情况时可将飞行值勤期限制延长2小时或至安全降落下一目的地；一个飞行值勤期内服务的机型不得超过两种（含）。'},
{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.3', t:['累积飞行时间','7个连续日历日','日历月','日历年','值勤时间限制'],

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.4', t:['休息期','连续48小时','144小时内','休息附加要求'],

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.4', t:['连续10小时休息','值勤期间隔','飞行值勤期之间','休息要求'],
q:'连续两个飞行值勤期之间最短休息期是多久？',

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.6', t:['通宵航班','轮换休息','30分钟','凌晨0点','15分钟巡视'],
q:'通宵航班轮换休息的规定是什么？',

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.4', t:['连续飞行4日','培训考核','24小时内','禁止安排'],
q:'连续飞行4个日历日后能否立即安排培训考核？',
a:'安排客舱乘务员培训、考核、会议等任务时需充分考虑由此产生的疲劳。<strong>连续飞行4个日历日的最后一个飞行值勤期结束的24小时内，不得安排培训、考核、会议等任务。</strong>'},
{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.5', t:['自我监控','春秋之家','飞行小时','值勤期','SQM'],

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.5.1', t:['疲劳管理','身体不适','值班经理','航空医师'],

{cat:'值勤与疲劳管理', icon:'📘', src:'CCM 3.2.2', t:['签到时间','起飞前90分钟','签到','直接准备','起飞前'],

{cat:'航空卫生', icon:'📘', src:'CCM 3.4.2', t:['酒测标准','血液浓度','10毫克','100毫升','禁酒24小时'],

{cat:'航空卫生', icon:'📘', src:'CCM 3.4.2', t:['签到前15分钟','禁食','漱口水','酒测读数'],

a:'航班签到前<strong>15分钟</strong>客舱乘务员应禁食，不得使用漱口水等可能造成酒测读数超标的物品，以确保酒测读数无误差。'},
{cat:'航空卫生', icon:'📘', src:'CCM 3.4.3.2', t:['酒测异常','复测','酒精测试程序'],

{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.2.3', t:['安全带信号灯','接通','起飞','着陆','系安全带'],
q:'安全带信号灯应在什么情况下接通和关闭？',
a:'起飞、着陆、滑行及飞机移动等阶段须接通安全带信号灯，接通时每位旅客应在自己座位坐好并系好安全带。巡航高度20000英尺以下、起飞后20分钟等条件满足后方可按程序关闭，关闭的时机不得早于起飞后规定时间。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.9.3', t:['起飞后20分钟','安全带信号灯关闭','开始客舱服务','驾驶舱沟通','系安全带'],
q:'起飞后多久才可开始客舱服务程序？',
a:'平飞或起飞后<strong>20分钟</strong>且安全带信号灯关闭后，乘务员应使用机组协同准备会确定的联络方式与驾驶舱再次沟通天气和预知颠簸，随后方可开始客舱服务程序。如起飞后20分钟安全带灯仍未关闭，应主动内话联系飞行机组。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14', t:['出口座位','定义','无人值守','有人值守','应急出口','什么是出口座位','出口座位是什么意思','出口座位定义'],
q:'什么是出口座位？',
a:'<strong>出口座位</strong>：旅客从该座位可以不绕过障碍物直接到达出口的座位，以及旅客到达出口必经的成排座位中从出口到最近过道的每个座位（CCM 2.1定义）。我公司A320/A321飞机的出口座位均为<strong>成对出口</strong>，其中A321飞机的3号门具备出口座位条件。出口座位分为<strong>无人值守出口座位和有人值守出口座位</strong>，客舱乘务员须向出口座位旅客进行简介。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.4', t:['出口座位能力','旅客应具备能力','操作应急出口','评估滑梯','迅速通过','出口座位','能力','撤离滑梯'],
q:'坐在出口座位的旅客应具备哪些能力？',
a:'应具备完成下列职责的能力：确定应急出口位置、认出开启机构、理解操作指示、操作应急出口、评估打开是否增加暴露伤害、遵循机组口头指示或手势、收藏或固定应急出口门、评估操作滑梯并协助他人滑梯离开、迅速经应急出口通过、评估选择沿安全线路离开。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.5', t:['不能坐出口座位','未满15岁','超过70岁','能力缺陷','听力视力','不能安排在','应急出口座位'],
q:'哪些旅客不能安排在出口座位？',
a:'当旅客有下列情况不具备出口座位应具备的能力时不宜就座：两臂双手和双腿缺乏足够运动功能/体力/灵活性；<strong>不足15岁或超过70岁（含）</strong>的旅客（无陪伴协助时）；缺乏阅读理解撤离指示能力或理解口头命令能力；缺乏足够视力/听力；缺乏将信息口头传达给他人的能力；可能妨碍履行出口职责（如需照料幼小孩子）等。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.6', t:['调换座位','出口座位更换','非出口座位','满员','报告机长','出口座位','应急出口座位'],
q:'出口座位旅客要求调换座位时怎么办？',
a:'当确认出口座位旅客没有能力履行职能或旅客自己要求不坐出口座位时，应立即将该旅客重新安排在非出口座位。在非出口座位已满时，若需调出，应把愿意且能完成撤离功能的旅客调到出口座位。游客要求更换座位时机组成员不得要求其讲出理由；如果非出口座位已满且无人愿换，本次航班即被认为满员，乘务长立即报告机长交地面处理。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.10', t:['出口座位毛毯','松散物品','紧急撤离障碍','飞行关键阶段','毛毯','出口座位','应急出口座位'],
q:'出口座位旅客的毛毯有什么要求？',
a:'出口座位旅客的毛毯在"飞行关键阶段"中属于客舱松散物品。客舱乘务员在安全检查时应提醒出口座位旅客妥善存放，避免在紧急情况下成为撤离的障碍物。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.1', t:['客舱安全检查','松散物品','起飞','着陆','安全隐患'],
q:'起飞前客舱安全检查主要查什么？',
a:'客舱安全检查主要排查客舱松散物品（存在于座椅口袋、毛毯、行李溢出等）、出口通道畅通、行李正确固定、旅客安全带系好等隐患。检查中发现影响应急撤离的松散物品（如出口座位毛毯、地面物品）须及时处置，确保起飞着陆阶段安全。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.3', t:['旅客管理','登机','登机牌','行李摆放','坐好系带','旅客登机'],
q:'旅客登机和就座阶段客舱乘务员主要做哪些管理？',
a:'协助旅客登机、核对旅客数、引导就座、安排摆放手提行李（除孕妇、无人陪伴儿童、残疾人、担架旅客等由他人协助摆放）、提醒系好安全带，并做好出口座位评估和个别简介等安全管理工作。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.7', t:['锂电池','充电宝','机上禁止','危险品','额定能量','移动电源'],
q:'旅客在机上使用锂电池/充电宝有什么限制？',
a:'客舱乘务员应加强对含锂电池电子设备（PED，含充电宝/移动电源）的管理：<ul><li><strong>禁止旅客开启和使用锂电池移动电源（充电宝）</strong>，监控机载电源插座，禁止使用客舱机载电源给PED充电</li><li>旅客随身携带的锂离子电池额定能量须符合公司危险品运输规定，超限设备不得随身携带或托运，具体限额见《危险品手册》</li><li>含锂电池设备应注意避免挤压、高温与短路，设备发热时先断开电源</li><li>含锂电池设备起火冒烟时按锂电池应急处置程序处置：用航空安全防护箱浸没冷却、锂离子电池专用消防水降温，严禁用手直接拿取</li></ul>'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.3', t:['婴儿定义','不满2周岁','婴儿载运限制','婴儿','婴儿旅客','婴儿旅客限制','婴儿限制','婴儿载运数量','14天','早产90天'],
q:'手册中婴儿如何定义？有哪些载运限制？',
a:'婴儿指<strong>不满2周岁</strong>的旅客。载运限制：(1)出生不足14天的婴儿和出生不足90天的早产婴儿，春秋航空不予承运；(2)婴儿必须由年满18周岁以上成人携带乘机；(3)因A320/A321婴儿救生衣及婴儿安全带限制，承运婴儿数目（含占座）不超过<strong>10名</strong>。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.3', t:['不占座婴儿','救生衣','婴儿安全带','儿童限制装置','座椅安排','系安全带','求生衣'],
q:'不占座婴儿的座位和救生衣要求是什么？',
a:'(1)不占座婴儿应安排在有备份氧气面罩的座位上；同一排都有旅客时不得同时有2名不占座婴儿。(2)婴儿不提供单独座位，由占座成人怀抱并使用特殊安全带或有合格儿童限制装置。(3)起飞前主动为婴儿提供婴儿安全带和婴儿救生衣并指导使用，着陆停稳后方可回收。应急出口座位、其前/后一排及靠走道不得安排需用限制装置的婴儿。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.4', t:['无成人陪伴儿童','UM','5周岁','不满12周岁','无人陪伴','无人陪伴儿童'],
q:'什么是无人陪伴儿童（UM）？有什么要求？',
a:'无成人陪伴儿童，又称无人陪伴儿童或无伴儿童，指年龄满<strong>5周岁但不满12周岁</strong>，没有年满18周岁且具有民事行为能力的成年人陪伴乘机的儿童。不足5周岁的儿童单独乘机不予承运。应安排在乘务员易于照顾的座位上，但不得安排在飞机应急出口。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.1.6', t:['UM数量限制','无成人陪伴儿童','5名','担架','轮椅','无人陪伴儿童'],
q:'每一航班限制运输的无成人陪伴儿童数量是多少？',
a:'每一航班每一航段，无成人陪伴儿童可接受运输的数量为<strong>5—（担架旅客人数+轮椅旅客人数）</strong>。即基础上限5名，随担架/轮椅旅客占用而相应减少。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.5', t:['孕妇','32周','35周','乘机医疗许可','72小时'],
q:'孕妇乘机有什么规定？',
a:'(1)怀孕不足8个月（32周）的孕妇除医生诊断不适应乘机外按一般旅客运输；(2)怀孕超过32周但不足35周的应办理乘机医疗许可，该许可须在乘机前<strong>72小时内</strong>签发有效，并经区县级以上医疗单位盖章和医生签字；(3)怀孕35周（含）以上、预产期4周以内、不明预产期、多胎或产后不足7天者不予承运。孕妇座位应安排在宽敞便于照顾处但不得在应急出口。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.6', t:['老年旅客','60岁','无陪老年旅客','座位安排','老年人'],
q:'老年旅客的定义和座位安排是什么？',
a:'老年旅客指乘机之日年满<strong>60岁</strong>且需要特别照顾的旅客；无陪老年旅客指单独乘坐、需上下机引导及空中关照服务的老年旅客。老年旅客的座位发放应在客舱靠前的过道位置。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.7', t:['轮椅旅客','WCHC','WCHS','WCHR','残疾'],
q:'轮椅旅客有哪几类？',
a:'轮椅旅客按需要分为三类：<ul><li>WCHC——用以到达或离开客舱座位：旅客完全不能自己行动</li><li>WCHS——用以上下客梯：可自己走到或离开客舱座位</li><li>WCHR——用以通过停机坪：可自己走动和上下客梯</li></ul>'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.1.6', t:['轮椅限制','WCHC','WCHS','上限2名','轮椅旅客','人数','限制'],
q:'每一航班对轮椅旅客人数的限制是多少？',
a:'每一航班每一航段，<strong>WCHC与无人陪伴的WCHS合计上限2名</strong>。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.8', t:['伤病旅客','定义','手术2个月','术后','行动不便'],
q:'哪些旅客视为伤病旅客？',
a:'伤病旅客指因患病或受伤，在航空旅行中需要他人照料和/或提供医疗协助的旅客，包括：身体未患病但需他人帮助照顾的老年旅客；<strong>手术（含整形）后2个月内</strong>处于恢复期的旅客；有耳病/眼睛疾病但具生活自理能力的旅客；使用担架的伤病旅客。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.9', t:['残疾旅客','残障','载运限制','A320 4名','A321 6名'],
q:'残疾人旅客每航班的载运限制是多少？',
a:'在运输过程中无陪伴但紧急撤离时需他人协助的残疾人（使用轮椅、下肢严重残疾未装假肢、盲人、携服务犬、智力精神严重受损等）：<strong>A320不超过4名、A321不超过6名</strong>。超限按1:1比例增加陪伴人员，但残疾人数A320最多8名、A321最多12名。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.12', t:['盲人旅客','导盲犬','座位安排','盲人','视障旅客'],
q:'盲人旅客如何安排座位？',
a:'盲人旅客应安排在靠乘务员、靠窗口并尽可能靠近洗手间的位置；有成人陪伴的盲人旅客，其陪伴人的座位应安排在盲人旅客座位旁；携带导盲犬的盲人旅客应提供适合的座位；如座位不满可根据情况在旁留出一个空座位。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.10', t:['客舱宠物','数量限制','携带宠物','机上宠物','座位要求'],
q:'携带客舱宠物的旅客有什么数量及座位要求？',
a:'携带客舱宠物的旅客须按公司客舱宠物运输规定办理，乘务员负责客舱内的管理与监护：<ul><li>宠物须装入符合规定的密闭通风容器内，容器置于旅客脚前地板上并固定，不得占用座椅或过道，不得影响应急撤离与出口通道</li><li>同一航班客舱可承运的宠物数量按舱位、机型有一定限制，须提前办理付费并核对单据，未办理者不得带入客舱</li><li>运输期间宠物不得放出容器，乘务员应关注宠物状态，防止逃逸、咬伤或严重异味扰客</li><li>过站期间对宠物座位及周围区域做好清洁，保持客舱卫生</li><li>精神抚慰犬等服务犬的运输按公司特殊旅客相关规定办理</li></ul>具体数量、容器尺寸与办理时限按公司现行相关规定执行。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.2', t:['出口座位分布','无人值守','有人值守','3号乘务员','8号乘务员','值守分工','出口座位','怎么分布'],
q:'出口座位的值守分工是怎样的？',
a:'A320/A321的出口座位分为<strong>无人值守出口</strong>和<strong>有人值守出口</strong>两类，值守分工如下：<ul><li><strong>无人值守出口</strong>：乘务员不在出口正位值守，由负责该区域的乘务员兼顾监护——A320由3号客舱乘务员负责，A321由3号乘务员负责</li><li><strong>有人值守出口</strong>：乘务员就位于出口旁直接值守、可即时操作并指挥撤离，通常由8号客舱乘务员负责（如来有人值守出口）</li></ul>值守乘务员须确认出口座位旅客状态、对出口座位旅客进行评估与简介，撤离时负责操作该出口。各机型出口座位分布与标号见《客舱设备检查单》及各机型撤离分工。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.14.9', t:['无人值守出口','旅客责任','口头承诺','打开出口','机外状况','出口座位','责任','应急出口座位'],
q:'无人值守出口座位的旅客有哪些责任？',
a:'客舱乘务员应向旅客传达无人值守出口座位旅客的责任，包括：口头承诺承担操作出口的责任；应急出口的定位；理解操作出口的指令；知道何时和如何打开出口；遵照机组所有指令（包括撤离信号或命令）；在打开出口前确认机外状况；出口舱门的放置以免妨碍紧急出口的使用。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.15', t:['拒绝运输','拒绝承运','醉酒旅客','神志不清'],
q:'哪些情况下公司有权拒绝运输旅客？',
a:'公司可以安全原因或根据规定，认为属于下列情况之一的有权拒绝运输旅客及行李（春秋航空不承担责任）：违反相关法律法规及公司安全规定的旅客，如拒检、证件不符、神志不清不能自制、醉酒失去自控、发病中的精神病人、判定因伤病不适宜乘机的旅客、无法确认孕周或判定不适宜的孕妇、出生不足14天婴儿/早产婴儿、无陪不足5周岁儿童等。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.13/3.3.16系列', t:['特服通知单','特殊旅客交接','签字确认','特殊旅客'],
q:'特殊旅客上机时如何进行交接？',
a:'无成人陪伴儿童、伤病旅客、残疾旅客、担架旅客、轮椅旅客、押解/遣返旅客及使用儿童限制装置的婴儿/儿童等，地面工作人员会在舱门关闭前将相关单据交接给乘务长并签字确认。原则上乘务员无需再评估其是否符合乘机条件；如无单据，则须目视判断和询问，可参照各特殊旅客载运限制判断。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.16.1.3', t:['特殊旅客座位','同一排','2名特服','儿童座位','不能只安排儿童'],
q:'特殊旅客座位安排有哪些限制？',
a:'(1)为特殊旅客安排座位时，同一排同一侧座位不能安排2名或2名以上特殊旅客（限定人数的特殊旅客）；(2)同一排同一侧座位不能只安排儿童（儿童指年满2周岁（含）但不满12周岁的人）。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.9', t:['颠簸','系好安全带','信号灯','颠簸处置','机组协同','乘务员','系安全带','气流颠簸'],
q:'遇到空中颠簸时客舱乘务员如何处置？',
a:'颠簸时须进行客舱广播，长时间颠簸做间歇性广播并提醒旅客就座系好安全带；如飞行机组未打开安全带信号灯，乘务长应提醒；立即固定自己直到灯灭或接到通知；对需要帮助旅客进行安全须知简介并做好防颠簸自身安全防护。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.9.5', t:['可预知颠簸','服务停止','客舱服务调整','颠簸等级','气流颠簸'],
q:'可预知颠簸时客舱服务应如何处理？',
a:'客舱乘务员根据飞行机组告知的预知性颠簸等级和准备时间，可调整、删减服务程序或不提供服务（如遇颠簸或其他不正常不安全情况）；通知旅客回座并系好安全带。航班结束后乘务长在智慧客舱记录。'},
{cat:'客舱安全与旅客管理', icon:'📘', src:'CCM 3.3.9.3', t:['安全带灯开着','平飞','服务操作','询问驾驶舱','安全带信号灯','系安全带'],
q:'平飞且无颠簸但安全带信号灯仍开着时能否开始服务？',
a:'如飞机处于平稳飞行状态或颠簸缓解/消失后，但安全带信号灯仍处于接通状态，客舱乘务员应主动联系驾驶舱询问后续颠簸情况，以便判断是否可以进行客舱服务，必要时提醒飞行机组关闭安全带信号灯。'},
{cat:'客舱安全保卫', icon:'📘', src:'CCM 3.5.5', t:['安保检查','航空安保检查单','目视检查','航前安保'],
q:'航前客舱安保检查的方式和部位有哪些？',
a:'乘务组主要采取目视检查方式对客舱进行安保检查，部位包括但不限于：服务间（储物箱、柜、餐车、垃圾箱、天花板、地板、舱壁、凹槽）、舱门区域（滑梯包、安全销存放平台）、应急设备储存袋内部、乘务员座椅夹层缝隙、抽查旅客救生衣存放区域（至少3个）。须从前至后、从上至下、不留死角。'},
{cat:'客舱安全保卫', icon:'📘', src:'CCM 3.5.5', t:['可疑物品','可疑人员','发现危险品','报告安保员','3.5.12'],
q:'安保检查中发现可疑物品/人员如何处置？',
a:'发现可疑物品不得擅自移动、触摸，及时报告航空安全员、乘务长和机长，配合按3.5.12处置；发现可疑人员及时报告航空安全员、乘务长和机长；发现危险品按3.6.2处置；发现旅客遗留物品按遗留物品处置方法进行。'},
{cat:'客舱安全保卫', icon:'📘', src:'CCM 3.5.6', t:['中途过站','经停','旅客下机','1个地板高度出口'],
q:'经停站旅客下机时客舱有什么要求？',
a:'乘务长应在航前准备时做好经停过站相关工作的提示；旅客下机期间至少保持打开<strong>一个地板高度出口</strong>，与之连接的客梯车或廊桥可用；过站航班如因特殊原因旅客不离开客舱，应按3.5.5.2相关要求进行安保检查。'},
{cat:'客舱安全保卫', icon:'📘', src:'CCM 3.5.6.4', t:['过站离机','离开飞机要求','过站换组','应急设备检查'],
q:'经停过站期间更换乘务组时有什么要求？',
a:'经停过站期间更换乘务组时，新上机的乘务组仍需对客舱应急设备进行检查（参照本手册规定）。乘务员过站离开飞机须按规定办理并遵守安保纪律（如外出请销假审批等要求）。'},
{cat:'不正常情况与报告', icon:'📘', src:'CCM 3.6.1.3', t:['客舱乘务员失能','能力丧失','飞机指挥权接替'],
q:'客舱乘务员能力丧失时如何处置？',
a:'一旦机长或其他机组成员丧失行为能力，按本手册3.6.1.5"飞机指挥权接替程序"确定指挥权接替人；值勤中发现乘务员饮酒等失能情形，乘务长应视其为失能人员，按3.6.1.3"客舱乘务员能力丧失的处置"要求处置并报告机长。'},
{cat:'不正常情况与报告', icon:'📘', src:'CCM 3.6.2', t:['危险品','机上危险品类','危险品处置','3.6.2'],
q:'机上有疑似危险品时如何处置？',
a:'机上一旦发现或疑似危险品（含旅客违规携带的危险品，或客舱/货舱危险品泄漏、冒烟冒味），按本手册3.6.2"危险品的处置"执行：<ul><li><strong>识别与报告</strong>：及时识别危险品类别与状态，第一时间通知航空安全员、乘务长和机长，报告物品位置、包装、有无泄漏冒烟及气味</li><li><strong>隔离与防护</strong>：将危险品与热源、火源、旅客撤离通道隔离；泄漏时转移附近旅客并做好防护（避免皮肤直接接触，必要时使用防护装备），严禁随意触碰、挪动或撞击</li><li><strong>灭火与应急</strong>：涉及起火冒烟的按6.6机上火灾及锂电池处置程序；涉及爆炸物等爆炸性危险品不得随意触碰电器以防引爆，保持距离并受控看管</li><li><strong>降载与移交</strong>：按机长决定卸下危险品或限制危险区域，落地点做好移交，航班结束按规定上报SQM和值班经理</li></ul>货舱危险品报警的配合按公司现行危险品管理规定执行。'},

{cat:'不正常情况与报告', icon:'📘', src:'CCM 3.6.1', t:['紧急情况报告','不正常情况','报告机长','报告程序'],
q:'客舱发生紧急/不正常情况如何报告？',
a:'客舱乘务员应迅速识别并果断应用程序处置各类异常及紧急情况，第一时间通过内话或紧急呼叫驾驶舱将观察到的信息传递给飞行机组，并按程序逐级报告：<ul><li>一般情况先报告<strong>乘务长</strong>，由乘务长汇总后报告机长；紧急情况可直接报告机长并于事后告知乘务长</li><li>涉及安保、危险品、医学事件等特殊情形，按要求报告航空安全员、值班经理及地面相关单位</li><li>报告内容应包括时间、地点、人员、事件经过、已采取措施与所需协助，并如实填报SQM</li><li>航班结束后按需要参加航后讲评，对处置情况进行回顾与反馈</li></ul>'},
{cat:'不正常情况与报告', icon:'📘', src:'CCM 3.7', t:['特殊运行','高原运行','禁酒48小时','特殊运行要求'],
q:'高原机场等特殊运行为客舱乘务员有什么要求？',
a:'特殊运行（如高原/高高原机场运行）对客舱乘务员有相应要求：<ul><li>执行<strong>高原机场</strong>运行的客舱乘务员，在执行飞行任务签到前<strong>48小时内</strong>不得饮酒或饮用含酒精饮料</li><li>合理安排休息、保持良好身体状态，以应对高原缺氧等环境；值勤中如感不适及时报告</li><li>飞行中关注客舱增压与供氧设备状态，做好释压和旅客高原反应的处置准备</li><li>涉及跨水/延伸跨水运行时按规定确认救生衣、滑筏等漂浮设备在位可用，做好水上求生准备</li><li>特殊机场运行的服务与安全检查安排按机组协同决定执行</li></ul>其他特殊运行类别的具体限制见本手册3.7及公司运行规定。'},
{cat:'不正常情况与报告', icon:'📘', src:'CCM 3.7', t:['高原运行','高高原','客舱准备','特殊运行准备'],
q:'执行高原/高高原机场运行的客舱准备有哪些重点？',
a:'执行高原/高高原机场运行，客舱乘务员应重点注意：<ul><li>执行任务签到前<strong>48小时内</strong>不得饮酒，合理安排休息、避免疲劳，保持良好的身体状态以应对高原缺氧环境</li><li>飞行中密切监控客舱增压与供氧设备，做好突发释压、旅客高原反应不适的处置准备</li><li>旅客中如有感冒、心肺疾病、高血压等不适宜高原旅行的情况，地面已作识别，空中注意观察</li><li>高/高高原机场多伴随较长滑行与特殊气象，客舱服务与安全检查按机组协同安排调整</li></ul>具体机型与航线特殊运行要求按公司现行相关规定执行。'},
{cat:'机型设备-基本安全设备', icon:'📘', src:'CCM 4.2.1.2', t:['飞机出入口','客舱门','C型门','基本数据','机门类型','机门','A320','A321'],
q:'A320/A321各机门类型有何区别？',
a:'<ul><li><strong>A320</strong>：所有客舱主门均为<strong>C型门</strong>，可用于滑梯/滑筏转移（当其他门失效时）</li><li><strong>A321</strong>：1号门和4号门为C型门；3号门具备出口座位条件，其滑梯不能作为漂浮装置、无法与飞机断开</li></ul>C型门可按4.6.2.6进行滑梯/滑筏的转移。机上各机门号位（1/2/3/4号门及对应座椅区）和具体结构、操作请见各机型手册4.2.1相关内容。'},
{cat:'机型设备-基本安全设备', icon:'📘', src:'CCM 4.2.2', t:['机上应急设备清单','应急设备配备','客舱应急设备清单','应急设备有哪些'],
q:'机上客舱应急设备主要包括哪些？',
a:'机上客舱应急设备按民航规章与各机型配置，主要包括以下类别，检查时按各自设备检查标准逐项核对：<ul><li><strong>灭火设备</strong>：手提灭火瓶（海伦/等效洁净气体灭火瓶）、防护式呼吸装置（PBE）、防火手套、锂离子电池专用消防水</li><li><strong>供氧设备</strong>：便携式氧气瓶、客舱固定氧气系统（旅客氧气面罩）</li><li><strong>急救与防疫设备</strong>：急救箱、应急医疗箱、医疗用品补充箱、卫生防疫包</li><li><strong>撤离与求生设备</strong>：应急撤离滑梯、滑筏、翼上脱离滑梯、救生衣/婴儿救生衣、应急手电筒、扩音器、应急定位发射器（ELT）、救生包（SK包）、驾驶舱撤离绳、应急斧、撬棒</li><li><strong>信号与照明</strong>：应急照明、撤离信号、系好安全带/禁止吸烟信号灯</li></ul>各类应急设备的数量、位置与配备标准见各机型《客舱设备检查单》，每次登机后按检查单核查在位与完好。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.1.1/4.5.1.2', t:['氧气瓶分类','I型氧气瓶','II型氧气瓶','III型氧气瓶','310升','78分钟','氧气瓶','便携式氧气瓶'],
q:'机上氧气瓶是什么？分哪几类？',
a:'氧气瓶用于紧急情况下向机组/旅客提供氧气。按构造分为三类：<ul><li><strong>I型</strong>：氧气容量310升，4升/分钟可用<strong>78分钟</strong>；一个接头接氧气面罩提供4升/分钟高流量，另一接头为非计量全流量出口供烟雾面罩使用。</li><li><strong>II型</strong>：容量310升，4升/分钟可用78分钟、2升/分钟可用155分钟；通过旋转开/关活门调节高低流量（数字"2"低流量、"4"高流量）。</li><li><strong>III型</strong>：容量310升，参数同II型；通过旋转流量调节旋钮调节高低流量。</li></ul>'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.1.4', t:['氧气瓶','氧气瓶操作','氧气瓶怎么用','氧气瓶使用','开/关活门','逆时针旋转','流量观察窗','如何操作'],
q:'氧气瓶如何操作使用？',
a:'<strong>通用步骤</strong>：①从支架上取下；②确认适配氧气面罩插入在氧气输出口处；③戴上氧气面罩罩在口鼻处；④<strong>逆时针（左转）旋转开/关活门</strong>；⑤检查氧气流出；⑥用完后关闭氧气瓶，面罩放回面罩包，氧气瓶放回原位固定。<br><strong>分型要点</strong>：<ul><li>I型：逆时针旋转开/关活门→挤压袋子或检查袋上部绿色区域确认出氧。</li><li>II型：逆时针旋转开/关活门，仅当数字"2"或"4"位于流量观察窗中间氧气才会流出。</li><li>III型：先旋转流量调节旋钮调节高低流量，再逆时针旋转开/关活门，仅当数字"2"或"4"位于流量观察窗中间氧气才会流出；可通过输出管内"绿色浮珠"或袋子绿色区域确认出氧。</li></ul>'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.1.5', t:['氧气瓶检查','氧气瓶怎么检查','氧气瓶设备检查','1500PSI','压力指示','防尘帽','便携式氧气瓶'],
q:'氧气瓶的设备检查要点是什么？',
a:'氧气瓶设备检查：(1)<strong>氧气瓶固定在支架上</strong>；(2)<strong>压力指示数值在1500 PSI以上</strong>；(3)附有一个与氧气瓶匹配、独立包装的氧气面罩连接在氧气瓶输出口上；(4)如氧气瓶有多个输出口，还需检查未连接面罩的输出口<strong>防尘帽堵塞在位</strong>。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.1.6', t:['氧气瓶注意事项','氧气瓶特殊考虑','200PSI','禁止吸烟','油脂','监控','氧气瓶','注意事项'],
q:'使用氧气瓶有哪些特殊注意事项？',
a:'氧气瓶特殊考虑：(1)<strong>切勿将氧气瓶中氧气放空</strong>，压力在<strong>200PSI</strong>时停止使用以备急用；(2)使用氧气瓶时前后四排座位（3米）以内<strong>禁止吸烟</strong>；(3)<strong>操作时手上切勿沾有任何油脂</strong>；(4)使用氧气瓶时，<strong>客舱乘务员必须进行监控</strong>。'},
{cat:'机型设备-基本安全设备', icon:'📘', src:'CCM 4.2.3.7', t:['客舱固定氧气系统','氧气面罩','旅客氧气','自动脱落'],
q:'客舱固定氧气系统（旅客氧气面罩）有何特点？',
a:'客舱固定氧气系统（旅客氧气系统）在客舱释压时，各旅客及乘务员座位上方氧气面罩<strong>自动脱落</strong>供旅客使用（慢速与急速释压均有面罩脱落迹象）。要点：<ul><li>释压后乘务员应立即将机门上方的氧气面罩<strong>系起来缩短下坠长度</strong>，避免阻碍应急撤离</li><li>氧气由化学发生装置产生，使用中注意防热防护；检查时确认系统外观完好、指示正常</li><li>旅客固定氧气系统用于释压应急，不做治疗性供氧；治疗供氧使用便携式氧气瓶</li></ul>系统的触发条件与安装布局见各机型手册4.2.3.7。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.1', t:['灭火瓶','手提灭火瓶','Halon','海伦灭火瓶','等效洁净气体灭火瓶','灭火瓶操作','灭火器'],
q:'机上手提灭火瓶有哪两种？如何操作？',
a:'机上配备两种手提灭火瓶：①海伦灭火瓶（I型/件号74-20）：从支架取下→竖直握住提把提起→向下打开安全锁扣压断铅封丝→对准火源底部→压下把手来回扫射；②等效洁净气体灭火瓶（II型）：取下安全栓→对准火源底部→按压把手来回扫射（其余步骤相同）。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.1.2', t:['灭火瓶检查','灭火瓶怎么检查','压力表','绿色区域','安全锁扣','铅封','设备检查要点','灭火器'],
q:'灭火瓶的设备检查要点是什么？',
a:'灭火瓶设备检查：(1)固定在支架上；(2)压力表指示在<strong>绿色区域</strong>；(3)检查安全锁扣和铅封/安全栓完好。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.1.3', t:['灭火瓶喷射时间','灭火瓶的性能','灭火瓶能喷多久','灭火瓶喷多久','灭火瓶喷射时长','9-12秒','工作距离','1.5-2米','反复按压'],
q:'灭火瓶喷射时间和最佳工作距离是多少？',
a:'灭火瓶持续喷射时间大约<strong>9-12秒钟</strong>，可反复按压多次直至用完；最优工作距离<strong>1.5-2米</strong>。灭火剂需要完全雾化才会有效。灭火剂有微毒，禁止对头部喷洒以免造成窒息。建议灭火时戴上PBE。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.2', t:['PBE','防护式呼吸装置','PBE能供氧多久','PBE供氧时间','PBE的性能','PBE性能','15分钟','I型II型'],
q:'防护式呼吸装置（PBE）是什么？能供氧多久？',
a:'PBE可保护使用者的眼睛和呼吸系统不受高热、烟雾和毒气的侵害，能保证至少<strong>15分钟</strong>完全自主的呼吸。首要功能是在火灾、烟雾、有毒气体时向乘务员提供氧气，也可在客舱释压时使用。分胸前式（I型）和头戴式（II型）。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.2.2', t:['PBE穿戴','PBE','PBE怎么戴','PBE怎么穿','PBE如何穿戴','PBE怎么穿戴','PBE怎么用','PBE操作','PBE如何使用','扩展颈部密封圈','触发绳','身体固定绳','I型'],
q:'PBE（I型胸前式）如何穿戴？',
a:'I型PBE穿戴：①打开储存盒→②取出撕开真空袋→③拿出展开PBE→④双手扩大颈部密封圈，低下头将PBE套头上，罩住口鼻、头发在内→⑤用力拉动触发绳使其开始工作（听到呲呲气流声）→⑥将身体固定绳在腰间系好。'},
{cat:'机型设备-烟雾火警设备', icon:'📘', src:'CCM 4.4.2.2.2', t:['PBE头戴式','头戴式PBE','II型PBE','II型','PBE头戴式怎么戴','PBE头戴式怎么用','PBE头戴式操作','PBE','PBE操作','触发拉环','颈部密封圈'],
q:'PBE（II型头戴式）如何穿戴？',
a:'II型头戴式PBE穿戴：①从储存盒中取出真空袋→②撕开真空袋取出PBE→③拉动<strong>触发拉环</strong>（听到气流声）→④用双手扩大颈部密封圈→⑤低下头将PBE套在头上→⑥确保头发在PBE内。取下时双手由颈下插入面部，向上拉起PBE取下。设备检查：包装观察窗显示<strong>红色</strong>即为不正常。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.3', t:['急救箱','100个座位','1只','配备数量','急救措施'],
q:'急救箱的配备数量标准是什么？',
a:'每架飞机在载客飞行中所配急救箱的数量不得少于<strong>每100个旅客座位1只</strong>。乘务员应对急救箱的数量、有效期及签封是否在位进行检查。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.2', t:['急救箱','应急医疗箱','急救箱区别','药品','医疗物品补充箱','急救箱组成','急救措施'],
q:'急救箱与应急医疗箱有什么区别？',
a:'急救箱（first aid kit）用于一般外伤应急处理；应急医疗箱（medical kit）含应急医疗及诊断物品。箱内物品缺失时先用医疗物品补充箱补充足量；如急救箱/应急医疗箱在运行中已使用过，乘务长应填写《飞行中旅客紧急医学事件报告》并按规定报告和补充。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.2.4/4.5.3.4', t:['急救箱里面有什么','急救箱里有什么','急救箱有什么','急救箱物品','应急医疗箱组成','急救箱组成','药品清单','箱内物品','应急医疗箱','都有什么'],
q:'应急医疗箱和急救箱里面都有什么？',
a:'<strong>应急医疗箱（每架载客运行飞机配1个）主要组成</strong>：血压计、听诊器、口咽气道（大中小各1）、静脉止血带、脐带夹、医用口罩、医用橡胶手套、皮肤消毒剂及消毒棉签、体温计（非水银式）、注射器（2ml/5ml各2支）、0.9%氯化钠溶液250ml、1:1000肾上腺素注射液2支、苯海拉明注射液2支、硝酸甘油片10片、醋酸基水杨酸（阿司匹林）口服片30片、应急医疗箱使用手册、飞行中旅客紧急医学事件报告单（标★药品和物品须由医疗专业人员使用或操作）。<br><strong>急救箱（A320配2个/A321配3个）主要组成</strong>：绷带、敷料、三角巾、胶布、动脉止血带、外用烧伤药膏、可塑性手臂/腿部夹板、医用剪刀、医用橡胶手套、皮肤消毒剂及消毒棉签、单向活瓣嘴对嘴复苏面罩、急救箱使用手册、飞行中旅客紧急医学事件报告单。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.2.7', t:['应急医疗箱检查','签封','黄色签封','有效期','补充','应急医疗箱'],
q:'应急医疗箱设备检查和签封有什么要求？',
a:'(1)乘务员应对应急医疗箱的数量、有效期及签封是否在位进行检查；(2)签封缺失且核对无缺失的，经责任乘务员和乘务长双人确认后用备用<strong>黄色签封</strong>封箱继续运行，航后报告航空医师；(3)物品缺失的先用医疗物品补充箱补足，双人确认后黄色签封封箱，补充箱用红色签封封箱，航后报告航空医师；(4)数量不足、未在有效期内且不能及时补充的，报告AOC和航空医师，待补齐后方可运行。'},
{cat:'机型设备-急救设备', icon:'📘', src:'CCM 4.5.5', t:['卫生防疫包','防疫包','突发公共卫生','物品'],
q:'机上卫生防疫包用于什么？',
a:'卫生防疫包用于机上发生传染病或疫情疑似情况时的防护、隔离与处置，防止交叉感染。用途与要点：<ul><li>当怀疑旅客患传染病或存在<strong>体液污染（血液、呕吐物、尿液等）</strong>时，使用卫生防疫包进行收集、隔离与清洁被污染物品</li><li>处置前先做好个人防护（手套、口罩），避免皮肤直接接触体液</li><li>包装内通常含防护与隔离所需物品（口罩、手套、清洁袋等）</li><li>使用卫生防疫包后，乘务长应填写《飞行中旅客紧急医学事件报告单》并按规定上报；疑似传染病的及时报告机长并通知地面检疫部门</li></ul>防疫包的固定位置、有效期及清单构成见各机型《客舱设备检查单》。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.2', t:['应急撤离滑梯','滑梯','滑梯充气时间','滑梯多久充气','10秒','充气','滑梯操作','撤离滑梯'],
q:'应急撤离滑梯如何操作？多长时间充气完成？',
a:'气动开门方法：①确认机门滑梯在待命状态→②向上提起门把手后松开→③机门气动开启→④充分拉出红色人工充气手柄→⑤挡住涌来的旅客，滑梯在<strong>10秒内</strong>完成充气→⑥充气完毕开始撤离。水上撤离时滑梯可作为漂浮装置（A321 3号门滑梯除外）。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.2.6', t:['滑梯转移','失效舱门','滑梯杆','GIRT BAR','转移','撤离滑梯'],
q:'舱门失效且滑梯可用时如何转移滑梯？',
a:'当一扇门因故障、受挤压或水淹不能使用时，可将该门上的滑梯/滑筏转移至另一扇滑梯已脱开的机门使用。方法：失效舱门滑梯待命手柄须处于待命状态；打开上/下方卡扣去掉外壳；拆除滑梯包；向后45°拉黄色系索解开滑梯杆（GIRT BAR）；按步骤安装到新门并人工充气。适用范围：A320所有C型机门、A321的1号和4号门。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.6', t:['救生衣','求生衣','救生衣分几种','救生衣有几种','救生衣分类','分类','成人儿童','婴儿救生衣','几种'],
q:'机上救生衣按功能分为哪几种？',
a:'救生衣按功能分为三种：成人/儿童救生衣（黄色）、机组救生衣（橙色）、婴儿救生衣。按构造分为单气囊和双气囊救生衣（操作相同）。成人/儿童救生衣与机组救生衣操作基本相同。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.6.3', t:['救生衣','救生衣怎么穿','救生衣穿戴','红色充气阀门','离开飞机前','人工充气','腰带走线','如何穿戴'],
q:'成人/儿童/机组救生衣如何穿戴和使用？',
a:'救生衣穿戴：打开包装取出→从头上穿过（红色充气阀门在身前）→儿童将背后拉下完全展开、腰带走线打叉穿入扣好，成人腰带自后向前扣好系紧→调节松紧→多余腰带缠腰间→<strong>离开飞机前</strong>拉下红色充气阀门使气囊充气，并打开救生衣电池销→如漏气用人工充气管充气。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.6.3', t:['婴儿救生衣','系留绳','充气','成人救生衣连接','救生衣','求生衣'],
q:'婴儿救生衣如何使用？',
a:'婴儿救生衣：打开塑料包取出→将婴儿双手平举依次套入→围在婴儿脖子上，腰带放入孔中并放在婴儿身下→固定搭扣和尼龙子母带（不要太紧）→将系留绳与成人救生衣连接好→离开飞机前拉动红色充气阀门充气→漏气用人工充气管充气。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.6.4', t:['救生衣定位灯','8-10小时','电池销','夜间定位','求生衣'],
q:'救生衣定位灯如何工作、能亮多久？',
a:'救生衣定位灯用于夜间确定落水旅客方位。当海水浸入救生衣底部电池块的两个小孔内，电池即开始工作，定位灯在几秒内亮起并可<strong>持续亮8-10小时</strong>。如电池上有电池销，应先将其打开，定位灯才会工作。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.6.6', t:['客舱内充气','禁止客舱充气','救生衣','救生衣的性能','救生衣性能','救生衣自动充气','求生衣'],
q:'救生衣能否在客舱内充气？',
a:'<strong>不得在客舱内充气</strong>，充气的救生衣可能阻碍旅客撤离。若要释放出救生衣内气体，压下充气管内的阀门并挤压救生衣使气体挤出。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.7', t:['应急手电筒','手电筒','手电筒能亮多久','手电筒亮多久','电量指示灯','4小时','干电池'],
q:'应急手电筒有哪几类？电量指示灯式可持续多久？',
a:'应急手电筒分为电量指示灯手电筒和干电池手电筒。电量指示灯手电筒从支架取下灯即亮，通常可<strong>持续使用4小时以上</strong>；用后须把断路开关嵌入支架复位，否则电池将被耗光；若闪亮间隔在10秒以上或变暗表明电量不足。'},
{cat:'机型设备-应急撤离设备', icon:'📘', src:'CCM 4.6.1', t:['应急撤离能力','自动展开','地板高度出口','撤离辅助设备','紧急撤离'],
q:'飞机应急撤离辅助设备有什么要求？',
a:'公司A320/A321飞机备有紧急情况下能自动展开的应急撤离辅助设备；载有旅客的飞机在所装每个自动展开撤离辅助设备做好撤离准备之前，不得在地面移动、起飞或着陆；载有旅客的飞机在地面移动前至少有一个<strong>地板高度出口</strong>供旅客撤出。'},

{cat:'标准操作程序-飞行四阶段', icon:'📘', src:'CCM 5.1.1', t:['飞行四阶段','预先准备','直接准备','飞行实施','航后讲评'],
q:'飞行四阶段包括哪几个阶段？',
a:'飞行四阶段包括：<strong>预先准备、直接准备、飞行实施和航后讲评</strong>四个阶段。实施过程中客舱乘务员不得做与工作无关的事情；服务程序和标准须充分考虑完成时间，不得影响履行安全职责。'},
{cat:'标准操作程序-飞行四阶段', icon:'📘', src:'CCM 5.1.2', t:['四阶段节点','筹备会','上机后','落地后','节点任务','飞行四阶段','主要节点'],
q:'飞行四阶段的主要节点/任务有哪些？',
a:'预先准备（网上准备、个人准备、客舱机组准备会、机组协同准备会）；直接准备（进场、上机后-旅客登机前、旅客登机-飞机起飞前、起飞前最后准备、爬升/巡航/下降）；飞行实施（落地前最后准备、落地后滑行、到达停机位）；航后讲评（飞行后讲评）。'},
{cat:'标准操作程序-飞行四阶段', icon:'📘', src:'CCM 5.1.3', t:['标准操作程序','客舱监控','旅客管理','异常处置','基本要求'],
q:'飞行实施阶段客舱机组的基本要求是什么？',
a:'客舱机组在飞行实施阶段应持续做好客舱监控和旅客管理，确保客舱安全；严格遵守指令标志或飞行机组的指令；迅速识别并果断应用程序处置各类异常及紧急情况，有效管控风险。如遇颠簸等可不正常条件下可调整、删减服务。'},
{cat:'标准操作程序-预先准备', icon:'📘', src:'CCM 5.2.1', t:['网上准备','48小时','12小时','30分钟','春秋之家'],
q:'网上准备应在何时完成？',
a:'客舱乘务员应在航班起飞前<strong>48小时至起飞前12小时之间</strong>完成网上准备；未完成不得参与航班飞行。进入直接准备前必须完成不少于<strong>30分钟</strong>的网上准备。登录乘务门户（CC系统）或手机客户端"春秋之家"完成。'},
{cat:'标准操作程序-预先准备', icon:'📘', src:'CCM 5.2.2', t:['个人准备','飞行工作记录本','证件装具','身心评估'],
q:'个人准备阶段要做哪些事？',
a:'根据网上准备填写《飞行工作记录本》；确认携带的证件及装具并出发前再确认，避免晚签到晚登机甚至漏飞；评估个人身心健康，如有异常及时报告；执行次日浦东出港航班的乘务员应于航班前一天使用春秋之家报告乘车情况。'},
{cat:'标准操作程序-直接准备', icon:'📘', src:'CCM 5.3.1', t:['签到酒测','春秋之家签到','30分钟','酒测','健康自评','签到与酒测'],
q:'直接准备时的签到与酒测有什么要求？',
a:'在公布的签到时间前，使用手机客户端"春秋之家"打卡签到；无法成功签到须立即向当日值班经理报备；在签到时间前30分钟（含）以内完成酒测，完成酒测后通过"春秋之家（SMP）"完成健康自评。如酒精检测异常参照3.4.3.2复测。'},
{cat:'标准操作程序-直接准备', icon:'📘', src:'CCM 5.3', t:['直接准备内容','上机前准备','签到酒测','乘务组准备会'],
q:'直接准备阶段（签到后至上机前）要做哪些事？',
a:'直接准备阶段是上机前完成各项准备的关键环节：<ul><li>按规定时间<strong>签到并完成酒测、健康自评</strong>，无法正常签到的及时向值班经理报备</li><li>领取并核对手册、证件、《飞行工作记录本》等装具</li><li>参加<strong>乘务组准备会</strong>，接受乘务长对安全、服务、特殊旅客等工作的布置</li><li>参加/确认<strong>机组协同准备会</strong>，明确本次航班特殊运行、颠簸预案等协同信息</li><li>按规定携带个人证件、航班资料等，按节点时间完成相应准备并复查</li></ul>'},

{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.2', t:['客舱设备检查','客舱设备检查单','应急灯光','撤离信号','报告乘务长'],
q:'上机后客舱设备检查怎么做？',
a:'乘务组登机后，乘务长组织组员按《客舱设备检查单》对客舱设备进行检查，包括餐车、刹车、烤箱等服务设备。对应急灯光以及撤离信号检查前，乘务长必须向机长提出申请，得到同意后方可进行。发现设备问题及时报告乘务长，由乘务长报告机务人员。'},
{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.4.2', t:['机组餐','机长副驾驶','餐食种类不同','间隔1小时','检查要求'],
q:'机组餐检查有哪些要求？',
a:'确认机组餐食份数和实际机组人数相符；保证机长和副驾驶的餐食种类不同，相同应立即提出调换，如无法调换则报告机长，并告知机长和副驾驶需<strong>间隔1小时</strong>进餐。冷藏箱温度不得超过10℃（餐食可保存12小时），无冷藏设施时餐食可保存4小时。'},
{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.3', t:['航前安保检查','航空安全员','安保检查单','目视检查','合并进行','安保'],
q:'航前安保检查如何执行？',
a:'各号位收到航空安全员PA外话发布安保检查指令后，按《春秋航空A320/321机型安保检查单》的分工协助航空安全员执行；安保检查区域与客舱设备检查区域相同时可合并进行。检查完毕各号位外话报告"X号位安保检查完毕"。'},
{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.2.6', t:['消防水','锂电池','餐车','前后服务间','清点检查','充电宝','移动电源'],
q:'机上锂电池扑救用"消防水"如何配备？',
a:'锂电池辅助灭火专用水（消防水）每架飞机配备<strong>两瓶</strong>，分别放置于前后服务间的餐车内，由乘务长和4号位乘务员做好清点、检查工作。应放置在便于取用、不被遮挡处；水量不满自行加灌生水；如餐车未配备消防水及时与机操部联系配送。'},
{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.2.8', t:['安全须知','出口座位旅客须知卡','备份','30张','10张','应急出口座位'],
q:'备份《安全须知》和《出口座位旅客须知卡》各配多少？',
a:'每架飞机前舱全餐车内配备有不少于<strong>30张</strong>备份《安全须知》和不少于<strong>10张</strong>备份《出口座位旅客须知卡》。各号位航前按旅客服务组件检查区域检查旅客座位口袋内的须知卡，缺失损坏用备份补充。'},
{cat:'标准操作程序-上机后', icon:'📘', src:'CCM 5.4.1.2.9', t:['座椅安全带','氧气系统检查','驾驶舱门','应急出口通道','值班乘务员','上机后','安全设施','系安全带'],
q:'上机后要检查哪些安全设施？',
a:'检查旅客座椅、安全带、行李架是否完好；检查客舱固定氧气系统外观并确认乘务员位置数量；驾驶舱门由乘务长负责安保检查，确认能从外部正常锁闭；A320由3号位、A321由3号8号位检查应急出口通道确保畅通。发现任何问题立即通知机务并填写客舱记录本。'},
{cat:'标准操作程序-起飞前', icon:'📘', src:'CCM 5.4.2.10', t:['出口座位旅客评估','评估','登机前','目视评估','询问确认','应急出口座位'],
q:'起飞前如何进行出口座位旅客评估？',
a:'在关闭所有旅客登机门前，指定的客舱乘务员对每一位坐于出口座位的旅客适合情况进行<strong>目视评估、询问和确认</strong>，提示其阅读出口座位旅客须知卡并自我对照，以上述过程中（还有手动指示等）旅客能理解的语言进行基本的出口座位简介，发现不适合坐出口座位的旅客报告乘务长。'},
{cat:'标准操作程序-起飞前', icon:'📘', src:'CCM 5.4.2', t:['安全演示','救生衣演示','救生衣演示时机','仅水上迫降演示','安全须知卡','起飞前','救生衣什么时候演示','求生衣'],
q:'起飞前安全须知/安全演示包含哪些内容？',
a:'起飞前乘务组按规定进行安全须知演示（安全示范）。主要内容和时机：<ul><li><strong>安全带</strong>演示：系紧与解开的方法</li><li><strong>氧气面罩</strong>演示：佩戴与供氧顺序（先戴自己面罩再帮他人）</li><li><strong>救生衣</strong>演示：位置、穿戴与充气方式——<strong>仅在实施水上迫降时进行救生衣演示</strong>（见6.2.5.4）</li><li><strong>出口位置</strong>指示：示意最近及相邻应急出口</li><li><strong>出口座位旅客个别简介</strong>：对其承担操作出口的职责进行简短说明</li><li>对需帮助旅客（无成人陪伴儿童、残疾人、老年旅客等）进行安全须知简介并提供相应保障</li></ul>演示须按规定时机完成，确保旅客知晓基本安全事项。'},
{cat:'标准操作程序-起飞前', icon:'📘', src:'CCM 5.4.3/5.5', t:['起飞前最后准备','安全检查','松散物品','旅客就座'],
q:'起飞前最后准备阶段做什么？',
a:'起飞前最后准备包括完成客舱安全检查（核实旅客就座并系好安全带、松散物品固定、出口通道和过道无行李堆堵等），提醒旅客收起小桌板、调直座椅靠背等，并做最后的报告确认，确保具备起飞条件。'},
{cat:'标准操作程序-起飞后落地', icon:'📘', src:'CCM 5.5.1', t:['起飞后','爬升','客舱服务','安全带灯','服务开始','系安全带'],
q:'起飞后何时开始客舱服务？',
a:'飞机平飞/起飞后20分钟且安全带信号灯关闭后，乘务员与驾驶舱沟通后可开始客舱服务程序。起飞爬升阶段不得提供服务，须待进入平飞且信号灯关闭后方可执行。'},
{cat:'标准操作程序-起飞后落地', icon:'📘', src:'CCM 5.5.3.2', t:['着陆前安全检查','客舱安全检查','收起物品','安全带','系安全带'],
q:'着陆前安全检查（CCAR 121.583）包括哪些内容？',
a:'着陆前安全检查依据CCAR 121.583及手册5.5.3.2执行，主要内容包括：<ul><li>提醒旅客<strong>系好安全带</strong>，将座椅靠背调直、小桌板收起并固定</li><li>收起并固定桌板上的物品，将手提行李、松散物品放入行李架或座椅下固定</li><li>确保<strong>应急出口与过道畅通</strong>，无行李堆堵</li><li>确认餐车、服务间设备固定，客舱门处于着陆就绪状态</li><li>乘务员自身回到值勤位置坐好、系好安全带与肩带</li></ul>乘务组按规定时间完成检查并向乘务长报告，确保具备安全着陆条件。'},
{cat:'标准操作程序-起飞后落地', icon:'📘', src:'CCM 5.5.4', t:['下降阶段','下降准备','客舱服务停止','安全检查'],
q:'下降阶段客舱乘务员做什么？',
a:'下降阶段须停止客舱服务，进行着陆前客舱安全检查和固定松散物品（含检查烤箱架无油渍碳渍等），检查旅客就座系好安全带，乘务员自身在值勤位置坐好系好安全带，为着陆做好准备。'},
{cat:'标准操作程序-落地后', icon:'📘', src:'CCM 5.6.4', t:['落地后','到达停机位','发动机关车','系好安全带灯灭','离机','系安全带'],
q:'落地后、发动机关车后如何操作？',
a:'到达停机位、发动机关车、系好安全带灯熄灭后，乘务组方可解除安全带指令组织旅客离机；按程序解除滑梯待命（如5.6.2.1滑梯解除预位程序），并做好离机引导和客舱检查。'},
{cat:'标准操作程序-落地后', icon:'📘', src:'CCM 5.6.2.1', t:['滑梯解除预位','滑梯待命','客舱门操作','撤离滑梯'],
q:'落地后滑梯解除预位程序是什么？',
a:'落地后滑梯解除预位（解除待命）程序：<ul><li>在飞机<strong>到达停机位、发动机关车、系好安全带灯熄灭</strong>后方可解除滑梯待命并开舱门</li><li><strong>C型门</strong>：将机门待命手柄从预位（ARMED）转回解除预位（DISARMED）位，确认滑梯杆（GIRT BAR）处于安全位置后开门</li><li><strong>机翼上方出口（III型机门）</strong>：按应急出口操作要求解除预位</li><li>解除预位后向乘务长/驾驶舱报告，再按程序组织旅客离机</li><li>起飞前则相反，须在舱门关闭前完成<strong>滑梯预位</strong>并向机组确认</li></ul>具体操作口令与确认方式按机型《客舱设备检查单》执行。'},
{cat:'标准操作程序-航后讲评', icon:'📘', src:'CCM 5.7', t:['航后讲评','航班讲评','问题反馈'],
q:'航后讲评主要做什么？',
a:'航后讲评在每次航班任务结束后进行，是飞行四阶段（预先准备、直接准备、飞行实施、航后讲评）的最后一个阶段：<ul><li>乘务长组织全体客舱乘务员对本次航班的<strong>安全、服务、运行及不正常情况</strong>进行总结与反馈</li><li>回顾并复盘正常/不正常/应急事件的处置过程，查找问题、总结经验、明确改进措施</li><li>填写相关记录，如《客舱记录本》（CLB）、机上事件/紧急医学事件报告单、SQM报告、智慧客舱登记等</li><li>将需上报或跟进的事项按报告程序上报值班经理、相关处室</li></ul>讲评须客观如实，为后续飞行运行提供依据。'},
{cat:'标准操作程序-航后讲评', icon:'📘', src:'CCM 5.7', t:['航后讲评内容','讲评记录','航班总结','乘务长讲评'],
q:'航后讲评一般包括哪些内容？',
a:'航后讲评由乘务长组织，一般包括：<ul><li>本次航班旅客乘机与特殊旅客服务情况</li><li>客舱安全、不正常事件及应急处置过程的回顾与复盘</li><li>服务程序执行、旅客投诉与表扬情况</li><li>客舱设备状况与需上报事项</li><li>组员表现与改进建议</li></ul>讲评结果和需上报内容按要求填写记录（客舱记录本、SQM、智慧客舱等）并在航后及时反馈。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.6', t:['指挥体系','机长负责','指挥权','飞行安全'],
q:'飞机上应急指挥体系是怎样的？',
a:'飞机上由<strong>机长负责飞行安全</strong>，所有人员必须听从机长指示。一旦机长或其他机组成员丧失行为能力，按本手册3.6.1.5"飞机指挥权接替程序"确定指挥权接替人。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.1', t:['撤离决定','机长决断','撤离指令','应急撤离决定','紧急撤离'],
q:'应急撤离的决定由谁做出？',
a:'应急撤离必须由<strong>机长决断</strong>，机组人员必须等待机长做出命令，除非紧急情况变为灾难性。如机长能力丧失，按下列顺序宣布应急撤离指令：巡航机长→C/B/A类副驾驶→驾驶舱其他合适成员→乘务长→客舱乘务员→航空安全员。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.2', t:['乘务组各就各位','Cabin crew at stations','中英文口令','各就各位','镇静听指挥'],
q:'听到"乘务组各就各位"口令时乘务员要做什么？',
a:'听到驾驶舱广播中英文口令"乘务组各就各位！Cabin crew at stations！"时，客舱机组须意识到飞行机组可以控制局势和决策。客舱乘务员解开安全带并站起来，发布口令："镇静、听指挥！Keep calm, follow my direction!"；无准备水上迫降时取出并使用救生衣或漂浮装置。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.3', t:['撤离口令','Evacuate','撤离撤离','快撤离'],
q:'听到"撤离！撤离！Evacuate！"口令时怎么办？',
a:'听到驾驶舱广播中英文口令"撤离！撤离！Evacuate！Evacuate！"或听到应急撤离信号时，客舱乘务员须立即组织应急撤离：撤离滑梯未预位时先迅速预位滑梯；解开安全带站起来；无准备水上迫降取出使用救生衣；将所有个人物品留在飞机上；移向过道准备到最近可用出口。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.3', t:['机门处口令','跳滑','Come this way','撤离口令','陆上','口令'],
q:'陆地迫降撤离时机门处的撤离口令是什么？',
a:'陆地迫降机门处口令："到这边来，跳、滑！Come this way, jump slide."；翼上出口口令："到这边来，坐、滑！Come this way. Sit! Slide!"。水上迫降机门处使用滑筏时："到这边来！救生衣充气！上船！Come this way. Inflate your life vest. On board!"。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.4', t:['不需撤离','旅客留在原位','Passengers remain seated','撤销撤离','口令'],
q:'决定不撤离时听到什么口令？',
a:'当决定不撤离时，客舱乘务员会收到机长广播："旅客留在原位，旅客留在原位。Passengers remain seated！"如机长进一步决定需尽快离开飞机，则按6.7启动快速离机；客舱乘务员安抚旅客："镇静、听指挥！"、"我们安全了，请坐在座位上坐好"。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.2', t:['联系未果','30秒','驾驶舱失能','自主发起撤离','FAP','驾驶舱','未果','联系不到'],
q:'飞机停稳后联系驾驶舱未果怎么办？',
a:'当存在应撤离情况（烟雾火灾无法控制、机体明显破损、燃油严重泄漏、水上迫降等）且未获指令时，乘务长应立即用多种方式联系驾驶舱；<strong>联系30秒后未果</strong>，视为驾驶舱机组失能，客舱机组在确保安全前提下可自主发起撤离指令组织实施撤离。自主发出撤离指令首先使用FAP上的"EVA CMD"键，其次用PA、扩音器、口头指令等。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7.5', t:['防止擅自撤离','旅客逃离','监护机门','应急出口'],
q:'如何防止旅客未经允许擅自撤离飞机？',
a:'发生紧急情况时机组成员应保持警戒，防止旅客未经允许擅自撤离飞机。飞行机组与客舱机组保持联系，发现舱门或应急出口被异常触碰或打开应及时沟通立即制止；乘务员加强机门和应急出口的监护、设法使旅客镇静、必要时进行客舱广播。'},
{cat:'应急程序-总则与口令', icon:'📘', src:'CCM 6.1.7 撤离决定', t:['撤离指令不可取消','偏离取消','一旦下达','撤离指令','取消'],
q:'撤离指令下达后能否取消？',
a:'机组需明白只要<strong>撤离指令没有下达就可以偏离或取消</strong>；一旦撤离指令下达，此决定<strong>不可取消</strong>，全体机组成员必须密切合作确保撤离成功。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2', t:['有准备迫降','Brace for impact','口令','迫降准备'],
q:'有准备迫降时机组与旅客的口令/动作是什么？',
a:'有准备迫降由客舱机组通过广播演示救生衣穿戴、防冲击姿势、出口位置；指导旅客采取防冲击姿势，口令"防冲击姿势 Brace for impact"。应按准备时间演示救生衣穿戴方法、防冲击姿势、出口位置指示并采取防冲击姿势指令。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2.6.1', t:['成人防冲击姿势','儿童防冲击姿势','头抵椅背','孕妇姿势','安全带低位','防冲击姿势','成人旅客','系安全带'],
q:'成人旅客的正确防冲击姿势是什么？',
a:'成人正确防冲击姿势：保持安全带的低位并系紧；向前弯曲，把头抵在前面座椅的椅背上；将手放在头顶或将手臂放在小腿两侧或抱住小腿；将脚平放在地板上尽量向后。错误姿势：头部向后倾斜、头搁在交叉前臂上、头靠在手上等应避免。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2.6.1', t:['婴儿防冲击姿势','儿童CRS','儿童限制装置','26公斤','125厘米','防冲击姿势','儿童防冲击姿势'],
q:'有准备迫降时婴儿/儿童的防冲击姿势如何处理？',
a:'体重<strong>小于26公斤（60磅）</strong>和身高<strong>小于125厘米（49英寸）</strong>的婴儿和儿童可使用经批准的儿童限制装置（CRS）占用单独座位得到保护。如无CRS，可将婴儿直立面向成人、成人一只手臂环绕婴儿躯干、另一只支撑头部，成人前倾将头抵前座椅背，把婴儿保持在成人与前座之间；不应将婴儿放在成人膝盖上。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2.6.1', t:['孕妇防冲击姿势','身体受限旅客','安全带腹部以下','防冲击姿势','系安全带'],
q:'孕妇和身体受限旅客的防冲击姿势有何要求？',
a:'(1)紧靠座椅靠背；(2)将安全带系在低处并系紧、不得扭曲、确保安全带在腹部以下；(3)尽可能分开腿，身体向前弯曲，尽量靠在前排座位上；(4)将手放在头的后面两手交叠、不交叉手指、肘部缩紧（或把手臂放在小腿侧面）；(5)前方无座位时弯腰双手放头后。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2.6.3', t:['乘务员防冲击姿势','面向机头','面向机尾','下颏置胸','安全带肩带','防冲击姿势','系安全带'],
q:'客舱乘务员的防冲击姿势是什么？',
a:'面向机头的乘务员：上下背部紧靠座椅靠背，系紧安全带和肩带（腰带臀部低位、不扭曲），下颏置于胸部，手放腿上，脚腿稍分开，脚平放地板，前方有舱壁时脚平放前伸至脚尖碰到舱壁（不踩舱壁）。面向机尾的乘务员：保持头部紧靠靠背/头枕，胸前交叉手臂（不握肩带），膝弯曲90度。'},
{cat:'应急程序-有准备迫降', icon:'📘', src:'CCM 6.2.7.1', t:['旅客援助者','需要帮助旅客','安排援助者','老人残疾人'],
q:'迫降时如何为需要帮助的旅客安排援助者？',
a:'为需要帮助的旅客（如老年旅客、残疾人、伤病旅客、无人陪伴儿童和行动不便的旅客）安排援助者；重新安置旅客和援助者的座位，避免把家人分开；结合旅客情况及个别简介信息选择7.15.3中的一种撤离方式指导援助者；如未找到援助者由乘务员协助撤离。'},
{cat:'应急程序-无准备迫降', icon:'📘', src:'CCM 6.3', t:['无准备迫降','静默三十秒复查','防范','口头痛令'],
q:'无准备迫降的防范措施是什么？',
a:'由于没有时间为无准备迫降做客舱准备，因此客舱乘务员必须在事先做好充分防范——<strong>静默三十秒复查</strong>。通过事先的和机动的准备，随时做好面对无准备迫降和立即撤离的准备。'},
{cat:'应急程序-无准备迫降', icon:'📘', src:'CCM 6.3', t:['静默三十秒复查','无准备迫降','静默复查','防范措施'],
q:'无准备迫降的"静默三十秒复查"包含哪些要点？',
a:'"静默三十秒"用于无准备迫降时乘务员在事发前用三十秒快速复查客舱与自身准备状态，主要要点包括：<ul><li>客舱：确认松散物品已固定、锋利物品收起、旅客都在座位并系好安全带</li><li>出口：确认最近的应急出口方位、滑梯/滑筏可用性</li><li>指令：牢记撤离口令、防冲击姿势与机门操作要点</li><li>自身：坐回值勤位置系好安全带与肩带，备好必要防护</li></ul>通过事先和机动的准备，随时做好面对无准备迫降和立即撤离的准备。'},
{cat:'应急程序-组织撤离', icon:'📘', src:'CCM 6.4.4', t:['陆地迫降要点','观察机外','确认出口','障碍物','不开门','陆地迫降'],
q:'陆地迫降撤离时开门前做什么？',
a:'陆地迫降撤离要点（6.4.4）：注意观察机外情况，如有烟雾、起火和障碍物等情况<strong>不要开门</strong>，指挥旅客去其他出口。开门确认机外安全且滑梯充气可用后，指挥旅客从滑梯撤离。'},
{cat:'应急程序-组织撤离', icon:'📘', src:'CCM 6.4.5', t:['水上迫降要点','救生衣充气','跳入水中','滑梯作浮板','水位','水上迫降','迫降撤离','求生衣'],
q:'水上迫降撤离的要点是什么？',
a:'水上迫降撤离要点：<ul><li>开门前观察机外，如有<strong>烟雾、起火、障碍物或水位过高</strong>等情况不要开门，指挥旅客去其他出口</li><li>旅客离开飞机前<strong>救生衣充气</strong>；使用滑筏时口令"救生衣充气！上船！"（Come this way. Inflate your life vest. On board!）</li><li>滑梯可作为<strong>漂浮装置</strong>使用（A321 3号门滑梯除外），滑筏可作为救生筏；登筏人员均匀分布，避免倾覆</li><li>入水后尽快登上滑筏，将SK包、ELT携带上筏，连接滑筏、放下海锚、组织救起落水者，做好体温过低防护</li><li>指挥旅客取下硬鞋等尖锐物品，拆下直接靠近水面的出口</li></ul>'},
{cat:'应急程序-组织撤离', icon:'📘', src:'CCM 6.4', t:['撤离指挥','成对撤离','双通道滑梯','请勿携带物品','指挥出口','撤离滑梯'],
q:'撤离时如何指挥旅客从出口撤离？',
a:'一旦客舱机组打开出口并确认滑梯/滑筏可用，应指示旅客朝可用出口移动；装有双通道滑梯的出口应指挥旅客尽快成对撤离；如果出口不能使用，禁用此出口并指挥旅客选择另一可用出口；反复指挥旅客<strong>不要携带任何物品</strong>。'},
{cat:'应急程序-组织撤离', icon:'📘', src:'CCM 6.4.2', t:['撤离时机','撤离速度','安全出口','撤离要点'],
q:'影响撤离成功的关键要素有哪些？',
a:'成功的应急撤离因素包括：客舱机组的知识（训练、经验和行为）、飞机结构客舱布局、飞机内外环境（烟雾、火警、客舱灯光和外部情况）、旅客的行为年龄和情绪控制程序。人员撤离须快速高效，防止旅客携带行李物品延误撤离。'},
{cat:'应急程序-组织撤离', icon:'📘', src:'CCM 6.4.1', t:['撤离决策','评估出口','可用出口','选择出口','组织撤离'],
q:'组织撤离时如何选择使用哪个出口？',
a:'组织撤离（6.4）要求乘务员评估各出口可用状况，选择最近且安全的可用出口，指挥旅客朝可用出口移动；对不安全的出口进行处理（禁用/关闭）并引导旅客选择其他出口。出口选择还须结合机外状况（烟雾、火、水、障碍物）判断，确保安全。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.1', t:['释压类型','缓慢释压','急速释压','爆炸性释压','1分钟','几种','哪几种','客舱失压'],
q:'释压分哪几种类型？',
a:'释压分为：①<strong>缓慢释压</strong>：逐渐失去客舱压力（机门/应急窗密封泄漏或增压系统故障）；②<strong>急速释压</strong>：迅速失去客舱压力，通常一分钟内发生（金属疲劳、炸弹爆炸、武器射击等引起密封破裂）；③极端情况下5秒内发生的可归类为爆炸性释压。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.2', t:['急速释压迹象','氧气面罩脱落','雾气','冷空气','中耳受压','有哪些迹象','客舱失压'],
q:'急速释压有哪些迹象？',
a:'急速释压迹象：客舱灯光突然异常明亮、物体飘飞灰尘扬起、飞机结构突然损坏强烈震动、冷空气涌入温度下降、很响气流声及水雾或结霜、客舱突然雾气笼罩（烟雾探测器误报警不必理会）、中耳受压耳膜凸出、氧气面罩脱落、飞机急速下降、物品被吸向洞口、系好安全带灯亮而洗手间返回座位灯不亮。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.4.1', t:['飞行机组释压处置','应急下降','10000英尺','3000米','Emergency descent','释压处置','对释压','直接处置'],
q:'飞行机组对释压如何直接处置？',
a:'飞行机组直接处置：戴上氧气面罩；把飞行高度迅速（通常是陡直地）下降到大约<strong>10000英尺/约3000米</strong>；打开禁止吸烟和系好安全带信号；发布中英文广播"应急下降，应急下降，Emergency descent, Emergency descent"。到达安全高度后广播"所有人摘掉氧气面罩，乘务组检查客舱向我报告"，再飞往最近合适机场着陆。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.4.2', t:['客舱乘务员释压处置','戴上氧气面罩','最近座位','坐下系带','手势指示','释压处置','对释压','直接处置'],
q:'客舱乘务员对释压如何直接处置？',
a:'(1)迅速戴上最近的氧气面罩；(2)立即在最近座位坐下系上安全带；(3)无空座则坐旅客身上让旅客抱紧腰或蹲地上握行李档杆固定自己；(4)在戴面罩情况下用手势和简短提示指示旅客系好安全带；(5)到安全高度前停止客舱一切活动；(6)提醒带儿童旅客要先戴自己面罩再协助儿童。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.4.2', t:['10分钟','联系驾驶舱','便携式氧气瓶','进入驾驶舱急救','联系不到','急救措施','氧气瓶'],
q:'释压后10分钟联系不到驾驶舱怎么办？',
a:'若飞行机组已发布"应急下降"广播，自听到广播起计时，<strong>如10分钟后</strong>未收到宣布到达安全高度或解除指令，乘务长应通过内话立即与飞行机组取得联系；若无回应立即更换便携式氧气瓶进入驾驶舱进行急救。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.4.3', t:['释压后客舱检查','氧气面罩收起','系起来','携带氧气瓶','重新安置','客舱失压','便携式氧气瓶'],
q:'释压后客舱检查包括哪些内容？',
a:'飞机到达安全高度后：(1)检查机门是否完好；(2)将机门上方的氧气面罩系起来缩短下坠长度避免阻碍撤离；(3)携带氧气瓶进行客舱检查；(4)距驾驶舱最近的机组主动联系飞行机组；(5)为缺氧旅客或机组供氧；(6)指示旅客将用过的面罩放入座椅口袋或打结固定在应急氧气系统盖板处；(7)如机身上有裂口重新安置旅客离开危险区域。'},
{cat:'应急程序-释压', icon:'📘', src:'CCM 6.5.3.2', t:['有用知觉时间','TUC','缺氧','飞行高度','面罩'],
q:'什么是有用知觉时间（TUC）？',
a:'有用知觉时间（T.U.C）即不戴氧气面罩可以逗留的时间：从释压开始时起直到一个人由于缺氧而未能有效或足够地履行任务的时间阶段。影响TUC最重要的因素是飞行高度。缺氧反应随高度增加加重（如10000英尺头痛疲劳、22000英尺惊厥昏迷等）。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.1', t:['火灾分类','A类','B类','C类','灰烬液体电气','几类','火警'],
q:'机上火灾分哪几类？',
a:'火灾按类型分：<ul><li><strong>A类</strong>——灰烬类：织物、纸、木、橡胶</li><li><strong>B类</strong>——可燃性液体类：油脂、塑料等</li><li><strong>C类</strong>——电气类：烤箱、客舱灯具、整流器</li></ul>'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.5.2', t:['灭火角色','灭火者','通讯者','第二消防员','支援人员'],
q:'机上灭火小组有哪些角色分工？',
a:'灭火小组由若干人员组成，角色及职责：<ul><li>灭火者（主要消防员）：查明火源，根据火情使用灭火设备实施灭火</li><li>通讯者（联络员）：向飞行机组报告（灭火报告要素）、通知其他乘务员起火位置、接替乘务长完成火警广播</li><li>第二消防员：穿戴PBE做好防护及时替换主消防员、收集灭火设备、监控灭火设备使用时间和数量、清除可燃烧物品、疏散转移旅客</li></ul>另有支援人员和援助者。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.5.2', t:['灭火报告要素','火警报告','受伤人员','起火位置','持续报告','报告火警','火警要素'],
q:'向飞行机组报告火警时包含哪些要素？',
a:'按本手册6.6.6"灭火报告要素"向飞行机组报告，必要时进行持续报告。报告要素应包括起火位置、火势情况、处置进展、人员伤亡等，具体各要素以手册6.6.6原文（涉及位置、火种、程度、处置、伤亡等信息）为准。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.5.3.1', t:['浓烟防护','弯下腰捂住口鼻','Bend over','湿布捂口鼻','烟气低位'],
q:'客舱有浓烟时如何保护旅客？',
a:'如有浓烟，指挥旅客身体放低，并用手或湿润的布类（衣服、小毛巾、头片）捂住口鼻呼吸，防止吸入有毒气体，口令："弯下腰，捂住口鼻。Bend over. Cover your nose and mouth."乘务员可协助取水浸湿布类；向火源周边旅客发放湿毛毯或提醒取衣服遮挡。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.8.1', t:['洗手间起火','手背摸门','门是热的','略微开门','喷嘴扫射','卫生间','盥洗室'],
q:'洗手间起火（门热）如何处置？',
a:'若洗手间门是热的：(1)取出就近灭火瓶；(2)保持低位或蹲下，利用门板作保护预防烟雾和高温；(3)略微打开门，刚好能通过灭火瓶喷嘴；(4)将喷嘴对准内部扫射释放灭火剂；(5)关闭门；(6)按需重复；(7)安全时按门不热的程序处置。注意事项：不能在检查热度前打开门，不要正面对门缝晋级，防止氧气突然进入加重火情。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.8.2', t:['烤箱起火','关闭电源','拔出跳开关','堵通气孔','关闭烤箱门'],
q:'烤箱起火/冒烟如何处置？',
a:'烤箱起火一般由加热时间过长、油脂溢出或电气故障引起。除执行基本处置程序外：(1)关闭烤箱电源、拔出跳开关；(2)关闭烤箱门，堵上通气孔（如有）以消耗氧气（很多情况下火会熄灭）；(3)如烟/火焰仍存在，戴上PBE和防火手套取就近灭火瓶处置，略微打开门仅够伸入喷嘴并释放灭火剂，再关门按需重复。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.8.3', t:['烧水杯失火','干烧','切断电源','拔出烧水杯','不得倒水'],
q:'烧水杯（电热水壶）失火如何处置？',
a:'烧水杯长时间加热干烧易失火。处置：(1)<strong>切断电源、拔出跳开关</strong>；(2)拔出烧水杯；(3)使用灭火瓶灭火。注意事项：电器设备火警首先切断电源；使用灭火瓶灭火；<strong>不得将水倒入热的水杯内</strong>。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.8.5', t:['行李架起火','手背摸温','开小缝','隔绝空气','锂电池','充电宝','移动电源'],
q:'行李架内起火/冒烟如何处置？',
a:'行李架起火冒烟：(1)手背触摸行李架表面温度找出最高区域；(2)将行李架开启一条小缝仅够伸入灭火器喷嘴释放灭火剂；(3)关闭失火行李架隔绝外界空气；(4)火势控制后查明着火物品位置降温冷却；(5)持续监控防止复燃；(6)未控制则重复灭火程序；(7)判断是锂电池按6.6.9执行；(8)告知该区域旅客不要使用受损行李架。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.9', t:['锂电池发热','防护箱','冰块','冷却','监控','发热','充电宝','充电宝发热','发热时'],
q:'锂电池仅发热时如何处置？',
a:'锂电池仅出现发热现象：(1)关闭设备电源；(2)在防护前提下放置于开口的航空安全防护箱内，或置于冰水不渗漏袋上降温冷却（<strong>禁止使用冰块或干冰覆盖</strong>）；(3)由专人监控。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.9.2', t:['锂电池过热鼓包','焦糊味','浸没冷却','消防水','夹具','过热','鼓包','充电宝'],
q:'锂电池过热、鼓包或焦糊味如何处置？',
a:'(1)确认设备电源关闭；(2)戴好防火/防烫手套；(3)使用航空安全防护箱：用箱内夹具将涉事设备放入箱内，向箱内注入足够量的水（如锂电池专用消防水）或其他不可燃液体，确保<strong>锂电池被完全浸没</strong>；(4)防护箱已用/损坏时在备份箱内套上垃圾袋注水浸没冷却；(5)用夹具或餐车将冷却容器转移至后舱固定并监控。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.9.3', t:['锂电池起火冒烟','锂电池着火','锂电池起火','锂电池怎么处置','充电宝着火','查明原因','浸没','远离旅客','监控客舱'],
q:'客舱内锂电池起火冒烟如何处置？',
a:'确认由锂电池引发后：查明物品、确认由锂电池引发；向周围人员询问确定大致位置；维持客舱秩序安抚旅客，处置全程监控客舱安全，必要时疏散转移人员、提醒就座旅客系好安全带；将涉事设备浸没冷却并转移至后舱监控；告知所属人设备将浸水冷却并移交物证。'},
{cat:'应急程序-机上火灾', icon:'📘', src:'CCM 6.6.4', t:['灭火资源','清水灭火','碳酸饮料','消防水','湿毛毯'],
q:'机上灭火可用哪些资源？',
a:'灭火资源：(1)海伦灭火瓶、等效洁净气体灭火瓶（仅初步控制火势、不能彻底扑灭锂电池火，只能扑灭锂电池外部火焰）；(2)水、碳酸饮料、茶水咖啡果汁等不可燃液体可灭火冷却，前后服务舱各配备一瓶消防水供锂电池冒烟起火时淋洒降温；(3)湿毛毯可防火源周围物品被引燃、毛巾作隔热防护。'},
{cat:'应急程序-火灾', icon:'📘', src:'CCM 6.6.7', t:['闻到煤油汽油','关闭电器','提醒不要按呼唤铃','阅读灯','火警先兆','煤油','汽油','味道'],
q:'闻到煤油、汽油、酒精或化学物品味道时应怎么做？',
a:'当接到火警报告时，在飞机上闻到煤油、汽油、酒精或化学物品的味道，<strong>不要打开和关闭任何电器</strong>，提醒旅客不要按呼唤铃和阅读灯，以防产生电火花引燃。'},

{cat:'应急程序-事故后报告', icon:'📘', src:'CCM 6.9', t:['事故后报告','事故报告','新闻界','信息记录','报告内容','事故后','应急事件'],
q:'事故后客舱乘务员要作哪些报告记录？',
a:'事故后报告（6.9）：报告程序参照3.6.5.4.2；对新闻界提问不要作任何评论；尽量与局方合作直到事件结束；乘务长应确保记录有关信息、人员伤亡情况；作完整详细的事故报告，内容包括：登机时间、检查的应急设备、每一航段详尽报告、首次注意到应急事件的时间、为应付紧急事件的准备及步骤、实施应急处置详尽报告、旅客反应、为旅客做的每件事等。'},
{cat:'应急程序-求生技能', icon:'📘', src:'CCM 6.10.1', t:['求生','生存基本原则','24小时喝水','体力保存','分配饮水','基本原则'],
q:'求生技能的基本原则是什么？',
a:'(1)从容不迫的态度以保存全部体力，运动应缓和经常但不达疲乏；(2)利用所有物件保护身体免受寒冷湿气侵袭（毛毯衣服）；(3)将注意力集中在有益活动上防止枯燥敌意；(4)坚定领导旅客有效分配给养，通常<strong>撤离飞机24小时内不喝水</strong>（重伤例外应额外给水）；先用附近取得的淡水，将救生包里的饮用水保留。'},
{cat:'应急程序-求生技能', icon:'📘', src:'CCM 6.10.2', t:['求生饮水','不干净水煮10分钟','不能直接用雪','水比食物重要','饮水'],
q:'求生时饮水要注意什么？',
a:'生存中水比食物更重要。水源：机上带下的水饮料、河流湖泊池塘山泉、雨水露水、热带植物、寒带融化的冰雪。注意事项：不干净的水至少<strong>煮10分钟</strong>；河流湖泊要消毒；不得直接用冰和雪（会降体温造成脱水）；减少活动避免体液损失；飞机带下的水最后用；沙漠盐味水不得饮用。'},
{cat:'应急程序-求生技能', icon:'📘', src:'CCM 6.10.3', t:['求救信号','三堆火三角形','三次短闪','SOS','地对空符号'],
q:'求生时可以发出哪些求救信号？',
a:'可用的求救信号：应急定位发射器及救生包内信号设备；由<strong>三堆火组成三角形</strong>（国际通用）；三个烟柱三角形（蓝天白烟、雪地阴天黑烟）；手电筒"三次短闪、三次长闪、三次短闪"；地对空求救符号。国际公认的五种信号："V"＝需要帮助、"箭头"＝幸存者前进方向、"X"＝需要医疗、"Y/N"＝是/不是、"SOS"＝请救援我们。'},
{cat:'应急程序-求生技能', icon:'📘', src:'CCM 6.10.4', t:['陆地求生','远离飞机','清点人数','避难所','求生准备','求生'],
q:'陆地撤离后幸存者如何组织求生？',
a:'(1)首先远离飞机避免火的侵害；(2)发动机冷却、燃油蒸发、火熄灭后设法返回飞机；(3)对受伤人员施行急救并要求旅客中医务人员援助；(4)集合并清点人数，将幸存者分成若干小组，每组指定组长；(5)就地利用材料搭建临时避难所；(6)准备好发射求救信号的设备。'},

{cat:'应急救护-生命体征', icon:'📘', src:'CCM 7.7', t:['生命体征','体温','脉搏','呼吸','血压'],
q:'生命体征包括哪些？正常范围是多少？',
a:'生命体征包括体温、脉搏、呼吸、血压。正常范围：体温正常36.2-37.2℃（腋下36-37℃）；脉搏成人60-100次/分、儿童100-120、婴儿120-140；呼吸成人16-20次/分；血压成人收缩压90-140mmHg、舒张压60-90mmHg。飞机上通常采取腋下测温。'},
{cat:'应急救护-生命体征', icon:'📘', src:'CCM 7.7.1', t:['体温正常范围','36.2','37.2','低热','高热'],
q:'体温的正常范围和发热分级是什么？',
a:'正常体温（口腔基准）36.2-37.2℃，24小时内波动一般不超过1℃。体温升高分级：37.3-38℃低热、38.1-39℃中热、39.1-41℃高热、41℃以上超高热。体温低于正常常见于休克、大出血、年老体弱、甲减、重度营养不良、低温暴露过久。'},
{cat:'应急救护-生命体征', icon:'📘', src:'CCM 7.7.3', t:['呼吸正常值','16-20次','测量呼吸','听看感觉'],
q:'正常成人呼吸频率是多少？如何测量？',
a:'正常成人呼吸每分钟<strong>16-20次</strong>，儿童稍快。测量呼吸采用"听（有无呼气声）、看（胸腹部有无起伏）、感觉（脸颊贴近口鼻感受呼吸）"的方法；一般数胸腹起伏运动次数，最好与测量脉搏同时进行。'},
{cat:'应急救护-生命体征', icon:'📘', src:'CCM 7.7.4', t:['血压正常值','收缩压90-140','舒张压60-90','mmHg'],
q:'正常成人血压值是多少？',
a:'成年人正常血压值：收缩压（高压）<strong>90-140mmHg（12-18.6KPa）</strong>；舒张压（低压）<strong>60-90mmHg（8-12KPa）</strong>。'},
{cat:'应急救护-生命体征', icon:'📘', src:'CCM 7.7.5', t:['危重监测','10分钟','生命体征监测','病情危重'],
q:'病情危重的病人应多久监测一次生命体征？',
a:'机上急救时应注意随时观察病人的生命体征变化（体温、脉搏、呼吸和血压）；<strong>病情危重的情况要求至少10分钟监测一次</strong>。'},

{cat:'应急救护-呼吸道异物堵塞', icon:'📘', src:'CCM 7.10.2', t:['气道异物梗阻','V形手势','发绀','不能说话','完全阻塞'],
q:'气道异物梗阻有什么症状？',
