/* ===== 答题卡翻页导航（双层：题型 + 10题/页） ===== */
const AC_PAGE_SIZE = 10;

function _acGetGroups(qz){
  const groups = {};
  qz.indices.forEach((idx,i)=>{
    const t = APP.questions[idx]?.type || '其他';
    if(!groups[t]) groups[t] = [];
    groups[t].push({idx, i});
  });
  const order = (APP._meConfig && APP._meConfig.typeOrder) ? APP._meConfig.typeOrder : Object.keys(groups);
  return [...new Set([...order.filter(t=>groups[t]), ...Object.keys(groups)])].map(t=>({type:t, items:groups[t]}));
}

function _acTotalInnerPages(){
  const qz = APP.quiz; if(!qz) return 0;
  return _acGetGroups(qz).reduce((sum,g)=>sum+Math.max(1,Math.ceil(g.items.length/AC_PAGE_SIZE)), 0);
}

function _acGetPageByGlobal(globalPage){
  // globalPage 从 1 开始
  const qz = APP.quiz; if(!qz) return null;
  const groups = _acGetGroups(qz);
  let cursor = 1;
  for(let ti=0; ti<groups.length; ti++){
    const pages = Math.max(1, Math.ceil(groups[ti].items.length / AC_PAGE_SIZE));
    if(globalPage >= cursor && globalPage < cursor + pages){
      return {typeIdx: ti, innerPage: globalPage - cursor, groups, globalPage, totalPages: _acTotalInnerPages()};
    }
    cursor += pages;
  }
  // fallback: 最后一页
  const last = groups.length - 1;
  if(last < 0) return null;
  return {typeIdx: last, innerPage: Math.max(0, Math.ceil(groups[last].items.length/AC_PAGE_SIZE) - 1), groups, globalPage: cursor - 1, totalPages: _acTotalInnerPages()};
}

function _acGlobalPage(){
  const qz = APP.quiz; if(!qz) return 1;
  const groups = _acGetGroups(qz);
  const ti = APP._acTypeIdx || 0;
  const ip = APP._acInnerPage || 0;
  return groups.slice(0, ti).reduce((s,g)=>s+Math.max(1,Math.ceil(g.items.length/AC_PAGE_SIZE)), 0) + ip + 1;
}

/* 切换题型（type tab） */
function acGoType(typeIdx){
  if(typeof typeIdx !== 'number' || typeIdx < 0) return;
  const qz = APP.quiz; if(!qz) return;
  const groups = _acGetGroups(qz);
  if(typeIdx >= groups.length) return;
  if(APP._acTypeIdx === typeIdx) return;
  const oldGlobal = _acGlobalPage();
  APP._acTypeIdx = typeIdx;
  APP._acInnerPage = 0;
  _acFlipAnimate(_acGlobalPage(), oldGlobal);
  renderQuiz();
}

/* 跳转到全局页码（1-based） */
function acJumpToGlobalPage(page){
  const qz = APP.quiz; if(!qz) return;
  const total = _acTotalInnerPages();
  if(!total) return;
  page = Math.max(1, Math.min(total, page|0));
  const info = _acGetPageByGlobal(page);
  if(!info) return;
  const oldGlobal = _acGlobalPage();
  if(APP._acTypeIdx === info.typeIdx && APP._acInnerPage === info.innerPage) return;
  APP._acTypeIdx = info.typeIdx;
  APP._acInnerPage = info.innerPage;
  _acFlipAnimate(_acGlobalPage(), oldGlobal);
  renderQuiz();
}

/* 翻页动画（无渲染延迟） */
function _acFlipAnimate(newPage, oldPage){
  const track = document.getElementById('acPageTrack');
  if(!track) return;
  track.classList.remove('ac-flip-left', 'ac-flip-right');
  track.classList.add('ac-page-flipping');
  track.classList.add(newPage > oldPage ? 'ac-flip-left' : 'ac-flip-right');
  setTimeout(()=>{
    track.classList.remove('ac-page-flipping', 'ac-flip-left', 'ac-flip-right');
  }, 220);
}

function acPrevPage(){
  const cur = _acGlobalPage();
  if(cur > 1) acJumpToGlobalPage(cur - 1);
  else toast('已是第一页','info');
}
function acNextPage(){
  const cur = _acGlobalPage();
  const total = _acTotalInnerPages();
  if(cur < total) acJumpToGlobalPage(cur + 1);
  else toast('已是最后一页','info');
}

/* 翻页并跳转到目标题号（点击格子时自动切换到对应页） */
function acJumpAndFlip(targetI){
  const qz = APP.quiz;
  if(!qz) { jumpTo(targetI); return; }
  const groups = _acGetGroups(qz);
  for(let ti=0; ti<groups.length; ti++){
    const idx = groups[ti].items.findIndex(({i})=>i===targetI);
    if(idx >= 0){
      const targetPage = Math.floor(idx / AC_PAGE_SIZE);
      const oldGlobal = _acGlobalPage();
      const needRender = APP._acTypeIdx !== ti || APP._acInnerPage !== targetPage;
      if(needRender){
        APP._acTypeIdx = ti;
        APP._acInnerPage = targetPage;
        _acFlipAnimate(_acGlobalPage(), oldGlobal);
        setTimeout(()=>{ jumpTo(targetI); renderQuiz(); }, 60);
      } else {
        jumpTo(targetI);
        setTimeout(()=>{ renderQuiz(); }, 30);
      }
      return;
    }
  }
  jumpTo(targetI);
}

/* ===== 答题卡快速跳转辅助 ===== */
function _findNextUnanswered(fromCur){
  const qz = APP.quiz;
  if(!qz) return -1;
  const total = qz.indices.length;
  for(let i = (fromCur + 1) % total; i !== fromCur; i = (i + 1) % total){
    const idx = qz.indices[i];
    const q = APP.questions[idx];
    const a = qz.answers[idx];
    const answered = a !== undefined && (q.type === '多选' ? (Array.isArray(a) && a.length > 0) : a !== null);
    if(!answered) return i;
  }
  return -1;
}
function _findNextFlagged(fromCur){
  const qz = APP.quiz;
  if(!qz) return -1;
  const total = qz.indices.length;
  for(let i = (fromCur + 1) % total; i !== fromCur; i = (i + 1) % total){
    if(qz.flagged.has(qz.indices[i])) return i;
  }
  return -1;
}
function acJumpToUnanswered(){
  const qz = APP.quiz;
  if(!qz) return;
  const cur = qz.current || 0;
  const target = _findNextUnanswered(cur);
  if(target < 0){
    toast('🎉 恭喜！所有题目都已作答','success');
    return;
  }
  acJumpAndFlip(target);
  setTimeout(()=>toast(`已跳转到第 ${target+1} 题（未答）`,'info'), 80);
}
function acJumpToFlagged(){
  const qz = APP.quiz;
  if(!qz || !qz.flagged.size){
    toast('当前没有标记题目','info');
    return;
  }
  const cur = qz.current || 0;
  const target = _findNextFlagged(cur);
  if(target < 0){
    toast('已遍历所有标记题','info');
    return;
  }
  acJumpAndFlip(target);
  setTimeout(()=>toast(`已跳转到第 ${target+1} 题（标记）`,'info'), 80);
}
function acJumpToFirst(){
  const qz = APP.quiz;
  if(!qz) return;
  acJumpAndFlip(0);
  toast('已跳转到第 1 题','info');
}
function acJumpToLast(){

function go(page){
  // 清理定时器
  if(APP.timer){clearInterval(APP.timer);APP.timer=null;}
  if(APP.examTimer){clearInterval(APP.examTimer);APP.examTimer=null;}

  // 切换板块时如果当前有未提交的练习（非首页/设置/答题页），自动保存并切换
  if(page!=='quiz' && APP.quiz && !APP.quiz.submitted && APP.quiz.indices && APP.quiz.indices.length){
    // 计算已答题数（用于判断是否值得保存）
    const answeredNow = APP.quiz.indices.filter(idx=>{
      const a = APP.quiz.answers[idx];
      return a!==undefined && (Array.isArray(a)?a.length>0:a!==null);
    }).length;
    if(answeredNow > 0){
      // 静默保存进度并切换
      const ok = _autoSaveQuizProgress();
      if(ok){
        APP.quiz = null;
        APP._acTypeIdx = 0;
        APP._acInnerPage = 0;
        APP._switchPromptShown = false;
        toast(`💾 已自动保存 ${answeredNow} 题进度，可从首页"继续训练"恢复`, 'success', 2500);
      }
    } else {
      // 0 已答：直接清空，不保存
      APP.quiz = null;
      APP._acTypeIdx = 0;
      APP._acInnerPage = 0;
    }
  }
  APP._switchPromptShown = false;

  APP.currentPage = page;
  renderNav();
  updateBreadcrumb(page);
  const m = document.getElementById('mainContent');
  // 显示skeleton加载
  m.innerHTML = '<div class="skeleton" style="height:200px;margin-bottom:16px;"></div><div class="skeleton" style="height:100px;margin-bottom:16px;"></div><div class="skeleton" style="height:150px;"></div>';
  // 短暂延迟后渲染实际内容
  setTimeout(()=>{
    const renderers = {home:renderHome,bank:renderBank,chapter:renderChapterPractice,quiz:renderQuiz,stats:renderStats,wrong:renderWrong,favorite:renderFavorite,history:renderHistory,achievement:renderAchievement,settings:renderSettings,mockExam:renderMockExam};
    if(renderers[page]) renderers[page]();
  },50);
  // close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  window.scrollTo(0,0);
}

/* 切换浏览器标签 / 最小化窗口时自动保存 */
let _lastVisibilitySave = 0;
let _visibilityToastShown = false;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && APP.quiz && !APP.quiz.submitted && APP.quiz.indices && APP.quiz.indices.length){
    // 节流：避免频繁保存
    const now = Date.now();
    if(now - _lastVisibilitySave < 1500) return;
    _lastVisibilitySave = now;
    try {
      APP.savedQuiz = JSON.parse(JSON.stringify(APP.quiz));
      APP.savedQuiz.savedAt = new Date().toISOString();
      sessionStorage.setItem('spring_active_quiz', JSON.stringify(APP.savedQuiz));
      STORAGE.save();
    } catch(err){}
  } else if(!document.hidden && _visibilityToastShown){
    // 切回前台时给个提示
    _visibilityToastShown = false;
    if(APP.quiz && !APP.quiz.submitted && APP.quiz.indices && APP.quiz.indices.length){
      toast('💾 训练进度已自动保存（可从首页继续）','success');
    }
  }
});

/* ===== 切换板块时的训练处置 =====
   答题中点击板块切换：go() 函数会自动保存进度并切换，无需在此处弹窗
   此处仅保留逻辑占位（防止旧代码引用 _showSwitchQuizPrompt 报错）
*/
function _showSwitchQuizPrompt(targetPage){
  // 新逻辑：go() 函数已处理自动保存，此函数仅做兼容保留
  if(!APP.quiz || APP.quiz.submitted) return false;
  if(!APP.quiz.indices || !APP.quiz.indices.length) return false;
  if(APP._navSwitchPromptShown) return true;
  APP._navSwitchPromptShown = true;
  setTimeout(()=>{ APP._navSwitchPromptShown = false; }, 300);
  if(targetPage && targetPage !== 'quiz'){
    go(targetPage);
  }
  return true;
}

/* 恢复保存的训练 */
function resumeSavedQuiz(){
  if(!APP.savedQuiz || !APP.savedQuiz.indices || !APP.savedQuiz.indices.length){
    // 尝试从 sessionStorage 恢复
    try {
      const raw = sessionStorage.getItem('spring_active_quiz');
      if(raw) {
        APP.savedQuiz = JSON.parse(raw);
      }
    } catch(e){}
  }
  if(!APP.savedQuiz || !APP.savedQuiz.indices || !APP.savedQuiz.indices.length){
    toast('没有可恢复的训练','info');
    return;
  }
  // 校验题目索引有效性
  const validIdxs = APP.savedQuiz.indices.filter(i => APP.questions[i]);
  if(!validIdxs.length){
    toast('保存的训练题目已失效','warning');
    APP.savedQuiz = null;
    return;
  }
  APP.savedQuiz.indices = validIdxs;
  // 恢复 flagged（Set 需要重新构造）
  if(!Array.isArray(APP.savedQuiz.flagged)) APP.savedQuiz.flagged = [];
  APP.quiz = APP.savedQuiz;
  APP.quiz.flagged = new Set(APP.savedQuiz.flagged);
  APP.savedQuiz = null;
  APP._switchPromptShown = false;
  try { sessionStorage.removeItem('spring_active_quiz'); } catch(e){}
  toast('✈️ 已恢复训练进度','success');
  go('quiz');
}

/* 放弃保存的训练 */
function discardSavedQuiz(){
  APP.savedQuiz = null;
  try { sessionStorage.removeItem('spring_active_quiz'); } catch(e){}
  STORAGE.save();
  renderHome();
}

/* ===== 答案分隔符解析（兼容|和逗号） ===== */
function splitAnswer(ansStr){
  if(!ansStr) return [];
  // 优先用|分割，若无|则用逗号兼容旧数据
  if(ansStr.includes('|')){
    return ansStr.split('|').map(s=>s.trim()).filter(Boolean);
  }
  return ansStr.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
}

/* ===== CSV 解析（纯JS，无外部依赖） ===== */
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  function splitCSVLine(line){
    const result = []; let current = ''; let inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){inQuotes=!inQuotes;}
      else if((ch===','||ch==='\t')&&!inQuotes){result.push(current.trim());current='';}
      else{current+=ch;}
    }
    result.push(current.trim());
    return result;
  }
  const rows = lines.map(l=>splitCSVLine(l));
  return parseExcel(rows);
}

/* ===== CBT 题库格式解析（识别《客舱乘务员CBT题库》特殊排版） =====
   该格式特征:
   - 章节标题: 【第X章 章名】（共XX题）
   - 小节标题: ▎ X.X 章名（XX题）
   - 每道题目: 序号. 【原题号】[题型] + 题干 + 选项 + 答案 + 解析
   - 版本: v2024.06.07-cbt-fix-2
*/
function parseCBTFormat(paragraphs){
  // paragraphs: 段落纯文本数组（已trim）
  const result = [];
  let currentChapter = '未分类';
  let currentSection = '其他';

  // 正则: 章节标题  "【第X章 xxx】（共XX题）"
  const chapRe = /^【第[一二三四五六七八九十]+章\s*[^】]+】(?:（共\d+题）)?/;
  // 小节标题  "▎ X.X xxx（XX题）"
  const secRe = /^▎\s*(\d+\.\d+)\s+[^（(]+(?:（\d+题）)?/;
  // 题目头  "数字. 【原题号】[题型]"
  const qHeadRe = /^(\d+)\.\s*【([^】]+)】\[([^\]]+)\]/;
  // 题型标准化
  const typeMap = {'单选':'单选','单选题':'单选','新增-单选':'单选','新增-单选题':'单选',
                   '多选':'多选','多选题':'多选','新增-多选':'多选','新增-多选题':'多选',
                   '判断':'判断','判断题':'判断','新增-判断':'判断','新增-判断题':'判断',
                   '简答':'简答','新增-简答':'简答'};
  // 段落清理：去除零宽字符、html标签
  const clean = s => (s||'').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/<[^>]+>/g,'').trim();

  let i = 0;
  let invalidCount = 0;
  while(i < paragraphs.length){
    let text = clean(paragraphs[i]);
    if(!text){i++;continue;}

    // 章节标题
    if(chapRe.test(text)){
      const m = text.match(/^【第[一二三四五六七八九十]+章\s*([^】]+)】/);
      if(m) currentChapter = m[1].trim();
      currentSection = '其他';
      i++;
      continue;
    }
    // 小节标题
    if(secRe.test(text)){
      const m = text.match(/^▎\s*(\d+\.\d+)\s+([^（(]+?)(?:（|$)/);
      if(m) currentSection = m[2].trim();
      i++;
      continue;
    }
    // 题目头
    if(qHeadRe.test(text)){
      const m = text.match(qHeadRe);
      const origNum = m[2].trim();
      const qtype = typeMap[m[3].trim()] || m[3].trim();
      i++;
      // 收集题干
      let stem = '';
      while(i < paragraphs.length){
        const t = clean(paragraphs[i]);
        if(!t){i++;continue;}
        if(/^题干[：:]/.test(t)){
          stem = t.replace(/^题干[：:]\s*/, '').trim();
          i++;
          break;
        }
        // 兼容无"题干："前缀
        if(/^[A-D][.、]/.test(t) || /^答案[：:]/.test(t) || qHeadRe.test(t) || chapRe.test(t) || secRe.test(t)){
          break;
        }
        stem = t;
        i++;
        break;
      }
      // 收集选项
      const opts = [];
      while(i < paragraphs.length){
        const t = clean(paragraphs[i]);
        if(!t){i++;continue;}
        const optMatch = t.match(/^([A-H])[.、]\s*(.+)$/);
        if(optMatch){
          opts.push({key:optMatch[1], val:optMatch[2].trim()});
          i++;
          continue;
        }
        break;
      }
      // 收集答案
      let ans = '';
      while(i < paragraphs.length){
        const t = clean(paragraphs[i]);
        if(!t){i++;continue;}
        if(/^答案[：:]/.test(t)){
          ans = t.replace(/^答案[：:]\s*/, '').trim();
          i++;
          break;
        }
        break;
      }
      // 收集解析
      let explain = '';
      while(i < paragraphs.length){
        const t = clean(paragraphs[i]);
        if(!t){i++;continue;}
        if(/^解析[：:]/.test(t)){
          explain = t.replace(/^解析[：:]\s*/, '').trim();
          i++;
          break;
        }
        break;
      }
      // 验证: 至少要有题干和答案
      if(stem && ans){
        // 难度推断
        let diff = '中';
        if(qtype === '判断'){
          diff = '易';
        } else if(qtype === '多选'){
          diff = '难';
        } else {
          if(stem.length < 40) diff = '易';
          else if(stem.length > 100) diff = '难';
          else diff = '中';
        }
        result.push({
          q: stem,
          type: qtype,
          opts: opts.map(o=>`${o.key}. ${o.val}`),
          ans: ans,
          chapter: currentChapter,
          section: currentSection,
          diff: diff,
          explain: explain,
          origNum: origNum,
        });
        continue;
      }
      invalidCount++;
      i++;
      continue;
    }
    i++;
  }
  if(invalidCount>0) console.warn(`[parseCBTFormat] 跳过 ${invalidCount} 个不完整题目`);
  return result;
}

/* ===== EXCEL PARSE ===== */
function parseExcel(rows){
  if(!rows||!rows.length) return [];
  const header = rows[0];
  const qIdx = header.findIndex(h=>/题|question/i.test(h));
  const typeIdx = header.findIndex(h=>/类型|type/i.test(h));
  const optsIdx = header.findIndex(h=>/选项|option/i.test(h));
  const ansIdx = header.findIndex(h=>/答案|answer/i.test(h));
  const chapIdx = header.findIndex(h=>/章节|chapter/i.test(h));
  const diffIdx = header.findIndex(h=>/难度|diff/i.test(h));
  const explainIdx = header.findIndex(h=>/解析|解释|explain/i.test(h));
  const result = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r||!r[qIdx]) continue;
    let opts = [];
    if(optsIdx>=0 && r[optsIdx]){
      if(typeof r[optsIdx]==='string' && r[optsIdx].includes(',')){
        opts = r[optsIdx].split(/[,，]/).map(s=>s.trim()).filter(Boolean);
      } else {
        for(let j=optsIdx;j<r.length&&opts.length<6;j++){
          if(r[j] && String(r[j]).trim()) opts.push(String(r[j]).trim());
        }
      }
    } else {
      for(let j=0;j<header.length;j++){
        if(/^[A-Da-d]$/.test(String(header[j]).trim()) && r[j]){
          opts.push(String(r[j]).trim());
        }
      }
    }
    if(!opts.length) opts = ['正确','错误'];
    // 答案列：检测是否包含|，优先用|分割，否则用逗号
    let ansText = ansIdx>=0 ? String(r[ansIdx]||'').trim() : '';
    // 将逗号分隔的答案转为|分隔存储
    if(ansText && !ansText.includes('|') && ansText.match(/[,，]/)){
      ansText = ansText.split(/[,，]/).map(s=>s.trim()).filter(Boolean).join('|');
    }
    // 难度
    let diff = diffIdx>=0 ? String(r[diffIdx]||'中').trim() : '中';
    if(!['易','中','难'].includes(diff)) diff = '中';
    result.push({
      q: String(r[qIdx]||'').trim(),
      type: typeIdx>=0 ? String(r[typeIdx]||'单选').trim() : '单选',
      opts,
      ans: ansText,
      chapter: chapIdx>=0 ? String(r[chapIdx]||'未分类').trim() : '未分类',
      diff: diff,
      explain: explainIdx>=0 ? String(r[explainIdx]||'').trim() : '',
    });
  }
  return result;
}

/* ===== DOCX 解析（纯 JS，无外部依赖）=====
   DOCX 是 ZIP 格式，包含 word/document.xml 等文件
   1) 解析 ZIP 找到 word/document.xml
   2) 用 DOMParser 解析 XML
   3) 提取 <w:p> 段落 / <w:tbl> 表格 文本
=========================================== */
function parseZip(arrayBuffer){
  // 简化 ZIP 解析：仅支持 STORED(0) + DEFLATE(8)，足够解析 .docx
  const data = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  const files = {};

  // 1. 找 End of Central Directory Record（签名 0x06054b50 = 117853销量）
  let eocdOffset = -1;
  for(let i = data.length - 22; i >= Math.max(0, data.length - 65557); i--){
    if(view.getUint32(i, true) === 0x06054b50){
      eocdOffset = i;
      break;
    }
  }
  if(eocdOffset < 0) throw new Error('ZIP 格式错误：未找到 End of Central Directory');

  // 2. 解析 EOCD
  const totalEntries = view.getUint16(eocdOffset + 10, true);
  const cdOffset = view.getUint32(eocdOffset + 16, true);

  // 3. 遍历 Central Directory 找到每个文件
  let offset = cdOffset;
  for(let i = 0; i < totalEntries; i++){
    if(view.getUint32(offset, true) !== 0x02014b50) break;
    const method = view.getUint16(offset + 10, true);
    const compSize = view.getUint32(offset + 20, true);
    const uncompSize = view.getUint32(offset + 24, true);
    const fnameLen = view.getUint16(offset + 28, true);
    const extraLen = view.getUint16(offset + 30, true);
    const commentLen = view.getUint16(offset + 32, true);
    const localHeaderOffset = view.getUint32(offset + 42, true);
    const fname = new TextDecoder().decode(data.slice(offset + 46, offset + 46 + fnameLen));
    // 读取 Local File Header 找到实际数据
    const lh = localHeaderOffset;
    if(view.getUint32(lh, true) !== 0x04034b50) { offset += 46 + fnameLen + extraLen + commentLen; continue; }
    const lhFnameLen = view.getUint16(lh + 26, true);
    const lhExtraLen = view.getUint16(lh + 28, true);
    const dataStart = lh + 30 + lhFnameLen + lhExtraLen;
    const fileData = data.slice(dataStart, dataStart + compSize);

    if(method === 0){
      // STORED：未压缩
      files[fname] = fileData;
    } else if(method === 8){
      // DEFLATE：用 DecompressionStream API（现代浏览器/Node 18+）
      try{
        // 同步解压不可用，使用异步转同步的方式
        // 由于本函数是同步的，这里采用一个轻量级方案：
        // 调用方应改用 parseDOCXAsync
        files[fname] = fileData; // 占位，下面用异步解压
      }catch(e){
        files[fname] = fileData;
      }
    }
    offset += 46 + fnameLen + extraLen + commentLen;
  }
  return files;
}

// 异步解压 DEFLATE 数据
async function inflateRaw(compressedData){
  // 使用浏览器原生 DecompressionStream
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('当前浏览器不支持 DEFLATE 解压，请使用 Chrome/Edge/Firefox 最新版');
  }
  const blob = new Blob([compressedData]);
  const stream = blob.stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const buffer = await new Response(stream).arrayBuffer();
  return new Uint8Array(buffer);
}

// 异步解析 DOCX
async function parseDOCXAsync(arrayBuffer){
  const data = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  const files = {};

  // 1. 找 EOCD
  let eocdOffset = -1;
  for(let i = data.length - 22; i >= Math.max(0, data.length - 65557); i--){
    if(view.getUint32(i, true) === 0x06054b50){
      eocdOffset = i;
      break;
    }
  }
  if(eocdOffset < 0) throw new Error('DOCX 格式错误：未找到 ZIP 结束标记');

  // 2. 解析 EOCD
  const totalEntries = view.getUint16(eocdOffset + 10, true);
  const cdOffset = view.getUint32(eocdOffset + 16, true);

  // 3. 遍历 Central Directory
  let offset = cdOffset;
  for(let i = 0; i < totalEntries; i++){
    if(view.getUint32(offset, true) !== 0x02014b50) break;
    const method = view.getUint16(offset + 10, true);
    const compSize = view.getUint32(offset + 20, true);
    const fnameLen = view.getUint16(offset + 28, true);
    const extraLen = view.getUint16(offset + 30, true);
    const commentLen = view.getUint16(offset + 32, true);
    const localHeaderOffset = view.getUint32(offset + 42, true);
    const fname = new TextDecoder().decode(data.slice(offset + 46, offset + 46 + fnameLen));

    const lh = localHeaderOffset;
    if(view.getUint32(lh, true) !== 0x04034b50){ offset += 46 + fnameLen + extraLen + commentLen; continue; }
    const lhFnameLen = view.getUint16(lh + 26, true);
    const lhExtraLen = view.getUint16(lh + 28, true);
    const dataStart = lh + 30 + lhFnameLen + lhExtraLen;
    const fileData = data.slice(dataStart, dataStart + compSize);

    if(method === 0){
      files[fname] = fileData;
    } else if(method === 8){
      // 异步解压
      files[fname] = await inflateRaw(fileData);
    }
    offset += 46 + fnameLen + extraLen + commentLen;
  }

  // 4. 提取 word/document.xml
  const docXml = files['word/document.xml'];
  if(!docXml) throw new Error('DOCX 中未找到 document.xml');

  // 5. 解析 XML
  const xmlText = new TextDecoder('utf-8').decode(docXml);
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
  if(xmlDoc.getElementsByTagName('parsererror').length){
    throw new Error('XML 解析失败');
  }

  // 6. 提取文本：表格行优先（题库通常用表格），其次段落
  const rows = [];
  // 处理表格（每行作为一条记录）
  const tables = xmlDoc.getElementsByTagName('w:tbl');
  if(tables.length){
    for(const tbl of tables){
      const trs = tbl.getElementsByTagName('w:tr');
      for(const tr of trs){
        const cells = tr.getElementsByTagName('w:tc');
        const row = [];
        for(const tc of cells){
          // 单元格内所有段落文本拼接
          const paras = tc.getElementsByTagName('w:p');
          let cellText = '';
          for(const p of paras){
            const texts = p.getElementsByTagName('w:t');
            for(const t of texts){
              cellText += t.textContent;
            }
            cellText += '\n';
          }
          row.push(cellText.trim());
        }
        if(row.some(c=>c)) rows.push(row);
      }
    }
    return parseExcel(rows);
  } else {
    // 无表格：按段落提取，先检测是否为 CBT 题库格式
    const paragraphs = [];
    const paras = xmlDoc.getElementsByTagName('w:p');
    for(const p of paras){
      const texts = p.getElementsByTagName('w:t');
      let line = '';
      for(const t of texts){
        line += t.textContent;
      }
      const trimmed = line.trim();
      if(trimmed) paragraphs.push(trimmed);
    }
    console.log(`[parseDOCXAsync] 提取段落: ${paragraphs.length} 个`);

    // 检测是否为 CBT 格式（多重判定）
    const chapCount = paragraphs.filter(p=>/【第[一二三四五六七八九十]+章/.test(p)).length;
    const qheadCount = paragraphs.filter(p=>/^\d+\.\s*【[^】]+】\[[^\]]+\]/.test(p)).length;
    const stemCount = paragraphs.filter(p=>/^题干[：:]/.test(p)).length;
    const ansCount = paragraphs.filter(p=>/^答案[：:]/.test(p)).length;
    console.log(`[parseDOCXAsync] CBT检测: 章节=${chapCount}, 题头=${qheadCount}, 题干=${stemCount}, 答案=${ansCount}`);

    // 判定条件: 至少3个题头 或 (1个章节+3个题干+3个答案)
    const isCBT = qheadCount >= 3 || (chapCount >= 1 && stemCount >= 3 && ansCount >= 3);
    if(isCBT){
      console.log('[parseDOCXAsync] 识别为 CBT 格式，使用 parseCBTFormat');
      return parseCBTFormat(paragraphs);
    }
    // 否则回退到逐行解析（每行当作题目）
    console.warn('[parseDOCXAsync] 未识别为 CBT 格式，使用逐行解析');
    for(const line of paragraphs){
      rows.push([line]);
    }
    return parseExcel(rows);
  }
}

/* ===== 文件上传处理（支持CSV/XLSX/DOCX + 拖拽） ===== */
// 统一处理入口：input change 与 drag-drop 共用
function processFile(file){
  if(!file) return;
  const ext = (file.name.split('.').pop()||'').toLowerCase();

  if(ext==='csv'){
    // CSV：纯JS解析，无外部依赖
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const text = ev.target.result;
        const parsed = parseCSV(text);
        if(parsed.length){
          APP.questions = parsed;
          APP.wrong = [];
          APP.favorites = [];
          STORAGE.save();
          toast(`成功导入 ${parsed.length} 道题目！`,'success');
          go('home');
        } else {
          toast('未识别到有效题目，请检查格式','danger');
        }
      }catch(err){
        toast('CSV解析失败：'+err.message,'danger');
      }
    };
    reader.readAsText(file);
  } else if(ext==='xlsx'||ext==='xls'){
    // XLSX：需要SheetJS库
    if(typeof XLSX==='undefined'){
      toast('离线模式下仅支持CSV/DOCX格式，请上传.csv或.docx文件','danger');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data,{type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws,{header:1});
        const parsed = parseExcel(rows);
        if(parsed.length){
          APP.questions = parsed;
          APP.wrong = [];
          APP.favorites = [];
          STORAGE.save();
          toast(`成功导入 ${parsed.length} 道题目！`,'success');
          go('home');
        } else {
          toast('未识别到有效题目，请检查格式','danger');
        }
      }catch(err){
        toast('文件解析失败：'+err.message,'danger');
      }
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='docx'){
    // DOCX：原生 ZIP + XML 解析，离线可用
    const reader = new FileReader();
    reader.onload = async function(ev){
      try{
        toast('正在解析 Word 文档...','info',2000);
        const parsed = await parseDOCXAsync(ev.target.result);
        if(parsed.length){
          // 异常保护: 如果题目数明显超过合理范围(>5000)，警告用户
          if(parsed.length > 5000){
            console.error(`[导入] 解析得到 ${parsed.length} 道题，可能识别错误！`);
            toast(`⚠️ 解析得到 ${parsed.length} 道题，超过合理范围，请检查文件格式或刷新浏览器（Ctrl+F5）`,'danger',5000);
            return;
          }
          APP.questions = parsed;
          APP.wrong = [];
          APP.favorites = [];
          APP._selected = new Set();
          STORAGE.save();
          // 统计章节和难度
          const chapSet = new Set(parsed.map(q=>q.chapter).filter(c=>c && c!=='未分类'));
          const diffSet = new Set(parsed.map(q=>q.diff));
          toast(`成功导入 ${parsed.length} 道题目 · ${chapSet.size} 个章节 · 难度: ${[...diffSet].join('/')}`,'success',3000);
          go('home');
        } else {
          toast('未识别到有效题目，请检查 Word 文档格式','danger');
        }
      }catch(err){
        toast('Word 解析失败：'+err.message,'danger');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('不支持的文件格式，请上传 .csv / .xlsx / .docx 文件','danger');
  }
}

/* ===== 拖拽上传 ===== */
function setupDragDrop(){
  const zone = document.getElementById('uploadZone');
  if(!zone) return;
  // 防止整页默认拖拽行为（避免浏览器直接打开文件）
  ['dragenter','dragover','dragleave','drop'].forEach(evt=>{
    zone.addEventListener(evt, e=>{ e.preventDefault(); e.stopPropagation(); });
  });
  // 视觉反馈
  zone.addEventListener('dragenter', ()=>zone.classList.add('dragging'));
  zone.addEventListener('dragover',  ()=>zone.classList.add('dragging'));
  zone.addEventListener('dragleave', e=>{
    // 只有真正离开 zone（不是进入子元素）才取消高亮
    if(e.target===zone || !zone.contains(e.relatedTarget)) zone.classList.remove('dragging');
  });
  zone.addEventListener('drop', e=>{
    zone.classList.remove('dragging');
    const dt = e.dataTransfer;
    if(!dt || !dt.files || !dt.files.length){
      toast('未检测到文件','warning');
      return;
    }
    // 取第一个文件
    processFile(dt.files[0]);
  });
}
// 首次进入页面时绑定一次（renderHome 每次都会重写 #uploadZone）
document.addEventListener('DOMContentLoaded', setupDragDrop);
// 路由切换时（如返回首页）重新绑定
const _origGo = window.go;
window.go = function(page){
  _origGo(page);
  // 50ms 与 renderHome 的 setTimeout 对齐
  setTimeout(setupDragDrop, 60);
};

/* ===== CANVAS CHARTS ===== */
function drawBarChart(canvasId, labels, values, colors){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  const pad = {top:20,right:20,bottom:40,left:50};
  const cw = w-pad.left-pad.right, ch = h-pad.top-pad.bottom;
  const maxVal = Math.max(...values,1);
  const barW = Math.min(40, cw/labels.length*0.6);
  const gap = cw/labels.length;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--fog').trim()||'#E5EDE9';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = pad.top + ch*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim()||'#B5C2BC';
    ctx.font = '11px sans-serif';ctx.textAlign='right';
    ctx.fillText(Math.round(maxVal*i/4),pad.left-8,y+4);
  }
  labels.forEach((lbl,i)=>{
    const x = pad.left + gap*i + (gap-barW)/2;
    const bh = (values[i]/maxVal)*ch;
    const y = pad.top+ch-bh;
    const grad = ctx.createLinearGradient(x,y,x,pad.top+ch);
    grad.addColorStop(0, colors[i%colors.length]);
    grad.addColorStop(1, colors[i%colors.length]+'66');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x,y,barW,bh,[4,4,0,0]);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#5A6F65';
    ctx.font = '11px sans-serif';ctx.textAlign='center';
    ctx.fillText(lbl, x+barW/2, h-pad.bottom+18);
  });
}

function drawLineChart(canvasId, labels, values, color){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  const pad = {top:20,right:20,bottom:40,left:50};
  const cw = w-pad.left-pad.right, ch = h-pad.top-pad.bottom;
  const maxVal = Math.max(...values,1);
  const minVal = Math.min(...values,0);
  const range = maxVal-minVal||1;
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--fog').trim()||'#E5EDE9';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = pad.top + ch*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim()||'#B5C2BC';
    ctx.font = '11px sans-serif';ctx.textAlign='right';
    ctx.fillText(Math.round(minVal+range*i/4),pad.left-8,y+4);
  }
  if(values.length<2) return;
  const gap = cw/(values.length-1);
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  values.forEach((v,i)=>{
    const x = pad.left + gap*i;
    const y = pad.top + ch*(1-(v-minVal)/range);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  const lastX = pad.left + gap*(values.length-1);
  ctx.lineTo(lastX, pad.top+ch);
  ctx.lineTo(pad.left, pad.top+ch);
  ctx.closePath();
  ctx.fillStyle = color+'18';
  ctx.fill();
  values.forEach((v,i)=>{
    const x = pad.left + gap*i;
    const y = pad.top + ch*(1-(v-minVal)/range);
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=color;ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#5A6F65';
  ctx.font = '11px sans-serif';ctx.textAlign='center';
  labels.forEach((lbl,i)=>{
    const x = pad.left + gap*i;
    ctx.fillText(lbl, x, h-pad.bottom+18);
  });
}

/* ===== RENDER: BANK ===== */
function renderBank(){
  const chapters = getChapters();
  let filterChapter = APP._pendingChapter || '';
  APP._pendingChapter = null;
  let filterType = '';
  let filterDiff = '';
  let searchKey = '';

  function getFiltered(){
    return APP.questions.map((q,i)=>({...q,idx:i})).filter(q=>{
      if(filterChapter && q.chapter!==filterChapter) return false;
      if(filterType && q.type!==filterType) return false;
      if(filterDiff && q.diff!==filterDiff) return false;
      if(searchKey && !q.q.includes(searchKey)) return false;
      return true;
    });
  }

  function renderList(){
    const list = getFiltered();
    const container = document.getElementById('bankList');
    if(!container) return;
    if(!list.length){
      container.innerHTML = emptyState({
        icon: searchKey||filterChapter||filterType||filterDiff ? '🔍' : '📋',
        title: searchKey||filterChapter||filterType||filterDiff ? '暂无匹配题目' : '题库为空',
        lead: searchKey||filterChapter||filterType||filterDiff ? '当前筛选条件下没有找到题目' : '上传你的第一份题库，开启飞行训练',
        tip: searchKey||filterChapter||filterType||filterDiff ? '试试调整或清空筛选条件' : '支持 CSV / Excel 格式，文件即用无需联网',
        ctas: searchKey||filterChapter||filterType||filterDiff ? [
          {text:'清空筛选', icon:'🔄', outline:true, onclick:'document.getElementById("bankSearch").value="";document.getElementById("bankChapter").value="";document.getElementById("bankType").value="";document.getElementById("bankDiff").value="";bankFilter();'},
          {text:'上传题库', icon:'📂', onclick:'triggerUpload()'}
        ] : [
          {text:'立即上传', icon:'📂', onclick:'triggerUpload()'},
          {text:'前往答题', icon:'✈️', outline:true, onclick:'go("quiz")'}
        ],
        steps: searchKey||filterChapter||filterType||filterDiff ? [] : [
          '下载模板', '上传文件', '前往答题'
        ]
      });
      return;
    }
    container.innerHTML = list.map((q,i)=>{
      const fnum = `9C ${1000+q.idx}`;
      const selected = APP._selected && APP._selected.has(q.idx);
      return `<div class="flight-ticket" onclick="startQuiz([${q.idx}])">
        <div class="ft-left"></div>
        <div class="ft-body">
          <div class="ft-fnum">${fnum}</div>
          <div class="ft-q">${q.q}</div>
          <div class="ft-tags">
            <span class="tag tag-type">${q.type}</span>
            <span class="tag tag-chapter">${q.chapter||'未分类'}</span>
            <span class="tag tag-diff-${diffClass(q.diff)}">${q.diff||'中'}</span>
          </div>
          <div class="ft-actions">
            <button onclick="event.stopPropagation();toggleSelect(${q.idx}, this)" class="${selected?'select-active':''}" title="${selected?'取消选择':'选择（用于批量删除）'}">${selected?'☑':'⬜'}</button>
            <button onclick="event.stopPropagation();editQuestion(${q.idx})" title="编辑题目">✏️</button>
            <button onclick="event.stopPropagation();deleteQuestion(${q.idx})" title="删除题目" style="color:var(--danger);">🗑</button>
            <button onclick="event.stopPropagation();toggleFav(${q.idx})" class="${isFav(q.idx)?'fav-active':''}" title="收藏">⭐</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hero">
      <h1>📋 题库 · 航班清单</h1>
      <p>共 ${APP.questions.length} 道题目，${chapters.length} 个章节</p>
      <div class="plane-anim">🛫</div>
    </div>
    <div class="search-bar">
      <input type="text" id="bankSearch" placeholder="搜索题目关键词…" oninput="bankFilter()">
      <select id="bankChapter" onchange="bankFilter()">
        <option value="">全部章节</option>
        ${chapters.map(c=>`<option value="${c}" ${filterChapter===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select id="bankType" onchange="bankFilter()">
        <option value="">全部类型</option>
        <option value="单选">单选</option>
        <option value="多选">多选</option>
        <option value="判断">判断</option>
      </select>
      <select id="bankDiff" onchange="bankFilter()">
        <option value="">全部难度</option>
        <option value="易">易</option>
        <option value="中">中</option>
        <option value="难">难</option>
      </select>
    </div>
    <div class="bk-toolbar">
      <button class="bk-tool-btn" onclick="go('quiz')" title="前往答题板块选择训练模式">✈️ 前往答题</button>
      <button class="bk-tool-btn" onclick="addNewQuestion()" title="新增题目">➕ 新增题目</button>
      <button id="batchDelBtn" onclick="batchDeleteQuestions()" class="bk-tool-btn bk-tool-danger" style="display:none;">🗑 批量删除 (<span id="selCount">0</span>)</button>

      </div>
    </div>
    <div class="ticket-list" id="bankList"></div>
  `;
  renderList();

  // 初始化选择集合
  if(!APP._selected) APP._selected = new Set();
  updateBatchBtn();

  window.toggleSelect = function(idx, btn){
    if(!APP._selected) APP._selected = new Set();
    if(APP._selected.has(idx)){
      APP._selected.delete(idx);
      btn.classList.remove('select-active');
      btn.textContent = '⬜';
    } else {
      APP._selected.add(idx);
      btn.classList.add('select-active');
      btn.textContent = '☑';
    }
    updateBatchBtn();
  };

  function updateBatchBtn(){
    const btn = document.getElementById('batchDelBtn');
    if(!btn) return;
    const cnt = APP._selected ? APP._selected.size : 0;
    document.getElementById('selCount').textContent = cnt;
    btn.style.display = cnt > 0 ? 'inline-flex' : 'none';
  }

  window.bankFilter = function(){
    searchKey = document.getElementById('bankSearch').value.trim();
    filterChapter = document.getElementById('bankChapter').value;
    filterType = document.getElementById('bankType').value;
    filterDiff = document.getElementById('bankDiff').value;
    renderList();
  };
}

/* ===== RENDER: CHAPTER PRACTICE 章节专项练习 ===== */
function renderChapterPractice(){
  // 题库为空时显示空状态
  if(!APP.questions.length){
    document.getElementById('mainContent').innerHTML = emptyState({
      icon:'📋', title:'题库为空', lead:'请先上传题库，再开启章节专项练习',
      tip:'支持 CSV / Excel / DOCX 格式，文件即用无需联网',
      ctas:[
        {text:'上传题库', icon:'📂', onclick:'triggerUpload()'},
        {text:'前往题库', icon:'📋', outline:true, onclick:'go("bank")'}
      ],
      steps:['下载模板', '上传文件', '章节训练']
    });
    return;
  }

  // 按章节分组统计
  const chapterData = {};
  APP.questions.forEach((q,idx)=>{
    const c = q.chapter || '未分类';
    if(!chapterData[c]) chapterData[c] = {total:0, easy:0, mid:0, hard:0, single:0, multi:0, judge:0, idxs:[]};
    chapterData[c].total++;
    chapterData[c].idxs.push(idx);
    if(q.diff==='易') chapterData[c].easy++;
    else if(q.diff==='中') chapterData[c].mid++;
    else if(q.diff==='难') chapterData[c].hard++;
    if(q.type==='单选') chapterData[c].single++;
    else if(q.type==='多选') chapterData[c].multi++;
    else if(q.type==='判断') chapterData[c].judge++;
  });

  // 顺序: 优先"第X章"格式，再按章节名排序
  const chapterOrder = Object.keys(chapterData).sort((a,b)=>{
    const order = ['一','二','三','四','五','六','七','八','九','十'];
    const ai = order.findIndex(c=>a.startsWith(c+'章') || a.startsWith('第'+c));
    const bi = order.findIndex(c=>b.startsWith(c+'章') || b.startsWith('第'+c));
    if(ai>=0 && bi>=0) return ai-bi;
    if(ai>=0) return -1;
    if(bi>=0) return 1;
    return a.localeCompare(b,'zh-CN');
  });

  const totalQ = APP.questions.length;
  const totalChap = chapterOrder.length;

  // 总体进度: 计算已答题数中按章节练习的进度
  const chapterProgress = APP.chapterProgress || {};
  const progressKeys = Object.keys(chapterProgress);
  const startedChapters = progressKeys.filter(k=>chapterProgress[k] && chapterProgress[k].total>0).length;

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hero">
      <h1>🗂 章节专项 · 航线专训</h1>
      <p>共 ${totalChap} 个章节 · ${totalQ} 道题目 · ${startedChapters} 个章节已开始</p>
      <div class="plane-anim">🛫</div>
    </div>

    <div class="metrics" style="margin-bottom:20px;">
      <div class="metric-card">
        <div class="mc-icon">🗂</div>
        <div class="mc-val">${totalChap}</div>
        <div class="mc-label">章节总数</div>
      </div>
      <div class="metric-card">
        <div class="mc-icon">📚</div>
        <div class="mc-val">${totalQ}</div>
        <div class="mc-label">题库总量</div>
      </div>
      <div class="metric-card">
        <div class="mc-icon">✈️</div>
        <div class="mc-val">${startedChapters}</div>
        <div class="mc-label">已练习章节</div>
      </div>
      <div class="metric-card">
        <div class="mc-icon">🎯</div>
        <div class="mc-val">${progressKeys.length ? Math.round(progressKeys.reduce((s,k)=>s+(chapterProgress[k]&&chapterProgress[k].pct||0),0)/progressKeys.length) : 0}%</div>
        <div class="mc-label">总体完成度</div>
      </div>
    </div>

    <div class="chapter-list" id="chapterList">
      ${chapterOrder.map((c,idx)=>{
        const d = chapterData[c];
        const prog = chapterProgress[c] || {total:0,pct:0};
        const progPct = d.total ? Math.round(prog.total/d.total*100) : 0;
        const isStarted = prog.total > 0;
        // 难度分布条
        const easyPct = d.total ? Math.round(d.easy/d.total*100) : 0;
        const midPct = d.total ? Math.round(d.mid/d.total*100) : 0;
        const hardPct = d.total ? Math.round(d.hard/d.total*100) : 0;
        return `<div class="chapter-card" data-chap="${escapeHtml(c)}" onclick="openChapter('${escapeHtml(c).replace(/'/g,"\\'")}')">
          <div class="chc-index">${idx+1}</div>
          <div class="chc-body">
            <div class="chc-title">${escapeHtml(c)}</div>
            <div class="chc-meta">
              <span class="chc-tag">📚 ${d.total}题</span>
              <span class="chc-tag" style="color:var(--success)">单选 ${d.single}</span>
              <span class="chc-tag" style="color:var(--warning)">多选 ${d.multi}</span>
              <span class="chc-tag" style="color:var(--info)">判断 ${d.judge}</span>
            </div>
            <div class="chc-progress-bar">
              <div class="chc-progress-fill" style="width:${progPct}%;background:${progPct>=100?'var(--success)':progPct>0?'var(--primary)':'var(--fog)'}"></div>
              <span class="chc-progress-text">${progPct}% · ${prog.total}/${d.total}</span>
            </div>
            <div class="chc-diff-bar">
              <div class="chc-diff-seg" style="width:${easyPct}%;background:var(--success)" title="易 ${d.easy}题"></div>
              <div class="chc-diff-seg" style="width:${midPct}%;background:var(--warning)" title="中 ${d.mid}题"></div>
              <div class="chc-diff-seg" style="width:${hardPct}%;background:var(--danger)" title="难 ${d.hard}题"></div>
            </div>
            <div class="chc-actions">
              <button class="chc-btn chc-btn-primary" onclick="event.stopPropagation();startChapterPractice('${escapeHtml(c).replace(/'/g,"\\'")}','all')">✈️ 全部练习</button>
              <button class="chc-btn" onclick="event.stopPropagation();startChapterPractice('${escapeHtml(c).replace(/'/g,"\\'")}','easy')" ${d.easy===0?'disabled':''}>易 ${d.easy}</button>
              <button class="chc-btn" onclick="event.stopPropagation();startChapterPractice('${escapeHtml(c).replace(/'/g,"\\'")}','mid')" ${d.mid===0?'disabled':''}>中 ${d.mid}</button>
              <button class="chc-btn" onclick="event.stopPropagation();startChapterPractice('${escapeHtml(c).replace(/'/g,"\\'")}','hard')" ${d.hard===0?'disabled':''}>难 ${d.hard}</button>
              <button class="chc-btn" onclick="event.stopPropagation();startChapterExam('${escapeHtml(c).replace(/'/g,"\\'")}')" ${d.total<5?'disabled':''}>📝 模拟考</button>
            </div>
          </div>
          <div class="chc-arrow">→</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// 章节练习启动
window.startChapterPractice = function(chapter, diffLevel){
  const idxs = [];
  APP.questions.forEach((q,i)=>{
    if(q.chapter !== chapter) return;
    if(diffLevel==='all'){ idxs.push(i); return; }
    if(diffLevel==='easy' && q.diff==='易') idxs.push(i);
    else if(diffLevel==='mid' && q.diff==='中') idxs.push(i);
    else if(diffLevel==='hard' && q.diff==='难') idxs.push(i);
  });
  if(!idxs.length){toast('该难度下没有题目','warning');return;}
  // 记录章节进度
  if(!APP.chapterProgress) APP.chapterProgress = {};
  if(!APP.chapterProgress[chapter]) APP.chapterProgress[chapter] = {total:0,pct:0,attempts:0};
  APP.lastChapter = chapter;
  STORAGE.save();
  startQuiz(idxs);
  toast(`✈️ 开始练习：${chapter}（${diffLevel==='all'?'全部':diffLevel}）`,'info',1500);
};

// 章节模拟考
window.startChapterExam = function(chapter){
  const allIdxs = [];
  APP.questions.forEach((q,i)=>{ if(q.chapter===chapter) allIdxs.push(i); });
  if(allIdxs.length<5){toast('题目数量不足5道，无法模拟考','warning');return;}
  // 随机抽取20题（不多于该章节总数）
  const n = Math.min(20, allIdxs.length);
  const shuffled = allIdxs.slice().sort(()=>Math.random()-0.5);
  const selected = shuffled.slice(0,n);
  if(!APP.chapterProgress) APP.chapterProgress = {};
  if(!APP.chapterProgress[chapter]) APP.chapterProgress[chapter] = {total:0,pct:0,attempts:0};
  APP.lastChapter = chapter;
  STORAGE.save();
  startExam(selected, n*60); // 每题60秒
  toast(`📝 模拟考：${chapter} · ${n}题 · ${n}分钟`,'info',2000);
};

};

/* ===== QUIZ ===== */
function startQuiz(idxs){
  if(!idxs||!idxs.length){toast('请选择题目','warning');return;}
  APP.quiz = {
    indices: idxs,
    current: 0,
    answers: {},
    flagged: new Set(),
    startTime: Date.now(),
    submitted: false,
    mode: 'practice',
  };
  APP.timer = null;
  APP.examTimer = null;
  APP._acTypeIdx = 0;
  APP._acInnerPage = 0;
  go('quiz');
}

/* 从章节名直接进入该章节练习 */
function startChapterQuiz(chapterName){
  const idxs = APP.questions.map((q,i)=>q.chapter===chapterName?i:-1).filter(i=>i>=0);
  if(!idxs.length){toast('该章节暂无题目','warning');return;}
  startQuiz(idxs);
}

/* 考试模式：限时、打乱、不可回退 */
function startExam(idxs, timeLimit){
  if(!idxs||!idxs.length){toast('请选择题目','warning');return;}
  const limit = timeLimit || 1800; // 默认30分钟
  const shuffled = [...idxs].sort(()=>Math.random()-0.5);
  APP.quiz = {
    indices: shuffled,
    current: 0,
    answers: {},
    flagged: new Set(),
    startTime: Date.now(),
    submitted: false,
    mode: 'exam',
    timeLimit: limit,
    noBack: true,
    originalOrder: idxs,
  };
  APP.timer = null;
  APP.examTimer = null;
  APP._acTypeIdx = 0;
  APP._acInnerPage = 0;
  go('quiz');
}

/* 背题模式：直接显示答案 */
function startStudyMode(idxs){
  if(!idxs||!idxs.length){toast('请选择题目','warning');return;}
  APP.quiz = {
    indices: idxs,
    current: 0,
    answers: {},
    flagged: new Set(),
    startTime: Date.now(),
    submitted: false,
    mode: 'study',
  };
  APP.timer = null;
  APP.examTimer = null;
  APP._acTypeIdx = 0;
  APP._acInnerPage = 0;
  go('quiz');
}

/* 答题板块·模式选择中心 的统一入口 */
function qhStartMode(mode){
  if(!APP.questions.length){toast('题库为空，请先上传题库','warning');go('bank');return;}
  if(mode==='wrong_redo'){
    const valid = APP.wrong.filter(i=>APP.questions[i]);
    if(!valid.length){toast('暂无错题','warning');return;}
    startQuiz(valid);
    return;
  }
  if(mode==='fav'){
    const valid = APP.favorites.filter(i=>APP.questions[i]);
    if(!valid.length){toast('暂无收藏题','warning');return;}
    startQuiz(valid);
    return;
  }
  const all = APP.questions.map((_,i)=>i);
  if(mode==='exam') startExam(all);
  else if(mode==='study') startStudyMode(all);
  else startQuiz(all);
}

                    <div class="ac-page-meta">

  // 启动考试倒计时（含模拟考试）
  if((isExam || isMock) && qz.timeLimit){

      const topEl = document.getElementById('examCountdownTime');

      const elapsed2 = Math.floor((Date.now()-qz.startTime)/1000);
      const remain = Math.max(0, qz.timeLimit - elapsed2);
      const txt = String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');
      // 同步顶部显示
      topEl.textContent = txt;
      // 顶部进度条
      if(progEl) progEl.style.width = (remain/(qz.timeLimit))*100 + '%';
      // 颜色预警
      if(remain<=300){
        if(topEl) topEl.style.color = '#fff';
        if(barEl) barEl.classList.add('ecb-warning');
      }
      if(remain<=60){
        if(barEl) barEl.classList.add('ecb-danger');
        if(barEl) barEl.classList.remove('ecb-warning');
      }
      if(remain<=0){
        clearInterval(APP.examTimer);APP.examTimer=null;
        toast('考试时间到！自动交卷','warning');
        finishQuiz();
      }
    },1000);
  }
}

function getOptClass(q, myAns, i, isAnswered, isCorrect){
  if(!isAnswered){
    if(q.type==='多选'){
      return (myAns && myAns.includes(i))?'selected':'';
    }
    return myAns===i?'selected':'';
  }
  const ansArr = splitAnswer(q.ans);
  const optText = q.opts[i];
  // 兼容多种答案格式："B" / "B. xxx" / "xxx"
  const optLetter = optText.match(/^\s*([A-H])/i)?.[1]?.toUpperCase();
  const isAnsOpt = ansArr.some(a=>{
    if(!a) return false;
    if(a === optText) return true;
    const aLetter = a.match(/^\s*([A-H])/i)?.[1]?.toUpperCase();
    if(aLetter && optLetter && aLetter === optLetter) return true;
    const aStripped = a.replace(/^[A-H][.、:：\s]+/i,'').trim();
    const oStripped = optText.replace(/^[A-H][.、:：\s]+/i,'').trim();
    if(aStripped && aStripped === oStripped) return true;
    return false;
  });
  const isMyOpt = q.type==='多选' ? (myAns && myAns.includes(i)) : myAns===i;
  if(isAnsOpt) return 'correct';
  if(isMyOpt && !isAnsOpt) return 'wrong';
  return '';
}

function checkAnswer(q, myAns){
  if(myAns===null||myAns===undefined) return false;
  const ansArr = splitAnswer(q.ans);
  if(!ansArr.length) return false;
  if(q.type==='多选'){
    if(!Array.isArray(myAns)||!myAns.length) return false;
    const myTexts = myAns.map(i=>q.opts[i]).sort();
    return JSON.stringify(myTexts)===JSON.stringify(ansArr.sort());
  }
  // 提取答案首字母（兼容 "B" / "B. 押解警力" / "押解警力" 三种存储格式）
  const myText = q.opts[myAns] || '';
  const myLetter = myText.match(/^\s*([A-H])/i)?.[1]?.toUpperCase() || myText.trim();
  for(const a of ansArr){
    if(!a) continue;
    // 1. 完全相等
    if(myText === a) return true;
    // 2. 答案只有字母，比对首字母
    const aLetter = a.match(/^\s*([A-H])/i)?.[1]?.toUpperCase();
    if(aLetter && myLetter === aLetter) return true;
    // 3. 答案就是选项内容（去除前导字母和点号后比较）
    const aStripped = a.replace(/^[A-H][.、:：\s]+/i,'').trim();
    const myStripped = myText.replace(/^[A-H][.、:：\s]+/i,'').trim();
    if(aStripped && aStripped === myStripped) return true;
  }
  return false;
}

/* ===== 错题解析展示 =====
   答错时立即在答题卡下方显示：
   1. 正确答案
   2. 详细解析（来自 q.explain 字段）
   3. 关联知识点（章节）
   4. 同章节/同类型的其他错题（用于关联学习）
*/
function showQuestionExplain(qi, q){
  // 移除旧解析
  const old = document.getElementById('questionExplain');
  if(old) old.remove();

  const box = document.createElement('div');
  box.id = 'questionExplain';
  box.className = 'qe-box';

  const ansText = q.ans.replace(/\|/g,'、');
  const explain = q.explain || '';
  const hasExplain = explain.trim().length > 0;

  // 同章节/同类型的其他错题（最多3道）
  const siblings = [];
  for(let i=0;i<APP.questions.length && siblings.length<3;i++){
    if(i===qi) continue;
    const oq = APP.questions[i];
    if(!APP.wrong.includes(i) && !oq.chapter) continue;
    const sameChapter = oq.chapter && q.chapter && oq.chapter === q.chapter;
    const sameType = oq.type === q.type;
    if((sameChapter || sameType) && APP.wrong.includes(i)){
      siblings.push(i);
    }
  }

  box.innerHTML = `
    <div class="qe-header">
      <div class="qe-title">📖 错题解析</div>
      <button class="qe-close" onclick="document.getElementById('questionExplain')?.remove()" aria-label="关闭">×</button>
    </div>
    <div class="qe-row">
      <span class="qe-lbl">正确答案</span>
      <span class="qe-val qe-ans">${ansText}</span>
    </div>
    <div class="qe-row">
      <span class="qe-lbl">题目解析</span>
      <div class="qe-explain">${hasExplain ? escapeHtml(explain) : '<span style="color:var(--text3);font-style:italic;">本题暂无解析，请参考相关教材或咨询教员。</span>'}</div>
    </div>
    ${q.chapter ? `<div class="qe-row"><span class="qe-lbl">所属章节</span><span class="qe-val">${q.chapter} · ${q.type} · 难度${q.diff||'中'}</span></div>` : ''}
    ${siblings.length ? `<div class="qe-row"><span class="qe-lbl">关联错题</span><div class="qe-siblings">${siblings.map(idx=>{
      const oq = APP.questions[idx];
      const safeText = escapeHtml(oq.q.length>30 ? oq.q.substring(0,30)+'…' : oq.q);
      return `<button class="qe-sibling" onclick="goToWrongIdx(${idx})">${safeText}</button>`;
    }).join('')}</div></div>` : ''}
    <div class="qe-actions">
      <button class="qe-btn qe-btn-ghost" onclick="document.getElementById('questionExplain')?.remove()">收起解析</button>
      <button class="qe-btn qe-btn-primary" onclick="addNotePrompt(${qi})">📝 添加笔记</button>
    </div>
  `;
  // 插入到 feedback 之后
  const fb = document.getElementById('feedback');
  if(fb && fb.parentNode){
    fb.parentNode.insertBefore(box, fb.nextSibling);
  } else {
    const body = document.querySelector('.bp-body');
    if(body) body.appendChild(box);
  }
  // 平滑滚动到解析区
  setTimeout(()=>{
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 50);
}

/* 跳转到某个错题（从关联错题中点击） */
function goToWrongIdx(idx){
  if(!APP.wrong.includes(idx)) return;
  // 若当前不在错题重练模式，重置 indices 为全部错题
  if(!APP.quiz || APP.quiz.mode!=='wrong_redo' || !APP.quiz.indices.includes(idx)){
    APP.quiz = {
      indices: APP.wrong.filter(i=>APP.questions[i]),
      current: 0,
      answers: {},
      flagged: new Set(),
      startTime: Date.now(),
      submitted: false,
      mode: 'wrong_redo',
    };
    APP.quiz.current = APP.quiz.indices.indexOf(idx);
  } else {
    APP.quiz.current = APP.quiz.indices.indexOf(idx);
  }
  go('quiz');
}

/* 添加错题笔记（弹窗） */
function addNotePrompt(qi){
  const q = APP.questions[qi];
  if(!q) return;
  const existing = (APP.notes && APP.notes[qi]) || {};
  const text = typeof existing === 'string' ? existing : (existing.text || '');
  const tags = (existing && existing.tags) || [];

    title: '📝 错题笔记',

      <textarea id="noteText" rows="5" placeholder="记录你的错因、记忆口诀、关联知识点..." style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:var(--font-sans);resize:vertical;background:var(--bg);">${escapeHtml(text)}</textarea>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--text2);">
        <span style="color:var(--text3);">错因标签：</span>
        ${tagList.map(t=>`<label style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);"><input type="checkbox" name="errTag" value="${t}" ${tags.includes(t)?'checked':''}> ${t}</label>`).join('')}
      </div>`,
    okText: '保存笔记',
    onOk: () => {
      const noteText = document.getElementById('noteText').value.trim();

        delete APP.notes[qi];

      toast('笔记已保存','success');

/* 局部更新选项状态（避免全量重绘） */
function updateOptState(qi, clickedIdx){
  const qz = APP.quiz;
  const q = APP.questions[qi];
  const myAns = qz.answers[qi];
  const isExamOrMock = qz.isExam || qz.isMock;
  const isAnswered = q.type==='多选' ? (myAns && myAns.length>0) : myAns!==null;

  if(q.type!=='多选' && isAnswered){
    // 单选/判断：立即判定
    const isCorrect = checkAnswer(q, myAns);
    const letters = 'ABCDEFGH';
    q.opts.forEach((o,i)=>{
      const el = document.getElementById('opt_'+i);
      const letterEl = document.getElementById('optLetter_'+i);
      if(!el) return;
      const cls = 'bp-opt ' + getOptClass(q, myAns, i, isAnswered, isCorrect);
      el.className = cls;
      el.style.pointerEvents = 'none';
      if(letterEl){
        letterEl.className = 'opt-letter';
        if(cls.includes('correct')) letterEl.classList.add('correct');
        else if(cls.includes('wrong')) letterEl.classList.add('wrong');
        else if(cls.includes('selected')) letterEl.classList.add('selected');
      }
      // 在选项内右上角显示 ✓/✗ 徽章
      let badge = el.querySelector('.opt-badge');
      if(cls.includes('correct')) {
        if(!badge){ badge = document.createElement('span'); badge.className='opt-badge opt-badge-ok'; el.appendChild(badge); }
        badge.textContent = '✓';
      } else if(cls.includes('wrong')) {
        if(!badge){ badge = document.createElement('span'); badge.className='opt-badge opt-badge-err'; el.appendChild(badge); }
        badge.textContent = '✗';
      } else if(badge){ badge.remove(); }
    });
    // 显示反馈
    const fb = document.getElementById('feedback');
    if(fb){
      fb.className = `bp-feedback show ${isCorrect?'fb-correct':'fb-wrong'}`;
      fb.textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误，正确答案：' + q.ans.replace(/\|/g,'、');
    }
    // 错题解析（仅在非考试/非模拟考试模式显示）
    if(!isCorrect && !isExamOrMock) showQuestionExplain(qi, q);
    // 考试/模拟考试模式：清除可能残留的解析
    if(isExamOrMock){
      const old = document.getElementById('questionExplain');
      if(old) old.remove();
    }
    // 隐藏多选确认按钮
    const multiBtn = document.querySelector('.bp-confirm-multi');
    if(multiBtn) multiBtn.style.display = 'none';
  } else if(q.type==='多选'){
    // 多选：仅更新选中状态
    q.opts.forEach((o,i)=>{
      const el = document.getElementById('opt_'+i);
      const letterEl = document.getElementById('optLetter_'+i);
      if(!el) return;
      const isSelected = myAns && myAns.includes(i);
      // 保留已判定的correct/wrong状态
      if(!el.classList.contains('correct') && !el.classList.contains('wrong')){
        el.className = 'bp-opt' + (isSelected?' selected':'');
        if(letterEl){
          letterEl.className = 'opt-letter' + (isSelected?' selected':'');
        }
      }
    });
  }
}

function pickOpt(i){
  if(!APP.quiz || APP.quiz.submitted) return;
  const qz = APP.quiz;
  const qi = qz.indices[qz.current];
  const q = APP.questions[qi];

  if(q.type==='多选'){
    let arr = qz.answers[qi] || [];
    const idx = arr.indexOf(i);
    if(idx>=0) arr.splice(idx,1); else arr.push(i);
    qz.answers[qi] = arr;
    // 多选模式：仅局部更新选中状态
    updateOptState(qi, i);
  } else {
    qz.answers[qi] = i;
    // 单选/判断：局部更新
    updateOptState(qi, i);
    // 答题反馈（仅单选/判断立即判定时）
    const isCorrect = checkAnswer(q, i);
    pulseQuiz(isCorrect ? 'correct' : 'wrong');
    // 维护连击
    qz._combo = qz._combo || 0;
    if(isCorrect){
      qz._combo++;
      if(qz._combo >= 3) showCombo(qz._combo);
    } else {
      qz._combo = 0;
    }
    // 触发里程碑（按已答题数 + 百分比）
    const answered = qz.indices.filter(idx=>{
      const a = qz.answers[idx];
      return a!==undefined && (Array.isArray(a)?a.length>0:a!==null);
    }).length;
    showMilestone(answered, qz.indices.length);
    const pctDone = answered / qz.indices.length;
    if(Math.abs(pctDone - 0.25) < 0.01) showMilestone(0.25, 0);
    else if(Math.abs(pctDone - 0.5) < 0.01) showMilestone(0.5, 0);
    else if(Math.abs(pctDone - 0.75) < 0.01) showMilestone(0.75, 0);
    // 更新顶部倒计时条已答数
    updateExamBarAnswered();
    // 答错题直接归为错题本（即时入库，背题模式不计入）
    if(!isCorrect && qz.mode !== 'study'){
      addToWrongImmediate(qi, q);
    }
    // 答对题自动切下一题（背题模式、考试模式、模拟考试模式不自动切）
    if(isCorrect && APP.autoNextOnCorrect && qz.mode !== 'study' && qz.mode !== 'exam' && qz.mode !== 'mock_exam' && qz.current < qz.indices.length - 1){
      setTimeout(()=>{ nextQ(); }, 700);
    }
  }
  STORAGE.save();
}

/* 错题即时入库（用于即时反馈与连续答对计数） */
function addToWrongImmediate(qi, q){
  if(!APP.wrong.includes(qi)) APP.wrong.push(qi);
  if(!APP.wrongStats) APP.wrongStats = {};
  const s = APP.wrongStats[qi] || { count: 0, mastered: false, redoStreak: 0 };
  s.count = (s.count||0) + 1;
  s.lastWrongAt = new Date().toISOString();
  s.mastered = false;
  s.redoStreak = 0;  // 答错重置连击
  APP.wrongStats[qi] = s;
  if(APP.mastered){
    const mi = APP.mastered.indexOf(qi);
    if(mi >= 0) APP.mastered.splice(mi, 1);
  }
}

/* 更新顶部倒计时条的已答数量 */
function updateExamBarAnswered(){
  const el = document.getElementById('ecbAnswered');
  if(!el || !APP.quiz) return;
  const qz = APP.quiz;
  const answered = qz.indices.filter(idx=>{
    const a = qz.answers[idx];
    const q = APP.questions[idx];
    return a!==undefined && (q.type==='多选'?(a&&a.length>0):a!==null);
  }).length;
  el.textContent = answered;
}

/* 返回配置：停止计时器并返回对应模式配置页 */
function returnToConfig(){
  if(!APP.quiz) {
    // 没有进行中的训练，直接回首页
    go('home');
    return;
  }
  const qz = APP.quiz;
  const isStudy = qz.mode === 'study';
  const isFormalExam = qz.mode === 'exam' || qz.mode === 'mock_exam';

  // 统计已答题数
  const answered = qz.indices.filter(idx=>{
    const a = qz.answers[idx];
    return a!==undefined && (Array.isArray(a)?a.length>0:a!==null);
  }).length;
  const total = qz.indices.length;

  // 停止计时器
  if(APP.timer){ clearInterval(APP.timer); APP.timer = null; }
  if(APP.examTimer){ clearInterval(APP.examTimer); APP.examTimer = null; }

  // 自动保存进度（非正式考试模式）
  if(!isFormalExam && answered > 0){
    try {
      APP.savedQuiz = JSON.parse(JSON.stringify(qz));
      APP.savedQuiz.savedAt = new Date().toISOString();
      APP.savedQuiz.savedFrom = 'returnToConfig';
      sessionStorage.setItem('spring_active_quiz', JSON.stringify(APP.savedQuiz));
      STORAGE.save();
    } catch(e){}
  }

  const doReturn = ()=>{
    // 正式考试模式需二次确认
    if(isFormalExam){
      modal({
        title: '⚠️ 确认退出考试？',
        body: `<p>当前为<strong style="color:var(--danger)">正式考试</strong>模式，退出后进度将<strong>不会保存</strong>。</p><p style="margin-top:8px;color:var(--text2);font-size:.88rem;">已答 <strong>${answered}</strong> / ${total} 题</p>`,
        okText: '确认退出',
        cancelText: '继续答题',
        onOk: ()=>{
          APP.quiz = null;
          APP._acPage = 0;
          // 根据模式跳转到对应配置页
          if(qz.mode === 'mock_exam'){
            go('mockExam');
          } else if(qz.mode === 'exam'){
            go('chapter');
          } else {
            go('home');
          }
        }
      });
      return;
    }

    // 其他模式直接退出
    APP.quiz = null;
    APP._acPage = 0;
    if(answered > 0){
      toast('💾 训练进度已保存，可在首页"继续训练"恢复','success');
    }
    // 根据模式跳转到对应配置页
    const modeToPage = {
      'practice': 'chapter',
      'study': 'chapter',
      'wrong_redo': 'wrong',
      'wrong': 'wrong',
      'fav': 'favorite',
      'favorite': 'favorite',
      'mock_exam': 'mockExam'
    };
    go(modeToPage[qz.mode] || 'home');
  };

  // 背题模式/已答题数较少时直接退出
  if(isStudy || answered === 0){
    doReturn();
  } else {
    // 有进度时弹确认
    modal({
      title: '↩ 返回配置？',
      body: `<p>当前<strong>${answered}/${total}</strong>题已作答，返回后可在首页"继续训练"恢复进度。</p>`,
      okText: '保存并返回',
      cancelText: '继续答题',
      onOk: doReturn
    });
  }
}

}

function prevQ(){

  if(APP.quiz.mode==='exam' && APP.quiz.noBack){
    toast('考试模式不可回退上一题','warning');
    return;
  }

    renderQuiz();

}

function jumpTo(i){

function toggleFlag(){
  if(!APP.quiz) return;
  const qi = APP.quiz.indices[APP.quiz.current];
  if(APP.quiz.flagged.has(qi)) APP.quiz.flagged.delete(qi);
  else APP.quiz.flagged.add(qi);

  // 顶部控制条按钮
  const topBtn = document.querySelector('.quiz-topbar .qt-icon-btn[onclick*="toggleFlag"]');
  if(topBtn){
    topBtn.innerHTML = isFlagged ? '🚩' : '⚑';
    topBtn.classList.toggle('active', isFlagged);
  }
  // 登机牌导航按钮
  const bpBtn = document.querySelector('.bp-nav .btn-outline[onclick*="toggleFlag"]');
  if(bpBtn){
    bpBtn.innerHTML = isFlagged ? '🚩 已标记' : '⚑ 标记';
    bpBtn.classList.toggle('is-flagged', isFlagged);
  }

  if(acFlag) acFlag.textContent = APP.quiz.flagged.size;
}

/* ===== 答题统计工具函数（统一已答/正确/标记计算） ===== */
function computeQuizStats(qz){
  let correct = 0, answered = 0;
  if(!qz || !qz.indices) return {correct:0, answered:0, total:0, flagged:0, accuracy:0};
  qz.indices.forEach(idx=>{
    const a = qz.answers[idx];
    const qItem = APP.questions[idx];
    if(!qItem) return;
    if(a !== undefined && (qItem.type==='多选' ? (Array.isArray(a)&&a.length>0) : a!==null)){
      answered++;
      if(checkAnswer(qItem, a)) correct++;
    }
  });
  return {
    correct, answered,
    total: qz.indices.length,
    flagged: qz.flagged ? qz.flagged.size : 0,
    accuracy: answered ? Math.round(correct/answered*100) : 0
  };
}

function isQuestionAnswered(qItem, a){
  if(a === undefined || a === null) return false;
  if(qItem && qItem.type === '多选') return Array.isArray(a) && a.length > 0;
  return true;
}

function finishQuiz(){
  if(!APP.quiz) return;
  const qz = APP.quiz;
  // 清理所有定时器
  if(APP.timer){clearInterval(APP.timer);APP.timer=null;}
  if(APP.examTimer){clearInterval(APP.examTimer);APP.examTimer=null;}
  qz.submitted = true;

  let correct = 0;
  let answeredCount = 0;  // 实际作答的题数（不含未答）
  let wrongList = [];
  let scoreEarned = 0;     // 模拟考试得分
  let totalScore = 0;      // 模拟考试总分
  const isMock = qz.mode === 'mock_exam';

  // 模拟考试：先计算总分
  if(isMock){
    qz.indices.forEach(idx=>{
      const score = (qz.scores && qz.scores[idx]) || 1;
      totalScore += score;
    });
  }

  qz.indices.forEach(idx=>{
    const q = APP.questions[idx];
    const myAns = qz.answers[idx];
    const isAnswered = q.type==='多选' ? (myAns && myAns.length>0) : (myAns!==undefined && myAns!==null);
    if(!isAnswered){
      // 未作答的题目：不计为错误，不入错题本，不计入总数
      return;
    }
    answeredCount++;
    const isCorrect = checkAnswer(q, myAns);
    if(isCorrect){
      correct++;
      if(isMock) scoreEarned += (qz.scores && qz.scores[idx]) || 1;
      // 在错题重练模式下答对，累计连击，需达到设定阈值才从错题本移除
      if(qz.mode === 'wrong_redo'){
        if(!APP.wrongStats) APP.wrongStats = {};
        const s = APP.wrongStats[idx] || { count: 0, mastered: false, redoStreak: 0 };
        s.redoStreak = (s.redoStreak||0) + 1;
        s.lastRedoCorrectAt = new Date().toISOString();
        const threshold = APP.wrongRedoThreshold || 3;
        if(s.redoStreak >= threshold){
          s.mastered = true;
          // 达到阈值：从错题本中移除
          const wi = APP.wrong.indexOf(idx);
          if(wi>=0) APP.wrong.splice(wi, 1);
          // 加入已掌握列表（错题页三态切换用）
          if(!APP.mastered) APP.mastered = [];
          if(!APP.mastered.includes(idx)) APP.mastered.push(idx);
        }
        APP.wrongStats[idx] = s;
      }
    } else {
      wrongList.push(idx);
      if(!APP.wrong.includes(idx)) APP.wrong.push(idx);
      // 累计错误次数
      if(!APP.wrongStats) APP.wrongStats = {};
      const s = APP.wrongStats[idx] || { count: 0, mastered: false, redoStreak: 0 };
      s.count = (s.count||0) + 1;
      s.lastWrongAt = new Date().toISOString();
      s.mastered = false;
      s.redoStreak = 0;  // 答错重置连击
      APP.wrongStats[idx] = s;
      // 答错时同步从已掌握列表中移除
      if(APP.mastered){
        const mi = APP.mastered.indexOf(idx);
        if(mi >= 0) APP.mastered.splice(mi, 1);
      }
    }
  });

  const total = qz.indices.length;
  const pct = answeredCount ? Math.round(correct/answeredCount*100) : 0;
  const elapsed = Math.floor((Date.now()-qz.startTime)/1000);
  qz.elapsed = elapsed; // 记录用时，供保存使用

  // 只累加实际作答的题数（含对+错），未答不计入
  APP.totalAnswered += answeredCount;
  APP.totalCorrect += correct;
  // 累计今日答题数
  incrementTodayAnswered(answeredCount);

  // ===== 章节进度追踪 =====
  if(APP.lastChapter){
    if(!APP.chapterProgress) APP.chapterProgress = {};
    if(!APP.chapterProgress[APP.lastChapter]) APP.chapterProgress[APP.lastChapter] = {total:0,pct:0,attempts:0};
    // 累加已练习的题数
    const newTotal = APP.chapterProgress[APP.lastChapter].total + answeredCount;
    // 计算该章节的总题数
    const chapTotal = APP.questions.filter(q=>q.chapter===APP.lastChapter).length;
    APP.chapterProgress[APP.lastChapter].total = Math.min(newTotal, chapTotal);
    APP.chapterProgress[APP.lastChapter].pct = chapTotal ? Math.round(APP.chapterProgress[APP.lastChapter].total/chapTotal*100) : 0;
    APP.chapterProgress[APP.lastChapter].attempts++;
    APP.chapterProgress[APP.lastChapter].lastPct = pct;
  }

  // ===== 错题峰值追踪（用于错题清空类成就） =====
  if(!APP._peakWrong) APP._peakWrong = 0;
  if(APP.wrong.length > APP._peakWrong) APP._peakWrong = APP.wrong.length;

  // 模拟考试：先关闭提交进度遮罩
  const submitLoading = document.getElementById('submitLoading');
  if(submitLoading) submitLoading.remove();

  // 模拟考试：保存到历史试卷记录（独立通道，不混入常规训练历史）
  if(isMock && answeredCount > 0){
    qz.totalScore = totalScore;
    qz.scoreEarned = scoreEarned;
    const record = saveMockExamRecord(qz, scoreEarned, totalScore, correct, total);
    // 模拟考试不触发常规训练统计
    STORAGE.save();
    showMockExamResultModal(qz, record, scoreEarned, totalScore, correct, total, elapsed, pct);
    return;
  }

  const record = {
    date: new Date().toLocaleString('zh-CN'),
    total: answeredCount,    // 记录实际作答的题数
    correct, pct, elapsed,
    unanswered: total - answeredCount,  // 记录未答题数
    questions: qz.indices,
    mode: qz.mode,
  };
  // 边界保护：一题未答不入历史，不触发任何成就
  if(answeredCount === 0){
    STORAGE.save();
    modal({
      title:'⚠️ 本次未作答',
      body:`<p>你没有回答任何题目</p><p style="margin-top:8px;font-size:.85rem;color:var(--text3)">本次记录不会保存，也不会触发任何成就</p>`,
      okText:'返回首页',
      onOk:()=>{APP.quiz=null;go('home');}
    });
    return;
  }
  APP.history.push(record);
  STORAGE.save();

  // ===== 成就检测 =====
  checkAndUnlockBadges(pct, elapsed, answeredCount, correct);
  // 段位提升检测
  checkRankUp();

  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');
  const circleColor = pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--danger)';
  const modeLabels = {practice:'顺序练习',exam:'考试模式',study:'背题模式',wrong_redo:'错题重练'};

  modal({
    title:'🎉 训练完成！',
    body:`<div class="result-modal">
      <div class="rm-score">
        <div class="rm-circle" style="border-color:${circleColor}">
          <div class="rm-pct" style="color:${circleColor}">${pct}%</div>
          <div class="rm-lbl">正确率</div>
        </div>
        <div class="rm-stats">
          <div class="rm-stat"><div class="rms-val">${correct}</div><div class="rms-lbl">正确</div></div>
          <div class="rm-stat"><div class="rms-val" style="color:var(--danger)">${answeredCount-correct}</div><div class="rms-lbl">错误</div></div>

/* 模拟考试实时得分 */
function openMockExamSummary(){
  if(!APP.quiz || APP.quiz.mode!=='mock_exam') return;
  const qz = APP.quiz;
  let earned = 0, total = 0, answered = 0, correct = 0;
  qz.indices.forEach(idx=>{
    const score = (qz.scores && qz.scores[idx]) || 1;
    total += score;
    const a = qz.answers[idx];
    const q = APP.questions[idx];
    const isAnswered = q.type==='多选' ? (a && a.length>0) : (a!==undefined && a!==null);
    if(isAnswered){
      answered++;
      if(checkAnswer(q, a)){ earned += score; correct++; }
    }
  });
  const pct = total ? Math.round(earned/total*100) : 0;
  const answeredPct = qz.indices.length ? Math.round(answered/qz.indices.length*100) : 0;
  modal({
    title:'📊 模拟考试 · 实时得分',
    body:`
      <div class="me-live-score">
        <div class="me-live-score-box">
          <div class="me-live-score-num">${earned}<span class="me-live-score-total"> / ${total}</span></div>
          <div class="me-live-score-meta">已答 <strong>${answered}</strong>/${qz.indices.length} · 正确率 <strong>${pct}%</strong></div>
          <div class="me-live-progress"><div class="me-live-progress-fill" style="width:${answeredPct}%"></div></div>
          <div class="me-live-progress-label">答题进度 ${answeredPct}%</div>
        </div>
        <div class="me-live-hint">💡 这是基于你当前已答题目计算的实时分数，最终分数以交卷时为准</div>
      </div>
    `,
    okText:'继续答题',
    cancelText: false
  });
}

/* ===== 成就检测与解锁 ===== */
function checkAndUnlockBadges(pct, elapsed, total, correct){
  const newBadges = [];
  function tryUnlock(id){
    const b = BADGES.find(x=>x.id===id);
    if(b && !b.unlocked){b.unlocked=true; newBadges.push(b);}
  }

  const ta = APP.totalAnswered;
  const tc = APP.totalCorrect;
  const acc = ta ? Math.round(tc/ta*100) : 0;
  const now = new Date();
  const hour = now.getHours();
  const day = now.getDay(); // 0=周日,6=周六
  const isWeekend = day===0||day===6;
  const isExamMode = APP.quiz && APP.quiz.mode==='exam';

  // ===== 有效训练门控 =====
  // 只有真正作答了一定数量题目的训练才视为"完成训练"
  // 防止一题不答直接交卷误触发"首飞"等入门成就
  const validSession = total >= 1;          // 至少答了 1 题
  const standardSession = total >= 3;       // 标准训练（≥3题）才能触发正确率/速度类成就
  const seriousSession  = total >= 5;       // 严肃训练（≥5题）才能触发完美/三连/连飞成就
  const strongSession   = total >= 10;      // 强训练（≥10题）才能触发高阶成就
  // 白卷（total===0）下不触发任何成就
  if(total === 0) return;

  // ===== 入门级 =====
  // 只有完成过至少 1 次有效训练才能解锁"首飞"
  if(APP.history.length>=1 && APP.history.some(h=>h.total>=1)) tryUnlock('first');
  if(ta>=10) tryUnlock('ten');
  if(ta>=50) tryUnlock('fifty');
  if(ta>=100) tryUnlock('cent');
  if(ta>=300) tryUnlock('threeh');
  if(ta>=500) tryUnlock('fiveh');
  if(ta>=1000) tryUnlock('thousand');
  if(ta>=2000) tryUnlock('twothousand');

  // ===== 正确率 =====
  // 至少标准训练才计算单次正确率成就
  if(standardSession && pct>=60) tryUnlock('acc60');
  if(standardSession && pct>=80) tryUnlock('acc80');
  if(acc>=95 && ta>=20) tryUnlock('master');
  // 完美飞行：单次全对 + 至少 5 题
  if(seriousSession && correct===total) tryUnlock('perf');
  // 三连完美 / 五连完美：连续 3/5 次全部为 100% 且都达到 5 题
  if(seriousSession && correct===total){
    const recent3 = APP.history.slice(-3);
    if(recent3.length>=3 && recent3.every(h=>h.pct===100 && h.total>=5)) tryUnlock('perf3');
    const recent5 = APP.history.slice(-5);
    if(recent5.length>=5 && recent5.every(h=>h.pct===100 && h.total>=5)) tryUnlock('perf5');
  }
  // 连续5次 ≥ 70%（每次至少3题）
  if(APP.history.length>=5){
    const r5 = APP.history.slice(-5);
    if(r5.every(h=>h.pct>=70 && h.total>=3)) tryUnlock('acc70_5');
  }
  // 连续10次 ≥ 90%（每次至少3题）
  if(APP.history.length>=10){
    const r10 = APP.history.slice(-10);
    if(r10.every(h=>h.pct>=90 && h.total>=3)) tryUnlock('acc90_10');
  }

  // ===== 速度 =====
  // 至少 3 题才算有效速度成就
  if(standardSession && elapsed<300) tryUnlock('speed');
  if(standardSession && elapsed<180 && total>=10) tryUnlock('speed3');
  if(standardSession && elapsed<120 && total>=20) tryUnlock('speed2');
  if(standardSession && elapsed<60 && total>=10) tryUnlock('speed1');
  if(standardSession && elapsed/total < 10 && total>=10) tryUnlock('fast10');
  // 一眼定答：未标记 + 至少10题
  if(APP.quiz && APP.quiz.flagged.size===0 && total>=10) tryUnlock('noFlag');

  // ===== 坚持 =====
  if(APP.history.length>=3){
    const maxStreak = getMaxStreak();
    if(maxStreak>=3) tryUnlock('streak3');
    if(maxStreak>=7) tryUnlock('streak');
    if(maxStreak>=14) tryUnlock('streak14');
    if(maxStreak>=30) tryUnlock('streak30');
    if(maxStreak>=100) tryUnlock('streak100');
  }
  if(getActiveDays()>=30) tryUnlock('spring');
  if(getActiveDays()>=100) tryUnlock('spring100');

  // ===== 特殊时段 =====
  // 必须在有效训练中（≥1题）才触发时段成就
  if(validSession && hour>=0 && hour<5) tryUnlock('night');
  if(validSession && hour===0) tryUnlock('midnight3');
  if(validSession && hour>=5 && hour<7) tryUnlock('dawn');
  if(validSession && isWeekend) tryUnlock('weekend');
  if(validSession && hour>=11 && hour<13) tryUnlock('lunch');

  // ===== 覆盖与收藏 =====
  const totalCh = getChapters().length;
  if(totalCh>0 && getChaptersPracticed()>=totalCh) tryUnlock('all');
  if(getHardCount()>=50) tryUnlock('hard');
  if(getHardCount()>=100) tryUnlock('hard100');
  if(getChaptersPracticed()>=5) tryUnlock('chapters5');
  if(getChaptersPracticed()>=10) tryUnlock('chapters10');
  if(APP.favorites.length>=20) tryUnlock('vip');
  if(APP.favorites.length>=50) tryUnlock('vip50');
  if(APP.favorites.length>=100) tryUnlock('vip100');

  // ===== 考试模式 =====
  // 初考过关、考试通过、考试优秀、满分学霸：要求本次为有效考试（≥1题）
  const examHist = APP.history.filter(h=>h.mode==='exam');
  if(examHist.length>=1 && examHist.some(h=>h.total>=1)) tryUnlock('exam_first');
  if(isExamMode && validSession && pct>=60) tryUnlock('exam_pass');
  if(isExamMode && standardSession && pct>=80) tryUnlock('exam_excellent');
  if(isExamMode && standardSession && pct===100) tryUnlock('exam_perfect');
  if(examHist.length>=10) tryUnlock('exam10');
  if(examHist.length>=5){
    const last5 = examHist.slice(-5);
    if(last5.every(h=>h.pct>=80 && h.total>=3)) tryUnlock('exam_streak');
  }

  // ===== 隐藏成就 =====
  if(ta>=2500) tryUnlock('early_adopter');
  // 分享达人：导出3次
  if(APP.exportCount>=3) tryUnlock('sharer');
  // 王者归来：30天前有记录，今天首次恢复
  if(APP.history.length>=2){
    const lastDate = new Date(APP.history[APP.history.length-2].date);
    const daysSince = (now-lastDate)/(86400000);
    if(daysSince>=30) tryUnlock('comeback');
  }

  // ===== 春秋专属 (Spring) — 契合春秋航空题库 =====
  // 春秋新秀：答对第一道题（至少标准训练）
  if(standardSession && correct>=1) tryUnlock('spring_first');
  // 错题终结者：错题重练中累计掌握 10 道
  if((APP.mastered||[]).length >= 10) tryUnlock('spring_mastered10');
  // 联程航班：一天内完成 3 次训练（每次至少 1 题）
  if(standardSession){
    const todayKey = new Date().toLocaleDateString('zh-CN');
    const today = APP.history.filter(h => h.date && h.date.startsWith(todayKey) && h.total > 0).length;
    if(today >= 3) tryUnlock('spring_daily3');
  }
  // 模拟考王：完成第一次模拟考试
  if(APP.mockExamRecords && APP.mockExamRecords.length >= 1) tryUnlock('spring_mock');
  // 乘务精英：模拟考试得分 ≥ 80%
  if(APP.quiz && APP.quiz.mode === 'mock_exam' && validSession){
    const mScore = (APP.quiz.scoreEarned||0);
    const mTotal = (APP.quiz.totalScore||1);
    if(mTotal > 0 && mScore / mTotal >= 0.8) tryUnlock('spring_mock80');
  }
  // 零失误航班：单次训练 ≥ 50 题且零错误
  if(seriousSession && correct === total && total >= 50) tryUnlock('spring_no_wrong');
  // 安全守护者：累计答对 10 道安保类题目
  if(getCorrectByChapter(['安保','安检','违禁','押解','爆炸物','锂电池','酒精','清舱','搜查']) >= 10) tryUnlock('spring_safety');
  // 应急达人：累计答对 10 道应急处置类题目
  if(getCorrectByChapter(['应急','急救','灭火','撤离','急救','CPR','心肺','止血','包扎','迫降','失压','释压','烟雾']) >= 10) tryUnlock('spring_emergency');
  // 服务之星：累计答对 10 道客舱服务类题目
  if(getCorrectByChapter(['服务','客舱服务','餐饮','迎客','送客','广播','问候','特殊旅客','无成人陪伴']) >= 10) tryUnlock('spring_service');
  // 机长认证：答对 5 道 A320/A321 机型相关题
  if(getCorrectByText(['A320','A321','180座','186座','240座','180型','机型','波音','空客','737','机型机号']) >= 5) tryUnlock('spring_fleet');
  // 生命守护：答对 5 道急救/医疗类题目

  if(getActiveDays() >= 90) tryUnlock('spring_3month');

  // ===== 春秋专属 (Spring v2) — 新增解锁判定 =====
  // 平稳巡航/远航稳健/资深稳飞/民航楷模

  // 安保新星 / 安保达人
  if(getCorrectByText(['安保','安检','违禁','押解','爆炸物','锂电池','酒精','清舱','搜查','危险品','管制刀具']) >= 5) tryUnlock('spring_security_5');

  if(getCorrectByText(['A320']) >= 3) tryUnlock('spring_a320');

  if(examHist.length >= 50) tryUnlock('spring_exam_50');

    const last10 = examHist.slice(-10);
    if(last10.every(h=>h.pct >= 90 && h.total >= 3)) tryUnlock('spring_exam_ace');

  if(getChapters().length > 0 && getChapters().every(c => getChapterMasteredPct(c) >= 80)) tryUnlock('spring_chapter_all');
