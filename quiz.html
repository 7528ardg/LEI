   优化增强 3：成就解锁庆祝弹层
   ============================================ */
.celebration-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s;}
.celebration-overlay.show{display:flex;}
.celebration-card{background:var(--bg-card);border-radius:24px;padding:40px;text-align:center;max-width:420px;width:100%;position:relative;animation:celebrateIn .6s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-lg);overflow:hidden;}
.celebration-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--grad-livery);}
@keyframes celebrateIn{0%{transform:scale(.3) rotate(-15deg);opacity:0;}60%{transform:scale(1.1) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.celebration-icon{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-size:3.5rem;box-shadow:0 12px 40px rgba(20,132,83,.4);animation:badgeBounce 1s ease-out;position:relative;}
.celebration-icon::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--gold);animation:ringPulse 1.5s ease-out;}
.celebration-icon::after{content:'';position:absolute;inset:-16px;border-radius:50%;border:2px solid var(--gold);opacity:.5;animation:ringPulse 1.5s ease-out .3s both;}
@keyframes badgeBounce{0%{transform:scale(0) rotate(-180deg);}60%{transform:scale(1.2) rotate(15deg);}100%{transform:scale(1) rotate(0);}}
@keyframes ringPulse{0%{transform:scale(.8);opacity:1;}100%{transform:scale(1.4);opacity:0;}}
.celebration-card[data-rarity="legendary"] .celebration-icon{background:linear-gradient(135deg,#C084FC,#7DD3FC,#F5B800);box-shadow:0 12px 40px rgba(192,132,252,.5);}
.celebration-card[data-rarity="epic"] .celebration-icon{background:linear-gradient(135deg,#7DD3FC,#0EA5E9);box-shadow:0 12px 40px rgba(14,165,233,.4);}
.celebration-card[data-rarity="rare"] .celebration-icon{background:linear-gradient(135deg,#F5B800,#F08A00);box-shadow:0 12px 40px rgba(245,184,0,.4);}
.celebration-card h2{font-family:var(--font-display);font-size:1.4rem;font-weight:800;margin-bottom:6px;color:var(--text);}
.celebration-card .ce-rarity{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--rarity-color);margin-bottom:12px;text-transform:uppercase;}
.celebration-card .ce-name{font-size:1.1rem;font-weight:700;color:var(--primary);margin-bottom:4px;}
.celebration-card .ce-desc{font-size:.88rem;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.celebration-card .ce-points{display:inline-flex;align-items:center;gap:4px;padding:4px 14px;border-radius:12px;background:var(--gold-soft);color:var(--gold-dark);font-size:.82rem;font-weight:700;margin-bottom:20px;}
.celebration-card button{padding:12px 32px;border-radius:12px;border:none;background:var(--grad-primary);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;font-family:var(--font-sans);transition:all .2s;box-shadow:var(--shadow);}
.celebration-card button:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}

/* 彩带粒子 */
.confetti{position:absolute;width:10px;height:14px;top:-20px;opacity:0;pointer-events:none;}

/* ============================================
   优化增强 4：微交互增强
   ============================================ */
@keyframes shine{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.shine-effect{position:relative;overflow:hidden;}
.shine-effect::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 3s infinite;}

@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--primary-soft);}50%{box-shadow:0 0 0 8px transparent;}}
.pulse{animation:pulseGlow 2s infinite;}

.btn-primary{position:relative;overflow:hidden;transition:all .25s cubic-bezier(.4,0,.2,1);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(20,132,83,.35);}

/* 进度环 */
.progress-ring{transform:rotate(-90deg);}
.progress-ring .pr-bg{fill:none;stroke:var(--fog);stroke-width:6;}
.progress-ring .pr-fill{fill:none;stroke:url(#prGrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}

/* 时间线 */
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--primary) 0%,transparent 100%);}
.timeline-item{position:relative;padding-bottom:16px;}
.timeline-item::before{content:'';position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--primary-light);}

/* 引导提示 */
.tip-popup{position:absolute;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:500;white-space:nowrap;z-index:50;animation:tipIn .3s cubic-bezier(.34,1.56,.64,1);}
.tip-popup::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);}
@keyframes tipIn{from{transform:translateY(8px) translateX(-50%);opacity:0;}to{transform:translateY(0) translateX(-50%);opacity:1;}}

/* 段位/等级条 */
.rank-bar{position:relative;height:8px;border-radius:4px;background:var(--fog);overflow:hidden;margin:8px 0;}
.rank-bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--rarity-bronze) 0%,var(--rarity-silver) 30%,var(--rarity-gold) 60%,var(--rarity-platinum) 85%,var(--rarity-diamond) 100%);transition:width 1s cubic-bezier(.4,0,.2,1);}

/* 暗色模式适配 premium */
[data-style="premium"] .bp-header{background:var(--grad-primary);color:var(--ink);}
[data-style="premium"] .metric-card{backdrop-filter:blur(12px);background:var(--bg-card);border:1px solid var(--border);}
[data-style="premium"] .flight-ticket,
[data-style="premium"] .q-card,
[data-style="premium"] .stat-card,
[data-style="premium"] .chart-card,
[data-style="premium"] .settings-section,
[data-style="premium"] .seat-map,
[data-style="premium"] .style-switcher,
[data-style="premium"] .boarding-pass,
[data-style="premium"] .modal{backdrop-filter:blur(20px);background:var(--bg-card);border:1px solid var(--border);}
[data-style="premium"] .topbar{backdrop-filter:blur(20px);background:var(--bg-card);border-bottom:1px solid var(--border);}
[data-style="premium"] .sidebar{backdrop-filter:blur(20px);background:var(--bg-sidebar);}

/* 极简模式适配 minimal */
[data-style="minimal"] .metric-card{border-radius:10px;}
[data-style="minimal"] .page-hero{border-radius:12px;box-shadow:var(--shadow);}
[data-style="minimal"] .flight-ticket{border-radius:8px;}

/* ============================================
   优化增强 5：情绪反馈层 · 增强空状态
   ============================================ */
.empty-state-illus{position:relative;width:140px;height:140px;margin:0 auto 20px;}
.empty-state-illus .esi-ring{position:absolute;inset:0;border-radius:50%;background:var(--grad-window);animation:ringPulse 3s ease-in-out infinite;}
.empty-state-illus .esi-ring::before{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--bg-card);box-shadow:0 8px 24px rgba(20,132,83,.1);}
.empty-state-illus .esi-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;animation:floatY 3s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(20,132,83,.2));z-index:1;}
.empty-state-illus .esi-orbit{position:absolute;inset:0;animation:rotateOrbit 8s linear infinite;}
.empty-state-illus .esi-orbit::before,.empty-state-illus .esi-orbit::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
.empty-state-illus .esi-orbit::before{top:10%;left:50%;transform:translateX(-50%);}
.empty-state-illus .esi-orbit::after{bottom:10%;left:50%;transform:translateX(-50%);background:var(--primary);box-shadow:0 0 8px var(--primary);}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
@keyframes rotateOrbit{to{transform:rotate(360deg);}}
.empty-state h2{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:8px;letter-spacing:-.3px;}
.empty-state p.lead{font-size:.92rem;color:var(--text2);margin-bottom:6px;line-height:1.5;max-width:380px;margin-left:auto;margin-right:auto;}
.empty-state p.tip{font-size:.82rem;color:var(--text3);margin-bottom:20px;line-height:1.5;max-width:380px;margin-left:auto;margin-right:auto;}
.empty-state .es-cta{display:inline-flex;align-items:center;gap:6px;padding:11px 24px;border-radius:12px;background:var(--grad-primary);color:#fff;font-size:.92rem;font-weight:700;cursor:pointer;border:none;box-shadow:var(--shadow);transition:all .2s cubic-bezier(.4,0,.2,1);font-family:var(--font-sans);min-height:44px;}
.empty-state .es-cta:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.empty-state .es-cta:active{transform:translateY(0);}
.empty-state .es-cta.outline{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none;}
.empty-state .es-cta.outline:hover{background:var(--primary-soft);}
.empty-state .es-cta-group{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.empty-state .es-steps{display:flex;justify-content:center;gap:20px;margin-top:20px;flex-wrap:wrap;}
.empty-state .es-step{text-align:center;flex:1;min-width:120px;max-width:160px;padding:12px 8px;border-radius:12px;background:var(--primary-mist);border:1px dashed var(--primary-light);transition:all .2s;}
.empty-state .es-step:hover{transform:translateY(-2px);background:var(--primary-soft);}
.empty-state .es-step .esn{font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--primary);line-height:1;}
.empty-state .es-step .esl{font-size:.72rem;color:var(--text2);margin-top:4px;font-weight:500;}

/* ============================================
   优化增强 6：Onboarding Tour 首次使用引导
   使用 4 个 mask div 拼接挖洞：真正的"洞"无渲染
   ============================================ */
.onb-overlay{position:fixed;inset:0;z-index:600;display:none;animation:fadeIn .3s;pointer-events:none;}
.onb-overlay.show{display:block;}
/* 4 个 mask div 共同组成"洞"边框 */
.onb-mask{position:absolute;background:rgba(8,12,20,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:auto;transition:all .4s cubic-bezier(.4,0,.2,1);}
/* 聚光灯：仅显示金色边框 */
.onb-spotlight{position:absolute;border-radius:14px;border:3px solid var(--gold);box-shadow:0 0 0 2px rgba(8,12,20,.4),0 0 32px rgba(245,184,0,.6),inset 0 0 0 1px rgba(255,255,255,.3);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none;animation:spotlightPulse 2s ease-in-out infinite;}
@keyframes spotlightPulse{0%,100%{box-shadow:0 0 0 2px rgba(8,12,20,.4),0 0 24px rgba(245,184,0,.5),inset 0 0 0 1px rgba(255,255,255,.3);}50%{box-shadow:0 0 0 2px rgba(8,12,20,.4),0 0 40px rgba(245,184,0,.7),inset 0 0 0 1px rgba(255,255,255,.5);}}
.onb-tooltip{position:absolute;background:var(--bg-card);border-radius:18px;padding:22px;width:360px;max-width:calc(100vw - 32px);box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:601;animation:onbIn .4s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border);pointer-events:auto;}
.onb-tooltip::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad-livery);border-radius:18px 18px 0 0;}
/* 引导箭头 */
.onb-tooltip::after{content:'';position:absolute;width:14px;height:14px;background:var(--bg-card);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
.onb-tooltip[data-arrow="top"]::after{bottom:-8px;left:50%;margin-left:-7px;transform:rotate(225deg);}
.onb-tooltip[data-arrow="bottom"]::after{top:-8px;left:50%;margin-left:-7px;}
.onb-tooltip[data-arrow="left"]::after{right:-8px;top:50%;margin-top:-7px;transform:rotate(135deg);}
.onb-tooltip[data-arrow="right"]::after{left:-8px;top:50%;margin-top:-7px;transform:rotate(-45deg);}
@keyframes onbIn{from{opacity:0;transform:translateY(8px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.onb-tooltip .onb-step{font-size:.7rem;color:var(--primary);font-weight:700;letter-spacing:2px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.onb-tooltip .onb-step .onb-step-icon{font-size:.9rem;}
.onb-tooltip h3{font-family:var(--font-display);font-size:1.15rem;font-weight:800;margin-bottom:10px;color:var(--text);line-height:1.35;}
.onb-tooltip p{font-size:.88rem;color:var(--text2);line-height:1.6;margin-bottom:18px;}
.onb-tooltip .onb-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--border);}
.onb-tooltip .onb-progress{display:flex;gap:5px;align-items:center;}
.onb-tooltip .onb-progress .dot{width:7px;height:7px;border-radius:50%;background:var(--fog);transition:all .3s;}
.onb-tooltip .onb-progress .dot.active{background:var(--primary);width:22px;border-radius:4px;}
.onb-tooltip .onb-progress .dot.done{background:var(--primary-light);}
.onb-tooltip button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;font-family:var(--font-sans);transition:all .15s;min-height:36px;display:inline-flex;align-items:center;gap:4px;}
.onb-tooltip .onb-skip{background:transparent;color:var(--text2);font-weight:500;}
.onb-tooltip .onb-skip:hover{color:var(--text);background:var(--fog);}
.onb-tooltip .onb-next{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-sm);}
.onb-tooltip .onb-next:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.onb-tooltip .onb-finish{background:linear-gradient(135deg,#F5B800,#F08A00);color:#fff;box-shadow:0 2px 8px rgba(245,184,0,.3);}
/* 重新观看引导的小按钮（仅在设置页内提供入口；浮动按钮始终隐藏） */
.replay-onb{position:fixed;bottom:80px;right:20px;z-index:80;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.75rem;color:var(--text2);cursor:pointer;box-shadow:var(--shadow-sm);display:none !important;align-items:center;gap:4px;font-weight:500;transition:all .2s;}
.replay-onb:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px);}

/* ===== Onboarding Tour 平板/手机适配 ===== */
@media (max-width:900px){
  .onb-tooltip{width:340px;padding:18px;}
  .onb-tooltip h3{font-size:1.05rem;}
  .onb-tooltip p{font-size:.85rem;}
}
@media (max-width:768px){
  .onb-tooltip{
    width:auto;
    left:16px!important;
    right:16px!important;
    top:auto!important;
    bottom:24px!important;
    transform:none!important;
    padding:16px 18px;
    border-radius:16px;
    max-width:none;
  }
  .onb-tooltip::after{display:none;}
  .onb-tooltip h3{font-size:1rem;margin-bottom:8px;}
  .onb-tooltip p{font-size:.82rem;margin-bottom:14px;line-height:1.55;}
  .onb-tooltip .onb-actions{padding-top:10px;flex-wrap:wrap;}
  .onb-tooltip button{padding:7px 14px;font-size:.82rem;min-height:38px;}
  /* 第 4 步 netText 元素高亮，spotlight 在小元素上内边距 */
  .onb-spotlight{border-radius:10px;}
  /* 平板/手机：重看引导按钮隐藏，避免遮挡样式切换器等 UI */
  .replay-onb{display:none !important;}
}
@media (max-width:480px){
  .onb-tooltip{left:12px!important;right:12px!important;bottom:16px!important;padding:14px 16px;}
  .onb-tooltip h3{font-size:.95rem;}
  .onb-tooltip p{font-size:.78rem;margin-bottom:12px;}
  .onb-tooltip .onb-step{font-size:.65rem;letter-spacing:1.5px;margin-bottom:4px;}
  .onb-tooltip button{padding:6px 12px;font-size:.78rem;min-height:36px;}
}

/* ============================================
   优化增强 7：按钮 Ripple 涟漪效果
   ============================================ */
.ripple{position:relative;overflow:hidden;}
.ripple .ripple-wave{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rippleAnim .6s linear;pointer-events:none;}
[data-style="premium"] .ripple .ripple-wave{background:rgba(245,241,232,.4);}
[data-style="minimal"] .ripple .ripple-wave{background:rgba(20,184,166,.3);}
@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}

/* ============================================
   优化增强 8：答题页里程碑与激励
   ============================================ */
.quiz-milestone{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);background:linear-gradient(135deg,var(--gold) 0%,#F08A00 100%);color:#fff;padding:16px 28px;border-radius:16px;font-weight:800;font-size:1.1rem;z-index:400;opacity:0;pointer-events:none;box-shadow:0 12px 32px rgba(245,184,0,.4);animation:milestonePop 1.8s cubic-bezier(.34,1.56,.64,1) forwards;}
.quiz-milestone .qmi-icon{font-size:2rem;margin-bottom:4px;}
.quiz-milestone .qmi-text{font-size:.95rem;}
.quiz-milestone .qmi-sub{font-size:.75rem;opacity:.9;margin-top:2px;font-weight:500;}
@keyframes milestonePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-15deg);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(3deg);}30%{transform:translate(-50%,-50%) scale(1) rotate(0);}85%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.9);}}

/* 答题连击数 */
.combo-counter{position:absolute;top:-30px;right:0;background:var(--danger);color:#fff;padding:4px 10px;border-radius:12px;font-size:.7rem;font-weight:800;animation:comboPop .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 12px rgba(230,74,25,.3);z-index:10;}
@keyframes comboPop{from{transform:scale(0) rotate(-10deg);}to{transform:scale(1) rotate(0);}}

/* 答题页激励横条（精简版：仅图标+文案） */
.motivation-bar{background:linear-gradient(90deg,var(--primary-mist),var(--gold-soft));border:1px solid var(--border);border-radius:12px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--text);font-weight:500;}
.motivation-bar .mb-icon{font-size:1.3rem;flex-shrink:0;}
.motivation-bar .mb-text{flex:1;line-height:1.4;}
.motivation-bar .mb-text strong{color:var(--primary);}

/* ============================================
   优化增强 9：上传区引导强化
   ============================================ */
.upload-zone{position:relative;}
.upload-zone .uz-features{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
.upload-zone .uz-feat{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text2);font-weight:500;}
.upload-zone .uz-feat::before{content:'✓';color:var(--success);font-weight:800;}

/* ============================================
   优化增强 10：成就进度条动画
   ============================================ */
.ach-summary{position:relative;overflow:hidden;}
.ach-summary::before{content:'';position:absolute;top:-50%;right:-10%;width:200px;height:200px;background:radial-gradient(circle,rgba(245,184,0,.12) 0%,transparent 70%);border-radius:50%;animation:floatY 6s ease-in-out infinite;pointer-events:none;}

.ach-summary-item{position:relative;z-index:1;}

/* 徽章卡 hover 增强 */
.badge-card{transition:all .3s cubic-bezier(.4,0,.2,1);}
.badge-card:hover{transform:translateY(-4px) scale(1.02);}
.badge-card .bc-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s;pointer-events:none;}
.badge-card:hover .bc-shine{left:100%;}

/* 飞行卡 3D 倾斜 */
.metric-card{transform-style:preserve-3d;}
.metric-card:hover{transform:translateY(-4px) rotateX(2deg);}

/* 工具提示气泡 */
[data-tip]{position:relative;}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:5px 10px;border-radius:6px;font-size:.72rem;white-space:nowrap;z-index:100;pointer-events:none;animation:tipIn .2s ease-out;font-weight:500;}
[data-tip]:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);z-index:100;}

/* 滚动条美化 */
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary-light),var(--primary));border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary);}

/* 飞行卡片入场动画 */
@keyframes flyIn{from{opacity:0;transform:translateY(20px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.flight-ticket{animation:flyIn .4s cubic-bezier(.4,0,.2,1) backwards;}
.flight-ticket:nth-child(1){animation-delay:.02s;}
.flight-ticket:nth-child(2){animation-delay:.04s;}
.flight-ticket:nth-child(3){animation-delay:.06s;}
.flight-ticket:nth-child(4){animation-delay:.08s;}
.flight-ticket:nth-child(5){animation-delay:.1s;}
.flight-ticket:nth-child(6){animation-delay:.12s;}
.flight-ticket:nth-child(7){animation-delay:.14s;}
.flight-ticket:nth-child(8){animation-delay:.16s;}

/* ===== CHAPTER PRACTICE 章节专项练习 ===== */
.chapter-list{display:flex;flex-direction:column;gap:14px;}
.chapter-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:18px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
.chapter-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary-light);}
.chapter-card:hover .chc-arrow{transform:translateX(4px);color:var(--primary);}
.chc-index{width:46px;height:46px;border-radius:12px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.2rem;font-weight:800;flex-shrink:0;box-shadow:0 4px 12px rgba(20,132,83,.25);}
.chc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.chc-title{font-size:1.05rem;font-weight:700;color:var(--text);font-family:var(--font-display);letter-spacing:-.2px;}
.chc-meta{display:flex;gap:8px;flex-wrap:wrap;}
.chc-tag{font-size:.75rem;padding:3px 9px;border-radius:6px;background:var(--primary-mist);color:var(--text2);font-weight:600;white-space:nowrap;}
.chc-progress-bar{position:relative;width:100%;height:18px;background:var(--fog);border-radius:9px;overflow:hidden;}
.chc-progress-fill{position:absolute;left:0;top:0;bottom:0;transition:width .5s cubic-bezier(.4,0,.2,1),background .3s;background:var(--primary);}
.chc-progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--text);mix-blend-mode:luminosity;}
.chc-diff-bar{display:flex;width:100%;height:6px;border-radius:3px;overflow:hidden;background:var(--fog);}
.chc-diff-seg{height:100%;transition:width .4s;flex-shrink:0;}
.chc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.chc-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s;font-family:var(--font-sans);color:var(--text2);}
.chc-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary);border-color:var(--primary);transform:translateY(-1px);}
.chc-btn:disabled{opacity:.4;cursor:not-allowed;}
.chc-btn-primary{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(20,132,83,.3);}
.chc-btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,132,83,.4);color:#fff;}
.chc-arrow{font-size:1.4rem;color:var(--text3);transition:transform .25s,color .25s;flex-shrink:0;font-weight:700;}
.chapter-card[data-chap~="未分类"]{opacity:.7;}
.chapter-card[data-chap~="未分类"] .chc-index{background:var(--steel);box-shadow:none;}
.select-active{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important;}

/* 段位升级闪光 */
@keyframes rankUp{0%{transform:scale(1);filter:brightness(1);}50%{transform:scale(1.15);filter:brightness(1.5);}100%{transform:scale(1);filter:brightness(1);}}
.rank-up{animation:rankUp 1.2s ease-out;}

/* 已回答的选项添加勾 */
.bp-opt.correct::after{content:'✓';position:absolute;right:14px;font-size:1rem;color:var(--success);font-weight:800;}
.bp-opt.wrong::after{content:'✗';position:absolute;right:14px;font-size:1rem;color:var(--danger);font-weight:800;}

/* 答题页快捷键提示 */
.quiz-shortcuts{position:absolute;bottom:10px;right:10px;font-size:.7rem;color:var(--text3);display:flex;gap:10px;align-items:center;background:var(--bg-card);padding:4px 10px;border-radius:14px;border:1px solid var(--border);opacity:.7;flex-wrap:wrap;max-width:90%;}
.quiz-shortcuts kbd{padding:1px 5px;border-radius:3px;background:var(--fog);font-family:var(--font-mono);font-size:.68rem;border:1px solid var(--border);font-weight:600;color:var(--text2);}
.quiz-shortcuts .qs-item{display:inline-flex;align-items:center;gap:3px;}

/* 考试暂停遮罩 */
.exam-pause-overlay{position:fixed;inset:0;background:rgba(15,42,31,.85);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease-out;}
.epo-card{background:var(--bg-card);padding:40px 56px;border-radius:18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--border);animation:scaleIn .35s cubic-bezier(.34,1.56,.64,1);min-width:280px;}
.epo-icon{font-size:4rem;line-height:1;margin-bottom:14px;animation:epoBounce 1.5s ease-in-out infinite;}
@keyframes epoBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.epo-card h2{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:8px;}
.epo-card p{color:var(--text2);font-size:.92rem;margin-bottom:6px;}
.epo-card kbd{padding:3px 8px;border-radius:4px;background:var(--fog);font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--border);font-weight:700;color:var(--text);}

/* ===== 首页每日训练目标 ===== */
.daily-goal-bar{background:linear-gradient(135deg,#fff 0%,#F0FDF4 100%);border:1px solid var(--primary-light);border-radius:16px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(20,132,83,.08);position:relative;overflow:hidden;flex-wrap:wrap;}
.daily-goal-bar.reached{background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 100%);border-color:var(--gold);box-shadow:0 4px 16px rgba(245,184,0,.2);}
.dgb-left{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;}
.dgb-icon{font-size:2rem;line-height:1;}
.dgb-title{font-family:var(--font-display);font-size:.96rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.dgb-progress-text{font-size:.78rem;color:var(--text2);}
.dgb-progress-text strong{color:var(--primary);font-weight:800;font-size:1rem;}
.daily-goal-bar.reached .dgb-progress-text strong{color:#92400E;}
.dgb-progress{flex:1;height:8px;background:rgba(20,132,83,.12);border-radius:4px;overflow:hidden;min-width:120px;max-width:200px;}
.daily-goal-bar.reached .dgb-progress{background:rgba(245,184,0,.18);}
.dgb-progress-fill{height:100%;background:var(--grad-primary);border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 6px rgba(20,132,83,.3);}
.daily-goal-bar.reached .dgb-progress-fill{background:linear-gradient(90deg,#F5B800,#F08A00);}
.dgb-action{background:var(--grad-primary);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:.86rem;font-weight:700;cursor:pointer;font-family:var(--font-sans);box-shadow:0 4px 12px rgba(20,132,83,.3);transition:all .2s;white-space:nowrap;}
.dgb-action:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,132,83,.45);}
.daily-goal-bar.reached .dgb-action{background:linear-gradient(135deg,#F5B800,#F08A00);box-shadow:0 4px 12px rgba(245,184,0,.35);}

/* 快速训练区 */
.quick-train-section{margin-bottom:22px;}
.section-header{margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.section-header h2{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--text);margin:0;}
.section-sub{color:var(--text3);font-size:.78rem;}
.quick-train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.qt-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
.qt-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);transition:width .25s;}
.qt-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--primary-light);}
.qt-card:hover::before{width:5px;}
.qt-card.qt-card-primary{background:linear-gradient(135deg,#F0FDF4,#fff);}
.qt-card.qt-card-warn{background:linear-gradient(135deg,#FEF3C7 0%,#fff 60%);}
.qt-card.qt-card-warn::before{background:var(--gold);}
.qt-card.qt-card-mock{background:linear-gradient(135deg,#EDE9FE,#fff);}
.qt-card.qt-card-mock::before{background:#7C3AED;}
.qt-card.qt-card-weak{background:linear-gradient(135deg,#FEE2E2 0%,#fff 60%);}
.qt-card.qt-card-weak::before{background:var(--danger);}
.qt-card.qt-card-disabled{opacity:.55;cursor:not-allowed;background:var(--bg);}
.qt-card.qt-card-disabled:hover{transform:none;box-shadow:none;}
.qt-icon{font-size:1.6rem;line-height:1;flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;}
.qt-body{flex:1;min-width:0;}
.qt-title{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.qt-desc{font-size:.76rem;color:var(--text2);margin-bottom:4px;line-height:1.4;}
.qt-desc strong{color:var(--danger);font-weight:800;}
.qt-card.qt-card-warn .qt-desc strong{color:#92400E;}
.qt-card.qt-card-weak .qt-desc strong{color:var(--danger);}
.qt-meta{font-size:.68rem;color:var(--text3);display:flex;align-items:center;gap:4px;}
.qt-tag{background:var(--primary-soft);color:var(--primary);padding:1px 6px;border-radius:4px;font-weight:600;}
.qt-tag-warn{background:rgba(245,184,0,.18);color:#92400E;}
.qt-tag-mock{background:rgba(124,58,237,.15);color:#7C3AED;}
.qt-tag-weak{background:rgba(230,74,25,.15);color:var(--danger);}
.qt-arrow{color:var(--text3);font-size:1.2rem;transition:transform .2s;}
.qt-card:hover .qt-arrow{transform:translateX(4px);color:var(--primary);}

@media (max-width:600px){
  .dgb-progress{max-width:100%;flex:1 1 100%;order:3;}
  .quick-train-grid{grid-template-columns:1fr;}
  .qt-card{padding:12px 14px;}
}

@media (max-width:768px){
  .daily-goal-bar{padding:12px 14px;gap:10px;}
  .dgb-icon{font-size:1.5rem;}
  .dgb-action{padding:8px 14px;font-size:.8rem;}
}

/* 模拟考试预设模板（一键配置） */
.me-presets-bar{background:linear-gradient(135deg,#fff 0%,#F9FAFB 100%);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.me-presets-label{font-size:.78rem;color:var(--text2);font-weight:600;font-family:var(--font-sans);flex-shrink:0;}
.me-preset{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-card);cursor:pointer;transition:all .2s;font-family:var(--font-sans);flex:0 0 auto;}
.me-preset:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.me-preset-quick{border-color:rgba(20,132,83,.3);background:linear-gradient(135deg,#F0FDF4,#fff);}
.me-preset-quick:hover{border-color:var(--primary);}
.me-preset-balance{border-color:rgba(59,130,246,.3);background:linear-gradient(135deg,#EFF6FF,#fff);}
.me-preset-balance:hover{border-color:#3B82F6;}
.me-preset-challenge{border-color:rgba(245,184,0,.4);background:linear-gradient(135deg,#FFFBEB,#fff);}
.me-preset-challenge:hover{border-color:var(--gold);}
.me-preset-cbt{border-color:rgba(124,58,237,.3);background:linear-gradient(135deg,#F5F3FF,#fff);}
.me-preset-cbt:hover{border-color:#7C3AED;}
.mep-icon{font-size:1.3rem;line-height:1;}
.mep-body{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;}
.mep-name{font-size:.84rem;font-weight:700;color:var(--text);}
.mep-meta{font-size:.7rem;color:var(--text3);margin-top:1px;}

/* ===== 步骤进度导航条 (Stepper) ===== */
.me-steps-nav{display:flex;align-items:stretch;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 12px;margin-bottom:18px;box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:thin;}
.me-step-item{display:flex;align-items:center;flex:1;min-width:0;cursor:pointer;position:relative;padding:0 6px;transition:all .2s;}
.me-step-item:hover{background:var(--primary-mist);border-radius:10px;}
.me-step-circle{width:34px;height:34px;border-radius:50%;background:var(--fog);color:var(--text3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.92rem;flex-shrink:0;transition:all .3s;border:2px solid var(--border);font-family:var(--font-display);}
.me-step-label{margin-left:8px;min-width:0;flex:1;}
.me-step-title{font-size:.82rem;font-weight:700;color:var(--text2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-step-desc{font-size:.68rem;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-step-line{position:absolute;left:calc(100% - 8px);right:8px;top:17px;height:2px;background:var(--fog);z-index:0;}
.me-step-item.passed .me-step-circle{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(20,132,83,.3);}
.me-step-item.passed .me-step-line{background:var(--primary);}
.me-step-item.passed .me-step-title{color:var(--primary);}
.me-step-item.current .me-step-circle{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(20,132,83,.18),0 4px 10px rgba(20,132,83,.3);transform:scale(1.1);}
.me-step-item.current .me-step-title{color:var(--primary);font-weight:800;}
.me-step-item.current::after{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid var(--primary);}

/* 步骤底部按钮区 */
.me-step-foot{display:flex;gap:8px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);flex-wrap:wrap;}
.me-step-foot .me-btn:disabled{opacity:.4;cursor:not-allowed;}

@media (max-width:768px){
  .me-presets-bar{padding:8px 10px;}
  .me-preset{padding:6px 10px;}
  .me-presets-label{font-size:.72rem;width:100%;margin-bottom:4px;}
  .mep-meta{display:none;}
  .me-step-item{padding:0 4px;}
  .me-step-label{display:none;}
  .me-step-circle{width:32px;height:32px;font-size:.85rem;}
  .me-step-line{top:15px;}
}

/* 答题卡浮动抽屉（已移除：使用顶部控制条 📋 按钮触发） */

/* ===== 翻页式答题卡（双层：题型 Tab + 10题/页） ===== */
.ac-paginator{position:relative;display:flex;flex-direction:column;gap:10px;}

/* === 题型 Tab 栏 === */
.ac-type-tabs{display:flex;gap:4px;padding:4px;background:var(--fog);border-radius:10px;overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x mandatory;}
.ac-type-tabs::-webkit-scrollbar{height:4px;}
.ac-type-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ac-type-tab{
  display:flex;align-items:center;gap:5px;flex:1;min-width:0;
  padding:7px 10px;border:1.5px solid transparent;border-radius:7px;
  background:transparent;color:var(--text2);cursor:pointer;
  font-family:var(--font-sans);font-size:.72rem;font-weight:600;
  transition:all .2s cubic-bezier(.4,0,.2,1);scroll-snap-align:start;
  white-space:nowrap;line-height:1.2;
}
.ac-type-tab:hover{background:var(--bg-card);color:var(--primary);border-color:var(--primary-light);}
.ac-type-tab.active{background:var(--bg-card);color:var(--primary);border-color:var(--primary);box-shadow:0 2px 6px rgba(20,132,83,.18);}
.ac-type-tab.done:not(.active){background:rgba(34,197,94,.08);color:var(--success);border-color:rgba(34,197,94,.25);}
.ac-type-tab-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--primary-soft);color:var(--primary);font-size:.68rem;font-weight:800;flex-shrink:0;}
.ac-type-tab.active .ac-type-tab-num{background:var(--primary);color:#fff;}
.ac-type-tab.done .ac-type-tab-num{background:var(--success);color:#fff;}
.ac-type-tab-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.ac-type-tab-meta{font-size:.65rem;color:var(--text3);font-weight:500;flex-shrink:0;}
.ac-type-tab.active .ac-type-tab-meta{color:var(--primary);}

/* === 翻页控制条（页码/总页 + 上下页 + 跳转） === */
.ac-page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(135deg,var(--primary-soft),transparent);border:1px solid var(--border);border-radius:10px;}
.ac-page-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text);font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;font-family:var(--font-sans);line-height:1;}
.ac-page-btn:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.08);}
.ac-page-btn:disabled{opacity:.35;cursor:not-allowed;}
.ac-page-info{flex:1;text-align:center;min-width:0;}
.ac-page-type{font-family:var(--font-display);font-size:.92rem;font-weight:700;color:var(--text);line-height:1.2;}
.ac-page-type strong{color:var(--primary);font-weight:800;}
.ac-page-meta{font-size:.7rem;color:var(--text2);margin-top:3px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;}
.ac-page-sep{color:var(--text3);opacity:.5;}
.ac-page-all-done{color:var(--success);font-weight:700;}

/* === 页码跳转输入框 === */
.ac-page-counter{display:inline-flex;align-items:center;gap:3px;}
.ac-page-jump{
  width:46px;height:22px;padding:0 4px;border:1px solid var(--border);border-radius:5px;
  background:var(--bg-card);color:var(--primary);font-size:.78rem;font-weight:700;
  text-align:center;font-family:var(--font-mono);
  transition:all .2s;outline:none;
  -moz-appearance:textfield;
}
.ac-page-jump::-webkit-outer-spin-button,
.ac-page-jump::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ac-page-jump:hover{border-color:var(--primary-light);}
.ac-page-jump:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);}

/* === 翻页动画轨道 === */
.ac-page-track{position:relative;overflow:hidden;min-height:180px;}
.ac-page-slide{animation:pageSlideIn .3s cubic-bezier(.4,0,.2,1) both;}
@keyframes pageSlideIn{0%{opacity:0;transform:translateX(12px);}100%{opacity:1;transform:translateX(0);}}
.ac-flip-left{animation:flipLeft .18s cubic-bezier(.4,0,.2,1) both;}
.ac-flip-right{animation:flipRight .18s cubic-bezier(.4,0,.2,1) both;}
@keyframes flipLeft{0%{opacity:1;transform:translateX(0);}100%{opacity:0;transform:translateX(-12px);}}
@keyframes flipRight{0%{opacity:1;transform:translateX(0);}100%{opacity:0;transform:translateX(12px);}}

/* === 快速翻页：页码按钮 === */
.ac-page-numbers{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;padding:6px 4px 2px;}
.ac-page-num{
  min-width:32px;height:32px;padding:0 8px;border-radius:7px;
  border:1.5px solid var(--border);background:var(--bg-card);color:var(--text2);
  cursor:pointer;font-family:var(--font-mono);font-size:.78rem;font-weight:600;
  transition:all .2s;line-height:1;
}
.ac-page-num:hover{background:var(--primary-soft);border-color:var(--primary-light);color:var(--primary);transform:translateY(-1px);}
.ac-page-num.active{background:var(--grad-primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 8px rgba(20,132,83,.3);font-weight:800;}
.ac-page-ellipsis{color:var(--text3);font-size:.78rem;padding:0 2px;user-select:none;}

/* 答题卡格子优化（已答对的显示绿色） */
.ac-cell.answered-right{background:rgba(34,197,94,.15);color:var(--success);border-color:rgba(34,197,94,.4);}
.ac-cell.answered-wrong{background:rgba(230,74,25,.15);color:var(--danger);border-color:rgba(230,74,25,.4);}

@media (max-width:480px){
  .ac-page-btn{width:26px;height:26px;font-size:1rem;}
  .ac-page-type{font-size:.82rem;}
  .ac-page-meta{font-size:.65rem;gap:3px;}
  .ac-page-jump{width:38px;height:20px;font-size:.72rem;}
  .ac-type-tab{padding:6px 6px;font-size:.68rem;gap:3px;}
  .ac-type-tab-num{width:16px;height:16px;font-size:.62rem;}
  .ac-type-tab-label{font-size:.68rem;}
  .ac-type-tab-meta{font-size:.6rem;}
  .ac-page-num{min-width:28px;height:28px;font-size:.72rem;padding:0 6px;}
  .ac-end-btn{padding:5px 9px;font-size:.72rem;}
  .ac-end-icon{font-size:.9rem;}
  .ac-hint{display:none;}
  .ac-current-badge{font-size:.72rem;padding:3px 8px;}
  .ac-current-badge strong{font-size:.85rem;}
}
/* 答题卡浮动抽屉触发按钮样式（已移除，保留样式以防历史引用） */


/* 题目页 ⭐ 一键收藏 */
.quick-fav-btn{background:transparent;border:none;font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;margin-left:8px;vertical-align:middle;line-height:1;}
.quick-fav-btn:hover{background:rgba(245,184,0,.1);transform:scale(1.15);}
.quick-fav-btn.faved{color:var(--gold);animation:none;}
.quick-fav-btn.faved:hover{background:rgba(245,184,0,.18);}
.quick-fav-btn.pop-anim{animation:favPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes favPop{0%{transform:scale(1);}40%{transform:scale(1.5) rotate(15deg);}70%{transform:scale(.9) rotate(-5deg);}100%{transform:scale(1) rotate(0);}}

.me-tab-bar{display:flex;gap:8px;margin-bottom:20px;background:var(--bg-card);padding:6px;border-radius:14px;border:1px solid var(--border);width:fit-content;box-shadow:var(--shadow-sm);}
.me-tab{padding:10px 18px;border-radius:10px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--text2);transition:all .2s;display:flex;align-items:center;gap:6px;font-family:var(--font-sans);position:relative;}
.me-tab:hover{color:var(--primary);background:var(--primary-mist);}
.me-tab.active{background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px rgba(20,132,83,.25);}
.me-tab.active::after{content:'';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:24px;height:3px;background:var(--grad-primary);border-radius:2px;display:none;}

/* 顶部固定操作栏（粘性 + 醒目"开始考试"按钮） */
.me-top-action-bar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#fff 0%,#F0FDF4 100%);border:1px solid var(--primary-light);border-radius:14px;padding:12px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(20,132,83,.12),inset 0 1px 0 rgba(255,255,255,.8);}
.me-tab-meta{flex:1;min-width:160px;}
.me-tab-meta-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3;}
.me-tab-meta-info{font-size:.78rem;color:var(--text2);font-family:var(--font-sans);}
.me-tab-meta-info strong{color:var(--primary);font-weight:800;}
.me-tab-actions{display:flex;gap:6px;align-items:center;}
.me-btn-icon{padding:8px 10px;font-size:1rem;min-width:36px;}
.me-btn-start{font-size:.96rem;padding:10px 22px;font-weight:700;background:linear-gradient(135deg,#148453 0%,#0d6d40 100%)!important;box-shadow:0 4px 12px rgba(20,132,83,.35);transition:all .2s;}
.me-btn-start:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,132,83,.5);}

@media (max-width:768px){
  .me-top-action-bar{padding:10px 12px;gap:8px;}
  .me-tab-meta{flex:1 1 100%;order:2;margin-top:4px;}
  .me-tab-actions{flex:1;justify-content:space-between;order:1;}
  .me-btn-start{flex:1;font-size:.86rem;padding:8px 12px;}
  .me-btn-icon{padding:6px 8px;}
}

.me-config-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:all .2s;}
.me-config-card:hover{box-shadow:var(--shadow);}
.me-config-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
.me-config-title-icon{width:32px;height:32px;border-radius:8px;background:var(--grad-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:0 2px 6px rgba(20,132,83,.2);}

.me-form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px;}
.me-form-item label{display:block;font-size:.78rem;color:var(--text2);font-weight:600;margin-bottom:4px;}
.me-form-item input,.me-form-item select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:.88rem;font-family:var(--font-sans);min-height:38px;}
.me-form-item input:focus,.me-form-item select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}

.me-chapter-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:6px;scrollbar-width:thin;}
.me-chapter-list::-webkit-scrollbar{width:6px;}
.me-chapter-list::-webkit-scrollbar-track{background:transparent;}
.me-chapter-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.me-chapter-list::-webkit-scrollbar-thumb:hover{background:var(--primary-light);}
.me-chapter-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:.86rem;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.me-chapter-item:hover{background:var(--primary-soft);border-color:var(--primary-light);}
.me-chapter-item label{flex:1;cursor:pointer;}
.me-chapter-item input[type=number]{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;text-align:center;background:var(--bg-card);font-family:var(--font-sans);font-weight:600;color:var(--text);}
.me-chapter-item input[type=number]:disabled{opacity:.4;cursor:not-allowed;}

/* ===== 答题模式选择中心 ===== */
.qh-modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:18px;}
.qh-mode{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;}
.qh-mode::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-primary);opacity:0;transition:opacity .25s;}
.qh-mode:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px);}
.qh-mode:hover::before{opacity:1;}
.qh-mode.qh-mode-warn::before{background:linear-gradient(135deg,#F08A00,#E64A19);}
.qhm-icon{font-size:2.2rem;line-height:1;margin-bottom:4px;display:inline-block;transition:transform .25s;}
.qh-mode:hover .qhm-icon{transform:scale(1.1) rotate(-3deg);}
.qhm-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.qhm-desc{font-size:.82rem;color:var(--text2);line-height:1.5;flex:1;}
.qhm-meta{display:inline-block;margin-top:6px;padding:4px 10px;background:var(--primary-soft);color:var(--primary);border-radius:6px;font-size:.74rem;font-weight:600;font-family:var(--font-sans);width:fit-content;}
.qhm-disabled{position:absolute;top:14px;right:14px;padding:3px 8px;background:var(--fog);color:var(--text3);border-radius:5px;font-size:.7rem;font-weight:600;font-family:var(--font-sans);}

/* 智能推荐 */
.qh-recommend{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.qh-recommend:empty{display:none;}
.qh-rec-title{font-family:var(--font-display);font-size:1.02rem;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.qh-rec-empty{text-align:center;padding:18px 12px;color:var(--text3);font-size:.86rem;background:var(--primary-mist);border-radius:10px;border:1px dashed var(--primary-light);}
.qh-rec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.qh-rec-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .2s;text-align:left;font-family:var(--font-sans);display:flex;flex-direction:column;gap:4px;color:inherit;}
.qh-rec-card:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.qhr-name{font-weight:700;font-size:.9rem;color:var(--text);font-family:var(--font-display);}
.qhr-meta{font-size:.76rem;color:var(--text3);}
.qhr-go{font-size:.76rem;color:var(--primary);font-weight:600;margin-top:4px;}

.me-strategy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
.me-strategy-card{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);transition:all .2s;}
.me-strategy-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-sm);}
.me-strategy-card-head{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.me-strategy-card-body{font-size:.78rem;color:var(--text2);line-height:1.6;}
.me-strategy-card-body input[type=number]{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;text-align:center;background:var(--bg-card);font-family:var(--font-sans);font-weight:600;color:var(--text);}
.me-strategy-card-body input[type=number]:disabled{opacity:.4;cursor:not-allowed;}
.me-switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.me-switch input{opacity:0;width:0;height:0;}
.me-switch-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:11px;transition:.2s;}
.me-switch-slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.me-switch input:checked + .me-switch-slider{background:var(--primary);}
.me-switch input:checked + .me-switch-slider:before{transform:translateX(18px);}

.me-summary-bar{background:linear-gradient(135deg,var(--primary-mist) 0%,var(--primary-soft) 100%);border:1px solid var(--primary-light);border-radius:12px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden;}
.me-summary-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-livery);}
.me-summary-item{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--text);font-weight:500;}
.me-summary-item strong{color:var(--primary);font-size:1.1rem;font-weight:800;font-family:var(--font-display);}

.me-preview-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;font-size:.85rem;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.me-preview-table th,.me-preview-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);}
.me-preview-table th{background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:.82rem;}
.me-preview-table tbody tr:last-child td{border-bottom:none;}
.me-preview-table tbody tr:hover{background:var(--primary-mist);}

.me-action-bar{position:sticky;bottom:0;background:var(--bg-card);border-top:1px solid var(--border);padding:14px 18px;border-radius:0 0 14px 14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:16px -20px -18px;box-shadow:0 -4px 12px rgba(0,0,0,.04);}
.me-btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.88rem;font-weight:600;font-family:var(--font-sans);min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.me-btn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.me-btn-primary{background:var(--grad-primary);color:#fff;border-color:transparent;}
.me-btn-primary:hover{background:var(--primary-deep);color:#fff;}
.me-btn-warn{background:rgba(245,184,0,.1);color:#92400E;border-color:rgba(245,184,0,.3);}
.me-btn-warn:hover{background:rgba(245,184,0,.2);color:#92400E;}

/* 答题卡 */
.ac-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;position:relative;box-shadow:var(--shadow-sm);}
.ac-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--gold),var(--primary));border-radius:12px 12px 0 0;}
/* 标准答题卡格子布局：5列固定网格，更接近标准化考试答题卡 */
.ac-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
.ac-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);transition:all .15s;font-family:var(--font-sans);min-height:40px;position:relative;}
.ac-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--primary-light);z-index:1;}
.ac-cell.answered{background:var(--success);color:#fff;border-color:var(--success);}
.ac-cell.unanswered{background:var(--bg);color:var(--text3);border-style:dashed;}
.ac-cell.flagged{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft,rgba(245,184,0,.2));}
.ac-cell.flagged::after{content:'⚑';position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#fff;color:var(--gold);font-size:.55rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);}
.ac-cell.current{outline:2.5px solid var(--primary);outline-offset:1px;background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.1);box-shadow:0 0 0 4px rgba(20,132,83,.22),0 6px 14px rgba(20,132,83,.4);z-index:2;}
.ac-cell.type-divider{aspect-ratio:auto;background:transparent;border:none;color:var(--text2);font-weight:700;cursor:default;min-height:auto;padding:6px 4px;font-size:.78rem;display:flex;align-items:center;gap:4px;}
.ac-cell.type-divider:hover{transform:none;box-shadow:none;}
.ac-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--text3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.ac-legend-item{display:flex;align-items:center;gap:4px;}
.ac-legend-dot{width:12px;height:12px;border-radius:3px;}

/* 收藏卡片中"同时是错题"标记 */
.q-card.wr-card.is-wrong{border-left:3px solid var(--danger);background:linear-gradient(90deg,rgba(230,74,25,.04),transparent 50%);}

/* 知识点图谱 */
.kg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px;}
.kg-cell{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;}
.kg-cell::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--text3);transition:width .25s;}
.kg-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.kg-cell:hover::before{width:6px;}
.kg-cell.kg-strong{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(34,197,94,.02));border-color:rgba(34,197,94,.3);}
.kg-cell.kg-strong::before{background:var(--success);}
.kg-cell.kg-medium{background:linear-gradient(135deg,rgba(245,184,0,.1),rgba(245,184,0,.02));border-color:rgba(245,184,0,.3);}
.kg-cell.kg-medium::before{background:var(--gold);}
.kg-cell.kg-weak{background:linear-gradient(135deg,rgba(230,74,25,.1),rgba(230,74,25,.02));border-color:rgba(230,74,25,.3);}
.kg-cell.kg-weak::before{background:var(--danger);}
.kg-cell.kg-unknown{background:var(--bg);border-style:dashed;}
.kg-cell.kg-unknown::before{background:var(--text3);}
.kg-name{font-size:.86rem;font-weight:700;color:var(--text);font-family:var(--font-display);margin-bottom:4px;line-height:1.3;}
.kg-pct{font-size:1.4rem;font-weight:800;font-family:var(--font-display);color:var(--text);margin-bottom:4px;}
.kg-cell.kg-strong .kg-pct{color:var(--success);}
.kg-cell.kg-medium .kg-pct{color:#92400E;}
.kg-cell.kg-weak .kg-pct{color:var(--danger);}
.kg-meta{font-size:.7rem;color:var(--text3);margin-bottom:6px;}
.kg-bar{height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden;}
.kg-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.kg-cell.kg-strong .kg-bar-fill{background:var(--success);}
.kg-cell.kg-medium .kg-bar-fill{background:var(--gold);}
.kg-cell.kg-weak .kg-bar-fill{background:var(--danger);}
.kg-recommend-btn{display:inline-block;margin:2px 6px 2px 0;padding:5px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.78rem;color:var(--text);font-family:var(--font-sans);transition:all .15s;}
.kg-recommend-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-1px);}

@media (max-width:600px){
  .kg-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .kg-pct{font-size:1.15rem;}
  .kg-name{font-size:.78rem;}
}

/* 答题卡顶部 - 当前题号徽章 */
.ac-current-badge{font-size:.78rem;color:var(--text2);background:var(--primary-soft);padding:4px 10px;border-radius:8px;font-weight:500;font-family:var(--font-sans);}
.ac-current-badge strong{color:var(--primary);font-weight:800;font-size:.95rem;}
/* 移动端适配 */
@media (max-width:640px){
  .ac-end-btn{padding:5px 9px;font-size:.72rem;}
  .ac-end-icon{font-size:.9rem;}
  .ac-hint{display:none;}
  .ac-current-badge{font-size:.72rem;padding:3px 8px;}
  .ac-current-badge strong{font-size:.85rem;}
}

/* 进度环 */
.ac-progress-ring{position:relative;width:48px;height:48px;margin:6px 0 12px;}
.ac-progress-svg{width:100%;height:100%;transform:rotate(-90deg);}
.ac-progress-bg{fill:none;stroke:var(--fog);stroke-width:3.5;}
.ac-progress-fg{fill:none;stroke:url(#acGradient);stroke:url(#acGradient);stroke:var(--primary);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1);}
.ac-progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--primary);font-family:var(--font-display);}

/* 答题卡三宫格统计（已答/未答/标记） */
.ac-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.ac-stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;transition:all .2s;cursor:default;}
.ac-stat:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.05);}
.ac-stat b{display:block;font-family:var(--font-display);font-size:1.15rem;font-weight:800;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.ac-stat span{display:block;font-size:.66rem;color:var(--text3);margin-top:2px;font-weight:500;}
.ac-stat[data-type="answered"] b{color:var(--success);}
.ac-stat[data-type="unanswered"] b{color:var(--warning);}
.ac-stat[data-type="flagged"] b{color:var(--gold);}

/* 答题卡快捷跳转按钮组 */
.ac-jump-bar{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px;}
.ac-jump-btn{padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text2);font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font-sans);min-height:32px;}
.ac-jump-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-light);transform:translateY(-1px);}
.ac-jump-btn:active{transform:scale(.97);}

/* 答题卡按题型分组 */
.ac-type-section{margin-bottom:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ac-type-section:last-child{margin-bottom:0;}
.ac-type-section-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--grad-mist);border-bottom:1px solid var(--border);font-size:.82rem;}
.ac-type-label{font-weight:700;color:var(--text);font-family:var(--font-display);background:var(--bg-card);padding:2px 8px;border-radius:5px;border:1px solid var(--border);}
.ac-type-range{color:var(--text2);font-size:.76rem;flex:1;}
.ac-type-progress{background:var(--bg-card);color:var(--text2);font-weight:600;font-size:.74rem;padding:2px 8px;border-radius:5px;border:1px solid var(--border);}
.ac-type-progress.all-done{background:var(--success);color:#fff;border-color:var(--success);}
.ac-grid-type{padding:10px;margin:0;}

/* ===== 考试顶部倒计时条（粘性 + 醒目） ===== */
.exam-countdown-bar{position:sticky;top:60px;z-index:50;background:linear-gradient(135deg,#148453 0%,#0d6d40 100%);color:#fff;padding:12px 20px;border-radius:14px;margin-bottom:18px;box-shadow:0 8px 24px rgba(20,132,83,.25),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden;transition:background .4s;}
.exam-countdown-bar.ecb-warning{background:linear-gradient(135deg,#F08A00 0%,#E64A19 100%);box-shadow:0 8px 24px rgba(230,74,25,.35),inset 0 1px 0 rgba(255,255,255,.1);animation:ecbPulse 1.5s ease-in-out infinite;}
.exam-countdown-bar.ecb-danger{background:linear-gradient(135deg,#DC2626 0%,#991B1B 100%);box-shadow:0 8px 24px rgba(220,38,38,.4);animation:ecbShake .5s ease-in-out infinite;}
@keyframes ecbPulse{0%,100%{box-shadow:0 8px 24px rgba(230,74,25,.35);}50%{box-shadow:0 8px 32px rgba(230,74,25,.6);}}
@keyframes ecbShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}
.ecb-inner{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.ecb-icon{font-size:1.4rem;line-height:1;}
.ecb-label{font-size:.86rem;opacity:.92;font-weight:500;}
.ecb-time{font-family:var(--font-mono);font-size:1.6rem;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.2);min-width:80px;text-align:center;transition:color .3s;}
.ecb-progress{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;min-width:80px;max-width:300px;}
.ecb-progress-fill{height:100%;background:#fff;border-radius:3px;transition:width 1s linear;box-shadow:0 0 8px rgba(255,255,255,.4);}
.ecb-info{font-size:.78rem;opacity:.9;margin-left:auto;}
.ecb-info strong{color:#fff;font-weight:700;}

@media (max-width:768px){
  .exam-countdown-bar{padding:10px 14px;top:56px;}
  .ecb-time{font-size:1.3rem;min-width:64px;}
  .ecb-info{display:none;}
  .ecb-progress{max-width:120px;}
}

/* 提交进度遮罩 */
.me-submit-loading{position:fixed;inset:0;background:rgba(15,42,31,.55);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease-out;}
.me-submit-card{background:var(--bg-card);padding:28px 36px;border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.25);text-align:center;min-width:240px;animation:scaleIn .25s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--border);}
.me-submit-spinner{width:42px;height:42px;border:4px solid var(--fog);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:meSpin .8s linear infinite;}
.me-submit-text{font-size:1.05rem;font-weight:700;color:var(--text);font-family:var(--font-display);margin-bottom:4px;}
.me-submit-hint{font-size:.78rem;color:var(--text3);}
@keyframes meSpin{to{transform:rotate(360deg);}}
@keyframes scaleIn{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* 模拟考试实时得分 */
.me-live-score{padding:8px 0;}
.me-live-score-box{text-align:center;padding:24px 20px;background:var(--grad-window);border-radius:14px;margin-bottom:14px;border:1px solid var(--border);}
.me-live-score-num{font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:var(--primary);line-height:1;letter-spacing:-1px;}
.me-live-score-total{font-size:1rem;color:var(--text3);font-weight:500;}
.me-live-score-meta{margin-top:8px;font-size:.9rem;color:var(--text2);}
.me-live-score-meta strong{color:var(--text);font-weight:700;}
.me-live-progress{margin-top:14px;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.me-live-progress-fill{height:100%;background:var(--grad-primary);border-radius:4px;transition:width .4s ease-out;}
.me-live-progress-label{margin-top:6px;font-size:.76rem;color:var(--text3);font-weight:500;}
.me-live-hint{font-size:.86rem;color:var(--text2);padding:10px 12px;background:var(--primary-mist);border-radius:8px;border-left:3px solid var(--primary);}

/* 分组题型（试卷布局） */
.qe-section{margin-bottom:18px;}
.qe-section-head{background:var(--primary-soft);color:var(--primary);padding:8px 14px;border-radius:8px;font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-left:4px solid var(--primary);}
.qe-section-head .qe-section-count{font-size:.78rem;color:var(--text2);font-weight:400;}

/* 历史试卷卡片 */
.me-record-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;transition:all .2s;}
.me-record-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px);}
.me-record-score{font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--primary);min-width:80px;text-align:center;line-height:1;}
.me-record-score::after{content:'';display:block;width:36px;height:3px;background:var(--grad-livery);border-radius:2px;margin:6px auto 0;}
.me-record-info{flex:1;min-width:160px;}
.me-record-name{font-weight:700;color:var(--text);font-size:.95rem;margin-bottom:4px;font-family:var(--font-display);}
.me-record-meta{font-size:.78rem;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.me-record-meta span{display:inline-flex;align-items:center;gap:3px;}
.me-record-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* 模板卡片 */
.me-template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px;}
.me-template-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--bg);transition:all .2s;position:relative;overflow:hidden;}
.me-template-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.me-template-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-primary);opacity:0;transition:opacity .2s;}
.me-template-card:hover::before{opacity:1;}
.me-template-name{font-weight:700;margin-bottom:8px;font-family:var(--font-display);font-size:.95rem;color:var(--text);display:flex;align-items:center;gap:4px;}
.me-template-info{font-size:.78rem;color:var(--text3);margin-bottom:10px;display:flex;flex-direction:column;gap:3px;}
.me-template-info span{display:flex;align-items:center;gap:4px;}
.me-template-actions{display:flex;gap:6px;flex-wrap:wrap;}

@media (max-width:640px){
  .me-tab{padding:8px 12px;font-size:.82rem;}
  .ac-grid{grid-template-columns:repeat(auto-fill,minmax(36px,1fr));}
  .ac-cell{font-size:.78rem;min-height:36px;}
  .me-summary-bar{flex-direction:column;align-items:flex-start;gap:8px;}
  .me-action-bar{flex-direction:column;align-items:stretch;}
  .me-btn{justify-content:center;}
  .me-record-card{padding:12px 14px;}
  .me-record-score{font-size:1.3rem;min-width:60px;}
  .me-config-card{padding:14px 16px;}
  .me-form-row{grid-template-columns:1fr;}
  .quick-entry-card{padding:14px 16px;gap:12px;}
  .qec-icon{width:40px;height:40px;font-size:1.3rem;}
}

/* 通用快速入口卡片 */
.quick-entry-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:18px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all .25s;}
.quick-entry-card:hover{box-shadow:var(--shadow);border-color:var(--primary-light);transform:translateY(-1px);}
.quick-entry-card .qec-icon{width:48px;height:48px;border-radius:12px;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(20,132,83,.3);flex-shrink:0;}
.quick-entry-card .qec-body{flex:1;min-width:0;}
.quick-entry-card .qec-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.quick-entry-card .qec-desc{font-size:.82rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quick-entry-card .qec-arrow{font-size:1.4rem;color:var(--text3);font-weight:700;transition:transform .2s;}
.quick-entry-card:hover .qec-arrow{transform:translateX(4px);color:var(--primary);}
/* 模拟考试专属强调样式 */
.me-home-card{background:linear-gradient(135deg,rgba(20,132,83,.08),rgba(34,197,94,.04));border-color:var(--primary-light);position:relative;overflow:hidden;}
.me-home-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-livery);}

</style>
</head>

<div class="livery-stripe"></div>

<!-- SIDEBAR OVERLAY -->

<!-- SIDEBAR -->

/* ===== 存储使用量估算 ===== */
function getStorageUsage(){
  try{
    let total = 0;
    for(let key in localStorage){
      if(localStorage.hasOwnProperty(key)){
        total += localStorage.getItem(key).length * 2; // UTF-16编码，每字符2字节
      }
    }
    return total / (1024*1024); // 返回MB
  }catch(e){return 0;}
}

/* ===== THEME ===== */
function applyTheme(t){
  APP.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeBtn');
  if(t==='dark') btn.textContent='🌙';
  else if(t==='light') btn.textContent='☀️';
  else btn.textContent='🔄';
  STORAGE.save();
}
function cycleTheme(){
  const themes=['light','dark','auto'];
  const i = themes.indexOf(APP.theme);
  const next = themes[(i+1)%themes.length];
  applyTheme(next);
  if(next==='auto'){
    const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark?'dark':'light');
  }
  toast('主题已切换','info');
}

function getSegmentLevel(points){
  if(points >= 5000) return {name:'钻石乘务长',color:'var(--rarity-diamond)',tier:6};
  if(points >= 2500) return {name:'白金乘务长',color:'var(--rarity-platinum)',tier:5};
  if(points >= 1000) return {name:'金牌乘务长',color:'var(--rarity-gold)',tier:4};
  if(points >= 500) return {name:'银牌乘务长',color:'var(--rarity-silver)',tier:3};
  if(points >= 200) return {name:'铜牌乘务长',color:'var(--rarity-bronze)',tier:2};
  if(points >= 50) return {name:'资深乘务',color:'var(--primary)',tier:1};
  return {name:'实习乘务',color:'var(--text2)',tier:0};
}
function getNextLevelProgress(points){
  const tiers = [0, 50, 200, 500, 1000, 2500, 5000];
  for(let i=0;i<tiers.length-1;i++){
    if(points < tiers[i+1]){
      return {current:points-tiers[i], target:tiers[i+1]-tiers[i], pct:(points-tiers[i])/(tiers[i+1]-tiers[i])*100};
    }
  }
  return {current:5000, target:5000, pct:100};
}

/* ===== 成就进度计算 ===== */
function getBadgeProgress(badge){
  const ta = APP.totalAnswered;
  const tc = APP.totalCorrect;
  const acc = ta ? Math.round(tc/ta*100) : 0;
  const t = badge.type;
  if(!t) return 0;
  if(t==='total') return Math.min(ta/badge.target*100, 100);
  if(t==='correct_total') return Math.min(tc/badge.target*100, 100);
  if(t==='sessions') return APP.history.length >= badge.target ? 100 : Math.min(APP.history.length/badge.target*100, 100);
  if(t==='streak') return Math.min((getMaxStreak()||0)/badge.target*100, 100);
  if(t==='active') return Math.min((getActiveDays()||0)/badge.target*100, 100);
  if(t==='hard') return Math.min((getHardCount()||0)/badge.target*100, 100);
  if(t==='chapters') return Math.min((getChaptersPracticed()||0)/badge.target*100, 100);
  if(t==='fav') return Math.min((APP.favorites.length||0)/badge.target*100, 100);
  if(t==='exam') return Math.min((APP.history.filter(h=>h.mode==='exam').length||0)/badge.target*100, 100);
  if(t==='unlocked') return Math.min(BADGES.filter(x=>x.unlocked).length/badge.target*100, 100);
  if(t==='mastered') return Math.min(((APP.mastered||[]).length||0)/badge.target*100, 100);
  if(t==='security_correct') return Math.min(getCorrectByText(['安保','安检','违禁','押解','爆炸物','锂电池','酒精','清舱','搜查','危险品','管制刀具'])/badge.target*100, 100);
  if(t==='daily_sessions'){
    // 当天训练次数：取 APP.history 中 date 为今天且有实际作答的记录
    const todayKey = new Date().toLocaleDateString('zh-CN');
    const today = APP.history.filter(h => h.date && h.date.startsWith(todayKey) && h.total > 0).length;
    return Math.min(today/badge.target*100, 100);
  }
  return 0;
}
function getMaxStreak(){
  if(APP.history.length<2) return APP.history.length;
  const dates = [...new Set(APP.history.map(h=>h.date.split(' ')[0]))].sort();
  let max=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const d1=new Date(dates[i-1]), d2=new Date(dates[i]);
    if((d2-d1)/(86400000)===1){cur++;max=Math.max(max,cur);} else cur=1;
  }
  return max;
}
function getActiveDays(){
  return new Set(APP.history.map(h=>h.date.split(' ')[0])).size;
}
function getHardCount(){
  let c=0;
  APP.history.forEach(h=>{
    if(h.questions) h.questions.forEach(idx=>{
      if(APP.questions[idx] && APP.questions[idx].diff==='难') c++;
    });
  });
  return c;
}
function getChaptersPracticed(){
  const set = new Set();
  APP.history.forEach(h=>{
    if(h.questions) h.questions.forEach(idx=>{
      if(APP.questions[idx]) set.add(APP.questions[idx].chapter);
    });
  });
  return set.size;
}

/* ===== 按章节关键词统计累计答对的题数（用于 spring_* 成就） ===== */
function getCorrectByChapter(keywords){
  if(!APP.history || !APP.history.length) return 0;
  const kwArr = (keywords||[]).map(s=>String(s).toLowerCase());
  const seen = new Set(); // 避免同一题被多次统计
  APP.history.forEach(h=>{
    if(!h.questions || !h.answers) return;
    h.questions.forEach((idx, i)=>{
      if(seen.has(idx)) return;
      const ans = h.answers[i];
      if(ans === undefined || ans === null) return;
      const q = APP.questions[idx];
      if(!q) return;
      const ch = String(q.chapter||'').toLowerCase();
      const tx = String(q.q||'').toLowerCase();
      const matched = kwArr.some(k => ch.includes(k) || tx.includes(k));
      if(matched && checkAnswer(q, ans)) seen.add(idx);
    });
  });
  return seen.size;
}

/* ===== 按题干关键词统计累计答对的题数 ===== */
function getCorrectByText(keywords){
  if(!APP.history || !APP.history.length) return 0;
  const kwArr = (keywords||[]).map(s=>String(s).toLowerCase());
  const seen = new Set();
  APP.history.forEach(h=>{
    if(!h.questions || !h.answers) return;
    h.questions.forEach((idx, i)=>{
      if(seen.has(idx)) return;
      const ans = h.answers[i];
      if(ans === undefined || ans === null) return;
      const q = APP.questions[idx];
      if(!q) return;
      const txt = (q.q||'') + ' ' + (q.explain||'') + ' ' + (q.opts||[]).join(' ');
      const low = txt.toLowerCase();
      const matched = kwArr.some(k => low.includes(k));
      if(matched && checkAnswer(q, ans)) seen.add(idx);
    });
  });
  return seen.size;
}

/* ===== 章节训练进度（用于 spring_chapter_* 成就） ===== */
function getChapterMasteredPct(chapter){
  if(!APP.questions.length) return 0;
  const qIdxs = APP.questions.map((q,i)=>q.chapter===chapter?i:-1).filter(i=>i>=0);
  if(!qIdxs.length) return 0;
  // 取最近一次该章节练习中的正确率
  let bestPct = 0;
  APP.history.slice().reverse().forEach(h=>{
    if(!h.questions || !h.answers) return;
    const hits = h.questions.filter(idx => APP.questions[idx] && APP.questions[idx].chapter === chapter);
    if(hits.length < 3) return;
    let done=0, right=0;
    h.questions.forEach((idx, i)=>{
      const q = APP.questions[idx];
      if(!q || q.chapter !== chapter) return;
      const a = h.answers[i];
      if(a === undefined || a === null) return;
      done++;
      if(checkAnswer(q, a)) right++;
    });
    if(done >= 3){
      const pct = Math.round(right/done*100);
      if(pct > bestPct) bestPct = pct;
    }
  });
  return bestPct;
}

/* ===== HTML 转义辅助 ===== */
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* ===== 快速开始训练（首页智能推荐） ===== */
function quickStart(mode){
  if(!APP.questions.length){toast('题库为空，请先上传','warning');go('bank');return;}
  if(mode === 'quick20'){
    // 20 题随机（覆盖三种题型）
    const total = Math.min(20, APP.questions.length);
    const idxs = shuffle(APP.questions.map((_,i)=>i)).slice(0,total);
    startQuiz(idxs);
  } else if(mode === 'wrong'){
    if(!APP.wrong.length){toast('暂无错题','info');return;}
    startQuiz(APP.wrong.slice());
  } else if(mode === 'weakest'){
    // 找最薄弱章节
    const chapters = getChapters();
    let weakest = null, weakestAcc = 100;
    chapters.forEach(c => {
      const qIdxs = APP.questions.map((q,i)=>q.chapter===c?i:-1).filter(i=>i>=0);
      let done=0, right=0;
      APP.history.forEach(h => {
        (h.answers||[]).forEach((a, idx) => {
          if(idx<APP.questions.length && APP.questions[idx].chapter===c){
            done++;
            if(checkAnswer(APP.questions[idx], a)) right++;
          }
        });
      });
      const acc = done?right/done:1;
      if(done>=3 && acc<weakestAcc){weakestAcc=acc;weakest=c;}
    });
    if(weakest) startChapterQuiz(weakest);
    else {toast('暂无薄弱章节（需至少练习 3 题）','info');go('chapter');}
  } else if(mode === 'default' || mode === 'quick'){
    // 默认快速训练：未答优先
    const answeredIdx = new Set();
    APP.history.forEach(h => (h.questions||[]).forEach(idx => answeredIdx.add(idx)));
    const unanswered = APP.questions.map((_,i)=>i).filter(i => !answeredIdx.has(i));
    let pool = unanswered.length >= 20 ? unanswered : APP.questions.map((_,i)=>i);
    const idxs = shuffle(pool).slice(0, Math.min(20, pool.length));
    startQuiz(idxs);
  } else {
    // 传入章节名
    startChapterQuiz(mode);
  }
}
