<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#148453">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="春秋刷题">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="春秋刷题">
<meta name="description" content="春秋航空乘务员刷题系统，完全离线可用">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>春秋航空 · 广州刷题系统 · 全能助手</title>
<style>
/* ============================================
   设计系统：3 套主题方案
   [data-style="classic"] 经典航空（默认）
   [data-style="minimal"] 现代极简
   [data-style="premium"] 商务高端
   ============================================ */
:root{
  /* 字体系统 */
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",-apple-system,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",Menlo,monospace;
  /* 尺寸 */
  --sidebar-w:248px;--topbar-h:60px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  /* 标签倾斜 */
  --tilt-counter:-8deg;
}

/* ========== 方案 A：经典航空（升级版） ========== */
[data-style="classic"]{
  --primary:#148453;--primary-dark:#0C5F3A;--primary-light:#67AC91;
  --primary-soft:#E8F3EE;--primary-mist:#F4F9F6;
  --gold:#F5B800;--gold-dark:#C99300;--gold-soft:#FEF6DC;
  --white:#FFFFFF;--mist:#F7FAF8;--cloud:#EEF3F0;--fog:#E5EDE9;
  --steel:#B5C2BC;--graphite:#5A6F65;--ink:#0F2A1F;
  --success:#148453;--success-soft:#E8F3EE;
  --danger:#E64A19;--danger-soft:#FEE7DE;
  --warning:#F5B800;--warning-soft:#FEF6DC;
  --info:#2D8FB5;--info-soft:#E0F0F6;
  --grad-primary:linear-gradient(135deg,#148453 0%,#1FA56A 100%);
  --grad-livery:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);
  --grad-window:linear-gradient(135deg,#E8F3EE 0%,#FEF6DC 100%);
  --grad-hero:linear-gradient(135deg,#0C5F3A 0%,#148453 50%,#1FA56A 100%);
  --bg:#F5F8F6;--bg-card:#fff;--bg-sidebar:#fff;
  --text:#0F2A1F;--text2:#5A6F65;--text3:#B5C2BC;
  --border:#E5EDE9;
  --shadow-sm:0 1px 2px rgba(20,132,83,.06);
  --shadow:0 4px 14px rgba(20,132,83,.10);
  --shadow-lg:0 12px 32px rgba(20,132,83,.14);
  --shadow-glow:0 0 0 4px rgba(20,132,83,.12);
  /* 稀有度色 */
  --rarity-bronze:#CD7F32;--rarity-silver:#9CA3AF;--rarity-gold:#F5B800;--rarity-platinum:#7DD3FC;--rarity-diamond:#C084FC;
}

/* ========== 方案 B：现代极简 ========== */
[data-style="minimal"]{
  --primary:#0F766E;--primary-dark:#134E4A;--primary-light:#5EEAD4;
  --primary-soft:#F0FDFA;--primary-mist:#F7FEFD;
  --gold:#D97706;--gold-dark:#92400E;--gold-soft:#FEF3C7;
  --white:#FFFFFF;--mist:#FAFAFA;--cloud:#F4F4F5;--fog:#E4E4E7;
  --steel:#A1A1AA;--graphite:#52525B;--ink:#18181B;
  --success:#059669;--success-soft:#D1FAE5;
  --danger:#DC2626;--danger-soft:#FEE2E2;
  --warning:#D97706;--warning-soft:#FEF3C7;
  --info:#0284C7;--info-soft:#E0F2FE;
  --grad-primary:linear-gradient(135deg,#0F766E 0%,#14B8A6 100%);
  --grad-livery:linear-gradient(90deg,#0F766E 0%,#14B8A6 50%,#5EEAD4 100%);
  --grad-window:linear-gradient(135deg,#F0FDFA 0%,#FEF3C7 100%);
  --grad-hero:linear-gradient(135deg,#134E4A 0%,#0F766E 100%);
  --bg:#FAFAFA;--bg-card:#FFFFFF;--bg-sidebar:#FFFFFF;
  --text:#18181B;--text2:#52525B;--text3:#A1A1AA;
  --border:#E4E4E7;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --shadow-glow:0 0 0 4px rgba(15,118,110,.10);
  --rarity-bronze:#A8A29E;--rarity-silver:#94A3B8;--rarity-gold:#D97706;--rarity-platinum:#0EA5E9;--rarity-diamond:#7C3AED;
}

/* ========== 方案 C：商务高端 ========== */
[data-style="premium"]{
  --primary:#C9A24B;--primary-dark:#8C6D2E;--primary-light:#E8C97A;
  --primary-soft:rgba(201,162,75,.12);--primary-mist:rgba(201,162,75,.06);
  --gold:#E8C97A;--gold-dark:#A8842A;--gold-soft:rgba(232,201,122,.14);
  --white:#FFFFFF;--mist:#0A1020;--cloud:#101830;--fog:#1A2440;
  --steel:#5A6480;--graphite:#8A93B0;--ink:#F5F1E8;
  --success:#10B981;--success-soft:rgba(16,185,129,.15);
  --danger:#EF4444;--danger-soft:rgba(239,68,68,.15);
  --warning:#F59E0B;--warning-soft:rgba(245,158,11,.15);
  --info:#3B82F6;--info-soft:rgba(59,130,246,.15);
  --grad-primary:linear-gradient(135deg,#C9A24B 0%,#E8C97A 50%,#C9A24B 100%);
  --grad-livery:linear-gradient(90deg,#C9A24B 0%,#E8C97A 35%,#FFFFFF 50%,#E8C97A 65%,#C9A24B 100%);
  --grad-window:linear-gradient(135deg,rgba(201,162,75,.1) 0%,rgba(232,201,122,.05) 100%);
  --grad-hero:linear-gradient(135deg,#0A1020 0%,#1A2440 60%,#2A3450 100%);
  --bg:#070B16;--bg-card:rgba(20,28,48,.78);--bg-sidebar:rgba(10,16,32,.85);
  --text:#F5F1E8;--text2:#B0B8CC;--text3:#6A7494;
  --border:rgba(201,162,75,.18);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --shadow-glow:0 0 24px rgba(201,162,75,.25);
  --rarity-bronze:#B08D57;--rarity-silver:#C0C5CE;--rarity-gold:#E8C97A;--rarity-platinum:#9BC4E2;--rarity-diamond:#B794F4;
}

/* ========== 主题（明/暗）+ 设计风格组合 ========== */
[data-style="classic"][data-theme="dark"]{
  --bg:#0F1A14;--bg-card:#162420;--bg-sidebar:#0F1A14;
  --text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;
  --border:#1E3A2C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --primary-soft:#1A3D2A;--primary-mist:#142E22;
  --gold-soft:#2A2410;--mist:#0F1A14;--cloud:#162420;--fog:#1E3A2C;
  --success-soft:#1A3D2A;--danger-soft:#2A1510;--warning-soft:#2A2410;--info-soft:#102830;
}
[data-style="minimal"][data-theme="dark"]{
  --bg:#09090B;--bg-card:#18181B;--bg-sidebar:#09090B;
  --text:#FAFAFA;--text2:#A1A1AA;--text3:#52525B;
  --border:#27272A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --primary-soft:#134E4A;--primary-mist:#0F2D2A;
  --gold-soft:#451A03;--mist:#09090B;--cloud:#18181B;--fog:#27272A;
  --success-soft:#064E3B;--danger-soft:#450A0A;--warning-soft:#451A03;--info-soft:#0C4A6E;
}
[data-style="premium"][data-theme="light"]{
  --bg:#F5F1E8;--bg-card:#FFFFFF;--bg-sidebar:#FFFFFF;
  --text:#0A1020;--text2:#4A5070;--text3:#8A93B0;
  --border:rgba(201,162,75,.30);
  --primary-soft:rgba(201,162,75,.10);--primary-mist:rgba(201,162,75,.05);
  --gold-soft:rgba(201,162,75,.12);
  --mist:#F5F1E8;--cloud:#EDE8DA;--fog:#E0D9C4;
  --success-soft:rgba(16,185,129,.12);--danger-soft:rgba(239,68,68,.12);--warning-soft:rgba(245,158,11,.12);--info-soft:rgba(59,130,246,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
a{color:var(--primary);text-decoration:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--steel);border-radius:3px;}

/* ===== LIVERY STRIPE ===== */
.livery-stripe{height:3px;background:var(--grad-livery);width:100%;flex-shrink:0;}

/* ===== TOPBAR ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;z-index:100;gap:16px;transition:background .3s;backdrop-filter:blur(20px);}
.topbar .logo-wrap{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0;padding:6px 10px;border-radius:10px;transition:background .2s;}
.topbar .logo-wrap:hover{background:var(--primary-mist);}
.topbar .logo-wrap svg{width:40px;height:40px;}
.topbar .brand-name{font-family:var(--font-display);font-weight:800;font-size:1.1rem;color:var(--primary);white-space:nowrap;letter-spacing:-.3px;}
.topbar .brand-sub{font-size:.7rem;color:var(--text2);font-weight:500;margin-left:4px;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary);}
.topbar .breadcrumb{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text2);margin-left:12px;flex:1;min-width:0;}
.topbar .breadcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .breadcrumb .sep{color:var(--steel);}
.topbar .breadcrumb .current{color:var(--primary);font-weight:700;}
.topbar .actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar .theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.topbar .theme-btn:hover{border-color:var(--primary);background:var(--primary-soft);transform:rotate(30deg) scale(1.1);}
.topbar .user-chip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:24px;background:var(--primary-soft);font-size:.82rem;color:var(--primary);font-weight:700;border:1px solid transparent;transition:all .2s;cursor:pointer;}
.topbar .user-chip:hover{border-color:var(--primary-light);transform:translateY(-1px);}
.topbar .user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem;font-weight:800;box-shadow:0 2px 6px rgba(20,132,83,.3);}
.topbar .net-status{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--text2);padding:5px 12px;border-radius:14px;background:var(--primary-soft);transition:all .3s;font-weight:500;}
.topbar .net-status.offline{background:var(--danger-soft);color:var(--danger);}
.topbar .net-status .net-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0;box-shadow:0 0 8px var(--success);}
.topbar .net-status.offline .net-dot{background:var(--danger);box-shadow:0 0 8px var(--danger);}
/* 离线就绪指示（Service Worker 注册成功后） */
.topbar .net-status[data-offline-ready="true"]::after{content:"📦";font-size:.7rem;margin-left:2px;opacity:.6;}
.topbar .net-status[data-offline-ready="true"][class*="offline"]{background:var(--warning-soft,rgba(245,184,0,.18));color:#92400E;}
.topbar .net-status[data-offline-ready="true"][class*="offline"]::before{content:"✓";color:var(--success);font-weight:800;margin-right:2px;}
.hamburger{display:none;width:38px;height:38px;border:none;background:none;cursor:pointer;font-size:1.4rem;color:var(--text);border-radius:10px;transition:background .2s;}
.hamburger:hover{background:var(--primary-mist);}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;top:var(--topbar-h);left:0;width:var(--sidebar-w);height:calc(100vh - var(--topbar-h));background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:90;transition:transform .3s,background .3s;backdrop-filter:blur(20px);}
.sidebar nav{flex:1;padding:14px 12px;overflow-y:auto;}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;font-size:.88rem;color:var(--text2);transition:all .2s cubic-bezier(.4,0,.2,1);border-left:3px solid transparent;position:relative;margin-bottom:2px;border-radius:0 10px 10px 0;}
.sidebar .nav-item:hover{background:var(--primary-mist);color:var(--primary);padding-left:20px;}
.sidebar .nav-item.active{background:var(--primary-soft);color:var(--primary);border-left-color:var(--primary);font-weight:700;box-shadow:inset 0 0 0 1px rgba(20,132,83,.08);}
.sidebar .nav-item .nav-icon{width:22px;text-align:center;font-size:1.05rem;flex-shrink:0;}
.sidebar .nav-item .nav-label{flex:1;white-space:nowrap;}
.sidebar .nav-item .nav-badge{background:var(--danger);color:#fff;font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:700;box-shadow:0 2px 6px rgba(230,74,25,.3);}
.sidebar .flight-card{margin:12px 16px;padding:16px;background:var(--grad-primary);border-radius:14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.sidebar .flight-card::before{content:'';position:absolute;top:0;right:0;width:120px;height:100%;background:radial-gradient(circle at 100% 50%,rgba(255,255,255,.15) 0%,transparent 70%);pointer-events:none;}
.sidebar .flight-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--grad-livery);}
.sidebar .flight-card .fc-route{font-size:.78rem;opacity:.9;margin-bottom:6px;letter-spacing:1px;font-weight:500;}
.sidebar .flight-card .fc-num{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:1.5px;}
.sidebar .flight-card .fc-status{font-size:.72rem;margin-top:8px;opacity:.85;display:flex;align-items:center;gap:6px;font-weight:500;}
.sidebar .flight-card .fc-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;animation:pulse 2s infinite;box-shadow:0 0 8px #4ADE80;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.85);}}

/* ===== MAIN ===== */
.main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);min-height:calc(100vh - var(--topbar-h));padding:24px;transition:margin .3s;}

/* ===== PAGE HERO ===== */
.page-hero{position:relative;padding:32px 36px;border-radius:18px;background:var(--grad-hero);color:#fff;margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-lg);}
.page-hero::before{content:'';position:absolute;top:0;right:0;width:280px;height:100%;background:radial-gradient(circle at 100% 50%,rgba(255,255,255,.12) 0%,transparent 60%);pointer-events:none;}
.page-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--grad-livery);}
.page-hero h1{font-family:var(--font-display);font-size:1.65rem;font-weight:800;margin-bottom:6px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;}
.page-hero p{font-size:.9rem;opacity:.88;font-weight:400;}
.page-hero .plane-anim{position:absolute;right:40px;top:50%;transform:translateY(-50%);font-size:3.5rem;opacity:.22;animation:flyPlane 4s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));}
@keyframes flyPlane{0%,100%{transform:translateY(-50%) translateX(0) rotate(-3deg);}50%{transform:translateY(-55%) translateX(-10px) rotate(0deg);}}

/* ===== METRIC CARDS ===== */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:24px;}
.metric-card{background:var(--bg-card);border-radius:16px;padding:22px;border:1px solid var(--border);transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;cursor:default;}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-primary);opacity:0;transition:opacity .3s;}
.metric-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-light);}
.metric-card:hover::before{opacity:1;}
.metric-card:hover .mc-icon{transform:rotate(-12deg) scale(1.15);}
.metric-card .mc-icon{font-size:2.2rem;margin-bottom:12px;transition:transform .4s cubic-bezier(.34,1.56,.64,1);display:inline-block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.08));}
.metric-card .mc-val{font-family:var(--font-display);font-size:1.85rem;font-weight:800;color:var(--primary);line-height:1.1;letter-spacing:-1px;}
.metric-card .mc-label{font-size:.78rem;color:var(--text2);margin-top:4px;font-weight:500;}
.metric-card .mc-bar{height:5px;border-radius:3px;background:var(--fog);margin-top:14px;overflow:hidden;position:relative;}
.metric-card .mc-bar-fill{height:100%;border-radius:3px;background:var(--grad-primary);transition:width .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(20,132,83,.3);}
.metric-card .mc-trend{position:absolute;top:18px;right:18px;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-weight:600;}

/* ===== UPLOAD ZONE ===== */
.upload-zone{border:2px dashed var(--steel);border-radius:14px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg-card);margin-bottom:24px;position:relative;}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-mist);}
.upload-zone .uz-icon{font-size:2.5rem;margin-bottom:10px;animation:floatIcon 3s ease-in-out infinite;display:inline-block;}
@keyframes floatIcon{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.upload-zone .uz-title{font-size:1rem;font-weight:600;margin-bottom:4px;}
.upload-zone .uz-sub{font-size:.82rem;color:var(--text2);}
.upload-zone .uz-offline{font-size:.82rem;color:var(--danger);margin-top:6px;display:none;}
.upload-zone.offline .uz-offline{display:block;}
.upload-zone input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;}
/* 拖拽时的视觉反馈 */
.upload-zone.dragging{border-color:var(--primary);background:var(--primary-mist);border-style:solid;transform:scale(1.01);box-shadow:0 8px 24px rgba(20,132,83,.18);}
.upload-zone.dragging .uz-icon{animation:dropBounce .8s ease-in-out infinite;}
.upload-zone.dragging::after{content:'松开鼠标即可导入';position:absolute;inset:auto 0 -8px 0;text-align:center;font-size:.82rem;color:var(--primary);font-weight:600;pointer-events:none;}
@keyframes dropBounce{0%,100%{transform:translateY(0) scale(1.1);}50%{transform:translateY(-10px) scale(1.15);}}

/* ===== CHART AREA ===== */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.chart-card{background:var(--bg-card);border-radius:12px;padding:20px;border:1px solid var(--border);}
.chart-card h3{font-size:.92rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.chart-card canvas{width:100%;height:180px;}

/* ===== ACHIEVEMENT PREVIEW ===== */
.badge-preview{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px;align-items:center;}
.badge-mini{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;position:relative;transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 8px rgba(0,0,0,.1);}
.badge-mini:hover{transform:scale(1.15) rotate(-5deg);box-shadow:0 6px 16px rgba(0,0,0,.15);}
.badge-mini.unlocked{background:var(--grad-primary);}
.badge-mini.locked{background:var(--fog);opacity:.5;filter:grayscale(.6);}
.badge-mini[data-rarity="common"]{background:linear-gradient(135deg,#CD7F32,#A0522D);}
.badge-mini[data-rarity="uncommon"]{background:linear-gradient(135deg,#9CA3AF,#6B7280);}
.badge-mini[data-rarity="rare"]{background:linear-gradient(135deg,#F5B800,#F08A00);}
.badge-mini[data-rarity="epic"]{background:linear-gradient(135deg,#7DD3FC,#0EA5E9);}
.badge-mini[data-rarity="legendary"]{background:linear-gradient(135deg,#C084FC,#7DD3FC,#F5B800);animation:legendaryShine 3s ease-in-out infinite;}

/* ===== FLIGHT TICKET (Bank) ===== */
.ticket-list{display:flex;flex-direction:column;gap:14px;}
.flight-ticket{background:var(--bg-card);border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;cursor:pointer;position:relative;}
.flight-ticket::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--grad-primary);transition:width .3s;}
.flight-ticket:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:var(--primary-light);}
.flight-ticket:hover::before{width:8px;}
.flight-ticket .ft-left{width:6px;background:var(--grad-primary);flex-shrink:0;}
.flight-ticket .ft-body{flex:1;padding:18px 22px;display:flex;align-items:center;gap:18px;}
.flight-ticket .ft-fnum{font-family:var(--font-display);font-size:.78rem;color:var(--primary);font-weight:800;letter-spacing:1.5px;white-space:nowrap;padding:4px 10px;background:var(--primary-soft);border-radius:6px;}
.flight-ticket .ft-q{flex:1;font-size:.95rem;line-height:1.55;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);font-weight:500;}
.flight-ticket .ft-tags{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:5px;font-size:.72rem;font-weight:700;transform:skew(var(--tilt-counter));white-space:nowrap;min-height:24px;min-width:44px;letter-spacing:.3px;}
.tag-type{background:var(--primary-soft);color:var(--primary);}
.tag-chapter{background:var(--gold-soft);color:var(--gold-dark);}
.tag-diff-easy{background:var(--success-soft);color:var(--success);}
.tag-diff-mid{background:var(--warning-soft);color:var(--warning);}
.tag-diff-hard{background:var(--danger-soft);color:var(--danger);}
.flight-ticket .ft-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;}
.flight-ticket .ft-actions button{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.flight-ticket .ft-actions button:hover{background:var(--primary-soft);border-color:var(--primary);transform:scale(1.1);}
.flight-ticket .ft-actions button.fav-active{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);}

/* ===== SEARCH BAR ===== */
.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-bar input,.search-bar select{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:.88rem;font-family:var(--font-sans);outline:none;transition:border .2s;min-height:44px;}
.search-bar input:focus,.search-bar select:focus{border-color:var(--primary);}
.search-bar input{flex:1;min-width:200px;}

/* ===== MODE SELECTOR ===== */
.mode-selector{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.mode-btn{padding:8px 18px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:.85rem;font-family:var(--font-sans);transition:all .15s;display:flex;align-items:center;gap:6px;min-height:44px;}
.mode-btn:hover{border-color:var(--primary);color:var(--primary);}
.mode-btn.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600;}

/* ===== QUIZ LAYOUT ===== */
.quiz-layout{display:grid;grid-template-columns:1fr 280px;gap:20px;}

/* ===== 答题页顶部统一控制条（所有模式） ===== */
.quiz-topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--bg-card) 0%,var(--primary-mist) 100%);
  border:1px solid var(--primary-light);border-radius:14px;
  padding:12px 18px;margin-bottom:18px;
  box-shadow:0 4px 16px rgba(20,132,83,.1),inset 0 1px 0 rgba(255,255,255,.6);
  position:sticky;top:calc(var(--topbar-h,60px) + 12px);z-index:20;
}
.qt-back{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-card);border:1px solid var(--border);
  padding:8px 14px;border-radius:10px;cursor:pointer;
  font-size:.85rem;font-weight:600;color:var(--text2);
  transition:all .2s;font-family:var(--font-sans);
}
.qt-back:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-mist);transform:translateX(-2px);box-shadow:var(--shadow-sm);}
.qt-back-icon{font-size:1rem;}
.qt-info{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;}
.qt-mode{padding:4px 12px;border-radius:8px;font-size:.75rem;font-weight:700;background:var(--primary-soft);color:var(--primary);letter-spacing:.5px;}
.qt-mode-study{background:#FEF3C7;color:#B45309;}
.qt-mode-exam,.qt-mode-mock_exam{background:#FEE2E2;color:#B91C1C;}
.qt-mode-wrong_redo{background:#FCE7F3;color:#9D174D;}
.qt-mode-favorite{background:#FEF3C7;color:#B45309;}
.qt-progress{font-size:.88rem;color:var(--text);font-weight:600;}
.qt-progress b{color:var(--primary);font-size:1rem;}
.qt-meta{font-size:.78rem;color:var(--text2);}
.qt-meta b{font-weight:700;}
.qt-actions{display:flex;align-items:center;gap:6px;}
.qt-icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card);cursor:pointer;font-size:1.05rem;
  display:inline-flex;align-items:center;justify-content:center;
  transition:all .2s;color:var(--text2);
}
.qt-icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-mist);transform:translateY(-1px);}
.qt-icon-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);}
@media(max-width:768px){
  .quiz-topbar{padding:10px 12px;gap:8px;}
  .qt-back-text{display:none;}
  .qt-back{padding:8px 10px;}
  .qt-info{gap:6px;}
  .qt-mode{font-size:.7rem;padding:3px 8px;}
  .qt-progress{font-size:.8rem;}
  .qt-meta{font-size:.72rem;}
  .qt-icon-btn{width:34px;height:34px;font-size:.95rem;}
}
.boarding-pass{background:var(--bg-card);border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);}
.boarding-pass::before{content:'';display:block;height:4px;background:var(--grad-livery);}
.bp-header{background:var(--grad-hero);padding:18px 26px;color:#fff;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;}
.bp-header::before{content:'';position:absolute;top:0;right:0;width:200px;height:100%;background:radial-gradient(circle at 100% 50%,rgba(255,255,255,.12) 0%,transparent 60%);pointer-events:none;}
.bp-header .bp-route{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:1.15rem;font-weight:800;letter-spacing:.5px;}
.bp-header .bp-route .bp-plane{animation:flyPlane 3s ease-in-out infinite;display:inline-block;}
.bp-header .bp-route .bp-line{width:60px;height:2px;background:rgba(255,255,255,.4);position:relative;}
.bp-header .bp-route .bp-line::after{content:'';position:absolute;right:0;top:-3px;border:4px solid transparent;border-left:6px solid rgba(255,255,255,.6);}
.bp-header .bp-meta{font-size:.78rem;opacity:.85;text-align:right;}
.bp-header .bp-meta .bp-flight{font-weight:800;font-size:.95rem;letter-spacing:1px;}
.bp-header .bp-meta .bp-info{font-size:.72rem;margin-top:4px;opacity:.85;}
.bp-body{padding:26px;}
.bp-question{font-family:var(--font-display);font-size:1.08rem;font-weight:600;line-height:1.6;margin-bottom:22px;color:var(--text);}
.bp-question .bq-num{color:var(--primary);margin-right:8px;font-weight:800;padding:2px 8px;background:var(--primary-soft);border-radius:6px;font-size:.85rem;}
.bp-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.bp-opt{padding:14px 44px 14px 18px;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:14px;font-size:.95rem;min-height:52px;background:var(--bg-card);position:relative;}
.bp-opt:hover{border-color:var(--primary-light);background:var(--primary-mist);transform:translateX(4px);}
.bp-opt.selected{border-color:var(--primary);background:var(--primary-soft);font-weight:600;transform:translateX(4px);}
.bp-opt.correct{border-color:var(--success);background:var(--success-soft);animation:correctPulse .5s ease-out;}
.bp-opt.wrong{border-color:var(--danger);background:var(--danger-soft);animation:wrongShake .4s ease-out;}
.bp-opt .opt-letter{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;flex-shrink:0;transition:all .2s;}
.bp-opt .opt-text{flex:1;line-height:1.5;}
.bp-opt.selected .opt-letter{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(20,132,83,.3);}
@keyframes correctPulse{0%{transform:scale(1);}30%{transform:scale(1.02);box-shadow:0 0 0 6px var(--success-soft);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.bp-opt.correct .opt-letter{border-color:var(--success);background:var(--success);color:#fff;}
.bp-opt.wrong .opt-letter{border-color:var(--danger);background:var(--danger);color:#fff;}

/* 选项内的 ✓/✗ 徽章（卡片右上角内嵌） */
.opt-badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.15);animation:badgePop .35s cubic-bezier(.34,1.56,.64,1);font-family:var(--font-sans);}
.opt-badge-ok{background:var(--success);color:#fff;}
.opt-badge-err{background:var(--danger);color:#fff;}
@keyframes badgePop{from{transform:translateY(-50%) scale(0);opacity:0;}to{transform:translateY(-50%) scale(1);opacity:1;}}
.bp-feedback{padding:14px 18px;border-radius:10px;font-size:.88rem;margin-bottom:18px;display:none;font-weight:500;line-height:1.5;}
.bp-feedback.show{display:block;animation:slideIn .3s;}
.bp-feedback.fb-correct{background:var(--success-soft);color:var(--success);border-left:4px solid var(--success);}
.bp-feedback.fb-wrong{background:var(--danger-soft);color:var(--danger);border-left:4px solid var(--danger);}
/* 答对/答错后内嵌"下一题"提示 */
.bp-next-hint{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:.88rem;animation:slideIn .4s;flex-wrap:wrap;}
.bp-next-hint.is-correct{background:linear-gradient(90deg,var(--success-soft),rgba(20,132,83,.06));color:var(--success);border-left:4px solid var(--success);}
.bp-next-hint.is-wrong{background:linear-gradient(90deg,var(--danger-soft),rgba(230,74,25,.05));color:var(--danger);border-left:4px solid var(--danger);}
.btn-next-inline{padding:8px 20px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:.86rem;transition:all .2s;box-shadow:0 2px 8px rgba(20,132,83,.3);min-height:36px;}
.btn-next-inline:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,132,83,.4);}
.bp-next-hint.is-correct .btn-next-inline{background:var(--success);}
.bp-next-hint.is-wrong .btn-next-inline{background:var(--primary);}
/* 错题解析卡片 */
.qe-box{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:14px 16px;margin:8px 0 18px;animation:slideIn .35s;box-shadow:0 4px 12px rgba(0,0,0,.05);}
.qe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.qe-title{font-weight:700;color:var(--primary);font-size:.95rem;}
.qe-close{background:none;border:none;font-size:1.4rem;color:var(--text3);cursor:pointer;line-height:1;padding:0 4px;}
.qe-close:hover{color:var(--danger);}
.qe-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;font-size:.86rem;}
.qe-row:last-of-type{margin-bottom:0;}
.qe-lbl{color:var(--text3);font-weight:600;min-width:64px;flex-shrink:0;padding-top:2px;}
.qe-val{color:var(--text);flex:1;word-break:break-word;}
.qe-ans{color:var(--success);font-weight:700;font-size:.95rem;}
.qe-explain{flex:1;color:var(--text);line-height:1.6;background:var(--primary-soft);padding:8px 12px;border-radius:8px;border-left:3px solid var(--primary);font-size:.85rem;word-break:break-word;}
.qe-siblings{flex:1;display:flex;flex-wrap:wrap;gap:6px;}
.qe-sibling{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--text2);transition:all .15s;}
.qe-sibling:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.qe-actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);justify-content:flex-end;}
.qe-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.82rem;font-family:var(--font-sans);min-height:32px;}
.qe-btn-ghost{color:var(--text2);}
.qe-btn-ghost:hover{background:var(--bg-card);}
.qe-btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.qe-btn-primary:hover{background:var(--primary-deep);}
/* 错题板块升级 */
.wr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.wr-stat{padding:18px 12px;border-radius:12px;text-align:center;border:1px solid transparent;box-shadow:var(--shadow-sm);transition:transform .2s;}
.wr-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.wr-stat-val{font-size:1.7rem;font-weight:800;line-height:1.1;margin-bottom:4px;}
.wr-stat-lbl{font-size:.78rem;opacity:.85;}
.wr-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;}
.wr-toolbar-left{display:flex;gap:8px;flex-wrap:wrap;}
.wr-tool-btn{padding:8px 16px;border:1px solid var(--border);background:var(--bg);border-radius:8px;cursor:pointer;font-size:.84rem;font-family:var(--font-sans);font-weight:600;min-height:40px;transition:all .15s;}
.wr-tool-btn:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.wr-tool-danger{color:var(--danger);border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.05);}
.wr-tool-danger:hover{background:rgba(220,38,38,.12);border-color:var(--danger);color:var(--danger);}
.wr-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;}
.wr-filter-sel{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-family:var(--font-sans);font-size:.82rem;color:var(--text);cursor:pointer;min-height:36px;}
.wr-filter-check{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.8rem;cursor:pointer;}
.wr-card{position:relative;}
.wr-card.wr-mastered{opacity:.7;background:rgba(34,197,94,.04);border-left:3px solid var(--success);}
.wr-card .qc-explain{margin-top:10px;padding:8px 12px;background:var(--primary-soft);border-radius:8px;border-left:3px solid var(--primary);font-size:.85rem;line-height:1.6;}
.wr-card .qc-explain-label{font-weight:700;color:var(--primary);margin-bottom:4px;font-size:.78rem;}
.wr-card .qc-note{margin-top:8px;padding:8px 12px;background:rgba(59,130,246,.06);border-radius:8px;border-left:3px solid #3B82F6;font-size:.85rem;}
.wr-card .qc-note-label{font-weight:700;color:#1E40AF;margin-bottom:4px;font-size:.78rem;}
.wr-card .qc-actions button{padding:5px 10px;font-size:.78rem;}
.wr-list{display:flex;flex-direction:column;gap:12px;}
.bp-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.bp-nav button{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;font-family:var(--font-sans);transition:all .2s cubic-bezier(.4,0,.2,1);min-height:44px;display:flex;align-items:center;gap:6px;}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{opacity:.95;transform:translateY(-2px);box-shadow:var(--shadow);}
.btn-outline{background:var(--bg);border:1px solid var(--border)!important;color:var(--text);}
.btn-outline:hover{border-color:var(--primary)!important;color:var(--primary);transform:translateY(-1px);}
.btn-outline.is-flagged{color:var(--gold)!important;border-color:var(--gold)!important;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;transform:translateY(-1px);}
.btn-gold{background:linear-gradient(135deg,#F5B800,#F08A00);color:#fff;box-shadow:0 2px 8px rgba(245,184,0,.3);}
.btn-gold:hover{opacity:.95;transform:translateY(-2px);}
.bp-confirm-multi{margin-top:8px;}
.bp-confirm-multi button{padding:10px 24px;border-radius:10px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;font-family:var(--font-sans);min-height:44px;background:var(--grad-primary);color:#fff;transition:all .2s;box-shadow:var(--shadow);}
.bp-confirm-multi button:hover{opacity:.95;transform:translateY(-1px);}

/* ===== STUDY MODE ===== */
.bp-study-answer{background:var(--success-soft);border:1px solid var(--success);border-radius:10px;padding:16px;margin-bottom:16px;}
.bp-study-answer .bsa-label{font-size:.78rem;color:var(--success);font-weight:600;margin-bottom:6px;}
.bp-study-answer .bsa-text{font-size:.95rem;font-weight:700;color:var(--text);}
.bp-study-explain{background:var(--info-soft);border:1px solid var(--info);border-radius:10px;padding:16px;margin-bottom:16px;}
.bp-study-explain .bse-label{font-size:.78rem;color:var(--info);font-weight:600;margin-bottom:6px;}
.bp-study-explain .bse-text{font-size:.88rem;color:var(--text2);line-height:1.6;}

/* ===== SEAT MAP ===== */
.seat-map{background:var(--bg-card);border-radius:14px;border:1px solid var(--border);padding:20px;}
.seat-map h3{font-size:.92rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;}
.seat{min-width:36px;min-height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);transition:all .15s;}
.seat:hover{border-color:var(--primary);}
.seat.current{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 2px rgba(20,132,83,.3);}
.seat.answered{background:var(--primary-soft);border-color:var(--primary-light);color:var(--primary);}
.seat.flagged{background:var(--warning-soft);border-color:var(--gold);color:var(--gold-dark);}
.seat.seat-wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.seat-map-legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
.seat-map-legend .leg{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--text2);}
.seat-map-legend .leg .leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.seat-map-legend .leg .leg-current{background:var(--primary);}
.seat-map-legend .leg .leg-answered{background:var(--success);}
.seat-map-legend .leg .leg-wrong{background:var(--danger);}
.seat-map-legend .leg .leg-empty{background:var(--bg);border:1px dashed var(--text3);}
.seat-map-legend .leg .leg-flagged{background:var(--gold);}
.quiz-sidebar-actions{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.quiz-sidebar-actions button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.85rem;font-family:var(--font-sans);transition:all .15s;display:flex;align-items:center;gap:8px;justify-content:center;min-height:44px;}
.quiz-sidebar-actions button:hover{border-color:var(--primary);color:var(--primary);}
.quiz-sidebar-score-btn{background:var(--primary-soft) !important;border-color:var(--primary) !important;color:var(--primary) !important;font-weight:700;}
.quiz-shortcuts-inline{position:relative !important;bottom:auto !important;right:auto !important;margin-top:12px;justify-content:center;}
.bp-nav-mid{display:flex;gap:8px;align-items:center;}
/* 答题卡标题 */
.ac-title{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:.92rem;font-weight:600;flex-wrap:wrap;}
.ac-title-icon{font-size:1.1rem;}
.ac-title-text{font-weight:700;color:var(--text);}
.ac-hint{margin-left:auto;font-size:.7rem;color:var(--text3);font-weight:400;}
/* 答题卡"结束练习"按钮（标题栏右上角） */
.ac-end-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--danger) 0%,#B91C1C 100%);color:#fff;
  font-family:var(--font-sans);font-size:.78rem;font-weight:700;line-height:1.2;
  box-shadow:0 2px 8px rgba(230,74,25,.3);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.ac-end-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);opacity:0;transition:opacity .2s;}
.ac-end-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(230,74,25,.5);}
.ac-end-btn:hover::before{opacity:1;}
.ac-end-btn:active{transform:translateY(0);box-shadow:0 2px 6px rgba(230,74,25,.4);}
.ac-end-icon{font-size:1rem;line-height:1;}
.ac-end-text{white-space:nowrap;letter-spacing:.3px;}
/* 通用按钮 disabled 样式 */
.bp-nav button:disabled,
.bp-nav .btn-outline:disabled{opacity:.4;cursor:not-allowed;}
.bp-nav .btn-outline:disabled:hover{transform:none;box-shadow:none;background:var(--bg);color:var(--text2);border-color:var(--border);}

/* ===== STATS ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--bg-card);border-radius:12px;padding:18px;border:1px solid var(--border);text-align:center;}
.stat-card .sc-val{font-size:1.8rem;font-weight:700;color:var(--primary);}
.stat-card .sc-label{font-size:.78rem;color:var(--text2);margin-top:4px;}
.history-table{width:100%;border-collapse:collapse;background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.history-table th,.history-table td{padding:12px 16px;text-align:left;font-size:.85rem;border-bottom:1px solid var(--border);}
.history-table th{background:var(--primary-soft);color:var(--primary);font-weight:600;white-space:nowrap;}
.history-table tr:last-child td{border-bottom:none;}
.history-table tr:hover td{background:var(--primary-mist);}

/* ===== WRONG / FAVORITE LIST ===== */
.q-card{background:var(--bg-card);border-radius:12px;border:1px solid var(--border);padding:20px;margin-bottom:12px;transition:all .2s;}
.q-card:hover{box-shadow:var(--shadow);}
.q-card .qc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.q-card .qc-q{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:10px;}
.q-card .qc-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.q-card .qc-opt{padding:8px 12px;border-radius:6px;font-size:.85rem;border:1px solid var(--border);}
.q-card .qc-opt.opt-correct{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.q-card .qc-opt.opt-wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
.q-card .qc-ans{font-size:.82rem;color:var(--text2);margin-top:8px;}
.q-card .qc-ans strong{color:var(--primary);}
.q-card .qc-actions{display:flex;gap:8px;margin-top:12px;}
.q-card .qc-actions button{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.8rem;font-family:var(--font-sans);transition:all .15s;min-height:44px;}
.q-card .qc-actions button:hover{border-color:var(--primary);color:var(--primary);}

/* ===== ACHIEVEMENT ===== */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
.badge-card{background:var(--bg-card);border-radius:14px;border:1px solid var(--border);padding:24px 16px;text-align:center;transition:all .2s;position:relative;}
.badge-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.badge-card.locked{opacity:.55;filter:grayscale(.4);}
.badge-card .bc-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:var(--grad-primary);box-shadow:0 4px 14px rgba(20,132,83,.2);}
.badge-card.locked .bc-icon{background:var(--fog);box-shadow:none;}
.badge-card .bc-name{font-size:.92rem;font-weight:700;margin-bottom:4px;}
.badge-card .bc-desc{font-size:.75rem;color:var(--text2);line-height:1.4;}
.badge-card .bc-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--success);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;}

/* ===== SETTINGS ===== */
.settings-section{background:var(--bg-card);border-radius:12px;border:1px solid var(--border);padding:24px;margin-bottom:16px;}
.settings-section h3{font-size:1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .sr-label{font-size:.9rem;}
.settings-row .sr-desc{font-size:.78rem;color:var(--text2);margin-top:2px;}
.theme-btns{display:flex;gap:8px;}
.theme-btns button{padding:8px 18px;border-radius:8px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-size:.85rem;font-family:var(--font-sans);transition:all .15s;min-height:44px;}
.theme-btns button.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600;}
.danger-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);cursor:pointer;font-size:.85rem;font-family:var(--font-sans);transition:all .15s;min-height:44px;}
.danger-btn:hover{background:var(--danger);color:#fff;}
.storage-bar{height:8px;border-radius:4px;background:var(--fog);margin-top:8px;overflow:hidden;max-width:300px;}
.storage-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.storage-info{font-size:.78rem;color:var(--text2);margin-top:4px;}

/* ===== TOAST ===== */
.toast-container{position:fixed;top:70px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.1);font-size:.88rem;display:flex;align-items:center;gap:10px;animation:slideIn .3s;min-width:260px;border-left:4px solid var(--primary);}
.toast.toast-success{border-left-color:var(--success);}
.toast.toast-danger{border-left-color:var(--danger);}
.toast.toast-warning{border-left-color:var(--warning);}
.toast.toast-info{border-left-color:var(--info);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(100%);opacity:0;}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg-card);border-radius:14px;width:100%;max-width:480px;overflow:hidden;animation:modalIn .25s;}
@keyframes modalIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .modal-stripe{height:4px;background:var(--grad-livery);}
.modal .modal-header{padding:20px 24px 0;font-size:1.1rem;font-weight:700;}
.modal .modal-body{padding:16px 24px;font-size:.9rem;line-height:1.6;color:var(--text2);}
.modal .modal-footer{padding:16px 24px;display:flex;justify-content:flex-end;gap:10px;}

/* ===== RESULT MODAL ===== */
.result-modal .rm-score{text-align:center;padding:24px;}
.result-modal .rm-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:4px solid var(--primary);}
.result-modal .rm-circle .rm-pct{font-size:2rem;color:var(--primary);}
.result-modal .rm-circle .rm-lbl{font-size:.75rem;color:var(--text2);}
.result-modal .rm-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px;}
.result-modal .rm-stat{text-align:center;padding:12px;border-radius:8px;background:var(--primary-mist);}
.result-modal .rm-stat .rms-val{font-size:1.2rem;font-weight:700;color:var(--primary);}
.result-modal .rm-stat .rms-lbl{font-size:.72rem;color:var(--text2);margin-top:2px;}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text2);}
.empty-state .es-icon{font-size:3rem;margin-bottom:12px;opacity:.5;}
.empty-state .es-text{font-size:.95rem;margin-bottom:6px;}
.empty-state .es-sub{font-size:.82rem;opacity:.7;}

/* ===== LOADING INDICATOR ===== */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:250;display:none;align-items:center;justify-content:center;}
.loading-overlay.show{display:flex;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--fog);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,var(--fog) 25%,var(--cloud) 50%,var(--fog) 75%);background-size:200% 100%;animation:skeleton-shimmer 1.5s infinite;border-radius:8px;}
@keyframes skeleton-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ===== RESPONSIVE ===== */
/* ===== 平板优化（769-1120px）：收窄侧栏 / 压缩间距，保证横竖屏体验 ===== */
@media(max-width:1120px) and (min-width:769px){
  :root{--sidebar-w:200px;}
  .topbar{padding:0 16px;gap:10px;}
  .topbar .brand-name{font-size:1rem;}
  .main{padding:18px;}
  .page-hero{padding:22px 24px;margin-bottom:18px;}
  .page-hero h1{font-size:1.4rem;}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .metric-card{padding:18px;}
  .metric-card .mc-val{font-size:1.6rem;}
  .quiz-layout{grid-template-columns:1fr 250px;gap:14px;}
  .chart-row{gap:12px;}
  .badge-grid-v2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .ach-hero{padding:20px 22px;}
  .ach-hero-badge{width:84px;height:84px;font-size:2.2rem;}
  .ach-hero-info h2{font-size:1.4rem;}
  .search-bar input{min-width:160px;}
}
/* 横屏平板/小型笔记本（569-768px 高）额外收紧 */
@media(max-width:1120px) and (min-width:769px) and (max-height:700px){
  .page-hero{padding:16px 20px;}
  .main{padding:14px;}
  .metrics{gap:10px;}
  .metric-card{padding:14px;}
  .metric-card .mc-icon{font-size:1.6rem;}
  .metric-card .mc-val{font-size:1.3rem;}
}
@media(max-width:900px){
  .quiz-layout{grid-template-columns:1fr;}
  .chart-row{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;align-items:center;justify-content:center;}
  .topbar .breadcrumb{display:none;}
  .metrics{grid-template-columns:1fr 1fr;}
  .badge-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  /* 平板：默认收起为底部小条，点击展开，再点击关闭 */
  .style-switcher{bottom:12px;right:12px;flex-direction:row;padding:4px;border-radius:24px;}
  .style-switcher .ss-title{display:none;}
  .style-switcher.collapsed{padding:4px;}
  .style-switcher.collapsed .ss-toggle{margin:0;}
  .style-switcher button{width:34px;height:34px;font-size:.95rem;}
  .style-switcher:not(.collapsed) button{animation:ssSlideIn .35s ease-out;}
  @keyframes ssSlideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
}
@media(max-width:480px){
  .metrics{grid-template-columns:1fr;}
  .main{padding:16px;}
  .page-hero{padding:20px;}
  .page-hero h1{font-size:1.2rem;}
  .page-hero .plane-anim{display:none;}
  /* 手机：默认完全隐藏，悬浮右下角"🎨"小按钮，点击后弹出 */
  .style-switcher{right:8px;bottom:8px;flex-direction:row;padding:0;border:none;background:transparent;box-shadow:none;backdrop-filter:none;overflow:visible;pointer-events:none;}
  .style-switcher .ss-title{display:none;}
  .style-switcher .ss-toggle{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--primary);background:var(--bg-card);box-shadow:var(--shadow);font-size:1rem;display:flex;align-items:center;justify-content:center;}
  .style-switcher button:not(.ss-toggle){pointer-events:auto;position:fixed;width:38px;height:38px;border-radius:50%;font-size:.95rem;right:54px;bottom:8px;border:2px solid var(--border);background:var(--bg-card);box-shadow:var(--shadow-sm);}
  .style-switcher.collapsed button:not(.ss-toggle){display:none;}
  .style-switcher:not(.collapsed) button:not(.ss-toggle){animation:ssPopIn .3s cubic-bezier(.4,0,.2,1) backwards;}
  .style-switcher:not(.collapsed) button:nth-child(3){animation-delay:.05s;}
  .style-switcher:not(.collapsed) button:nth-child(4){animation-delay:.1s;}
  .style-switcher:not(.collapsed) button:nth-child(5){animation-delay:.15s;}
  @keyframes ssPopIn{from{opacity:0;transform:translateX(20px) scale(.7);}to{opacity:1;transform:translateX(0) scale(1);}}
}
/* 横屏适配 */
@media(orientation:landscape) and (max-height:500px){
  .page-hero{padding:16px 24px;margin-bottom:16px;}
  .page-hero h1{font-size:1.1rem;}
  .page-hero p{font-size:.78rem;}
  .page-hero .plane-anim{font-size:2rem;}
  .main{padding:12px;}
  .sidebar{transform:translateX(-100%);}
  .main{margin-left:0;}
  .hamburger{display:flex;align-items:center;justify-content:center;}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .metric-card{padding:14px;}
  .metric-card .mc-icon{font-size:1.5rem;}
  .metric-card .mc-val{font-size:1.2rem;}
  .bp-body{padding:16px;}
  .bp-opt{min-height:40px;padding:8px 12px;}
  .seat{min-width:30px;min-height:30px;}
}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:85;display:none;}
.sidebar-overlay.show{display:block;}

/* ============================================
   优化增强 1：设计风格切换器
   ============================================ */
.style-switcher{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:6px;box-shadow:var(--shadow-lg);backdrop-filter:blur(12px);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s,width .35s,padding .35s;overflow:hidden;}
.style-switcher .ss-title{font-size:.7rem;color:var(--text3);text-align:center;padding:4px 8px 2px;letter-spacing:1px;font-weight:600;transition:opacity .2s;}
.style-switcher button{width:42px;height:42px;border-radius:10px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s,opacity .25s;position:relative;flex-shrink:0;}
.style-switcher button:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.style-switcher button.active{border-color:var(--primary);box-shadow:var(--shadow-glow);background:var(--primary-soft);}
.style-switcher button::after{content:attr(data-name);position:absolute;right:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:.72rem;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:500;}
.style-switcher button:hover::after{opacity:1;}

/* 收起状态：仅显示一个折叠图标按钮（桌面端） */
.style-switcher.collapsed{padding:6px;}
.style-switcher.collapsed .ss-title,
.style-switcher.collapsed button:not(.ss-toggle){display:none;}
.style-switcher.collapsed .ss-toggle{width:42px;height:42px;border-radius:10px;border:2px solid var(--primary);background:var(--primary-soft);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);font-weight:700;box-shadow:var(--shadow);}

/* ============================================
   优化增强 2：成就稀有度体系
   ============================================ */
.badge-card{position:relative;overflow:hidden;}
.badge-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--rarity-color,var(--steel));}
.badge-card[data-rarity="common"]{--rarity-color:var(--rarity-bronze);}
.badge-card[data-rarity="uncommon"]{--rarity-color:var(--rarity-silver);}
.badge-card[data-rarity="rare"]{--rarity-color:var(--rarity-gold);}
.badge-card[data-rarity="epic"]{--rarity-color:var(--rarity-platinum);}
.badge-card[data-rarity="legendary"]{--rarity-color:var(--rarity-diamond);}
.badge-card .bc-rarity{position:absolute;top:8px;left:8px;font-size:.6rem;padding:2px 6px;border-radius:6px;background:var(--rarity-color);color:#fff;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.badge-card .bc-icon{position:relative;background:var(--grad-primary);box-shadow:0 6px 20px rgba(20,132,83,.25),inset 0 1px 0 rgba(255,255,255,.3);}
.badge-card[data-rarity="legendary"] .bc-icon{background:linear-gradient(135deg,#C084FC 0%,#7DD3FC 50%,#F5B800 100%);animation:legendaryShine 3s ease-in-out infinite;}
.badge-card[data-rarity="epic"] .bc-icon{background:linear-gradient(135deg,#7DD3FC 0%,#0EA5E9 100%);}
.badge-card[data-rarity="rare"] .bc-icon{background:linear-gradient(135deg,#F5B800 0%,#F08A00 100%);}
@keyframes legendaryShine{0%,100%{box-shadow:0 6px 20px rgba(192,132,252,.4),inset 0 1px 0 rgba(255,255,255,.3);}50%{box-shadow:0 6px 32px rgba(192,132,252,.7),inset 0 1px 0 rgba(255,255,255,.5);}}
.badge-card .bc-progress{height:4px;border-radius:2px;background:var(--fog);margin-top:10px;overflow:hidden;}
.badge-card .bc-progress-fill{height:100%;border-radius:2px;background:var(--grad-primary);transition:width .8s;}
.badge-card .bc-progress-text{font-size:.68rem;color:var(--text3);margin-top:4px;display:flex;justify-content:space-between;}
.badge-card.locked .bc-icon{background:var(--fog)!important;box-shadow:none;animation:none;}
.badge-card .bc-points{position:absolute;top:10px;right:10px;font-size:.65rem;padding:2px 7px;border-radius:8px;background:var(--rarity-color);color:#fff;font-weight:700;display:flex;align-items:center;gap:2px;}

/* ===== 成就页 v2 增强（春秋航空风） ===== */
.ach-hero{position:relative;padding:24px 28px;border-radius:18px;background:linear-gradient(135deg,#0C5F3A 0%,#148453 50%,#4FA86C 100%);color:#fff;margin-bottom:24px;overflow:hidden;box-shadow:0 12px 32px rgba(20,132,83,.18);}
.ach-hero::before{content:'';position:absolute;top:-30%;right:-10%;width:280px;height:280px;background:radial-gradient(circle,rgba(245,184,0,.18) 0%,transparent 70%);border-radius:50%;animation:floatY 8s ease-in-out infinite;}
.ach-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#148453 0%,#4FA86C 18%,#8FC85C 35%,#C9D745 52%,#F5B800 68%,#F08A00 85%,#E64A19 100%);}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.ach-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;}
.ach-hero-badge{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#F5B800 0%,#F08A00 100%);display:flex;align-items:center;justify-content:center;font-size:2.6rem;box-shadow:0 8px 24px rgba(245,184,0,.4),inset 0 2px 0 rgba(255,255,255,.4);position:relative;flex-shrink:0;}
.ach-hero-badge::after{content:'★';position:absolute;bottom:-6px;right:-6px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--gold);font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);font-weight:800;}
.ach-hero-info h2{font-family:var(--font-display);font-size:1.6rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.ach-hero-info .ach-level{font-size:.95rem;opacity:.95;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ach-hero-info .ach-level .pill{padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.18);font-weight:600;font-size:.8rem;}
