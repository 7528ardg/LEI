  // ===== 春秋专属·第四期 (Spring v4) — 01.10 题库扩展解锁 =====
  // 签派/调度
  if(getCorrectByText(['签派','签派员','调度','配载','载重','平衡','重心','舱单']) >= 5) tryUnlock('spring_dispatch');
  if(getCorrectByText(['配载','载重','平衡','重心','重量','装载']) >= 5) tryUnlock('spring_balance');
  // 飞行阶段
  if(getCorrectByText(['起飞','爬升','离地','抬轮','v1','v2','收起落架']) >= 5) tryUnlock('spring_climb');
  if(getCorrectByText(['巡航','下降','进近','着陆','落地','复飞','五边']) >= 5) tryUnlock('spring_cruise');
  // 客舱管理
  if(getCorrectByText(['巡舱','巡视','客舱管理','客舱检查','安全检查','服务检查']) >= 5) tryUnlock('spring_cabin_mgmt');
  if(getCorrectByText(['安全带','座椅','小桌板','靠背','坐姿','系好安全带']) >= 5) tryUnlock('spring_seat_safety');
  // 通讯与协作
  if(getCorrectByText(['通讯','通话','ATC','机内电话','驾驶舱通话','内话']) >= 5) tryUnlock('spring_comm');
  if(getCorrectByText(['机组','协作','CRM','标准喊话','喊话','协同']) >= 5) tryUnlock('spring_crew_coord');
  // 应急医疗扩展
  if(getCorrectByText(['分娩','产科','孕妇','急产','胎膜','宫缩']) >= 3) tryUnlock('spring_obstetric');
  if(getCorrectByText(['儿童','婴儿','幼儿','婴儿摇篮','婴儿安全','哺乳']) >= 5) tryUnlock('spring_pediatric');
  if(getCorrectByText(['心脏病','心绞痛','心梗','心肌梗塞','心脏','胸痛']) >= 3) tryUnlock('spring_cardiac');
  // 飞行文件
  if(getCorrectByText(['飞行计划','舱单','任务书','放行单','签派单']) >= 5) tryUnlock('spring_doc');
  if(getCorrectByText(['手册','QRH','FCOM','快速检查单','查阅','手册']) >= 5) tryUnlock('spring_manual_ref');
  // 天气与运行
  if(getCorrectByText(['雷雨','结冰','低能见度','大雾','风切变','下击暴流','飑线']) >= 5) tryUnlock('spring_weather');
  if(getCorrectByText(['除冰','防冰','除冰液','防冰液','机体结冰','机翼结冰']) >= 3) tryUnlock('spring_deicing');
  // 服务细节
  if(getCorrectByText(['饮料','酒水','茶水','咖啡','果汁','矿泉水']) >= 3) tryUnlock('spring_drink_service');
  if(getCorrectByText(['餐食','餐车','配餐','特殊餐','清真','素食','糖尿病餐']) >= 3) tryUnlock('spring_meal_service');
  // 训练模式达成
  const studyCount = APP.history.filter(h => h.mode === 'study' && h.total > 0).length;
  const practiceCount = APP.history.filter(h => h.mode === 'practice' && h.total > 0).length;
  const wrongRedoCount = APP.history.filter(h => h.mode === 'wrong_redo' && h.total > 0).length;
  if(studyCount >= 10) tryUnlock('spring_study_complete');
  if(practiceCount >= 10) tryUnlock('spring_practice_complete');
  if(wrongRedoCount >= 10) tryUnlock('spring_wrong_redo_complete');
  // 季节/航线
  if(getCorrectByText(['冬季','寒冷','冰雪','低温','雪天']) >= 3) tryUnlock('spring_winter_fly');
  if(getCorrectByText(['夏季','炎热','高温','雷暴','酷暑']) >= 3) tryUnlock('spring_summer_fly');
  if(getCorrectByText(['国际航线','国际航班','海关','边检','出境','入境','护照','签证']) >= 3) tryUnlock('spring_international');
  if(getCorrectByText(['红眼','夜间飞行','跨夜','通宵','长航线']) >= 3) tryUnlock('spring_red_eye');

  // ===== 终极 =====
  const unlockedCount = BADGES.filter(b=>b.unlocked && !b.hidden).length;
  const totalUnlocked = BADGES.filter(b=>b.unlocked).length;
  if(unlockedCount>=30) tryUnlock('cap');
  if(unlockedCount>=50) tryUnlock('legend');
  if(totalUnlocked>=BADGES.length) tryUnlock('spring_legend');

  // 通知新解锁：先 toast，再展示庆祝弹层（按稀有度优先级，传说级优先）
  if(newBadges.length){
    STORAGE.save();
    // 排序：传说 > 史诗 > 稀有 > 高级 > 普通
    const rarityOrder = {legendary:0,epic:1,rare:2,uncommon:3,common:4};
    newBadges.sort((a,b)=>rarityOrder[a.rarity]-rarityOrder[b.rarity]);
    newBadges.forEach(b=>{
      if(['legendary','epic','rare'].includes(b.rarity)){
        showCelebration(b);
      } else {
        toast(`🏅 成就解锁：${b.name} (+${b.points||10} 段位分)`,'success');
        APP.segmentPoints = (APP.segmentPoints||0) + (b.points||10);
      }
    });
    STORAGE.save();
  }
}

/* ===== RENDER: STATS ===== */
function renderStats(){
  // 题库为空：直接显示引导上传
  if(!APP.questions.length){
    document.getElementById('mainContent').innerHTML = `
      <div class="page-hero">
        <h1>📊 飞行数据</h1>
        <p>训练统计与数据分析</p>
        <div class="plane-anim">📈</div>
      </div>
      ${emptyState({
        icon:'📋', title:'题库为空', lead:'请先上传题库，再查看飞行数据',
        tip:'支持 CSV / Excel / DOCX 格式，文件即用无需联网',
        ctas:[
          {text:'上传题库', icon:'📂', onclick:'triggerUpload()'},
          {text:'前往题库', icon:'📋', outline:true, onclick:'go("bank")'}
        ],
        steps:['下载模板', '上传文件', '查看数据']
      })}
    `;
    return;
  }
  const totalQ = APP.questions.length;
  const totalDone = APP.totalAnswered;
  const totalRight = APP.totalCorrect;
  const accuracy = totalDone ? Math.round(totalRight/totalDone*100) : 0;
  const sessions = APP.history.length;
  const avgTime = APP.history.length ? Math.round(APP.history.reduce((s,h)=>s+h.elapsed,0)/APP.history.length) : 0;
  const chapters = getChapters();

  // ===== 章节准确率统计 =====
  const chapStats = chapters.map(c=>{
    const qIdxs = [];
    APP.questions.forEach((q,i)=>{ if(q.chapter===c) qIdxs.push(i); });
    const wrongCount = qIdxs.filter(i=>APP.wrong.includes(i)).length;
    const favCount = qIdxs.filter(i=>APP.favorites.includes(i)).length;
    // 从 history 统计该章节的已答/正确
    let done = 0, right = 0;
    APP.history.forEach(h=>{
      (h.answers||[]).forEach((a,idx)=>{
        if(idx<APP.questions.length && APP.questions[idx].chapter===c){
          done++;
          if(checkAnswer(APP.questions[idx], a)) right++;
        }
      });
    });
    const acc = done ? Math.round(right/done*100) : null;
    return { chapter:c, total:qIdxs.length, wrong:wrongCount, fav:favCount, done, right, acc };
  });
  // 排序：错题率高的在前（薄弱优先）
  const weakChaps = chapStats.filter(s=>s.done>0).sort((a,b)=>{
    const aWeak = (a.acc||100) - (a.wrong/a.total*100);
    const bWeak = (b.acc||100) - (b.wrong/b.total*100);
    return aWeak - bWeak;
  });
  // ===== 题型准确率 =====
  const typeStats = {};
  ['单选','多选','判断'].forEach(t=>{
    let done=0, right=0;
    APP.history.forEach(h=>{
      (h.answers||[]).forEach((a,idx)=>{
        if(idx<APP.questions.length && APP.questions[idx].type===t){
          done++;
          if(checkAnswer(APP.questions[idx], a)) right++;
        }
      });
    });
    typeStats[t] = { done, right, acc: done?Math.round(right/done*100):0 };
  });

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hero">
      <h1>📊 飞行数据</h1>
      <p>训练统计与数据分析</p>
      <div class="plane-anim">📈</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="sc-val">${totalQ}</div><div class="sc-label">题库总量</div></div>
      <div class="stat-card"><div class="sc-val">${totalDone}</div><div class="sc-label">累计答题</div></div>
      <div class="stat-card"><div class="sc-val">${accuracy}%</div><div class="sc-label">总正确率</div></div>
      <div class="stat-card"><div class="sc-val">${sessions}</div><div class="sc-label">训练次数</div></div>
      <div class="stat-card"><div class="sc-val">${avgTime}s</div><div class="sc-label">平均用时</div></div>
      <div class="stat-card"><div class="sc-val">${APP.wrong.length}</div><div class="sc-label">错题数</div></div>
      <div class="stat-card"><div class="sc-val">${APP.favorites.length}</div><div class="sc-label">收藏数</div></div>
      <div class="stat-card"><div class="sc-val">${chapters.length}</div><div class="sc-label">章节数</div></div>
    </div>

    <!-- 知识点图谱（章节准确率） -->
    <div class="chart-card" style="margin-top:20px;">
      <h3>🧠 知识点图谱 · 你的薄弱章节</h3>
      <p style="color:var(--text3);font-size:.84rem;margin-bottom:14px;">绿色=已掌握，黄色=一般，红色=薄弱。点击章节名可直接进入练习</p>
      <div class="kg-grid">
        ${chapStats.length?chapStats.map(s=>{
          const acc = s.acc==null ? 0 : s.acc;
          const colorClass = s.done===0 ? 'kg-unknown' : (acc>=80?'kg-strong':acc>=60?'kg-medium':'kg-weak');
          return `<div class="kg-cell ${colorClass}" onclick="startChapterQuiz('${escapeAttr(s.chapter)}')" title="点击进入章节练习">
            <div class="kg-name">${escapeHtml(s.chapter)}</div>
            <div class="kg-pct">${s.done>0?acc+'%':'未练'}</div>
            <div class="kg-meta">${s.total}题 · 错${s.wrong} · 已答${s.done}</div>
            <div class="kg-bar"><div class="kg-bar-fill" style="width:${acc}%"></div></div>
          </div>`;
        }).join(''):'<div style="padding:30px;text-align:center;color:var(--text3);">暂无章节数据</div>'}
      </div>
      ${weakChaps.length?`
        <div style="margin-top:16px;padding:12px 14px;background:linear-gradient(90deg,rgba(230,74,25,.06),rgba(245,184,0,.06));border-radius:10px;border-left:3px solid var(--danger);">
          <div style="font-weight:700;color:var(--text);margin-bottom:4px;">🎯 智能推荐 · 重点突破</div>
          <div style="color:var(--text2);font-size:.86rem;line-height:1.6;">
            ${weakChaps.slice(0,3).map(s=>`<button class="kg-recommend-btn" onclick="startChapterQuiz('${escapeAttr(s.chapter)}')">📌 ${escapeHtml(s.chapter)}（${s.acc==null?'未练':s.acc+'%'}）</button>`).join('')}
          </div>
        </div>
      `:totalDone>10?`<div style="margin-top:14px;padding:12px;background:var(--primary-soft);border-radius:8px;color:var(--primary);font-size:.86rem;">🌟 你的训练数据较少，再多刷几套题就能看到图谱分析！</div>`:''}
    </div>

    <!-- 题型准确率 -->
    <div class="chart-card" style="margin-top:20px;">
      <h3>📊 题型能力分布</h3>
      <div class="kg-grid">
        ${['单选','多选','判断'].map(t=>{
          const s = typeStats[t] || {done:0,acc:0};
          const colorClass = s.done===0 ? 'kg-unknown' : (s.acc>=80?'kg-strong':s.acc>=60?'kg-medium':'kg-weak');
          return `<div class="kg-cell ${colorClass}">
            <div class="kg-name">${t}</div>
            <div class="kg-pct">${s.done>0?s.acc+'%':'未练'}</div>
            <div class="kg-meta">已答 ${s.done} · 正确 ${s.right}</div>
            <div class="kg-bar"><div class="kg-bar-fill" style="width:${s.acc}%"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="chart-row" style="margin-top:20px;">
      <div class="chart-card">
        <h3>📊 章节题目分布</h3>
        <canvas id="statsChartChapter" style="width:100%;height:200px;"></canvas>
      </div>
      <div class="chart-card">
        <h3>📈 训练正确率趋势</h3>
        <canvas id="statsChartTrend" style="width:100%;height:200px;"></canvas>
      </div>
    </div>
    <div class="chart-card" style="margin-top:20px;">
      <h3>🕐 最近训练记录</h3>
      ${APP.history.length?`
      <div style="overflow-x:auto;">
        <table class="history-table">
          <thead><tr><th>时间</th><th>题数</th><th>正确</th><th>正确率</th><th>用时</th><th>模式</th></tr></thead>
          <tbody>
            ${APP.history.slice(-10).reverse().map(h=>{
              const mm = String(Math.floor(h.elapsed/60)).padStart(2,'0');
              const ss = String(h.elapsed%60).padStart(2,'0');
              const modeLabels = {practice:'练习',exam:'考试',study:'背题',wrong_redo:'错题'};
              return `<tr>
                <td>${h.date}</td>
                <td>${h.total}</td>
                <td>${h.correct}</td>
                <td><span style="color:${h.pct>=80?'var(--success)':h.pct>=60?'var(--warning)':'var(--danger)'};font-weight:600">${h.pct}%</span></td>
                <td>${mm}:${ss}</td>
                <td>${modeLabels[h.mode]||'练习'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`:`<div class="empty-state" style="padding:30px"><div class="es-icon">📭</div><div class="es-text">暂无训练记录</div></div>`}
    </div>
  `;

  setTimeout(()=>{
    const chapLabels = chapStats.map(s=>s.chapter.length>4?s.chapter.slice(0,4)+'…':s.chapter);
    const chapValues = chapStats.map(s=>s.total);
    drawBarChart('statsChartChapter',chapLabels,chapValues,['#148453','#4FA86C','#8FC85C','#C9D745','#F5B800','#F08A00','#E64A19','#2D8FB5']);

    const recent = APP.history.slice(-10);
    const trendLabels = recent.map((_,i)=>`#${i+1}`);
    const trendValues = recent.map(h=>h.pct);
    if(trendValues.length) drawLineChart('statsChartTrend',trendLabels,trendValues,'#148453');
  },100);
}

/* ===== RENDER: WRONG ===== */
function renderWrong(){
  // ===== 错题统计 =====
  const totalWrong = APP.wrong.length;
  const totalStats = APP.wrongStats || {};
  const masteredCount = (APP.mastered || []).length;
  // 按章节分组
  const chapterGroups = {};
  let totalChapters = 0;
  APP.wrong.forEach(idx=>{
    const q = APP.questions[idx];
    if(!q) return;
    const ch = q.chapter || '未分类';
    if(!chapterGroups[ch]) chapterGroups[ch] = [];
    chapterGroups[ch].push(idx);
    totalChapters = Math.max(totalChapters, Object.keys(chapterGroups).length);
  });
  const chapterList = Object.keys(chapterGroups);
  // 按错误次数统计
  const repeatCount = Object.values(totalStats).filter(s=>s.count>=2).length;
  // 难度分布
  const diffCount = {易:0,中:0,难:0};
  APP.wrong.forEach(idx=>{
    const q = APP.questions[idx];
    if(q && q.diff && diffCount[q.diff]!==undefined) diffCount[q.diff]++;
  });

  // ===== 三态筛选（待复习 / 已掌握 / 全部）=====
  const wState = APP._wrongState || 'pending'; // pending / mastered / all
  let displayList = [];
  if(wState === 'pending'){
    displayList = APP.wrong.slice();
  } else if(wState === 'mastered'){
    displayList = (APP.mastered || []).slice();
  } else {
    // 全部：合并去重
    const set = new Set([...APP.wrong, ...(APP.mastered || [])]);
    displayList = [...set];
  }
  // ===== 当前筛选状态 =====
  const wf = APP._wrongFilter || {chapter:'',diff:'',tag:'',sort:'time',showMastered:false};

  function applyFilter(list){
    return list.filter(idx=>{
      const q = APP.questions[idx];
      if(!q) return false;
      if(wf.chapter && q.chapter!==wf.chapter) return false;
      if(wf.diff && q.diff!==wf.diff) return false;
      if(wf.tag){
        const note = (APP.notes && APP.notes[idx]) || {};
        const tags = note.tags || [];
        if(!tags.includes(wf.tag)) return false;
      }
      return true;
    }).sort((a,b)=>{
      if(wf.sort==='count') return (totalStats[b]?.count||0) - (totalStats[a]?.count||0);
      if(wf.sort==='chapter') return (APP.questions[a]?.chapter||'').localeCompare(APP.questions[b]?.chapter||'');
      return 0;
    });
  }

  const filteredList = applyFilter(displayList);

  document.getElementById('mainContent').innerHTML = `
    <div class="page-hero">
      <h1>⬛ 错题本 · 黑匣子</h1>
      <p>记录每一次失误，确保安全飞行</p>
      <div class="plane-anim">⬛</div>
    </div>

    <!-- 三态 Tab 切换 -->
    <div class="me-tab-bar" style="margin-bottom:18px;">
      <div class="me-tab ${wState==='pending'?'active':''}" onclick="APP._wrongState='pending';renderWrong();">
        📋 待复习 <span style="background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px;font-size:.7rem;margin-left:4px;">${totalWrong}</span>
      </div>
      <div class="me-tab ${wState==='mastered'?'active':''}" onclick="APP._wrongState='mastered';renderWrong();">
        ✅ 已掌握 <span style="background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px;font-size:.7rem;margin-left:4px;">${masteredCount}</span>
      </div>
      <div class="me-tab ${wState==='all'?'active':''}" onclick="APP._wrongState='all';renderWrong();">
        📚 全部 <span style="background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px;font-size:.7rem;margin-left:4px;">${totalWrong+masteredCount}</span>
      </div>
    </div>

    ${(totalWrong+masteredCount)?`
      <!-- 错题统计卡片 -->
      <div class="wr-stats">
        <div class="wr-stat" style="background:linear-gradient(135deg,#FEE2E2,#FECACA);color:#991B1B;">
          <div class="wr-stat-val">${totalWrong}</div>
          <div class="wr-stat-lbl">错题总数</div>
        </div>
        <div class="wr-stat" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E;">
          <div class="wr-stat-val">${repeatCount}</div>
          <div class="wr-stat-lbl">反复错(≥2次)</div>
        </div>
        <div class="wr-stat" style="background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#065F46;">
          <div class="wr-stat-val">${masteredCount}</div>
          <div class="wr-stat-lbl">已掌握</div>
        </div>
        <div class="wr-stat" style="background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF;">
          <div class="wr-stat-val">${chapterList.length}</div>
          <div class="wr-stat-lbl">涉及章节</div>
        </div>
      </div>

      <!-- 难度分布条 -->
      <div class="wr-diff-bar" style="display:flex;gap:8px;margin:16px 0;align-items:center;">
        <span style="font-size:.82rem;color:var(--text3);font-weight:600;flex-shrink:0;">难度分布：</span>
        ${(()=>{
          const total = diffCount.易 + diffCount.中 + diffCount.难;
          if(!total) return '<span style="color:var(--text3);font-size:.82rem;">暂无数据</span>';
          return `

function removeWrong(idx){
  const i = APP.wrong.indexOf(idx);
  if(i>=0){
    APP.wrong.splice(i,1);
    // 标记为"已掌握"
    if(!APP.mastered) APP.mastered = [];
    if(!APP.mastered.includes(idx)) APP.mastered.push(idx);
    // 清除错因/笔记（可选保留）
    STORAGE.save();
    renderWrong();
    toast('已标记为"已掌握" 🎉','success');
  }
}

/* 反向：恢复为错题（已掌握 → 答错） */
function restoreWrong(idx){
  if(APP.mastered) {
    const i = APP.mastered.indexOf(idx);
    if(i>=0) APP.mastered.splice(i,1);
  }
  if(!APP.wrong.includes(idx)) APP.wrong.push(idx);
  STORAGE.save();
  renderWrong();
  toast('已恢复为错题','info');
}

function clearWrong(){
  modal({
    title:'确认清空错题？',
    body:'<p>此操作不可撤销</p><p style="margin-top:8px;font-size:.85rem;color:var(--text3)">错题笔记与错因标签将一同清空</p>',
    okText:'确认清空',
    onOk:()=>{
      APP.wrong=[];
      APP.notes = {};
      APP.wrongStats = {};
      STORAGE.save();
      renderWrong();
      toast('错题已清空','success');
    }
  });
}

/* ===== 错题导出 ===== */
function exportWrong(format){
  if(!APP.wrong.length){toast('暂无错题可导出','warning');return;}
  if(format==='html'){
    // 生成可打印的 HTML
    const html = buildWrongPrintHTML();
    const w = window.open('','_blank');
    if(!w){toast('请允许弹窗以打印错题','warning');return;}
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(()=>{w.print();}, 400);
    APP.exportCount = (APP.exportCount||0) + 1;
    STORAGE.save();
  } else {
    // 纯文本
    const txt = buildWrongText();
    const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `错题本_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    APP.exportCount = (APP.exportCount||0) + 1;
    STORAGE.save();
    toast(`已导出 ${APP.wrong.length} 道错题`,'success');
  }
}

function buildWrongText(){
  const lines = [];
  lines.push(`# 客舱乘务员题库·错题本`);
  lines.push(`# 导出时间：${new Date().toLocaleString('zh-CN')}`);
  lines.push(`# 共 ${APP.wrong.length} 道错题`);
  lines.push('='.repeat(60));
  APP.wrong.forEach((idx,i)=>{
    const q = APP.questions[idx];
    if(!q) return;
    const stat = (APP.wrongStats||{})[idx] || {count:1};
    const note = (APP.notes||{})[idx] || {};
    lines.push(`\n[${i+1}] ${q.type} · ${q.chapter||'未分类'} · 难度${q.diff||'中'} · 错${stat.count||1}次`);
    lines.push(`题干：${q.q}`);
    q.opts.forEach((o,k)=>lines.push(`  ${'ABCDEFGH'[k]}. ${o}`));
    lines.push(`答案：${q.ans.replace(/\|/g,'、')}`);
    if(q.explain) lines.push(`解析：${q.explain}`);
    if(note.text) lines.push(`笔记：${note.text}`);
    if(note.tags && note.tags.length) lines.push(`错因：${note.tags.join('、')}`);
  });
  return lines.join('\n');
}

  .wi-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;}
  .wi-head span{padding:2px 8px;background:#fff;border:1px solid #e5e7eb;border-radius:4px;}

</style>

<h1>⬛ 客舱乘务员题库·错题本</h1>
<div class="meta">导出时间：${new Date().toLocaleString('zh-CN')} · 共 ${APP.wrong.length} 道</div>

/* ===== 同类题查看 ===== */
function viewRelated(idx){
  const q = APP.questions[idx];
  if(!q) return;
  const related = [];
  for(let i=0;i<APP.questions.length && related.length<10;i++){
    if(i===idx) continue;
    const oq = APP.questions[i];
    const sameChapter = q.chapter && oq.chapter === q.chapter;
    const sameType = oq.type === q.type;
    if(sameChapter || sameType){
      related.push({idx:i, q:oq, sameChapter, sameType});
    }
  }
  if(!related.length){
    toast('未找到同类题','info');
    return;
  }
  modal({
    title: `🔗 ${q.chapter || '同类型'} · 同类题`,
    body: `<div style="max-height:60vh;overflow-y:auto;">
      ${related.map(r=>{
        const userHasWrong = APP.wrong.includes(r.idx);
        return `<div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg-card);">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:.75rem;">
            <span class="tag tag-type">${r.q.type}</span>
            <span class="tag tag-chapter">${r.q.chapter||'未分类'}</span>
            ${r.sameChapter?`<span style="color:var(--primary);">📚 同章节</span>`:''}
            ${r.sameType?`<span style="color:var(--primary);">🎯 同题型</span>`:''}
            ${userHasWrong?`<span style="color:var(--danger);">⬛ 也是错题</span>`:''}
          </div>
          <div style="font-size:.88rem;margin-bottom:6px;">${escapeHtml(r.q.q)}</div>
          <div style="display:flex;gap:6px;">
            <button onclick="document.querySelector('.modal-overlay').remove();startQuiz([${r.idx}])" style="padding:4px 10px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.78rem;">✈️ 做这道</button>
            ${userHasWrong?`<button onclick="document.querySelector('.modal-overlay').remove();goToWrongIdx(${r.idx})" style="padding:4px 10px;background:var(--danger);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.78rem;">🗑 去做错题</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`,
    okText: '关闭',
    onOk: ()=>{}
  });
}

  `;
}

/* ===== 1+2. 试卷配置与抽题系统 ===== */
// 配置步骤定义（用于顶部导航）
const ME_STEPS = [
  {id:'basic',     icon:'📋', title:'基本信息', desc:'试卷名称 · 时长'},
  {id:'chapters',  icon:'📚', title:'抽题范围', desc:'章节与数量'},
  {id:'score',     icon:'💯', title:'分值设置', desc:'题型分值'},
  {id:'types',     icon:'🎯', title:'题型与布局', desc:'数量与展示顺序'},
  {id:'strategy',  icon:'🧠', title:'抽题策略', desc:'错题/未答优先'},
  {id:'preview',   icon:'👀', title:'抽题预览', desc:'确认结果'},
];
function getMEStep(){ const i = APP._meStep || 0; return ME_STEPS[Math.max(0, Math.min(ME_STEPS.length-1, i))]; }
function setMEStep(i){
  i = Math.max(0, Math.min(ME_STEPS.length-1, +i || 0));
  APP._meStep = i;
  renderMEBuilder();
  // 滚动到顶部
  setTimeout(()=>{ try { document.querySelector('.me-top-action-bar')?.scrollIntoView({behavior:'smooth', block:'start'}); } catch(e){} }, 50);
}
function goMEPrev(){
  if(APP._meStep > 0) setMEStep(APP._meStep - 1);
  else toast('已是第一步','info');
}
function goMENext(){
  if(APP._meStep < ME_STEPS.length - 1){
    // 校验当前步骤
    if(!validateMEStep(APP._meStep)) return;
    setMEStep(APP._meStep + 1);
  } else {
    // 最后一步：开始考试
    startMockExam();
  }
}
function validateMEStep(i){
  const cfg = APP._meConfig;
  if(i === 0){
    if(!cfg.name || !cfg.name.trim()){ toast('请填写试卷名称','warning'); return false; }
    if(!cfg.timeLimit || cfg.timeLimit < 1){ toast('请填写考试时长','warning'); return false; }
  }
  if(i === 1){
    const totalQ = Object.values(cfg.types).reduce((a,b)=>a+(+b||0), 0);
    if(totalQ <= 0){ toast('请至少设置一种题型的抽题数量','warning'); return false; }
  }
  if(i === 4){
    if(cfg.wrongRatio > 100 || cfg.unanswerRatio > 100){ toast('比例不能超过 100%','warning'); return false; }
  }
  return true;
}
function resetMEConfigToInitial(){
  modal({
    title:'🔄 重置所有配置？',
    body:'<p>将清空当前所有配置项（名称/时长/章节/分值/题型/策略），恢复为初始默认状态。</p><p style="margin-top:6px;color:var(--text3);font-size:.85rem;">此操作不可撤销，请谨慎。</p>',
    okText:'确认重置',
    cancelText:'取消',
    danger:true,
    onOk:()=>{
      APP._meConfig = null;
      APP._meStep = 0;
      renderMEBuilder();
      toast('已重置为初始状态','success');
    }
  });
}
function goHomeFromConfig(){
  if(!APP._meConfig) { go('home'); return; }
  const cfg = APP._meConfig;
  const isModified = JSON.stringify(cfg) !== JSON.stringify({
    name: '模拟考 ' + new Date().toLocaleDateString('zh-CN'),
    timeLimit: 60,
    chapters: {},
    types: { '单选': 50, '多选': 0, '判断': 50 },
    typeOrder: ['单选','多选','判断'],
    diffs: {},
    wrongPriority: false, wrongRatio: 30,
    unanswerPriority: false, unanswerRatio: 40,
    shuffleWithinType: true,
    defaultScore: { ...ME_DEFAULT_SCORE },
    scoreOverrides: {},
  });
  if(!isModified){ go('home'); return; }
  modal({
    title:'↩️ 返回首页？',
    body:'<p>当前配置有修改，可选择：</p><p style="margin-top:8px;">💾 <b>保存并返回</b>：保存当前配置，下次继续编辑</p><p style="margin-top:6px;color:var(--text3);">🗑 <b>放弃并返回</b>：清空配置，回到首页</p>',
    okText:'💾 保存并返回',
    cancelText:'🗑 放弃修改',
    onOk: ()=>{ toast('配置已保存','success'); go('home'); },
    onCancel: ()=>{ APP._meConfig = null; APP._meStep = 0; go('home'); toast('已放弃配置','info'); }
  });
}

function renderMEBuilder(){
  // 题库为空时禁用
  if(!APP.questions.length){
    document.getElementById('meTabContent').innerHTML = emptyState({

      tip:'支持 CSV / Excel / DOCX 格式，文件即用无需联网',
      ctas:[
        {text:'上传题库', icon:'📂', onclick:'triggerUpload()'},
        {text:'前往题库', icon:'📋', outline:true, onclick:'go("bank")'}
      ],
      steps:['下载模板', '上传文件', '开始考试']
    });
    return;
  }

  // 默认配置
  if(!APP._meConfig){
    APP._meConfig = {
      name: '模拟考 ' + new Date().toLocaleDateString('zh-CN'),

      chapters: {}, // { chapter: count }
      types: { '单选': 50, '多选': 0, '判断': 50 }, // 各题型总数
      typeOrder: ['单选','多选','判断'], // 试卷中题型展示顺序
      diffs: {}, // { '易': 5, '中': 10, '难': 5 }
      wrongPriority: false,
      wrongRatio: 30,
      unanswerPriority: false,
      unanswerRatio: 40,
      shuffleWithinType: true, // 同题型内随机
      defaultScore: { ...ME_DEFAULT_SCORE },
      scoreOverrides: {}, // { idx: score }
    };
  }
  // 默认当前步骤
  if(typeof APP._meStep !== 'number') APP._meStep = 0;

  const cfg = APP._meConfig;
  const allChapters = getChapters();

  APP.questions.forEach(q=>{ if(typeCount[q.type]!==undefined) typeCount[q.type]++; });

  // 总题数 & 总分实时计算
  const totalQuestions = Object.values(cfg.types).reduce((a,b)=>a+(+b||0), 0);
  const totalScore = computeTotalScore(cfg);

  document.getElementById('meTabContent').innerHTML = `
    <!-- 顶部固定操作栏：返回 / 进度 / 操作 -->
    <div class="me-top-action-bar">

        <div>
          <div class="me-tab-meta-title">${escapeHtml(cfg.name||'模拟考试')}</div>
          <div class="me-tab-meta-info" id="meTopMetaInfo">
            📊 <strong>${totalQuestions}</strong> 题 · 🎯 <strong>${totalScore}</strong> 分 · ⏱ ${cfg.timeLimit} 分钟
          </div>
        </div>
      </div>
      <div class="me-tab-actions">
        <button class="me-btn me-btn-warn" onclick="goMEPrev()" ${APP._meStep===0?'disabled':''} title="上一步（Esc）">⬅ 上一步</button>
        ${APP._meStep < ME_STEPS.length-1
          ? `<button class="me-btn me-btn-primary" onclick="goMENext()" title="下一步（→）">下一步 ➡</button>`
          : `<button class="me-btn me-btn-primary me-btn-start" onclick="goMENext()" title="开始考试">🚀 开始考试</button>`}
        <button class="me-btn me-btn-icon" onclick="saveMETemplate()" title="保存为模板">💾</button>
        <button class="me-btn me-btn-icon" onclick="exportMEConfig()" title="导出配置">📤</button>
        <button class="me-btn me-btn-icon" onclick="document.getElementById('meImportInput').click()" title="导入配置">📥</button>
        <input type="file" id="meImportInput" accept=".json" style="position:absolute;width:1px;height:1px;opacity:0;left:-9999px;" onchange="importMEConfig(event)">
      </div>
    </div>

    <!-- 步骤进度导航条 -->
    <div class="me-steps-nav" id="meStepsNav">
      ${ME_STEPS.map((s,i)=>{
        const passed = i < APP._meStep;
        const current = i === APP._meStep;

        return `<div class="me-step-item ${stateClass}" onclick="setMEStep(${i})" title="${s.title} · ${s.desc}">

            <div class="me-step-title">${s.icon} ${s.title}</div>
            <div class="me-step-desc">${s.desc}</div>
          </div>
          ${i < ME_STEPS.length-1 ? '<div class="me-step-line"></div>' : ''}
        </div>`;
      }).join('')}
    </div>

    <!-- 预设模板（快速选择 4 套方案） -->
    <div class="me-presets-bar">
      <div class="me-presets-label">⚡ 一键配置：</div>
      <button class="me-preset me-preset-quick" onclick="applyMEPreset('quick')">
        <span class="mep-icon">⚡</span>
        <span class="mep-body">
          <span class="mep-name">快速训练</span>
          <span class="mep-meta">20 题 · 10 分钟</span>
        </span>
      </button>
      <button class="me-preset me-preset-balance" onclick="applyMEPreset('balance')">
        <span class="mep-icon">⚖️</span>
        <span class="mep-body">
          <span class="mep-name">平衡模式</span>
          <span class="mep-meta">50 题 · 30 分钟</span>
        </span>
      </button>
      <button class="me-preset me-preset-challenge" onclick="applyMEPreset('challenge')">
        <span class="mep-icon">🏆</span>
        <span class="mep-body">
          <span class="mep-name">挑战模式</span>
          <span class="mep-meta">100 题 · 60 分钟</span>
        </span>
      </button>
      <button class="me-preset me-preset-cbt" onclick="applyMEPreset('cbt')">
        <span class="mep-icon">✈️</span>
        <span class="mep-body">
          <span class="mep-name">CBT 模拟</span>
          <span class="mep-meta">100 题 · 90 分钟</span>

      </button>
    </div>

    <!-- 当前步骤对应的配置卡 -->
    ${renderMEStepContent(currentStep.id, cfg, allChapters, typeCount, totalQuestions, totalScore)}

  // 初始化预览
  if(currentStep.id === 'preview') previewMEQuestionPool();
  updateMESummary();
}

/* 切换章节选择 */
function toggleMEChapter(c, checked){
  if(checked) APP._meConfig.chapters[c] = APP._meConfig.chapters[c] || 10;
  else delete APP._meConfig.chapters[c];
  renderMEBuilder();
}
function updateMEChapterCount(c, n){
  APP._meConfig.chapters[c] = Math.max(0, n||0);
  updateMESummary();
}
function selectAllChapters(){
  APP._meConfig.chapters = {};
  getChapters().forEach(c=> APP._meConfig.chapters[c] = APP.questions.filter(q=>q.chapter===c).length);
  renderMEBuilder();
}
function clearAllChapters(){
  APP._meConfig.chapters = {};
  renderMEBuilder();
}
function autoFillChapterCounts(){
  // 智能推荐：根据题数平均分配
  const totalQ = APP.questions.length;
  const target = Math.min(30, totalQ);
  const chs = getChapters();
  if(!chs.length) return;
  const per = Math.max(1, Math.floor(target / chs.length));
  APP._meConfig.chapters = {};
  chs.forEach(c=>{
    const avail = APP.questions.filter(q=>q.chapter===c).length;
    APP._meConfig.chapters[c] = Math.min(per, avail);
  });
  renderMEBuilder();
}
function moveTypeOrder(i, dir){
  const arr = APP._meConfig.typeOrder;
  const j = i + dir;
  if(j<0 || j>=arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderMEBuilder();
}
function updateMESummary(){
  // 触发预览更新（debounce 防止频繁调用）
  if(updateMESummary._t) clearTimeout(updateMESummary._t);
  updateMESummary._t = setTimeout(()=>{
    // 顶部统计条实时更新
    const cfg = APP._meConfig;
    if(cfg){
      const totalQ = Object.values(cfg.types).reduce((a,b)=>a+(+b||0), 0);
      const totalS = computeTotalScore(cfg);
      const el = document.getElementById('meTopMetaInfo');
      if(el) el.innerHTML = `📊 <strong>${totalQ}</strong> 题 · 🎯 <strong>${totalS}</strong> 分 · ⏱ ${cfg.timeLimit} 分钟`;
    }
    const el = document.getElementById('mePreviewArea');
    if(el) previewMEQuestionPool();
  }, 200);
}

/* 计算总分 */
function computeTotalScore(cfg){
  // 预估总分 = ∑ 各题型数量 × 默认分值（具体题目分值在生成试卷时计算）
  let total = 0;
  Object.entries(cfg.types).forEach(([t,n])=>{
    total += (n||0) * (cfg.defaultScore[t] || ME_DEFAULT_SCORE[t] || 1);
  });
  return total;
}

/* ===== 智能抽题核心算法（带分桶索引 + 早停优化） ===== */
function drawQuestionPool(cfg){
  if(!cfg) cfg = APP._meConfig;
  if(!cfg) return [];

  // 1. 候选题目筛选（按章节）—— 使用预建索引 O(1) 查找
  const selectedChapters = Object.keys(cfg.chapters).filter(c => (cfg.chapters[c]||0) > 0);
  const idx = _getQuestionIndex();
  let candidates;
  if(selectedChapters.length > 0){
    candidates = [];
    for(const ch of selectedChapters){
      const arr = idx.byChapter[ch];
      if(arr) candidates.push(...arr);
    }
    if(candidates.length === 0) return [];
  } else {
    candidates = idx.all;
  }

  // 2. 按题型分组（直接复用预建索引）
  const byType = idx.byType;

  // 3. 应用错题/未答优先级
  const answeredIdx = APP._answeredIdx;
  const wrongSet = APP._wrongSet;
  const totalNeeded = Object.values(cfg.types).reduce((a,b)=>a+(+b||0), 0);

  function prioritySort(arr, ratio, kind){
    if(!ratio || ratio <= 0) return shuffle(arr);
    const target = Math.min(arr.length, Math.ceil(arr.length * ratio / 100));
    let priorityList = [];
    if(kind==='wrong' && wrongSet){
      priorityList = arr.filter(q => wrongSet.has(q._idx));
    } else if(kind==='unanswered'){
      priorityList = arr.filter(q => !answeredIdx.has(q._idx) && (!wrongSet || !wrongSet.has(q._idx)));
    }
    priorityList = shuffle(priorityList);
    const pSet = new Set(priorityList.map(q=>q._idx));
    const remaining = arr.filter(q => !pSet.has(q._idx));
    return [...priorityList.slice(0, target), ...shuffle(remaining)];
  }

  // 4. 每题型抽取（带去重 + 早停）
  const result = [];
  const seen = new Set();
  const typeCount = {}; // 当前题型已抽数量
  Object.entries(cfg.types).forEach(([type, count])=>{
    if(!count) return;
    if(result.length >= totalNeeded) return;
    let pool = byType[type] || [];
    if(!pool.length) return;

    // 若限定了章节，需二次过滤
    if(selectedChapters.length > 0){
      const candSet = new Set(candidates.map(c=>c._idx));
      pool = pool.filter(q => candSet.has(q._idx));
      if(!pool.length) return;
    }

    let sorted = pool;
    if(cfg.wrongPriority && cfg.wrongRatio > 0){
      sorted = prioritySort(sorted, cfg.wrongRatio, 'wrong');
    } else if(cfg.unanswerPriority && cfg.unanswerRatio > 0){
      sorted = prioritySort(sorted, cfg.unanswerRatio, 'unanswered');
    } else if(cfg.shuffleWithinType){
      sorted = shuffle(sorted);
    }

    let added = 0;
    for(const q of sorted){
      if(added >= count) break;
      if(result.length >= totalNeeded) break;
      if(seen.has(q._idx)) continue;
      seen.add(q._idx);
      result.push(q);
      added++;
    }
    typeCount[type] = added;
  });

  return result;
}

/* ===== 题目预建索引（按章节/题型分桶 + answered/wrong 索引） ===== */
let _qIndexCache = null;
let _qIndexCacheVer = -1;
function _getQuestionIndex(){
  const ver = APP.questions.length;
  if(_qIndexCache && _qIndexCacheVer === ver && _qIndexCache.wrongVer === (APP.wrong?APP.wrong.length:0)) {
    return _qIndexCache;
  }
  const byChapter = {};
  const byType = {};
  const all = [];
  const wrongSet = new Set(APP.wrong||[]);
  const answeredIdx = new Set();
  APP.history.forEach(h => (h.questions||[]).forEach(idx => answeredIdx.add(idx)));
  APP.questions.forEach((q,i)=>{
    const enriched = { ...q, _idx:i, _isWrong: wrongSet.has(i) };
    all.push(enriched);
    (byChapter[q.chapter] = byChapter[q.chapter] || []).push(enriched);
    (byType[q.type] = byType[q.type] || []).push(enriched);
  });
  _qIndexCache = { byChapter, byType, all, wrongVer: APP.wrong?APP.wrong.length:0 };
  _qIndexCacheVer = ver;
  APP._answeredIdx = answeredIdx;
  APP._wrongSet = wrongSet;
  return _qIndexCache;
}

function bulkSetScore(type, score){
  // 修复：直接更新分值覆盖，避免重新打开模态框导致卡顿
  const pool = drawQuestionPool(APP._meConfig);
  pool.forEach(q=>{ if(q.type===type) APP._meConfig.scoreOverrides[q._idx] = score; });
  // 刷新预览区域
  previewMEQuestionPool();
  // 局部刷新模态框内的分值小计显示
  const headEl = document.querySelector('.qe-section-head .qe-section-count');
  if(headEl){
    // 找到对应的 section 重新计算小计
    document.querySelectorAll('.qe-section').forEach(sec=>{
      const txt = sec.querySelector('.qe-section-head span')?.textContent || '';
      if(txt.startsWith(type+' · ')){
        const subTotalEl = sec.querySelector('.qe-section-count');
        if(subTotalEl){
          const ds = APP._meConfig.defaultScore[type] || ME_DEFAULT_SCORE[type] || 1;
          let subtotal = 0;
          sec.querySelectorAll('input[type=number]').forEach((inp,i)=>{
            if(i===0) return; // 跳过批量设置输入框
            subtotal += (+inp.value || 0);
          });
          subTotalEl.textContent = `小计 ${subtotal} 分`;
        }
      }
    });
  }
  toast('已批量设置 '+type+' 分值','success');
}

/* ===== 4+5. 启动考试 + 答题流程（含答题卡、交卷二次确认） ===== */
function startMockExam(){
  if(!APP._meConfig) {toast('请先配置试卷','warning');return;}
  const cfg = APP._meConfig;
  const pool = drawQuestionPool(cfg);
  if(!pool.length) {toast('抽题结果为空，请调整配置','danger');return;}

  const totalQ = pool.length;
  const totalScore = pool.reduce((s,q)=>s + (cfg.scoreOverrides[q._idx] || cfg.defaultScore[q.type] || ME_DEFAULT_SCORE[q.type] || 1), 0);

  // 按试卷布局顺序排列（先按 typeOrder，再组内随机）
  const ordered = [];
  cfg.typeOrder.forEach(t=>{
    const items = pool.filter(q=>q.type===t);
    if(!items.length) return;
    const sorted = cfg.shuffleWithinType ? shuffle(items) : items;
    sorted.forEach(q => ordered.push(q));
  });

  APP.quiz = {
    indices: ordered.map(q=>q._idx),
    current: 0,
    answers: {},
    flagged: new Set(),
    startTime: Date.now(),
    submitted: false,
    mode: 'mock_exam',
    timeLimit: (cfg.timeLimit || 60) * 60, // 秒
    config: JSON.parse(JSON.stringify(cfg)), // 深拷贝
    scores: {}, // { idx: score }
    typeOrder: cfg.typeOrder.slice(),
    totalScore,
  };
  // 写入分值
  ordered.forEach(q=>{
    APP.quiz.scores[q._idx] = cfg.scoreOverrides[q._idx] || cfg.defaultScore[q.type] || ME_DEFAULT_SCORE[q.type] || 1;
  });

  APP.timer = null;
  APP.examTimer = null;
  APP._acTypeIdx = 0;
  APP._acInnerPage = 0;
  go('quiz');
  toast(`已生成 ${totalQ} 题模拟试卷，总分 ${totalScore} 分`,'success');
}

function filterMERecords(){

  if(kw) list = list.filter(r => (r.name||'').toLowerCase().includes(kw) || (r.date||'').toLowerCase().includes(kw));
  list.sort((a,b)=>{
    if(sort==='timeDesc') return new Date(b.date)-new Date(a.date);
    if(sort==='timeAsc') return new Date(a.date)-new Date(b.date);
    if(sort==='scoreDesc') return (b.pct||0)-(a.pct||0);
    if(sort==='scoreAsc') return (a.pct||0)-(b.pct||0);
    return 0;
  });
  const wrap = document.getElementById('meRecordList');
  if(wrap) wrap.innerHTML = list.length ? list.map((r,i)=>renderMERecordCard(r, i)).join('') : '<div style="padding:30px;text-align:center;color:var(--text3);">无匹配记录</div>';

function exportMERecord(id){
  const r = (APP.mockExamRecords||[]).find(x=>x.id===id);
  if(!r) return;
  const lines = [];
  lines.push(`# ${r.name}`);
  lines.push(`# 日期：${new Date(r.date).toLocaleString('zh-CN')}`);
  lines.push(`# 得分：${r.scoreEarned}/${r.totalScore}（${r.pct}%）`);
  lines.push(`# 用时：${Math.floor(r.elapsed/60)}分${r.elapsed%60}秒`);
  lines.push('='.repeat(60));
  r.indices.forEach((idx,i)=>{
    const q = APP.questions[idx];
    if(!q) return;
    const myAns = r.answers[idx];
    const isCorrect = r.scores?.[idx] > 0 && checkAnswer(q, myAns);
    lines.push(`\n[${i+1}] ${isCorrect?'✓':'✗'} ${q.type} · ${q.chapter||'未分类'} · ${r.scores?.[idx]||0}分`);
    lines.push(`题干：${q.q}`);
    q.opts.forEach((o,k)=>lines.push(`  ${'ABCDEFGH'[k]}. ${o}`));
    lines.push(`正确答案：${q.ans.replace(/\|/g,'、')}`);
    lines.push(`你的答案：${myAns===null||myAns===undefined?'未答':Array.isArray(myAns)?myAns.map(i=>q.opts[i]).join('、'):q.opts[myAns]}`);
    if(q.explain) lines.push(`解析：${q.explain}`);
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `模拟考_${r.name}_${new Date(r.date).toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出为 TXT','success');
}

function importMEConfig(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const cfg = JSON.parse(ev.target.result);
      if(!cfg.types || typeof cfg.types !== 'object') throw new Error('配置文件格式错误');
      APP._meConfig = cfg;
      STORAGE.save();
      renderMockExam();
      toast('配置已导入','success');

  };
  reader.readAsText(file);
  e.target.value = '';
}

/* 工具：洗牌 */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* 转义辅助 */
function escapeAttr(s){return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function escapeHtmlId(s){return String(s||'').replace(/[^a-zA-Z0-9_\u4e00-\u9fa5]/g,'_').slice(0,40);}

/* 保存模拟考试记录（供 finishMockExam 调用） */
function saveMockExamRecord(qz, scoreEarned, totalScore, correct, total){
  const cfg = qz.config || APP._meConfig || {};
  const record = {
    id: 'me_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name: cfg.name || '模拟考试',
    date: new Date().toISOString(),
    total, correct, pct: total?Math.round(correct/total*100):0,
    elapsed: qz.elapsed || 0,
    mode: 'mock_exam',
    indices: qz.indices.slice(),
    answers: JSON.parse(JSON.stringify(qz.answers||{})),
    scores: JSON.parse(JSON.stringify(qz.scores||{})),
    totalScore,
    scoreEarned,
    typeOrder: (qz.typeOrder||cfg.typeOrder||[]).slice(),
    config: cfg,
  };
  if(!APP.mockExamRecords) APP.mockExamRecords = [];
  APP.mockExamRecords.unshift(record);
  // 限制最多保留 50 份
  if(APP.mockExamRecords.length > 50){
    APP.mockExamRecords = APP.mockExamRecords.slice(0, 50);
    toast('历史试卷已达上限 50 份，已自动清理最早记录','warning');
  }
  STORAGE.save();
  return record;
}

    <div class="ach-rarity-grid">
      ${['common','uncommon','rare','epic','legendary'].map(r=>{
        const labels = {common:'普通·铜翼',uncommon:'高级·银翼',rare:'稀有·金翼',epic:'史诗·铂翼',legendary:'传说·钻翼'};
        const icons = {common:'🥉',uncommon:'🥈',rare:'🥇',epic:'💠',legendary:'👑'};
        const total = rarityCount[r];
        const unc = rarityUnlocked[r];
        const pct = total ? Math.round(unc/total*100) : 0;
        return `<div class="ach-rarity-card" data-rarity="${r}">
          <div style="display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;">
            <div>
              <div class="arc-val">${unc}<span style="font-size:.7rem;color:var(--text3);font-weight:600;">/${total}</span></div>

            </div>
            <div style="font-size:1.4rem;font-weight:800;color:var(--rarity-color);opacity:.9;">${pct}%</div>
          </div>
          <div class="arc-bar"><div class="arc-bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>

      ${BADGE_CATEGORIES.map(c=>{
        const count = c.id==='all' ? BADGES.length : BADGES.filter(b=>b.cat===c.id).length;
        const unc = c.id==='all' ? unlocked.length : unlocked.filter(b=>b.cat===c.id).length;
        return `<div class="ach-tab-v2 ${filterCat===c.id?'active':''}" onclick="renderAchievementCat('${c.id}')">${c.icon} ${c.label} <span class="at-count-v2">${unc}/${count}</span></div>`;

        const rarityLabels = {common:'普通',uncommon:'高级',rare:'稀有',epic:'史诗',legendary:'传说'};
        const circumference = 2 * Math.PI * 30; // r=30
        const offset = circumference * (1 - progress/100);
        return `
          <div class="badge-card-v2 ${isUnlocked?'':'locked'}" data-rarity="${b.rarity}" ${isUnlocked?'title="✅ 已解锁"':'title="🔒 未解锁 ('+Math.round(progress)+'%)"'}>

              </svg>
              <div class="bcv-icon">${isHidden?'❓':b.icon}</div>
            </div>
            <div class="bcv-name">${isHidden?'???':b.name}</div>
            <div class="bcv-rarity">${rarityLabels[b.rarity]||'普通'}</div>
            <div class="bcv-desc">${isHidden?'满足条件后揭晓':b.desc}</div>
            ${!isUnlocked && !isHidden ? `
              <div class="bcv-progress"><div class="bcv-progress-fill" style="width:${progress}%"></div></div>
              <div class="bcv-progress-meta"><span>${Math.round(progress)}%</span><span>解锁中</span></div>
            ` : isUnlocked ? `
              <div class="bcv-progress-meta" style="color:var(--primary);justify-content:center;background:var(--primary-soft);border-radius:6px;padding:3px 0;margin-top:6px;"><span>✅ 已解锁 · ${b.points} 分</span></div>
            ` : `<div class="bcv-progress-meta" style="justify-content:center;"><span>???</span></div>`}
          </div>
        `;
      }).join('')}
    </div>
  `;

  // 绑定分类切换
  window.renderAchievementCat = function(cat){
    APP._achFilter = cat;
    renderAchievement();
    // 滚动到顶部
    window.scrollTo({top:0,behavior:'smooth'});
  };
}

/* ===== 数据导出 ===== */
function exportData(){
  try{
    APP.exportCount = (APP.exportCount||0) + 1;
    const data = {
      questions: APP.questions,
      history: APP.history,
      wrong: APP.wrong,
      favorites: APP.favorites,
      totalAnswered: APP.totalAnswered,
      totalCorrect: APP.totalCorrect,
      segmentPoints: APP.segmentPoints||0,
      exportCount: APP.exportCount,
      designStyle: APP.designStyle,
      badgeUnlocked: BADGES.map(b=>({id:b.id,unlocked:b.unlocked})),
      exportTime: new Date().toISOString(),
      version: '2.0',
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `春秋刷题数据_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    STORAGE.save();
    toast(`数据导出成功！已导出 ${APP.exportCount} 次`,'success');
    // 触发隐藏成就检测
    if(APP.exportCount>=3) checkAndUnlockBadges(0,0,0,0);
  }catch(e){
    toast('导出失败：'+e.message,'danger');
  }
}

/* ===== 数据导入 ===== */
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(data.questions && data.questions.length){
        APP.questions = data.questions;
        if(data.history) APP.history = data.history;
        if(data.wrong) APP.wrong = data.wrong;
        if(data.favorites) APP.favorites = data.favorites;
        if(data.totalAnswered) APP.totalAnswered = data.totalAnswered;
        if(data.totalCorrect) APP.totalCorrect = data.totalCorrect;
        // 恢复成就状态
        if(data.badgeUnlocked && data.badgeUnlocked.length){
          data.badgeUnlocked.forEach(saved=>{
            const b = BADGES.find(x=>x.id===saved.id);
            if(b) b.unlocked = saved.unlocked;
          });
        }
        STORAGE.save();
        toast(`成功导入 ${data.questions.length} 道题目！`,'success');
        renderSettings();
      } else {
        toast('JSON文件中未找到有效题目数据','danger');
      }
    }catch(err){
      toast('JSON解析失败：'+err.message,'danger');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ===== 删除单道题目 ===== */
function deleteQuestion(idx){
  if(idx<0 || idx>=APP.questions.length) return;
  const q = APP.questions[idx];
  const preview = (q.q||'').slice(0,40) + ((q.q||'').length>40?'...':'');
  modal({
    title:'确认删除这道题目？',
    body:`<div style="line-height:1.7;">第 <b>${idx+1}</b> 题：<br><br><div style="background:var(--bg);padding:12px;border-radius:8px;border-left:3px solid var(--warning);font-size:.9rem;">${escapeHtml(preview)}</div><br>此操作不可撤销！</div>`,
    okText:'确认删除',
    onOk:()=>{
      APP.questions.splice(idx, 1);
      // 同时清理错题和收藏中的引用
      APP.wrong = APP.wrong.filter(w => w.idx !== idx).map(w => w.idx>idx ? {...w, idx:w.idx-1} : w);
      APP.favorites = APP.favorites.filter(f => f !== idx).map(f => f>idx ? f-1 : f);
      STORAGE.save();
      toast(`已删除第 ${idx+1} 题，剩余 ${APP.questions.length} 道`,'success');
      // 刷新当前页面
      const cur = APP.currentPage;
      go(cur);
    }
  });
}

/* ===== 批量删除题目 ===== */
function batchDeleteQuestions(){
  if(!APP._selected || APP._selected.size === 0){
    toast('请先勾选要删除的题目','warning');
    return;
  }
  const count = APP._selected.size;
  modal({
    title:`确认删除 ${count} 道题目？`,
    body:`<div style="line-height:1.7;">将批量删除选中的 <b style="color:var(--danger)">${count}</b> 道题目。<br>此操作不可撤销！</div>`,
    okText:'确认删除',
    onOk:()=>{
      // 按索引降序删除（避免索引错位）
      const sorted = [...APP._selected].sort((a,b)=>b-a);
      for(const idx of sorted){
        APP.questions.splice(idx, 1);
      }
      APP._selected = new Set();
      // 清理错题和收藏引用
      APP.wrong = APP.wrong.filter(w => !sorted.includes(w.idx)).map(w => ({...w, idx: w.idx - sorted.filter(i=>i<w.idx).length}));
      APP.favorites = APP.favorites.filter(f => !sorted.includes(f)).map(f => f - sorted.filter(i=>i<f).length);
      STORAGE.save();
      toast(`已批量删除 ${count} 题，剩余 ${APP.questions.length} 道`,'success');
      const cur = APP.currentPage;
      go(cur);
    }
  });
}

// ============================================
// Onboarding 存储兼容层（本地/Session/内存三级回退）
// 解决 Safari 隐私模式 / file:// 下 localStorage 写入失败导致的引导重复弹出
// ============================================
let _onbDoneMem = false;       // 内存标记：本次会话内已完成
function _onbStorageWrite(){
  try{ localStorage.setItem('spring_onb_done', '1'); }catch(e){ /* 隐私模式等静默 */ }
  try{ sessionStorage.setItem('spring_onb_done', '1'); }catch(e){}
  _onbDoneMem = true;
}
function isOnbDone(){
  if(_onbDoneMem) return true;
  try{ if(localStorage.getItem('spring_onb_done')) { _onbDoneMem = true; return true; } }catch(e){}
  try{ if(sessionStorage.getItem('spring_onb_done')) { _onbDoneMem = true; return true; } }catch(e){}
  return false;
}

let onbIndex = 0;
let _onbPrevScrollY = 0;   // 记录进入引导前的滚动位置（修复 iPad 引导结束后页面停留在半屏、开始按钮不可见）
function startOnboarding(force){
  if(!force && isOnbDone()) return;
  onbIndex = 0;
  _onbPrevScrollY = window.scrollY || 0;
  // 启动引导时隐藏"重看引导"按钮（避免与引导同时显示造成 UI 重叠）
  const replayBtn = document.getElementById('replayOnb');
  if(replayBtn) replayBtn.style.display = 'none';
  document.getElementById('onbOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  renderOnboardingStep();
}
function renderOnboardingStep(){
  const step = ONB_STEPS[onbIndex];
  const total = ONB_STEPS.length;
  // 步骤指示
  document.getElementById('onbStep').innerHTML = `<span class="onb-step-icon">${onbIndex+1}</span> STEP ${onbIndex+1} / ${total}`;
  document.getElementById('onbTitle').textContent = step.title;
  document.getElementById('onbDesc').textContent = step.desc;
  document.getElementById('onbNextBtn').innerHTML = onbIndex === total-1 ? '🚀 开始旅程' : '下一步 →';
  document.getElementById('onbNextBtn').className = onbIndex === total-1 ? 'onb-finish' : 'onb-next';
  // 首步显示"跳过引导"（避免用户被引导卡住），后续步骤显示"上一步"
  const prevBtn = document.getElementById('onbPrevBtn');
  if(onbIndex === 0){
    prevBtn.innerHTML = '↪ 跳过引导';
    prevBtn.className = 'onb-skip';
    prevBtn.onclick = ()=>{ endOnboarding(); };
  } else {
    prevBtn.innerHTML = '← 上一步';
    prevBtn.className = 'onb-skip';
    prevBtn.onclick = ()=>{ prevOnboarding(); };
  }
  document.getElementById('onbProgress').innerHTML = ONB_STEPS.map((_,i)=>{
    let cls = 'dot';
    if(i < onbIndex) cls += ' done';
    else if(i === onbIndex) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  const spotlight = document.getElementById('onbSpotlight');
  const tooltip = document.getElementById('onbTooltip');
  const maskTop = document.getElementById('onbMaskTop');
  const maskRight = document.getElementById('onbMaskRight');
  const maskBottom = document.getElementById('onbMaskBottom');
  const maskLeft = document.getElementById('onbMaskLeft');

  // 居中模式（无 selector）
  if(!step.selector){
    spotlight.style.display = 'none';
    tooltip.dataset.arrow = 'none';
    tooltip.style.position = 'fixed';
    if(window.innerWidth <= 768){
      // 窄屏：底部贴齐
      tooltip.style.left = '12px';
      tooltip.style.right = '12px';
      tooltip.style.bottom = '16px';
      tooltip.style.top = 'auto';
      tooltip.style.transform = 'none';
    } else {
      tooltip.style.left = '50%';
      tooltip.style.top = '50%';
      tooltip.style.transform = 'translate(-50%,-50%)';
    }
    // 全屏遮罩
    maskTop.style.cssText = 'top:0;height:100%;left:0;width:100%;';
    maskRight.style.cssText = 'display:none;';
    maskBottom.style.cssText = 'display:none;';
    maskLeft.style.cssText = 'display:none;';
    return;
  }

  const el = document.querySelector(step.selector);
  if(!el){
    // 元素未找到，改为全屏居中
    spotlight.style.display = 'none';
    tooltip.dataset.arrow = 'none';
    tooltip.style.position = 'fixed';
    if(window.innerWidth <= 768){
      tooltip.style.left = '12px';
      tooltip.style.right = '12px';
      tooltip.style.bottom = '16px';
      tooltip.style.top = 'auto';
      tooltip.style.transform = 'none';
    } else {
      tooltip.style.left = '50%';
      tooltip.style.top = '50%';
      tooltip.style.transform = 'translate(-50%,-50%)';
    }
    maskTop.style.cssText = 'top:0;height:100%;left:0;width:100%;';
    maskRight.style.cssText = 'display:none;';
    maskBottom.style.cssText = 'display:none;';
    maskLeft.style.cssText = 'display:none;';
    return;
  }

  // 立即同步滚动到中央（避免 smooth 异步问题）
  // 使用 window.scrollTo + getBoundingClientRect 显式计算，确保跨浏览器一致
  const tmpR = el.getBoundingClientRect();
  const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 60;
  const targetY = window.scrollY + tmpR.top - (window.innerHeight - tmpR.height) / 2 + topbarH/2;
  try {
    window.scrollTo({top: Math.max(0, targetY), left: 0, behavior: 'auto'});
  } catch(e) {
    window.scrollTo(0, Math.max(0, targetY));
  }
  // 强制 reflow 同步布局
  void document.body.offsetHeight;

  // 用双 RAF + setTimeout 链确保布局稳定
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>positionOnboarding(el, step), 120);
    });
  });
}

// 集中处理位置计算，单独函数便于重试
function positionOnboarding(el, step){
  const spotlight = document.getElementById('onbSpotlight');
  const tooltip = document.getElementById('onbTooltip');
  const maskTop = document.getElementById('onbMaskTop');
  const maskRight = document.getElementById('onbMaskRight');
  const maskBottom = document.getElementById('onbMaskBottom');
  const maskLeft = document.getElementById('onbMaskLeft');
  const vw = window.innerWidth, vh = window.innerHeight;
  // 响应式：平板/手机上 tooltip 改为底部贴齐（由 CSS !important 接管）
  const isNarrow = vw <= 768;

  // 检查元素是否在视口内
  let r = el.getBoundingClientRect();
  if(r.width === 0 || r.height === 0){
    // 元素不可见，强制居中并全屏遮罩
    spotlight.style.display = 'none';
    tooltip.style.position = 'fixed';
    if(!isNarrow){
      tooltip.style.left = '50%';
      tooltip.style.top = '50%';
      tooltip.style.transform = 'translate(-50%,-50%)';
    } else {
      tooltip.style.left = '12px';
      tooltip.style.right = '12px';
      tooltip.style.bottom = '16px';
      tooltip.style.transform = 'none';
    }
    tooltip.dataset.arrow = 'none';
    // 全屏遮罩
    maskTop.style.cssText = 'top:0;height:100%;left:0;width:100%;';
    maskRight.style.cssText = 'display:none;';
    maskBottom.style.cssText = 'display:none;';
    maskLeft.style.cssText = 'display:none;';
    return;
  }

  // 元素完全在视口外 → 再次滚动重试
  if(r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw){
    const topbarH2 = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 60;
    const targetY2 = window.scrollY + r.top - (vh - r.height) / 2 + topbarH2/2;
    try {
      window.scrollTo({top: Math.max(0, targetY2), left: 0, behavior: 'auto'});
    } catch(e) {
      window.scrollTo(0, Math.max(0, targetY2));
    }
    void document.body.offsetHeight;
    setTimeout(()=>positionOnboarding(el, step), 150);
    return;
  }

  const pad = isNarrow ? 6 : 8;

  // 1. 设置聚光灯位置（金色边框）
  const spLeft = r.left - pad;
  const spTop = r.top - pad;
  const spWidth = r.width + pad*2;
  const spHeight = r.height + pad*2;
  spotlight.style.display = 'block';
  spotlight.style.left = spLeft + 'px';
  spotlight.style.top = spTop + 'px';
  spotlight.style.width = spWidth + 'px';
  spotlight.style.height = spHeight + 'px';

  // 2. 4 个 mask div 拼接成"挖洞"效果
  // 顶部：覆盖 0 到 (r.top - pad)
  const topH = Math.max(0, r.top - pad);
  const rightW = Math.max(0, vw - (r.right + pad));
  const bottomH = Math.max(0, vh - (r.bottom + pad));
  const leftW = Math.max(0, r.left - pad);

  maskTop.style.cssText = `top:0;left:0;width:100%;height:${topH}px;`;
  maskRight.style.cssText = `top:${topH}px;right:0;width:${rightW}px;height:${vh - topH - bottomH}px;`;
  maskBottom.style.cssText = `bottom:0;left:0;width:100%;height:${bottomH}px;`;
  maskLeft.style.cssText = `top:${topH}px;left:0;width:${leftW}px;height:${vh - topH - bottomH}px;`;

  // 3. 智能定位 tooltip（窄屏直接走 CSS 底部贴齐）
  if(isNarrow){
    tooltip.style.position = 'fixed';
    tooltip.style.left = '12px';
    tooltip.style.right = '12px';
    tooltip.style.bottom = '16px';
    tooltip.style.top = 'auto';
    tooltip.style.transform = 'none';
    tooltip.dataset.arrow = 'none';
    return;
  }

  const tw = 360, th = 220;
  const margin = 20;
  const elCenterX = r.left + r.width/2;
  const elCenterY = r.top + r.height/2;

  // 计算各方向可用空间
  const spaceRight = vw - r.right - margin;
  const spaceLeft = r.left - margin;
  const spaceBottom = vh - r.bottom - margin;
  const spaceTop = r.top - margin;

  let arrow = 'left';
  let tLeft, tTop;

  // 优先右侧
  if(spaceRight >= tw + margin){
    tLeft = r.right + margin;
    tTop = elCenterY - th/2;
    arrow = 'left';
  }
  // 其次左侧
  else if(spaceLeft >= tw + margin){
    tLeft = r.left - tw - margin;
    tTop = elCenterY - th/2;
    arrow = 'right';
  }
  // 再次下方
  else if(spaceBottom >= th + margin){
    tLeft = elCenterX - tw/2;
    tTop = r.bottom + margin;
    arrow = 'top';
  }
  // 最后上方
  else{
    tLeft = elCenterX - tw/2;
    tTop = r.top - th - margin;
    arrow = 'bottom';
  }

  // 边界保护
  tLeft = Math.max(20, Math.min(vw - tw - 20, tLeft));
  tTop = Math.max(80, Math.min(vh - th - 20, tTop));

  tooltip.style.position = 'fixed';
  tooltip.style.left = tLeft + 'px';
  tooltip.style.top = tTop + 'px';
  tooltip.style.transform = 'none';
  tooltip.dataset.arrow = arrow;
}
function nextOnboarding(){
  if(onbIndex < ONB_STEPS.length - 1){
    onbIndex++;
    renderOnboardingStep();
  } else {
    endOnboarding();
  }
}
function prevOnboarding(){
  if(onbIndex > 0){
    onbIndex--;
    renderOnboardingStep();
  }
}
function endOnboarding(){
  // 无论后续是否异常，都必须结束引导 → 先写完成标记，再强制关闭
  _onbStorageWrite();
  try{
    document.getElementById('onbOverlay').classList.remove('show');
    document.body.style.overflow = '';
    const btn = document.getElementById('replayOnb');
    if(btn) btn.style.display = 'none';
  }catch(e){}
  setTimeout(()=>{ try{ toast('🎉 引导完成，祝飞行愉快！','success'); }catch(e){} }, 300);
  // 恢复滚动位置，避免引导结束后页面停留在半屏（iPad 上开始按钮被滚出视口、误以为无法点击）
  try{ window.scrollTo(0, _onbPrevScrollY || 0); }catch(e){}
}
// 重新观看引导
function replayOnboarding(){
  document.getElementById('onbStep').textContent = '';
  startOnboarding(true);
}
window.addEventListener('resize', ()=>{
  if(document.getElementById('onbOverlay').classList.contains('show')) renderOnboardingStep();
  // 视口变化时不再显示"重看引导"浮动按钮（仅在客舱设置中可启动）
  const btn = document.getElementById('replayOnb');
  if(btn && !document.getElementById('onbOverlay').classList.contains('show')){
    btn.style.display = 'none';
  }
});

/* ============================================

   ============================================ */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.ripple, .btn-primary, .btn-gold, .btn-danger, .es-cta, .ach-tab, .mode-btn, .theme-btns button, .flight-ticket, .metric-card, .badge-card');
  if(!btn) return;
  // 排除已经标记 ripple 的元素
  if(!btn.classList.contains('ripple')) btn.classList.add('ripple');
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size/2;
  const y = e.clientY - rect.top - size/2;
  const wave = document.createElement('span');
  wave.className = 'ripple-wave';
  wave.style.width = size + 'px';
  wave.style.height = size + 'px';
  wave.style.left = x + 'px';
  wave.style.top = y + 'px';
  btn.appendChild(wave);
  setTimeout(()=>wave.remove(), 600);
}, true);

/* ============================================
   快捷键支持
   ============================================ */
document.addEventListener('keydown', function(e){
  // 在输入框/文本域内不响应快捷键
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if(e.ctrlKey || e.metaKey || e.altKey) {
    if(e.key === 'Enter' && APP.currentPage === 'quiz' && APP.quiz && !APP.quiz.submitted){
      e.preventDefault();
      confirmFinish();
    }
    return;
  }
  if(APP.currentPage === 'mock_exam' && APP._meTab === 'builder'){
    // 配置页快捷键
    const key = e.key.toLowerCase();
    if(key === 'arrowright' || key === 'arrowleft'){
      e.preventDefault();
      if(key === 'arrowright') goMENext();
      else goMEPrev();
      return;
    }
  }
  if(APP.currentPage === 'quiz' && APP.quiz && !APP.quiz.submitted){
    const key = e.key.toLowerCase();
    // Alt+←/→ 或 Shift+←/→：翻页（保留 ←/→ 为切题）
    if((key === 'arrowleft' && (e.altKey || e.shiftKey))){e.preventDefault(); acPrevPage(); return;}
    if((key === 'arrowright' && (e.altKey || e.shiftKey))){e.preventDefault(); acNextPage(); return;}
    // 切题（避免在多选模式使用空格跳转）
    if(key === 'arrowright' || (key === ' ' && APP.questions[APP.quiz.indices[APP.quiz.current]].type !== '多选' && !APP.quiz.answers[APP.quiz.indices[APP.quiz.current]])){
      e.preventDefault(); nextQ();
    }
    else if(key === 'arrowleft' || (key === ' ' && e.shiftKey)){e.preventDefault(); prevQ();}
    else if(key === 'f'){e.preventDefault(); toggleFlag();}
    else if(key === 'p'){e.preventDefault(); togglePauseExam();}
    else if(key === 'j'){e.preventDefault(); jumpToNextUnanswered();}
    else if(key === 'g'){e.preventDefault(); jumpToNextFlagged();}
    else if(key === 'c'){e.preventDefault(); toggleAnswerCard();}
    else if(key === 'pageup'){e.preventDefault(); acPrevPage();}
    else if(key === 'pagedown'){e.preventDefault(); acNextPage();}
    else if(key === 'home'){e.preventDefault(); acJumpToGlobalPage(1);}
    else if(key === 'end'){e.preventDefault(); acJumpToGlobalPage(_acTotalInnerPages());}
    else if(/^[1-9]$/.test(key)){
      const idx = +key - 1;
      const qz = APP.quiz;
      const qi = qz.indices[qz.current];
      const q = APP.questions[qi];
      if(q && q.opts[idx] !== undefined){
        pickOpt(idx);
      }
    }
    else if(/^[a-h]$/.test(key)){
      const idx = key.charCodeAt(0) - 97;
      const qz = APP.quiz;
      const qi = qz.indices[qz.current];
      const q = APP.questions[qi];
      if(q && q.opts[idx] !== undefined){
        pickOpt(idx);
      }
    }
    // Esc 关闭模态框 / 在模拟考试配置页返回上一步
    else if(key === 'escape'){
      const modal = document.getElementById('modal');
      if(modal) modal.remove();
      // 配置页面时返回上一步
      if(APP.page === 'mock_exam' && APP._meTab === 'builder' && typeof APP._meStep === 'number' && APP._meStep > 0){
        e.preventDefault();
        goMEPrev();
      }
    }
  }
});

let _swipeStartX = 0, _swipeStartY = 0, _swipeStartT = 0, _swipeActive = false;
document.addEventListener('touchstart', (e)=>{
  if(APP.currentPage !== 'quiz' || !APP.quiz || APP.quiz.submitted) return;
  if(APP.swipeEnabled === false) return;
  // 只在题目区响应（避免和答题卡、解析区冲突）
  const target = e.target;
  const inQuestion = target.closest('.boarding-pass') || target.closest('.bp-body');
  if(!inQuestion) return;
  if(e.touches.length !== 1) return;
  _swipeStartX = e.touches[0].clientX;
  _swipeStartY = e.touches[0].clientY;
  _swipeStartT = Date.now();
  _swipeActive = true;
}, {passive: true});

document.addEventListener('touchmove', (e)=>{
  if(!_swipeActive) return;
  // 仅跟踪水平距离用于提示
}, {passive: true});

document.addEventListener('touchend', (e)=>{
  if(!_swipeActive) return;
  _swipeActive = false;
  if(APP.currentPage !== 'quiz' || !APP.quiz || APP.quiz.submitted) return;
  if(APP.swipeEnabled === false) return;
  if(e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - _swipeStartX;
  const dy = e.changedTouches[0].clientY - _swipeStartY;
  const dt = Date.now() - _swipeStartT;
  // 滑动判定：水平位移 > 60px，垂直位移不超过水平 1.2 倍，耗时 < 600ms
  if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 1.2 || dt > 800) return;
  if(dx > 0){
    // 右滑：上一题
    prevQ();
    if(window.toast) toast('👈 上一题', 'info');
  } else {
    // 左滑：下一题
    nextQ();
    if(window.toast) toast('👉 下一题', 'info');
  }
}, {passive: true});

/* 切换模拟考试暂停状态 */
function togglePauseExam(){
  if(!APP.quiz || APP.quiz.submitted) return;
  if(!APP.quiz.isMock && !APP.quiz.isExam) {
    toast('暂停功能仅在考试/模拟考试模式下可用','info');
    return;
  }
  const existing = document.getElementById('examPauseOverlay');
  if(existing){
    existing.remove();
    APP.quiz._paused = false;
    APP.quiz.startTime = Date.now() - (APP.quiz._pausedElapsed || 0);
    return;
  }
  APP.quiz._paused = true;
  APP.quiz._pausedElapsed = (APP.quiz._pausedElapsed || (Date.now() - APP.quiz.startTime));
  if(APP.examTimer){clearInterval(APP.examTimer);APP.examTimer=null;}
  if(APP.timer){clearInterval(APP.timer);APP.timer=null;}
  const ov = document.createElement('div');
  ov.id = 'examPauseOverlay';
  ov.className = 'exam-pause-overlay';
  ov.innerHTML = `
    <div class="epo-card">
      <div class="epo-icon">⏸</div>
      <h2>考试已暂停</h2>
      <p>计时已冻结，休息一下再继续</p>
      <p style="color:var(--text3);font-size:.82rem;margin-top:6px;">按 <kbd>P</kbd> 键 或点击按钮继续</p>
      <button onclick="togglePauseExam()" style="margin-top:16px;">▶ 继续答题</button>
    </div>
  `;
  document.body.appendChild(ov);
  toast('已暂停（按 P 继续）','info');
}

/* 跳转到下一道未答题 */
function jumpToNextUnanswered(){
  if(!APP.quiz) return;
  const qz = APP.quiz;
  const start = qz.current;
  for(let i=1; i<=qz.indices.length; i++){
    const idx = qz.indices[(start+i) % qz.indices.length];
    const a = qz.answers[idx];
    const q = APP.questions[idx];
    const answered = a!==undefined && (q.type==='多选'?(a&&a.length>0):a!==null);
    if(!answered){
      qz.current = (start+i) % qz.indices.length;
      renderQuiz();
      return;
    }
  }
  toast('已是全部完成状态 🎉','success');
}

/* 跳转到下一道标记题 */
function jumpToNextFlagged(){
  if(!APP.quiz) return;
  const qz = APP.quiz;
  const start = qz.current;
  for(let i=1; i<=qz.indices.length; i++){
    const idx = qz.indices[(start+i) % qz.indices.length];
    if(qz.flagged.has(idx)){
      qz.current = (start+i) % qz.indices.length;
      renderQuiz();
      return;
    }
  }
  toast('没有标记的题目','info');
}

// 切换设计风格面板的展开/收起状态
let ssHideTimer = null;
function toggleStyleSwitcher(){
  const sw = document.getElementById('styleSwitcher');
  if(!sw) return;
  if(sw.classList.contains('collapsed')) expandStyleSwitcher();
  else collapseStyleSwitcher();
}
function expandStyleSwitcher(){
  const sw = document.getElementById('styleSwitcher');
  if(!sw) return;
  sw.classList.remove('collapsed');
  // 桌面端：悬停时持续展开，无操作 3s 后自动收起
  if(window.innerWidth > 768){
    clearTimeout(ssHideTimer);
    ssHideTimer = setTimeout(()=>collapseStyleSwitcher(), 3000);
  }
}
function collapseStyleSwitcher(){
  const sw = document.getElementById('styleSwitcher');
  if(!sw) return;
  sw.classList.add('collapsed');
  clearTimeout(ssHideTimer);
}
// 桌面端：鼠标悬停时持续展开，离开后 1.5s 收起
const _ssEl = document.getElementById('styleSwitcher');
if(_ssEl){
  _ssEl.addEventListener('mouseenter', ()=>{
    if(window.innerWidth > 768){
      clearTimeout(ssHideTimer);
      ssHideTimer = setTimeout(()=>collapseStyleSwitcher(), 3000);
    }
  });
  _ssEl.addEventListener('mouseleave', ()=>{
    if(window.innerWidth > 768){
      clearTimeout(ssHideTimer);
      ssHideTimer = setTimeout(()=>collapseStyleSwitcher(), 1500);
    }
  });
}

// Canvas roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(!Array.isArray(r)) r=[r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y);
    this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);
    this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);
    this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();
    return this;
  };
}

      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);
  }catch(e){}

  // Service Worker（stale-while-revalidate 策略 + 离线回退）
  const swCode = `
    const CACHE_NAME = 'spring-quiz-v10-offline-2026';
    const ASSETS = ['./', './index.html', location.href.split('#')[0]];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS).catch(()=>{})).then(()=>self.skipWaiting()));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
        )).then(()=>self.clients.claim())
      );
    });
    self.addEventListener('fetch', e => {
      if(e.request.method !== 'GET') return;
      if(e.request.url.startsWith('blob:') || e.request.url.startsWith('data:')) return;
      // 只缓存同源请求
      const url = new URL(e.request.url);
      if(url.origin !== location.origin && !e.request.url.startsWith(self.location.origin)){
        return; // 跨域请求直接走网络
      }
      e.respondWith(
        caches.match(e.request).then(cached => {
          // stale-while-revalidate：先返回缓存，同时后台更新
          const fetchPromise = fetch(e.request).then(resp => {
            if(resp && (resp.status === 200 || resp.type === 'opaque') && (resp.type === 'basic' || resp.type === 'default')){
              const clone = resp.clone();
              caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
            }
            return resp;
          }).catch(()=>cached);
          return cached || fetchPromise;
        }).catch(()=>{
          // 完全离线时回退到主页面
          return caches.match('./').then(html => html || new Response(
            '<!DOCTYPE html><html><body style="font-family:sans-serif;text-align:center;padding:40px;"><h2>✈️ 离线模式</h2><p>请在有网络时打开一次页面以启用离线。</p></body></html>',
            {headers:{'Content-Type':'text/html;charset=utf-8'}}
          ));
        })
      );
    });
    self.addEventListener('message', e => {
      if(e.data && e.data.type === 'CLEAR_CACHE'){
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))))
          .then(()=>e.ports[0] && e.ports[0].postMessage({ok:true}));
      }else if(e.data && e.data.type === 'CACHE_STATUS'){
        e.ports[0] && e.ports[0].postMessage({cached: true, version: CACHE_NAME});
      }
    });
  `;
  try{
    const blob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg => {
      // 标记为"已就绪"（离线可用）
      window.__offlineReady = true;

    }).catch(err => {
      console.warn('Service Worker 注册失败（不影响核心功能）:', err);
    });
  }catch(e){}
}

// 离线/在线状态指示（全局）
(function(){
  function updateOnlineStatus(){
    const status = document.getElementById('netStatus');
    const text = document.getElementById('netText');
    if(!status || !text) return;
    if(navigator.onLine){
      status.classList.remove('offline');
      text.textContent = '在线';
      status.title = '网络已连接';
    } else {
      status.classList.add('offline');
      text.textContent = '离线';
      status.title = '离线运行中（所有功能可用）';
    }
  }
  window.addEventListener('online', ()=>{ updateOnlineStatus(); toast('网络已恢复','success',1500); });
  window.addEventListener('offline', ()=>{ updateOnlineStatus(); toast('已切换至离线模式，所有功能仍可用','info',2500); });
  window.addEventListener('DOMContentLoaded', updateOnlineStatus);
  // 监听离线缓存就绪事件
  window.addEventListener('offline-ready', ()=>{
    const status = document.getElementById('netStatus');
    if(status) status.setAttribute('data-offline-ready','true');
  });
  // 版本信息（用于确认浏览器加载的是最新代码）
  console.log('%c✈️ 客舱乘务员题库 v2026.06.07-offline', 'background:#148453;color:#fff;padding:4px 10px;border-radius:4px;font-weight:bold;');

  console.log('%c提示: 断网后所有功能仍可用，App 已自动缓存到本地', 'color:#22C55E;font-weight:bold;');
})();
