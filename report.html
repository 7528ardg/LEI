<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#148453">
<title>事件报告 · 流程速查</title>
<style>
:root{--primary:#148453;--primary-dark:#0C5F3A;--gold:#F5B800;--danger:#E64A19;--blue:#2563EB;--purple:#7C3AED;--grad:linear-gradient(135deg,#148453 0%,#1FA56A 100%);--bg:#F5F8F6;--card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#B5C2BC;--border:#E5EDE9;--primary-soft:#E8F3EE;--danger-soft:#FEE7DE;--gold-soft:#FEF6DC;--blue-soft:#E0F0F6;--shadow:0 4px 14px rgba(20,132,83,.10)}
html[data-theme="dark"]{--bg:#0F1A14;--card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;--primary-soft:#1A3D2A;--danger-soft:#3A1D1D;--gold-soft:#2A2410;--blue-soft:#16233C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:860px;margin:0 auto;padding:12px 14px 70px;-webkit-overflow-scrolling:touch}
.top{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;padding:14px 16px 12px;box-shadow:0 4px 16px rgba(20,132,83,.18)}
.t-title{font-size:1.06rem;font-weight:800;letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.t-title .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.search{display:flex;gap:8px}
.search input{flex:1;border:none;border-radius:10px;padding:10px 14px;font-size:.9rem;outline:none;background:rgba(255,255,255,.95);color:#1B2B23}
.search button{border:none;border-radius:10px;padding:0 16px;background:rgba(255,255,255,.22);color:#fff;font-size:1rem;cursor:pointer}
.menu{position:sticky;top:58px;z-index:40;display:flex;gap:6px;background:var(--card);padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.menu::-webkit-scrollbar{display:none}
.m-tab{flex-shrink:0;padding:7px 13px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.m-tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(20,132,83,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.stat{text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--primary);font-weight:800}
.stat span{font-size:.66rem;color:var(--text2)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:12px 0}
.f-label{font-size:.68rem;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--bg);font-size:.76rem;color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.ev{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.ev-head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.ev-title{font-size:.95rem;font-weight:800;color:var(--text);flex:1;min-width:200px}
.ev-title em{font-style:normal;background:var(--gold-soft);color:#C99300;border-radius:4px;padding:0 3px}
.ev-badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:.66rem;padding:2px 8px;border-radius:10px;font-weight:700}
.b-cat{background:var(--blue-soft);color:var(--blue)}
.b-src{background:var(--primary-soft);color:var(--primary)}
.b-risk{background:var(--danger-soft);color:var(--danger)}
.flow{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.step{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.step-head{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:.78rem;font-weight:800;background:var(--primary-soft);color:var(--primary-dark)}
.step-head .ic{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.step-body{padding:8px 10px;font-size:.8rem;line-height:1.7;color:var(--text2)}
.step-body li{margin-left:16px}
.step-body strong{color:var(--text)}
.step-body .k{font-weight:700;color:var(--primary)}
.ded{margin-top:10px;background:var(--danger-soft);border:1px dashed var(--danger);border-radius:10px;padding:8px 10px;font-size:.76rem}
.ded .d-title{font-weight:800;color:var(--danger);margin-bottom:4px}
.ded li{margin-left:16px;line-height:1.6;color:var(--text2)}
.ded strong{color:var(--danger)}
.hotbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.hot{font-size:.72rem;padding:3px 10px;border-radius:12px;background:var(--primary-soft);color:var(--primary);cursor:pointer;border:1px solid transparent}
.hot:hover{border-color:var(--primary)}
.empty{text-align:center;padding:48px 16px;color:var(--text3)}
.empty .e-ic{font-size:3rem;display:block;margin-bottom:10px}
footer{color:var(--text3);font-size:.68rem;text-align:center;line-height:1.8;padding:20px 10px 8px;border-top:1px dashed var(--border);margin-top:16px}
</style>
</head>
<body>
<div class="top">
  <div class="t-title"><span class="logo">🗂</span><span>事件报告 · 完整流程速查</span></div>
  <div class="search">
    <input id="kw" placeholder="搜索：事件 / 关键词 / 章节号（如 3.6.5.4）…" autocomplete="off">
    <button onclick="doSearch()">🔍</button>
  </div>
</div>
<div class="stats">
  <div class="stat"><b id="st-n">0</b><span>报告流程</span></div>
  <div class="stat"><b id="st-cat">0</b><span>事件分类</span></div>
  <div class="stat"><b id="st-ded">0</b><span>关联扣分项</span></div>
  <div class="stat"><b id="st-phone">6</b><span>报告渠道</span></div>
</div>
<div class="menu" id="menu">
  <button class="m-tab active" data-v="all">🗂 全部流程</button>
  <button class="m-tab" data-v="hot">🔥 高频重点</button>
  <button class="m-tab" data-v="phone">📞 报告渠道</button>
</div>
<div id="app" class="container"></div>

      '值班电话：客舱部值班 18017321071；安监部值班 17717356347；保卫部值班 18017321082；AOC 021-32315801；航空医师 021-32315893 / 18017321073。'
    ]},
    {ph:'✅ 闭环·报告要求', items:[
      '报告详细陈述事件、导致原因与采取的措施，注意<strong>时间、地点、旅客姓名/地址、目击者信息、人员受伤情况</strong>。',
      '报告<strong>准确完整</strong>，只记录事件事实，避免有损任何人的评论。'
    ]}
  ],
  ded:[
    '未按规定上报不安全事件 → <strong>扣 5 分</strong>；迟报漏报 → <strong>扣 10 分</strong>；谎报瞒报 → <strong>扣 20 分</strong>（6.7.9.1 信息报告）',
    '同类问题年度内重复发生（90 日内第 3 次）→ 按原分值 <strong>1.5-2 倍</strong>扣罚（6.7.9.1 其他规定）'
  ]}
];

/* ============ 报告渠道 ============ */
const PHONES = [
  {d:'客舱部 值班手机', n:'18017321071', tag:'事件/运行上报'},
  {d:'安监部 值班手机', n:'17717356347', tag:'安全/差错上报'},
  {d:'保卫部 值班手机', n:'18017321082', tag:'安保/非法干扰'},
  {d:'AOC 运行中心', n:'021-32315801', tag:'机长上报通道'},
  {d:'航空医师', n:'021-32315893', tag:'卫生/医学事件'},
  {d:'航空医师 手机', n:'18017321073', tag:'卫生/医学事件'}
];

/* ============ 渲染 ============ */
const $ = id => document.getElementById(id);
let state = { v:'all', kw:'' };
const CATS = [...new Set(EVENTS.map(e=>e.cat))];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s){ if(!state.kw) return s; const k=state.kw.toLowerCase(); let o=s; try{ o = s.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<em>$1</em>'); }catch(e){} return o; }
function phonesHtml(){
  return '<div class="ev"><div class="ev-head"><div class="ev-title">📞 报告联系渠道（手册 3.6.5.3）</div></div><div class="flow">' +
    PHONES.map(p=>'<div class="step"><div class="step-head"><span class="ic">☎</span>'+esc(p.d)+'</div><div class="step-body"><strong style="font-size:1rem;color:var(--primary)">'+esc(p.n)+'</strong><br><span class="k">用途：</span>'+esc(p.tag)+'</div></div>').join('') +
    '</div></div>';
}
function evHtml(e){
  const flow = e.flow.map(f=>'<div class="step"><div class="step-head"><span class="ic">'+(f.ph.slice(0,1))+'</span>'+esc(f.ph)+'</div><div class="step-body"><ul>'+f.items.map(it=>'<li>'+hl(it)+'</li>').join('')+'</ul></div></div>').join('');
  const ded = e.ded ? '<div class="ded"><div class="d-title">⚠️ 遗漏/违反流程 · 关联扣分（参见📕手册奖惩）</div><ul>' + e.ded.map(d=>'<li>'+hl(d)+'</li>').join('') + '</ul></div>' : '';
  const date=(new Date()).toJSON().slice(0,10);
  return '<div class="ev" data-id="'+e.id+'"><div class="ev-head"><div class="ev-title">'+hl(e.title)+'</div><div class="ev-badges"><span class="badge b-cat">'+esc(e.cat)+'</span><span class="badge b-src">'+esc(e.src)+'</span>'+(e.hot?'<span class="badge b-risk">🔥 高频</span>':'')+'</div></div><div class="flow">'+flow+'</div>'+ded+'</div>';
}
function hotHtml(){
  const kws=[];
  EVENTS.forEach(e=>e.kws.forEach(k=>{ if(kws.indexOf(k)<0 && k.length>1) kws.push(k); }));
  return '<div class="hotbar">' + kws.slice(0,20).map(k=>'<span class="hot" onclick="setKw(\''+k.replace(/'/g,"\\'")+'\')">'+k+'</span>').join('') + '</div>';
}
function render(){
  let list = EVENTS;
  if(state.kw){
    const k=state.kw.toLowerCase();
    list = list.filter(e=>{
      const hay = (e.title+' '+e.cat+' '+e.kws.join(' ')+' '+e.src+' '+(e.flow.map(f=>f.ph+' '+f.items.join(' ')).join(' '))).toLowerCase();
      return hay.indexOf(k)>=0;
    });
  }
  if(list.length===0 && state.kw){
    $('app').innerHTML = hotHtml()+'<div class="empty"><span class="e-ic">🕵️</span><div class="e-t">没有找到匹配流程</div><div class="e-s">换个关键词试试：如“滑梯 / 医学 / 移交 / 交接 / 报告单 / SQM”。</div></div>';
    return;
  }
  const body = (state.v==='phone') ? phonesHtml()
    : list.filter(e=>state.v!=='hot' || e.hot).map(evHtml).join('');
  $('app').innerHTML = hotHtml() + body;
  $('st-n').textContent = EVENTS.length;
  $('st-cat').textContent = CATS.length;
  $('st-ded').textContent = EVENTS.reduce((s,e)=>s+(e.ded?e.ded.length:0),0);
}
function doSearch(){ state.kw=$('kw').value.trim(); render(); }
function setKw(k){ $('kw').value=k; state.kw=k; render(); }
document.querySelectorAll('.m-tab').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); state.v=b.dataset.v; render(); };
});
$('kw').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
render();
</script>
</body>
</html>
