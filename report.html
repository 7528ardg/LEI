<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#148453">
<title>事件报告 · 流程速查</title>
<style>
:root{--primary:#148453;--primary-dark:#0C5F3A;--gold:#F5B800;--danger:#E64A19;--blue:#2563EB;--purple:#7C3AED;--grad:linear-gradient(135deg,#148453 0%,#1FA56A 100%);--bg:#F5F8F6;--card:#fff;--text:#0F2A1F;--text2:#5A6F65;--text3:#B5C2BC;--border:#E5EDE9;--primary-soft:#E8F3EE;--danger-soft:#FEE7DE;--gold-soft:#FEF6DC;--blue-soft:#E0F0F6;--shadow:0 4px 14px rgba(20,132,83,.10)}
html[data-theme="dark"]{--bg:#0F1A14;--card:#162420;--text:#E8F3EE;--text2:#8FA89C;--text3:#4A6358;--border:#1E3A2C;--primary-soft:#1A3D2A;--danger-soft:#3A1D1D;--gold-soft:#2A2410;--blue-soft:#16233C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:860px;margin:0 auto;padding:12px 14px 70px;-webkit-overflow-scrolling:touch}
.top{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;padding:14px 16px 12px;box-shadow:0 4px 16px rgba(20,132,83,.18)}
.t-title{font-size:1.06rem;font-weight:800;letter-spacing:.3px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.t-title .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.search{display:flex;gap:8px}
.search input{flex:1;border:none;border-radius:10px;padding:10px 14px;font-size:.9rem;outline:none;background:rgba(255,255,255,.95);color:#1B2B23}
.search button{border:none;border-radius:10px;padding:0 16px;background:rgba(255,255,255,.22);color:#fff;font-size:1rem;cursor:pointer}
.menu{position:sticky;top:58px;z-index:40;display:flex;gap:6px;background:var(--card);padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.menu::-webkit-scrollbar{display:none}
.m-tab{flex-shrink:0;padding:7px 13px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.m-tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(20,132,83,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.stat{text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--primary);font-weight:800}
.stat span{font-size:.66rem;color:var(--text2)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:12px 0}
.f-label{font-size:.68rem;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--bg);font-size:.76rem;color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.ev{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.ev-head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.ev-title{font-size:.95rem;font-weight:800;color:var(--text);flex:1;min-width:200px}
.ev-title em{font-style:normal;background:var(--gold-soft);color:#C99300;border-radius:4px;padding:0 3px}
.ev-badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:.66rem;padding:2px 8px;border-radius:10px;font-weight:700}
.b-cat{background:var(--blue-soft);color:var(--blue)}
.b-src{background:var(--primary-soft);color:var(--primary)}
.b-risk{background:var(--danger-soft);color:var(--danger)}
.flow{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.step{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.step-head{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:.78rem;font-weight:800;background:var(--primary-soft);color:var(--primary-dark)}
.step-head .ic{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.step-body{padding:8px 10px;font-size:.8rem;line-height:1.7;color:var(--text2)}
.step-body li{margin-left:16px}
.step-body strong{color:var(--text)}
.step-body .k{font-weight:700;color:var(--primary)}
.ded{margin-top:10px;background:var(--danger-soft);border:1px dashed var(--danger);border-radius:10px;padding:8px 10px;font-size:.76rem}
.ded .d-title{font-weight:800;color:var(--danger);margin-bottom:4px}
.ded li{margin-left:16px;line-height:1.6;color:var(--text2)}
.ded strong{color:var(--danger)}
.hotbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.hot{font-size:.72rem;padding:3px 10px;border-radius:12px;background:var(--primary-soft);color:var(--primary);cursor:pointer;border:1px solid transparent}
.hot:hover{border-color:var(--primary)}
.empty{text-align:center;padding:48px 16px;color:var(--text3)}
.empty .e-ic{font-size:3rem;display:block;margin-bottom:10px}
footer{color:var(--text3);font-size:.68rem;text-align:center;line-height:1.8;padding:20px 10px 8px;border-top:1px dashed var(--border);margin-top:16px}

/* ===== 移动端适配（≤720px，与壳层断点对齐） ===== */
@media(max-width:720px){
  .container{padding:10px 10px 56px}
  .top{padding:11px 12px 9px}
  .t-title{font-size:.98rem;margin-bottom:8px}
  .search input{padding:9px 12px;font-size:.86rem}
  .menu{top:52px;padding:6px 8px}
  .m-tab{padding:6px 11px;font-size:.76rem}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px;padding:10px}
  .stat b{font-size:1rem}
  .stat span{font-size:.7rem}
  .filters{padding:10px;margin:10px 0}
  .ev{padding:12px;margin-bottom:10px}
  .ev-title{font-size:.9rem;min-width:0}
  .step-body{font-size:.78rem}
  .step-body li{margin-left:12px}
  .ded{padding:7px 9px}
  footer{padding:16px 8px 6px}
}

/* ===== 事件报告表单 ===== */
.ri{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;font-size:.86rem;outline:none;background:var(--bg);color:var(--text);box-sizing:border-box;font-family:inherit}
.ri:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,132,83,.12)}
textarea.ri{resize:vertical;line-height:1.6}
.rp-label{display:block;font-size:.72rem;font-weight:700;color:var(--text2);margin:0 0 4px}
.rp-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border-radius:10px;border:none;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;color:#fff}
.rp-btn.primary{background:var(--grad);box-shadow:0 4px 12px rgba(20,132,83,.22)}
.rp-btn.ghost{background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-light)}
.rp-btn.danger{background:var(--danger-soft);color:var(--danger)}
</style>

<style id="a11y20260919">
/* 2026-09-19 设计审核 P0-C：屏幕阅读器专用工具类 + 跳到主内容 */

.skip-link:focus{top:0;outline:2px solid #fff;outline-offset:-4px;}

/* ---- 深色模式：滚动条随主题（浅色令牌在 :root，各模块 dark 规则见下）---- */

/* ---- UX Polish v1 · 深色模式兜底层（2026-09-16）----
   用户反馈：深色模式只有边框在变、美妆与医疗未覆盖、深色下部分文字看不清。
   本层为「无令牌体系」的模块补最小暗色变量，并统一修高对比度问题。 */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A14;--bg-card:#162420;--bg-elev:#1B2E26;

/* 输入类：深色下浏览器默认白底白字，必须显式覆盖 */

/* 深色下「浅色底 + 浅色字」组合的兜底可读性修复 */

html[data-theme="dark"] .bg-gray-50,

html[data-theme="dark"] .border-gray-300,

/* report：手机档触控目标 */
/* report 响应式专项（2026-09-17 审计）：320 档 tab 行溢出改紧凑内滚；

@media (max-width:760px){
  .m-tab{min-height:40px;padding:6px 10px;font-size:.76rem;}

}

  input#kw,select.ri,input.ri{font-size:16px!important;}
  select,textarea,
  input[type="text"],input[type="date"],input[type="time"]{font-size:16px!important;}
}

<h1 class="a11y-sr">事件报告流程</h1>

<div class="top">
  <div class="t-title"><span class="logo">🗂</span><span>事件报告 · 完整流程速查</span></div>
  <div class="search">
    <input id="kw" placeholder="搜索：事件 / 关键词 / 章节号（如 3.6.5.4）…" autocomplete="off">

  </div>
</div>

</div>

</div>
<div id="app" class="container"></div>

<script>
/* ============ 数据：节选《客舱乘务员手册》01.10 相关章节整理 ============ */

const REPORT_KEY='report_records_v1';
const REPORT_MAGIC='cabin-report-v1';
const REPORT_TYPES=['旅客紧急医学事件','航空卫生不安全事件（机组）','机上事件（a）-(e)类','非法干扰/机闹/其他安保','其他事件'];
function rpRead(){
  try{
    const d=JSON.parse(localStorage.getItem(REPORT_KEY)||'null');
    if(d&&d.magic===REPORT_MAGIC&&Array.isArray(d.records)) return d.records;
  }catch(e){}
  return [];
}
function rpWrite(list){
  try{ localStorage.setItem(REPORT_KEY, JSON.stringify({magic:REPORT_MAGIC,records:list})); return true; }catch(e){ return false; }
}
function rpToast(msg){
  const old=document.getElementById('rpToast');
  if(old) old.remove();
  const t=document.createElement('div');
  t.id='rpToast';
  t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,42,31,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:.82rem;z-index:999;box-shadow:0 6px 18px rgba(0,0,0,.2)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2400);
}

function rpSave(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const rec={type:g('rf-type'),flight:g('rf-flight'),sector:g('rf-sector'),date:g('rf-date'),time:g('rf-time'),phase:g('rf-phase'),desc:g('rf-desc'),action:g('rf-action'),people:g('rf-people'),witness:g('rf-witness'),close:g('rf-close'),em:g('rf-em'),name:g('rf-name'),no:g('rf-no'),ts:Date.now()};
  if(!rec.flight||!rec.desc||!rec.name){ rpToast('请填写必填项：航班号、事件描述、填报人姓名'); return; }
  const list=rpRead(); list.unshift(rec); rpWrite(list);
  renderReportForm(); rpToast('✅ 报告已保存到本机');
}

  if(!list.length){ rpToast('暂无记录'); return; }
  if(confirm('确定清空全部 '+list.length+' 条报告记录？此操作不可恢复。')){
    rpWrite([]); renderReportForm(); rpToast('已清空全部');
  }
}
function rpExport(){
  const list=rpRead();
  if(!list.length){ rpToast('暂无记录可导出'); return; }
  const blob=new Blob([JSON.stringify({magic:REPORT_MAGIC,records:list},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='客舱事件报告_'+new Date().toJSON().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  rpToast('✅ 已导出 '+list.length+' 条记录');
}

<script id="mobile-native-js">
(function(){
  'use strict';
  if(!window.matchMedia||!matchMedia('(pointer:coarse)').matches)return;
  /* 1) 触感反馈（Android 原生手感；iOS/Safari 自动忽略 vibrate） */
  if(navigator.vibrate){
    addEventListener('pointerdown',function(e){
      var t=e.target;
      if(t&&t.closest&&t.closest('button,[onclick],a,[role="button"]')){
        try{navigator.vibrate(8)}catch(_){}
      }
    },{passive:true,capture:true});
  }
  /* 2) 安全区自动注入：贴边的 fixed/sticky 条补 env(safe-area-inset-*)；
        无贴边条的页面则给 body 补，保证内容不钻进刘海/小白条 */
  var px=function(v){return parseFloat(v)||0};
  function patchOne(el,edge){
    var cs=getComputedStyle(el);
    if(edge==='top'){el.style.paddingTop='calc('+px(cs.paddingTop)+'px + env(safe-area-inset-top,0px))';}
    else{el.style.paddingBottom='calc('+px(cs.paddingBottom)+'px + env(safe-area-inset-bottom,0px))';}
  }
  function walk(){
    var vw=innerWidth,vh=innerHeight,gotTop=false,gotBot=false;
    var els=document.querySelectorAll('body *');
    for(var i=0;i<els.length;i++){
      var el=els[i];if(el.dataset.msa)continue;el.dataset.msa='1';
      var cs=getComputedStyle(el),pos=cs.position;
      if(pos!=='fixed'&&pos!=='sticky')continue;
      var r=el.getBoundingClientRect();
      if(r.width===0||r.height===0)continue;
      if(r.width>=vw*0.95&&r.height>=vh*0.9)continue; /* 全屏遮罩类不碰 */
      var wide=(r.width>=vw*0.9);
      if(!wide)continue;
      if(pos==='fixed'){
        var t=px(cs.top),b=px(cs.bottom);
        if(t>=0&&t<=6){patchOne(el,'top');gotTop=true;}
        else if(b>=0&&b<=2){patchOne(el,'bot');gotBot=true;}
      }else{
        var st=px(cs.top),sb=px(cs.bottom);
        if(cs.top!=='auto'&&st<=6){patchOne(el,'top');gotTop=true;}
        else if(cs.bottom!=='auto'&&sb<=2){patchOne(el,'bot');gotBot=true;}
      }
    }
    var b=document.body,bs=getComputedStyle(b);
    if(!gotTop){b.style.paddingTop='calc('+px(bs.paddingTop)+'px + env(safe-area-inset-top,0px))';}
    if(!gotBot){b.style.paddingBottom='calc('+px(bs.paddingBottom)+'px + env(safe-area-inset-bottom,0px))';}
  }
  function safe(){try{walk()}catch(_){}}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',safe)}else{safe()}
  addEventListener('load',safe);
  setTimeout(safe,800);
})();
</script>

<div id="qaLanding" role="status" hidden>
  <span class="ql-ico" aria-hidden="true">&#8617;</span>
  <div class="ql-tx">从「你问我答」带来：<b id="qaLandingQ"></b></div>
  <button id="qaLandingFill" type="button">填入搜索框</button>
  <button id="qaLandingX" type="button" aria-label="关闭">&#10005;</button>
</div>
<script>
(function(){
  var KEY = 'spring_jump_ctx';
  var TTL = 5 * 60 * 1000;

  /* 自己是哪个模块 —— 用来认领"点名给我"的上下文。
     必须做这层过滤：storage 事件会广播给**所有**同源文档，壳层里多个 iframe 并存时
     不做归属判断就会「谁先醒谁把上下文消费掉」，真正的目标模块反而拿不到
     （2026-09-19 实战实测抓到的真缺陷）。 */
  var SELF = (function(){
    try{
      var p = String(location.pathname || '').split('/').pop().toLowerCase().replace(/\.html?$/, '');
      var ALIAS = { 'kb-admin':'kbadmin', 'risk-lite':'risk', 'cc-home':'home' };
      return ALIAS[p] || p;
    }catch(e){ return ''; }
  })();
  function mine(o){
    if(!o || o.from !== 'qa' || !o.q) return false;
    if(!o.to) return true;                 /* 兼容旧数据与 URL 通道 */
    return String(o.to) === SELF;
  }

  function readUrl(){
    try{
      var sp = new URLSearchParams(location.search || '');
      var q = sp.get('q') || '', from = sp.get('from') || '';
      if(from === 'qa' && q) return { q:q, via:'url' };
    }catch(e){}
    return null;
  }
  function readStore(){
    try{
      var o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(mine(o) && (Date.now() - (o.t || 0)) < TTL) return { q:o.q, via:'store' };
    }catch(e){}
    return null;
  }
  function clearStore(){ try{ localStorage.removeItem(KEY); }catch(e){} }

  function findSearchBox(){
    var sels = ['input[type=search]', 'input[type=text]', 'input[type=searchbox]',
                'input:not([type])', 'textarea'];
    for(var i = 0; i < sels.length; i++){
      var list;
      try{ list = document.querySelectorAll(sels[i]); }catch(e){ continue; }
      for(var j = 0; j < list.length; j++){
        var el = list[j];
        if(el.disabled || el.readOnly) continue;
        if(el.id === 'qaLandingFill' || el.id === 'qaLandingX') continue;
        if(el.offsetParent === null) continue;
        var r = el.getBoundingClientRect();
        if(r.width < 40 || r.height < 16) continue;
        return el;
      }
    }
    return null;
  }

  /* ---- 带进来的问题也交给本页 AI ----
     通用做法：包装 fetch，凡是 chat/completions 请求就给 system 补一句来路上下文。
     刻意不依赖各板块 AI 客户端的实现差异（beauty 的 SpringAI / quiz 的 QuizSpringAI /
     kb-admin 的 aiChat 各写各的），这样新增板块时也不用再改一遍。 */
  function installAiBridge(q){
    try{
      if(window.__qaLandingAiBridge) return;
      var of = window.fetch;
      if(typeof of !== 'function') return;
      window.fetch = function(u, o){
        try{
          var url = String(u || '');
          if(/chat\/completions/.test(url) && o && typeof o.body === 'string'){
            var body = JSON.parse(o.body);
            if(body && Array.isArray(body.messages) && body.messages.length){
              var note = '\n\n【来路】用户是从「你问我答」带着问题跳过来的，原问题：「' + q + '」。'
                + '若本次请求与该问题相关，请优先围绕它作答；无关则忽略这句。';
              var i0 = -1;
              for(var i = 0; i < body.messages.length; i++){
                if(body.messages[i] && body.messages[i].role === 'system'){ i0 = i; break; }
              }
              if(i0 >= 0){
                body.messages[i0] = { role:'system', content: String(body.messages[i0].content || '') + note };
              }else{
                body.messages.unshift({ role:'system', content: '【来路】' + note });
              }
              o = Object.assign({}, o, { body: JSON.stringify(body) });
              arguments[1] = o;
            }
          }
        }catch(e){}
        return of.apply(this, arguments);
      };
      window.__qaLandingAiBridge = true;
    }catch(e){}
  }

  /* 抽出来供两处复用：boot（首次加载）与 storage 事件（上下文后到） */
  function showBar(q){
    var box = document.getElementById('qaLanding');
    if(!box) return false;
    var qEl = document.getElementById('qaLandingQ');
    if(qEl) qEl.textContent = q.length > 42 ? (q.slice(0, 42) + '…') : q;
    box.dataset.q = q;
    box.hidden = false;
    bindButtons();
    return true;
  }

  function bindButtons(){
    var box = document.getElementById('qaLanding');
    if(!box) return;
    var fill = document.getElementById('qaLandingFill');
    if(fill && !fill.__qaBound){
      fill.__qaBound = true;
      var label = fill.textContent;
      fill.onclick = function(){
        var q = box.dataset.q || '';
        var el = findSearchBox();
        if(!el){
          fill.textContent = '没找到搜索框';
          setTimeout(function(){ fill.textContent = label; }, 1800);
          return;
        }
        try{
          el.focus();
          el.value = q;
          el.dispatchEvent(new Event('input', { bubbles:true }));
          el.dispatchEvent(new Event('change', { bubbles:true }));
          try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e2){}
          fill.textContent = '已填入';
          setTimeout(function(){ fill.textContent = label; }, 1600);
        }catch(e3){}
      };
    }
    var x = document.getElementById('qaLandingX');
    if(x && !x.__qaBound){ x.__qaBound = true; x.onclick = function(){ box.hidden = true; }; }
  }

  function boot(){
    var ctx = readUrl() || readStore();
    if(!ctx) return;
    if(!showBar(ctx.q)) return;
    if(ctx.via === 'store') clearStore();
    installAiBridge(ctx.q);
  }

  /* ★ 壳层内嵌的关键补丁（2026-09-19 实战实测抓到的真缺陷）：
     目标板块的 iframe 往往**早已加载**（壳层预热 / iframe 池化），DOMContentLoaded
     早就过去了，boot() 根本读不到"之后才写入"的上下文 —— 于是独立打开能用、
     壳层内「带着问题跳过去」却空转。storage 事件是天然的跨文档通知机制
     （同源的不同文档之间会触发），补上这条才真正闭合。 */
  window.addEventListener('storage', function(e){
    try{
      if(!e || e.key !== KEY || !e.newValue) return;
      var o = JSON.parse(e.newValue);
      if(!mine(o)) return;
      if(Date.now() - (o.t || 0) > TTL) return;
      if(showBar(o.q)) clearStore();
    }catch(err){}
  });

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.QaLanding = { boot:boot, find:findSearchBox, read:function(){ return readUrl() || readStore(); } };
})();
</script>
